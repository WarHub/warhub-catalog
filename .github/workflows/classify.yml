name: Classification

# Human-triggered LLM classification / duplicate-join-adjudication pass over the catalog's
# parked entities (null gameSystem) and suspected-duplicate entity pairs. See
# tools/acquisition/src/warhub_acquisition/classify/ (llm.py, joins.py) and
# .superpowers/sdd/task-5-report.md / task-6-report.md for the underlying module contracts.
#
# workflow_dispatch ONLY -- this workflow never runs on a schedule. Classification spends
# Anthropic API budget, so a human/controller decides when that spend happens; catalog-acquire.yml
# (nightly + weekly-deep-sweep harvesting) never triggers it.
#
# mode=classify (default): emit-queue -> `classify --llm` -> `classify --apply` -> `resolve` ->
#   `report`, committing catalog/overrides.yaml + classification-cache.jsonl changes to the sticky
#   PR branch `catalog/classification`.
# mode=propose-joins: `classify --propose-joins`, committing join-proposals.yaml +
#   join-cache.jsonl only. This mode NEVER touches matches.yaml or catalog/overrides.yaml --
#   promoting a proposed join into matches.yaml stays a manual, spot-checked human/controller step
#   (see task-6-report.md); there is no `emit-queue`/`apply`/`resolve`/`report` step for this mode
#   -- propose-joins never reads classification-queue.yaml. Its sticky PR branch is the
#   MODE-SUFFIXED `catalog/classification-joins`, deliberately SEPARATE from classify mode's
#   `catalog/classification`: both modes used to share one sticky branch, so a propose-joins
#   dispatch's create-pull-request step (which force-resets its branch from `main`) would blow
#   away an unmerged classify-mode PR's still-pending overrides/apply changes, and vice versa.
#   The branch name is derived from MODE via the `branch` env step below -- see the "Create or
#   update sticky PR" step.
#
# Requires the ANTHROPIC_API_KEY repository secret. The "Check ANTHROPIC_API_KEY secret" step
# below fails fast, before any budget-relevant work happens, if it's missing.

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Request budget (batches of up to 20 items/pairs per request)'
        required: false
        type: string
        default: '500'
      mode:
        description: 'classify (LLM gameSystem/faction decisions, applies to the catalog) or propose-joins (duplicate-entity adjudication, review-only output)'
        required: false
        type: choice
        options:
          - classify
          - propose-joins
        default: classify

concurrency:
  group: catalog-classify
  cancel-in-progress: false

jobs:
  classify:
    name: Classify (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    # 60 was sized for the LLM pass alone; the data-integrity suite below adds ~10 min.
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Mode-suffixed sticky branch: classify mode keeps `catalog/classification`,
      # propose-joins gets its own `catalog/classification-joins` -- see the header comment above
      # for why sharing one branch is unsafe (create-pull-request force-resets its branch from
      # `main` on every dispatch).
      - name: Derive mode-suffixed branch
        id: branch
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "propose-joins" ]; then
            echo "name=catalog/classification-joins" >> "$GITHUB_OUTPUT"
          else
            echo "name=catalog/classification" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v7

      - name: uv sync
        working-directory: tools/acquisition
        run: uv sync --locked

      # Fail fast, before any budget-relevant work happens, if the secret isn't configured.
      - name: Check ANTHROPIC_API_KEY secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not configured on this repository. Add it before running the classify workflow."
            exit 1
          fi

      # `set +e` + captured exit code (not a hard step failure) on this step and every
      # budget/data-mutating step below, same convention as catalog-acquire.yml's integrate job:
      # build_queue()/llm.py/joins.py can raise (e.g. build_queue()'s ValueError on evidence
      # mismatch) or flush partial progress mid-run (task-5-report.md:
      # "incremental-flush-survives-crash"), so a crash here still leaves whatever made it to disk
      # available for the sticky PR, instead of every later step -- including the sticky-PR step
      # itself -- being skipped by an early job abort. The final step fails the job loudly, after
      # the PR is opened. Gated to mode=classify: propose-joins never reads
      # classification-queue.yaml, so an irrelevant queue failure must not kill a joins run.
      - name: Emit classification queue
        id: emit_queue
        if: github.event.inputs.mode == 'classify'
        working-directory: tools/acquisition
        run: |
          set +e
          uv run warhub-data classify --data ../../data --emit-queue > ../../_emit_queue.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat ../../_emit_queue.txt

      # Inputs (github.event.inputs.*) are routed through env: rather than interpolated directly
      # into the script body -- same injection-hardening pattern as catalog-acquire.yml.
      - name: LLM classify
        id: llm
        if: github.event.inputs.mode == 'classify'
        working-directory: tools/acquisition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ github.event.inputs.budget }}
        run: |
          set +e
          # Empty string (explicitly-cleared input) falls back to the default budget -- same
          # empty-string fallback pattern as catalog-acquire.yml's OVERRIDE_BUDGET handling;
          # otherwise argparse receives --budget "" and errors.
          BUDGET="${BUDGET:-500}"
          uv run warhub-data classify --data ../../data --llm \
            --budget "$BUDGET" \
            --run-date "$(date -u +%F)" > ../../_llm.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat ../../_llm.txt

      - name: Propose joins
        id: joins
        if: github.event.inputs.mode == 'propose-joins'
        working-directory: tools/acquisition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ github.event.inputs.budget }}
        run: |
          set +e
          # Empty string (explicitly-cleared input) falls back to the default budget -- same
          # empty-string fallback pattern as catalog-acquire.yml's OVERRIDE_BUDGET handling;
          # otherwise argparse receives --budget "" and errors.
          BUDGET="${BUDGET:-500}"
          uv run warhub-data classify --data ../../data --propose-joins \
            --budget "$BUDGET" \
            --run-date "$(date -u +%F)" > ../../_joins.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat ../../_joins.txt

      - name: Apply classifications
        id: apply
        if: github.event.inputs.mode == 'classify'
        working-directory: tools/acquisition
        run: |
          set +e
          uv run warhub-data classify --data ../../data --apply > ../../_apply.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat ../../_apply.txt

      # Conflicts (exit 2) are expected review material, same convention as catalog-acquire.yml.
      - name: Resolve catalog
        id: resolve
        if: github.event.inputs.mode == 'classify'
        working-directory: tools/acquisition
        run: |
          set +e
          uv run warhub-data resolve --data ../../data > ../../_resolve.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat ../../_resolve.txt

      # NOT OPTIONAL, AND NOT DECORATION. `resolve` above rewrites every product file from
      # evidence, which resets `category` to the fallback for anything no source stated. Without
      # this step a classification run -- which is about gameSystem and faction and has nothing to
      # do with categories -- would silently publish 8,073 products as guessed `miniatures` that
      # the committed rule tables place correctly. `resolve` and `categorize` are one pipeline;
      # anywhere the first runs, the second must follow. Exit 2 (disagreements) is review
      # material, same convention as resolve's own conflicts.
      - name: Categorize products
        id: categorize
        if: github.event.inputs.mode == 'classify'
        working-directory: tools/acquisition
        run: |
          set +e
          uv run warhub-data categorize --data ../../data > ../../_categorize.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat ../../_categorize.txt

      - name: Coverage report
        id: report
        if: github.event.inputs.mode == 'classify'
        working-directory: tools/acquisition
        run: |
          set +e
          uv run warhub-data report --data ../../data > ../../_report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat ../../_report.txt

      # THE DATA-INTEGRITY NET, ON THE OTHER PATH THAT WRITES THE CATALOG. catalog-acquire.yml
      # gained this in its integrate job for a reason that applies here word for word: the sticky
      # bot PRs are where the net was needed and the one place it never ran, because a PR opened
      # with GITHUB_TOKEN starts no workflow runs. That half is now fixed by the app token minted
      # below -- data-ci.yml will genuinely execute on this branch. This step is the other half,
      # and it is not redundant with it: it judges the tree BEFORE the branch is written, it puts
      # the verdict in the PR body a reviewer is already reading, and it does not depend on any
      # trigger firing. classify mode runs `resolve` and `categorize`, which rewrite every product
      # file in the repo -- exactly the blast radius that produced the #111 incident.
      #
      # RUNS IN BOTH MODES. propose-joins writes data/review/join-proposals.yaml rather than the
      # catalog, but it still commits data, and "the job that writes the data validates it" does
      # not have a mode exemption.
      #
      # `set +e` + captured exit code is this job's existing idiom: the step always succeeds and
      # the code is adjudicated in the combined gate at the end, AFTER the PR exists, so a failing
      # run still opens a sticky PR carrying its own findings.
      - name: Snapshot the data tree before the tests
        id: pretree
        run: |
          git add -A data
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          git reset -q

      - name: Data-integrity tests
        id: datatests
        working-directory: tools/acquisition
        run: |
          set +e
          uv run pytest -q
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # tests/test_set_contents.py:138 regenerates data/catalog/set-contents/*.yaml in place, and
      # the sticky PR below commits with `add-paths: data`, so anything the suite leaves behind
      # would ride into the PR as an unexplained data change. Compared against the pre-test tree
      # rather than HEAD because this job has already rewritten data/ on purpose. See
      # catalog-acquire.yml's copy of this step for the full reasoning; the mechanics are identical.
      - name: Check the data tests did not rewrite committed data
        id: datadrift
        if: always()
        run: |
          pre="${{ steps.pretree.outputs.tree }}"
          # No snapshot means no way to separate the tests' writes from this job's own output, and
          # `git diff` against an empty rev would just crash the step. Report drift rather than
          # guessing: the snapshot step only fails if git itself did, which is not a state in which
          # to auto-commit data.
          if [ -z "$pre" ]; then
            echo "::error::No pre-test tree snapshot was recorded, so the tests' writes cannot be told apart from this run's own pipeline output. Treating as drift."
            echo "drift=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A data
          post="$(git write-tree)"
          if [ "$pre" = "$post" ]; then
            git reset -q
            echo "drift=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::The data tests wrote into data/. If the test step above PASSED, a committed generated file is stale for this run's catalog: regenerate with 'uv run --with pyyaml python tools/acquisition/scripts/gen_set_contents.py' and commit it. If that step FAILED or crashed, this is most likely fallout from a half-finished regeneration -- fix that failure first."
          git --no-pager diff --stat "$pre" "$post"
          git --no-pager diff "$pre" "$post"
          git read-tree "$pre"
          git checkout -- data
          git clean -fdq data
          git reset -q
          echo "drift=1" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        env:
          MODE: ${{ github.event.inputs.mode }}
          BUDGET: ${{ github.event.inputs.budget }}
        run: |
          {
            echo "Automated classification run (mode: \`$MODE\`, budget: $BUDGET requests)."
            echo
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "**Trigger:** ${{ github.event_name }}"
            echo
            if [ "$MODE" = "classify" ]; then
              echo "### Emit classification queue"
              echo
              cat _emit_queue.txt
              if [ "${{ steps.emit_queue.outputs.exit_code }}" != "0" ]; then
                echo
                echo "> :warning: \`classify --emit-queue\` exited ${{ steps.emit_queue.outputs.exit_code }} (expected 0) -- possible crash."
              fi
              echo
              echo "### LLM classify"
              echo
              cat _llm.txt
              if [ "${{ steps.llm.outputs.exit_code }}" != "0" ]; then
                echo
                echo "> :warning: \`classify --llm\` exited ${{ steps.llm.outputs.exit_code }} (expected 0) -- possible crash; cached decisions up to that point are still included below via the incremental cache flush."
              fi
              echo
              echo "### Apply classifications"
              echo
              cat _apply.txt
              if [ "${{ steps.apply.outputs.exit_code }}" != "0" ]; then
                echo
                echo "> :warning: \`classify --apply\` exited ${{ steps.apply.outputs.exit_code }} (expected 0) -- possible crash."
              fi
              echo
              echo "### Resolve"
              echo
              cat _resolve.txt
              if [ "${{ steps.resolve.outputs.exit_code }}" = "2" ]; then
                echo
                echo "> Conflicts detected -- see \`data/review/conflicts.yaml\`; treat as review material, not a failure."
              elif [ -n "${{ steps.resolve.outputs.exit_code }}" ] && [ "${{ steps.resolve.outputs.exit_code }}" != "0" ] && [ "${{ steps.resolve.outputs.exit_code }}" != "2" ]; then
                echo
                echo "> :warning: \`resolve\` exited ${{ steps.resolve.outputs.exit_code }} (expected 0 or 2)."
              fi
              echo
              echo "### Categorize"
              echo
              cat _categorize.txt
              if [ "${{ steps.categorize.outputs.exit_code }}" = "2" ]; then
                echo
                echo "> Disagreements found -- see \`data/review/categorize.yaml\`; review material, not a failure."
              elif [ "${{ steps.categorize.outputs.exit_code }}" != "0" ]; then
                echo
                echo "> :warning: \`categorize\` exited ${{ steps.categorize.outputs.exit_code }} (expected 0 or 2)."
              fi
              echo
              echo "### Coverage report"
              echo
              cat _report.txt
              if [ "${{ steps.report.outputs.exit_code }}" != "0" ]; then
                echo
                echo "> :warning: \`report\` exited ${{ steps.report.outputs.exit_code }} (expected 0) -- possible crash."
              fi
            else
              echo "### Propose joins"
              echo
              cat _joins.txt
              if [ "${{ steps.joins.outputs.exit_code }}" != "0" ]; then
                echo
                echo "> :warning: \`classify --propose-joins\` exited ${{ steps.joins.outputs.exit_code }} (expected 0) -- possible crash; cached verdicts up to that point are still included below via the incremental cache flush."
              fi
              echo
              echo "See \`data/review/join-proposals.yaml\` for candidate duplicate-entity pairs and their LLM verdicts."
              echo
              echo "> This workflow never edits \`matches.yaml\`. Promoting a proposed join is a manual, spot-checked human/controller step."
            fi
            echo
            echo "### Data-integrity tests"
            echo
            if [ "${{ steps.datatests.outputs.exit_code }}" = "0" ] && [ "${{ steps.datadrift.outputs.drift }}" = "0" ]; then
              echo "Passed on this run's own tree -- the full suite, the same command \`data-ci.yml\` runs, executed here so the job that writes the data validates it."
            else
              echo ":rotating_light: **FAILED on this run's own data.** Do not merge until this is understood."
              echo
              if [ "${{ steps.datatests.outputs.exit_code }}" != "0" ]; then
                echo "- \`pytest\` exited ${{ steps.datatests.outputs.exit_code }} -- see the job log for the failing assertions."
              fi
              if [ "${{ steps.datadrift.outputs.drift }}" = "1" ]; then
                echo "- The tests wrote into \`data/\` -- the job log lists the exact paths. If they touched \`data/catalog/set-contents\`, the committed relation is stale for this catalog: regenerate with \`uv run --with pyyaml python tools/acquisition/scripts/gen_set_contents.py\` and commit it."
              fi
            fi
          } > tools/acquisition/pr-body.md

      # See .github/actions/bot-token: a pull request opened with GITHUB_TOKEN cannot start a
      # workflow run, so every check on this branch parked at `action_required` and never ran.
      # Minted immediately before the PR step because an installation token lives 60 minutes and
      # the LLM pass above can spend most of this job's budget on its own.
      - name: Mint warhub-bot token
        id: bot
        uses: ./.github/actions/bot-token
        with:
          client-id: ${{ vars.WARHUB_BOT_CLIENT_ID }}
          private-key: ${{ secrets.WARHUB_BOT_PRIVATE_KEY }}

      - name: Create or update sticky PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.bot.outputs.token }}
          add-paths: data
          branch: ${{ steps.branch.outputs.name }}
          base: main
          title: "${{ github.event.inputs.mode == 'propose-joins' && 'Classification: proposed joins' || 'Classification update' }}"
          body-path: tools/acquisition/pr-body.md
          commit-message: 'Classification update (${{ github.event.inputs.mode }})'
          committer: ${{ steps.bot.outputs.committer }}
          author: ${{ steps.bot.outputs.committer }}
          delete-branch: true

      # Mirrors catalog-acquire.yml's fail-after-PR pattern: the sticky PR is always
      # opened/updated with whatever this run produced before the job is marked failed, so
      # findings are never hidden behind a red X with nothing to show for it.
      - name: Fail job on unexpected exit codes
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          crashed=0

          if [ "$MODE" = "classify" ]; then
            emit_queue_exit="${{ steps.emit_queue.outputs.exit_code }}"
            llm_exit="${{ steps.llm.outputs.exit_code }}"
            apply_exit="${{ steps.apply.outputs.exit_code }}"
            resolve_exit="${{ steps.resolve.outputs.exit_code }}"
            categorize_exit="${{ steps.categorize.outputs.exit_code }}"
            report_exit="${{ steps.report.outputs.exit_code }}"

            if [ "$emit_queue_exit" != "0" ]; then
              echo "::error::classify --emit-queue exited $emit_queue_exit (expected 0) -- possible crash. See the sticky PR body / job log for details."
              crashed=1
            fi
            if [ "$llm_exit" != "0" ]; then
              echo "::error::classify --llm exited $llm_exit (expected 0) -- possible crash. See the sticky PR body / job log for details."
              crashed=1
            fi
            if [ "$apply_exit" != "0" ]; then
              echo "::error::classify --apply exited $apply_exit (expected 0) -- possible crash. See the sticky PR body / job log for details."
              crashed=1
            fi
            if [ "$resolve_exit" != "0" ] && [ "$resolve_exit" != "2" ]; then
              echo "::error::resolve exited $resolve_exit (expected 0 or 2) -- possible crash, possibly mid-write. See the sticky PR body / job log for details."
              crashed=1
            fi
            # categorize was captured into an output that NOTHING read: not this gate, not the PR
            # body. Its own step comment calls it "NOT OPTIONAL, AND NOT DECORATION" -- resolve has
            # just reset every product's category to the fallback and categorize is what puts the
            # decided values back -- so a crash here published 8,073 products as guessed
            # `miniatures` behind a green check and a PR body that read clean. Contract {0, 2}, the
            # same as resolve: 2 is disagreements, which are review material.
            if [ "$categorize_exit" != "0" ] && [ "$categorize_exit" != "2" ]; then
              echo "::error::categorize exited $categorize_exit (expected 0 or 2) -- possible crash, possibly mid-write, leaving the catalog half-categorized. See the sticky PR body / job log for details."
              crashed=1
            fi
            if [ "$report_exit" != "0" ]; then
              echo "::error::report (coverage) exited $report_exit (expected 0) -- possible crash. See the sticky PR body / job log for details."
              crashed=1
            fi
          else
            joins_exit="${{ steps.joins.outputs.exit_code }}"
            if [ "$joins_exit" != "0" ]; then
              echo "::error::classify --propose-joins exited $joins_exit (expected 0) -- possible crash. See the sticky PR body / job log for details."
              crashed=1
            fi
          fi

          # Both modes. Adjudicated here rather than by letting pytest fail on its own, for the
          # reason this whole step exists: the sticky PR must carry the findings -- the PR body
          # reports the test result too -- before the job is marked failed.
          datatests_exit="${{ steps.datatests.outputs.exit_code }}"
          if [ "$datatests_exit" != "0" ]; then
            echo "::error::Data-integrity tests failed (pytest exited $datatests_exit) on this run's own data. See the sticky PR body / job log."
            crashed=1
          fi
          if [ "${{ steps.datadrift.outputs.drift }}" = "1" ]; then
            echo "::error::The data-integrity tests wrote into data/ -- a committed generated file is stale for this run's catalog. See the sticky PR body / job log."
            crashed=1
          fi

          if [ "$crashed" = "1" ]; then
            exit 1
          fi
