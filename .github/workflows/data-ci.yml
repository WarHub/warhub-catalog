name: Data CI

# Runs the data-integrity tests on changes under data/**. Until this file existed they ran
# NOWHERE for such a change: ci.yml gates BOTH of its jobs on one workflow-level `paths:` list
# (tools/**, Directory.Build.props, Directory.Packages.props, WarHub.Catalog.slnx, global.json,
# .github/workflows/ci.yml) and data/** is absent from it, while ci.yml's `uv run pytest` was the
# only one in any workflow -- `git grep -n pytest -- .github/` returned exactly one line before
# this file existed, and returns this file too once it does. So a pull request touching only data/
# ran ZERO tests and went green by default. PR #111 is what that looks like in practice: a
# `classify --apply` run deleted a hand-authored block from data/catalog/overrides.yaml and
# nothing in CI objected.
#
# WHY A SECOND WORKFLOW RATHER THAN ADDING 'data/**' TO ci.yml's FILTER. That filter is a budget,
# not an oversight. ci.yml restores, builds and tests the whole .NET solution AND runs the full
# pytest suite (~15 min; its build job carries timeout-minutes: 15). Every nightly
# catalog-acquire.yml PR and every paint-catalog-update.yml PR touches data/**, so widening the
# filter would put that whole suite -- including a .NET build that no YAML file can affect -- on
# several automated data PRs a week. This workflow runs the two data-facing test files and
# nothing else.
#
# WHAT IT COVERS. Every test file whose subject is COMMITTED DATA rather than code, which is the
# membership rule -- add a file here the moment one is written, or the net is hung only halfway
# and the gap is invisible because the job still goes green.
#
#   tests/test_repo_data.py        the YAML-1.2 scalar-retype guard, the within-brand barcode
#                                  double-hold guard, the crossover declaration/compile/
#                                  no-double-publish checks, the paint-bridge gate check, the
#                                  retract-key silent-no-op guard, the setRefs correction guard.
#   tests/test_set_contents.py     the boxed-set relation's invariants: no ref silently dropped,
#                                  no quantity invented, every member naming exactly one committed
#                                  paint, and the byte-compare proving the committed relation is
#                                  reproducible from committed inputs.
#   tests/test_paint_repro.py      data/paints/harvest/*.yaml and barcodes/citadel-colour.yaml
#                                  pinned to the evidence they project.
#   tests/test_paint_equivalences.py  no equivalence naming a paint the archive no longer holds,
#                                  under the archive key AND the publisher's own key.
#   tests/test_paint_harvest_gsw_names.py  every renaming addition carries its alias, and no alias
#                                  erases an archived hex on rename.
#   tests/test_paint_volume_gsw.py the volume-override block is exactly the records no constant can
#                                  reach, and no override smuggles in a barcode.
#   tests/test_vocabulary.py       every `category`/`packaging` value the committed catalog uses is
#                                  declared in data/catalog/taxonomy/categories.yaml, and every
#                                  legacy value names a real migration target. The resolver enforces
#                                  this too, but only on a run someone performs -- a hand-edited
#                                  override or a new crossover stamp would otherwise sit unnoticed
#                                  until the next nightly.
#
# THE LAST TWO WERE ADDED 2026-08-14 AFTER RUNNING NOWHERE ON THE CHANGE THEY POLICE. Their subject
# is data/paints/overrides.yaml -- aliases, hex erasure, volume assertions -- so the membership rule
# above always covered them, but they sat only in ci.yml, which filters to tools/**. An overrides
# edit that touches no code therefore reached neither workflow. PR #133 in this stack is exactly
# that shape: seven files, all under data/, adding 92 aliases and 6 hex corrections, with both alias
# guards silent. They cost this job ~78s.
#
# The next two matter here more than anywhere: a nightly catalog-acquire PR landing a new GW trade
# workbook can make the committed Citadel barcode file non-reproducible, and a local regeneration
# run without --equivalences (the documented procedure) can strand an equivalence ref. Both commit
# with `add-paths: data*`, so this workflow is the ONLY one their PRs trigger -- under ci.yml those
# two files are reachable only from a tools/** change, which such a PR never makes. Not one of
# these was reachable from a data-only change before this file existed.
#
# RUNTIME. The two-file version of this job measured 2m9s on this runner for 25 tests (2026-08-11,
# the first real run, PR #112 triggering it on itself). The four-file version measures 2m41s for 29
# tests on the Windows dev box, against 3m49s and 4m38s there for the two-file one -- so the extra
# two gates cost well under a minute and the runner should stay near the 2m mark. The six-file
# version adds 29 more tests measured at 78s on the same dev box. Everything here
# is I/O-bound: ~150 committed YAML files, one of them 9 MB, walked several times over, plus a
# subprocess regeneration of the set-contents relation and an in-process one of the harvest -- the
# kind of work a Linux runner does markedly faster than NTFS, which is the whole 2x. Replace the
# runner figure once the six-file job has a few real runs. timeout-minutes below stays well above
# it on purpose: it is a runaway backstop, not a performance budget, and both regenerations grow
# with the data.
#
# A PR touching data/** AND tools/** runs these tests twice, once here and once inside
# ci.yml's full suite. That is deliberate: the alternative is deselecting them from ci.yml, which
# would let a tools-only change break a data guard silently -- the mirror image of the hole this
# workflow closes.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '.github/workflows/data-ci.yml'
  pull_request:
    paths:
      - 'data/**'
      - '.github/workflows/data-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-integrity:
    name: Data integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/acquisition
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest tests/test_repo_data.py tests/test_set_contents.py tests/test_paint_repro.py tests/test_paint_equivalences.py tests/test_paint_harvest_gsw_names.py tests/test_paint_volume_gsw.py tests/test_vocabulary.py -q

      # THE TESTS WRITE INTO THE CHECKOUT. tests/test_set_contents.py:138 runs
      # scripts/gen_set_contents.py as a subprocess with cwd=REPO_ROOT, so the run rewrites
      # data/catalog/set-contents/*.yaml in place. Harmless on a throwaway runner -- and worth
      # keeping, because it is the only way that test can prove the committed relation is
      # reproducible -- but it means the tree state after pytest carries information, so this
      # step reads it instead of discarding it.
      #
      # WHY IT IS NOT REDUNDANT WITH THAT TEST. The test snapshots the files that exist BEFORE
      # the subprocess runs (`before = {p: p.read_bytes() for p in _require()}`) and compares
      # only those. A file the generator CREATES has no entry in that snapshot, so it is never
      # compared and the test stays green with a new, uncommitted relation file sitting in the
      # tree -- and gen_set_contents.py does create files, one per manufacturer that states
      # contentSkus (:517). `git status --porcelain` sees an untracked file; a byte-compare over
      # a pre-run snapshot structurally cannot. This step is therefore the half of "the committed
      # relation is stale" that the test cannot reach, at a cost of one git invocation.
      #
      # SCOPED TO data/ ON PURPOSE, not the whole tree: data/ is the only thing pytest can write
      # here, and an unscoped check would additionally be hostage to whatever build detritus a
      # future step drops in the workspace. (tools/acquisition/.venv and __pycache__ are already
      # ignored, and .pytest_cache self-ignores, so an unscoped check happens to pass today --
      # scoping keeps it passing for a reason rather than by luck.)
      #
      # Runs from the workspace root; the job default working-directory is tools/acquisition,
      # which the `-- data` pathspec would otherwise be resolved against.
      # `always()` so a FAILING test run is still inspected -- a stale relation usually shows up as
      # a failure plus a dirty tree, and skipping the check there would hide half the evidence. The
      # cost is that a pytest CRASH mid-regeneration also lands here, where a half-written file is
      # not drift at all, so the message says which of the two a reader is looking at rather than
      # asserting the drift reading.
      - name: Fail if the tests rewrote committed data
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            echo "::error::The test run rewrote data/. If the test step above PASSED, a committed generated file is stale: regenerate with 'uv run --with pyyaml python tools/acquisition/scripts/gen_set_contents.py' and commit the result. If the test step above FAILED or crashed, this is most likely fallout from a half-finished regeneration -- fix that failure first and discard this with 'git checkout -- data'."
            git status --porcelain -- data
            git --no-pager diff -- data
            exit 1
          fi
