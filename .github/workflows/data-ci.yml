name: Data CI

# Runs the Python test suite on changes under data/**. Until this file existed the data tests ran
# NOWHERE for such a change: ci.yml gated BOTH of its jobs on one workflow-level `paths:` list
# (tools/**, Directory.Build.props, Directory.Packages.props, WarHub.Catalog.slnx, global.json,
# .github/workflows/ci.yml) with data/** absent from it -- ci.yml now filters per job instead, for
# the gate reason below, but the list it filters on is the same one. Meanwhile ci.yml's pytest was the
# only one in any workflow -- `git grep -n pytest -- .github/` returned exactly one line before
# this file existed. So a pull request touching only data/ ran ZERO tests and went green by
# default. PR #111 is what that looks like in practice: a `classify --apply` run deleted a
# hand-authored block from data/catalog/overrides.yaml and nothing in CI objected.
#
# IT RUNS THE WHOLE SUITE, and it used to run a hand-listed subset. The list was the bug. Its
# membership rule was stated here in prose -- "every test file whose subject is COMMITTED DATA
# rather than code ... add a file here the moment one is written, or the net is hung only halfway
# and the gap is invisible because the job still goes green" -- and prose does not enforce itself.
# Measured 2026-08-25 on the tree at 98fa5f9: the list named 7 of the 27 test files that read
# committed data, so 20 files' worth of data-facing assertions ran on no data PR at all.
#
# THE GAP CAUGHT A REAL REGRESSION AND HID IT. tests/test_classify_queue.py asserts that every
# null-gameSystem product in the resolved catalog can be found in the evidence it was resolved
# from. The nightly merge #35 made that false -- `build_queue` re-joined a different observation
# set than the resolver did, so it derived `army-painter/CP3001S` for a product published as
# `army-painter/CP3001` -- and the file was not on the list, so every check on that PR was green
# and main was left red. It was found by running the full suite by hand, days later.
#
# WHAT IT COSTS, which is the trade the old list was buying. ci.yml's Python job measures ~10 min
# for the full suite on this runner (10m11s, run 32563899011); the seven-file job measured 2m42s.
# So this is ~7 extra minutes on the handful of automated data PRs a week that trigger it, against
# a class of failure that is invisible by construction. Nothing here builds the .NET solution --
# that stays in ci.yml, gated on tools/**, because no YAML file can affect it.
#
# `-m 'not live'` comes from pyproject.toml's addopts, so the network tests stay out without
# being named here.
#
# ONE RULE FOR WHAT MAY BE ASSERTED, and it is load-bearing now that both pipelines' tests run on
# both pipelines' PRs: a test must never require the PRODUCT catalog and the PAINT catalog to
# agree. Neither PR can fix such a failure -- paint-catalog-update.yml never runs `resolve`, so
# product data is frozen on its PRs, and catalog-acquire.yml never writes data/paints. A test of
# that shape is red on one side with no available correction. PR #143 was exactly that and was
# closed unmerged. Cross-catalog invariants belong in a stage that owns both inputs, not in a
# PR-triggered test.
#
# A PR touching data/** AND tools/** runs the suite twice, once here and once in ci.yml. That is
# deliberate: the alternative is deselecting these from ci.yml, which would let a tools-only
# change break a data guard silently -- the mirror image of the hole this workflow closes.
#
# catalog-acquire.yml runs the same command inside its integrate job, for a reason this workflow
# cannot cover: the runs THIS file queues for the sticky bot PRs sit at `action_required` awaiting
# manual approval and are never executed (six-plus on catalog/acquisition, 2026-08-13 to 08-18,
# 0s each). Running it in the job that writes the data removes the approval from the loop. Both
# call plain `pytest` now, so there is no longer a list to keep in sync between them.

# ONE REQUIRED CHECK PER WORKFLOW, and it is the gate job at the bottom, not the work jobs.
# Requiring `Data integrity tests` by name would couple the branch ruleset to job names
# -- rename a job and the ruleset silently waits forever for a check nobody reports. The gate is a
# stable name that aggregates: it fails if any job it needs failed or was cancelled, and passes
# when they succeeded or were correctly skipped.
#
# WHICH IS WHY `pull_request` NO LONGER CARRIES A `paths:` FILTER. A required status check that
# never reports does not fail open, it DEADLOCKS: the pull request sits at "Expected -- waiting
# for status to be reported" and can never merge. A tools-only pull request touches no data/ at
# all, so with the old filter this workflow would never have reported on one, and requiring it
# would have made every such PR permanently unmergeable -- the mirror image of what requiring
# ci.yml would have done to the data-only bot PRs (measured 2026-08-29 on #169 and #152: both
# data/** only, both with zero check runs). The workflow now always triggers on a pull request,
# and the `changes` job decides whether the expensive job actually runs. `push` keeps its filter:
# nothing requires a status check there.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '.github/workflows/data-ci.yml'
  # No `paths:` here on purpose -- see the gate note below.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=false
          while IFS= read -r f; do
            case "$f" in
              data/*|.github/workflows/data-ci.yml)
                relevant=true
                break ;;
            esac
          done <<< "$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "::notice::Relevant to Data CI: $relevant"

  data-integrity:
    name: Data integrity tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/acquisition
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q

      # THE TESTS WRITE INTO THE CHECKOUT. tests/test_set_contents.py:138 runs
      # scripts/gen_set_contents.py as a subprocess with cwd=REPO_ROOT, so the run rewrites
      # data/catalog/set-contents/*.yaml in place. Harmless on a throwaway runner -- and worth
      # keeping, because it is the only way that test can prove the committed relation is
      # reproducible -- but it means the tree state after pytest carries information, so this
      # step reads it instead of discarding it.
      #
      # WHY IT IS NOT REDUNDANT WITH THAT TEST. The test snapshots the files that exist BEFORE
      # the subprocess runs (`before = {p: p.read_bytes() for p in _require()}`) and compares
      # only those. A file the generator CREATES has no entry in that snapshot, so it is never
      # compared and the test stays green with a new, uncommitted relation file sitting in the
      # tree -- and gen_set_contents.py does create files, one per manufacturer that states
      # contentSkus (:517). `git status --porcelain` sees an untracked file; a byte-compare over
      # a pre-run snapshot structurally cannot. This step is therefore the half of "the committed
      # relation is stale" that the test cannot reach, at a cost of one git invocation.
      #
      # SCOPED TO data/ ON PURPOSE, not the whole tree: data/ is the only thing pytest can write
      # here, and an unscoped check would additionally be hostage to whatever build detritus a
      # future step drops in the workspace. (tools/acquisition/.venv and __pycache__ are already
      # ignored, and .pytest_cache self-ignores, so an unscoped check happens to pass today --
      # scoping keeps it passing for a reason rather than by luck.)
      #
      # Runs from the workspace root; the job default working-directory is tools/acquisition,
      # which the `-- data` pathspec would otherwise be resolved against.
      # `always()` so a FAILING test run is still inspected -- a stale relation usually shows up as
      # a failure plus a dirty tree, and skipping the check there would hide half the evidence. The
      # cost is that a pytest CRASH mid-regeneration also lands here, where a half-written file is
      # not drift at all, so the message says which of the two a reader is looking at rather than
      # asserting the drift reading.
      - name: Fail if the tests rewrote committed data
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            echo "::error::The test run rewrote data/. If the test step above PASSED, a committed generated file is stale: regenerate with 'uv run --with pyyaml python tools/acquisition/scripts/gen_set_contents.py' and commit the result. If the test step above FAILED or crashed, this is most likely fallout from a half-finished regeneration -- fix that failure first and discard this with 'git checkout -- data'."
            git status --porcelain -- data
            git --no-pager diff -- data
            exit 1
          fi

  # THE REQUIRED CHECK -- see the gate note in this file's header. `if: always()` so it reports
  # whatever happened above: without it a failed dependency would SKIP this job, and a skipped
  # required check reads as satisfied, which is the exact opposite of a gate. skipped and success
  # both pass (a job correctly not run is not a failure); failure and cancelled do not.
  gate:
    name: Data CI gate
    needs: [changes, data-integrity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          bad="$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::Data CI gate: these jobs did not pass -- $bad"
            exit 1
          fi
          echo "Data CI gate: green (skipped jobs are not failures)."
