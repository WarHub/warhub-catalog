name: Publish Catalog

# Bundles the source YAML under data/ into the versioned JSON catalog and publishes it
# two ways: immutable GitHub Release assets, and the GitHub Pages "latest" URL.

on:
  push:
    branches: [main]
    # NEGATIONS COME LAST. GitHub evaluates a `paths:` list in order and the LAST pattern that
    # matches decides, so `!data/paints/README.md` only excludes anything while it sits AFTER
    # the `data/paints/**` that admits it; put it first and the later wildcard re-admits the file
    # and the exclusion is silently inert.
    #
    # data/paints/README.md is prose for maintainers -- it reaches no consumer, no schema and no
    # dist/ document. Before this line, a typo fix in it cut an immutable Release and deployed
    # Pages for a catalog byte-identical to the one already published.
    paths:
      - 'data/catalog/**'
      - 'data/paints/**'
      - '!data/paints/README.md'
  workflow_dispatch:

permissions:
  contents: write   # create releases + tags
  pages: write      # deploy Pages
  id-token: write   # Pages OIDC

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 20 was sized for bundle + release only; the data-integrity gate below adds ~10 min.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need tags for same-day version suffixing

      # global.json, not a floating '10.x' + quality:preview. global.json pins 10.0.201 with
      # rollForward: latestFeature, which does NOT cross feature bands -- so the moment the latest
      # 10.x preview is a 10.0.3xx, a floating install lands an SDK global.json rejects and every
      # `dotnet` invocation below fails with "compatible SDK not found". ci.yml has always resolved
      # the SDK from the pin; this makes the publish path agree with the path that gates merges.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@v7

      # THE RELEASE IS IMMUTABLE AND THE PUBLISHED IDS ARE A CONSUMER CONTRACT (docs/OBJECTIVES.md),
      # so it is gated on the data actually passing its own tests. Until this step existed, nothing
      # sequenced publishing against testing: data-ci.yml triggers on the same push to main and runs
      # CONCURRENTLY with this job, so a hand-authored push straight to main could cut a Release and
      # deploy Pages before its test run had finished -- and an immutable release cannot be recalled
      # the way a red check on a PR can be fixed. The bot paths are already covered twice over
      # (in-job in catalog-acquire.yml, and on the PR now that those PRs are opened with an app
      # token and therefore actually run checks); this covers the one path that has neither.
      - name: Data-integrity tests
        working-directory: tools/acquisition
        run: |
          uv sync --locked
          uv run pytest -q

      # tests/test_set_contents.py:138 regenerates data/catalog/set-contents/*.yaml in place (see
      # data-ci.yml's header). Here that would be bundled INTO the release, so the tree is restored
      # to HEAD before anything reads it. Drift itself is data-ci.yml's finding to report, on the
      # change that introduced it; this job's job is to publish HEAD, not the post-test tree.
      - name: Restore any tree state the tests rewrote
        run: |
          git checkout -- data/catalog/set-contents
          git clean -fdq data/catalog/set-contents

      - name: Compute version
        id: ver
        run: |
          base="$(date -u +%Y.%-m.%-d)"
          # PROBE FOR A FREE TAG, don't count the taken ones. Counting assumes the day's tags form
          # an unbroken run, so one deleted tag makes the count point at a tag that still exists:
          # with v$base deleted and v$base.2 kept, the count is 1 and the next version recomputes
          # to v$base.2 -- a duplicate, and `gh release create` fails on it. Absence cannot collide.
          if ! git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            version="$base"
          else
            n=2
            while git rev-parse -q --verify "refs/tags/v$base.$n" >/dev/null; do n=$((n + 1)); done
            version="$base.$n"
          fi
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "tag=v$version"          >> "$GITHUB_OUTPUT"

      - name: Bundle catalog
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          dotnet run --project tools/WarHub.Catalog.Publish -c Release -- \
            --catalog-version "$VERSION" \
            --git-commit "$GITHUB_SHA" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$TAG" \
            --page-base-url "$PAGES"

      - name: Package partitions
        run: tar -czf catalog-${{ steps.ver.outputs.version }}.tar.gz -C dist .

      # THE ASSET LIST IS THE WHOLE CATALOG AS FAR AS A RELEASE CONSUMER IS CONCERNED, and until
      # this line it held two catalogs and neither of the relations that join them. Both are flat
      # root documents alongside products.json/paints.json, both were already in the tarball and on
      # Pages, and both were unfetchable on their own from a pinned release -- so the one journey
      # this data exists to serve (scan a box -> barcodes.json -> product id -> set-contents.json
      # -> paintId -> paints.json -> the colour) could be walked on `latest` and not on a version a
      # consumer had pinned. Measured 2026-08-31 over a full local publish, attaching them adds
      # 1.7 MB (barcodes.json 1.5 MB, set-contents.json 172 KB) beside the 20 MB of products.json
      # and paints.json already there -- and saves that consumer downloading the whole tarball.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Catalog ${{ steps.ver.outputs.version }}" \
            --notes "Automated catalog build from ${GITHUB_SHA:0:7}. Fetch \`manifest.json\` first — it lists every file with size + sha256." \
            dist/manifest.json dist/products.json dist/paints.json \
            dist/barcodes.json dist/set-contents.json \
            "catalog-${{ steps.ver.outputs.version }}.tar.gz"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
