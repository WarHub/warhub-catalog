p3:
  # FOUR charts across TWO ranges that must never be confused, so every one is set-scoped: the
  # relaunched `P3 Paints` and the original `Privateer Press Formula P3*`. A chart that spilled
  # across that boundary would restate one maker's colours as the other's, which is the whole
  # mistake this brand's history is made of.
  charts:
    - id: mixing-guide-2024-10
      url: https://cdn.shopify.com/s/files/1/0602/0156/6449/files/SFG-P3-Mixing-Guide.pdf
      # NAME-anchored: Steamforged's guide prints paint names, never codes.
      anchorNames: true
      set: P3 Paints
      pages: [0, 1, 2, 3]
      # Every page is a 4-column BASE / SHADE / HIGHLIGHT / +HIGHLIGHT table; each label cell
      # has its 16.6 x 16.3pt chip immediately to its left (dx -18.6) and half a line up
      # (dy -5.25). Chips are embedded images, not vector fills -- the only rects on the page
      # are the 3%-black zebra stripes -- so this is sampled from the render like every other
      # chart rather than read out of the PDF's colour operators.
      sample: { dx: -18.6, dy: -5.25, width: 16.6, height: 16.3, inset: 0.25 }
      # COVERAGE AND SELF-CONSISTENCY, measured 2026-08-13 over the committed store evidence:
      # 109 of the 110 singles get a chip. The only miss is Mixing Medium, which is not a
      # colour and appears in no recipe. Names repeat across recipes (up to 18 cells for
      # Menoth White) and the repeats agree: of the 84 colours in 2+ cells, the worst cell
      # sits a median of 0.0 from the consensus, and exactly two disagree at all -- Ryn Flesh
      # and Greatcoat Grey, each with a single dissenting cell that the median outvotes.
      # Both were confirmed independently against the product-photo panel below (d=17, d=7).
    - id: bottle-panel
      type: item-image
      useCatalogImages: true
      set: P3 Paints
      # The studio background panel IS the paint colour on this range (same shape as
      # ak-interactive's thirdgen-bottle-bg). Kept as the CROSS-CHECK and as the fill of last
      # resort: the guide above already covers 109 of 110, but it is a dated artifact
      # ("Updated: October 2024") and the range is live, so a colour added later will reach
      # this chart first.
      #
      # THE REGION IS A TALL LEFT STRIP ON PURPOSE. 18 metallics plus Mixing Medium (the
      # store's own $4.65 tier; the other 91 singles are $4.10) are rendered on a SHADED
      # panel that sweeps light-to-dark to suggest the metal, so a small window reads one
      # point of a gradient rather than the paint: measured against the guide, a compact
      # window like AK's scores median d=35.5 on those 19 and only 56% within 40, while this
      # full-height strip -- whose median spans the whole sweep -- scores 27.2 and 83%. On
      # the 91 flat panels the two are identical (the panels measure a channel spread of 0.0),
      # so one region serves both and no metallic special case is needed. Worst spread over
      # all 110 is 34.8, comfortably inside the 60 rejection ceiling.
      regions:
        - { x0: 0.02, y0: 0.05, x1: 0.26, y1: 0.75 }
      # CALIBRATION vs the guide, 109 colours, 2026-08-13: median dRGB 29.7, 86% within 40.
      # That residual is a near-CONSTANT darkening, not scatter -- the panel sits R -16.0,
      # G -16.5, B -18.0 from the chip (per-channel stdev only 5-7, luminance ratio 0.821),
      # i.e. the render is the paint colour with a fixed exposure offset. Anyone filling a
      # future colour from this chart should expect ~17/channel too dark and prefer the guide
      # where it has an entry. Deliberately NOT corrected here: a gain/offset field would be
      # machinery for zero current fills, and the measurement is the thing worth keeping.
      #
      # ONE GENUINE FAILURE, and it is loud rather than silent: Menoth White renders khaki
      # (#968E63 panel, #938B5C on the bottle body too) against the guide's #F1F1C2, d=164.6.
      # The guide wins, on four independent measurements (2026-08-13):
      #   * 18 chips across all four guide columns, byte-identical, visually verified against
      #     their labels in data/review/swatches/p3-mixing-guide-2024-10.jpg;
      #   * #F1F1C2 sits d=7.9 from PRIVATEER PRESS's own pre-relaunch chip for Menoth White
      #     Base (#EEEFBB, April 2022 guide) -- an ordinary barely-reformulated delta, in the
      #     band Royal Violet (4.1) and Runeshot (4.5) occupy. The khaki is d=157.8 from it;
      #   * the panel error is -97 luminance against a range median of -15.6 (stdev 13.9), i.e.
      #     -5.8 sigma; the next-worst is Radiant Platinum at -29.8, a gradient metallic;
      #   * it is not a two-SKU render swap -- no other paint's panel carries the missing cream
      #     (nearest is Devout White's own #DED8C1 at 31.4).
      # A single wrong colour fed to the render template, then, not a range-wide method problem:
      # every other white (Devout, Morrow, Retribution) renders correctly. It is the reason this
      # chart is second, and the reason it is worth keeping -- one witness could not have caught
      # it.
      skipCodes:
        # Colourless by nature. Its panel is the render's neutral backdrop grey (#A8A8A4),
        # which is a stand-in and not a pigment, and the guide gives it no chip precisely
        # because it has no colour. Minted as a paint (it is part of the range) but left
        # hex-less rather than filled with a plausible grey. Note the repo has gone the other
        # way for comparable products -- army-painter's 4 mediums and ak-interactive's
        # translucent effect fluids fill and are flagged for review -- so this is a judgement,
        # reversible by deleting this line.
        - SFP3-N235-S
    # --- the ORIGINAL Privateer Press range ---------------------------------------------------
    # Both documents are April 2022, both are Privateer Press's own, and they agree with each
    # other to a median of 1.0 dRGB (99% within 10) over the 78 colours both carry. Neither can
    # FILL anything -- all 92 legacy records already hold a colour -- so both run purely as
    # cross-checks, and that is the point: they are the standing verification behind the six
    # `hex:` corrections and the 92 PIP codes in data/paints/overrides.yaml, re-derivable by
    # running this generator instead of by trusting a comment.
    #
    # EXPECT DIFFERENCES EVERY RUN, and do not "fix" them. Most are +-1 per channel between a
    # rendered chip and a stored hex. The ones that matter are the two classes the correction rule
    # refuses: the line sheet prints an INK as an applied wash over white rather than as bottled
    # colour (Green Ink #87B993 against the archive's #129959), and the two metallics the two
    # documents disagree with each OTHER about (Cold Steel 8.8, Radiant Platinum 11.7) are a flat
    # print failing to photograph sheen. See the correction rule on the p3 block in overrides.yaml.
    #
    # The five washes report as `outside set` rather than as differences: they live in
    # `Privateer Press Formula P3 Wash` and both charts are scoped to the main set. That is left
    # as-is deliberately -- a second wash-scoped entry would cross-check five records whose chart
    # colour is known to be the applied wash, i.e. it would report a difference every run and mean
    # nothing by it.
    - id: pp-paint-line-2022-04
      url: https://home.privateerpress.com/wp-content/uploads/2022/05/P3-Paint-Line-Web_2022_v2.pdf
      # CODE-anchored: this sheet prints `PIP #####` under every name, which is where the
      # archive's 92 product codes come from. One page, 4 columns, a 22.1 x 22.1pt chip per entry.
      #
      # dx IS MEASURED FROM THE CODE WORD, NOT FROM ITS CELL, and the two are 17.7pt apart because
      # the anchor is the digits and the cell begins at `PIP `. Taking the cell's own x0 (-27.5)
      # lands the window inside the white gutter, every sample reads paper, and the paper guard
      # drops all 92 -- a chart that silently yields nothing rather than yielding something wrong.
      # Verified against an independent name-anchored extraction of the same page: 91 swatches,
      # median d=0.0, max 9.5. The 92nd is Morrow White, which IS paper-white and is exactly what
      # that guard is for.
      codePattern: '9\d{4}'
      pages: [0]
      set: Privateer Press Formula P3
      sample: { dx: -45.2, dy: -13.1, width: 22.1, height: 22.1, inset: 0.28 }
    - id: pp-mixing-guide-2022-04
      url: https://home.privateerpress.com/wp-content/uploads/2022/05/P3-Mixing-Guide-Web_2022_v1.pdf
      # NAME-anchored, like Steamforged's: this one prints recipes, never codes. 2 pages, the same
      # BASE/SHADE/HIGHLIGHT/+HIGHLIGHT layout, 8.7pt chips. Names repeat across recipes and the
      # repeats are byte-identical (61 colours in 2+ cells, worst-vs-consensus median 0.0).
      #
      # IT CARRIES THREE TYPOS OF ITS OWN -- `Battlefiled Brown`, `Bootstrap Brown` for Bootstrap
      # Leather, `Sulphuric Yellow` for Sulfuric Yellow -- so it is trusted for COLOUR and never
      # for names; the line sheet above is the naming authority. A name it misspells simply fails
      # to anchor, which is the safe direction.
      anchorNames: true
      pages: [0, 1]
      set: Privateer Press Formula P3
      sample: { dx: -11.03, dy: -1.33, width: 8.7, height: 8.7, inset: 0.25 }
