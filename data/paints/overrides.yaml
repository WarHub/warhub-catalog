  # is said so plainly. Those joined each record's `ean` to `hints.ml` in the manufacturer's own
  # observations; there is NO gram sibling to join against -- `_ML_RE` (sitemap_sd_paints.py:114)
  # is the only size parser in the GSW strategy and it looks for ml only, so both rows carry
  # `hints: {category, categorySlug, reference}` and no size at all. The name is nonetheless the
  # SAME second signal that agreed 79/79 with the evidence on the ml half, the manufacturer wrote
  # it, and `250gr` is unambiguous. tools/acquisition/tests/test_paint_weight.py re-derives both
  # figures from the committed names on every CI run, so this is single-sourced but not unchecked.
  #
  # NOT hints.grams. 1,843 observations across four Shopify sources carry one and it is GROSS
  # SHIPPING weight -- a brush is 3 g, an 18 ml dropper 26-31 g, a paint case 2450 g -- which
  # gen_paint_harvest.py:82 already depends on it meaning. Wiring it to `weightG` would fabricate
  # net contents on 1,843 records to fix these 2. GSW emits it on none of its 477 rows anyway.
  #
  # NOT A VolumeTable ROW, for the reason the block above already gives: their set is `Primer`,
  # which is genuinely mixed (240 ml x3, 60 ml x6, plus these two), so no per-set constant can be
  # right for it. A weight row in that table would need a whole set sold by mass and no such set
  # exists -- measured 2026-08-06, no (brand, set) anywhere in the archive is weight-sold.
  #
  # NO BARCODE MOVES here either: no `ean:` or `additionalEans:`, so `BarcodeSet.Union` writes
  # nothing.
  Foam Primer and Coat - Black 250gr|Primer:
    weightG: 250
  Foam Primer and Coat - Grey 250gr|Primer:
    weightG: 250
  # --- Colours carried across the three retractions above (2026-08-06) --------------------------
  # Each of these three keys names a paint that does NOT exist yet: `suffix_match`'s new set filter
  # files skus 1706/1702/2454 as additions instead of enrichments, and a harvest addition is born
  # `hex: ''` (HarvestApplier.cs:141-144). The three records they replace -- retracted at the top
  # of this file so their barcodes are not left on two records at once -- carry an Arcturus colour
  # each, and nothing else in the pipeline would carry it over: SwatchApplier is keyed
  # `{Name}|{Set}|{ProductCode}` and data/paints/swatches/green-stuff-world.yaml has no entry for
  # any of the three (measured 2026-08-06: it holds Blue/Lime/Red/Rose/Turquoise|Fluorescent and
  # nothing under `Chrome`). So without these three lines the retraction trades a wrong set name
  # for a lost colour.
  #
  # HEX IS NOT THE ONLY FIELD THAT MOVES, and an earlier draft of this comment implied it was.
  # All three records are `type: Metallic, finish: Metallic` today, and both classifiers run AFTER
  # AppendAdditions (PaintCatalogApp.cs:210 then :222-225) deriving from the record's SET -- which
  # is the whole point of the retraction. `Fluor Metallic` and `Metallic Colors` contain the
  # substring "Metallic"; `Fluorescent` and `Chrome` do not, so the re-homed records will classify
  # differently. That is CORRECT rather than a loss: a fluorescent paint filed under a metallic
  # set name was classified metallic because of the set name, not because of the pot. It is
  # recorded because "only the colour is at risk" was wrong and the next reader should not
  # rediscover it by diffing the archive.
  #
  # The values WERE the retracted records' own hexes, transcribed from
  # data/paints/brands/green-stuff-world.yaml (`Fluor Metallic|Violet` #BE68E3,
  # `Fluor Metallic|Yellow-orange` #F89D68, `Metallic Colors|Chrome Paint` #FCFDFF) -- the same
  # pots under the store's own set names, so the colour was not being re-asserted, only re-homed.
  # TWO OF THE THREE HAVE SINCE BEEN RE-MEASURED AND REPLACED; see the block immediately below,
  # which is the live justification for the values now on file. This paragraph is kept because the
  # reasoning it records -- transcribe rather than lose -- was right for the day it was written,
  # and only a measurement that did not exist yet could improve on it.
  # `OverrideApplier.Apply:64-69` recomputes R/G/B from the hex, so the three stay in sync.
  #
  # NOT belt-and-braces: `Chrome Paint|Chrome` is a NEW key, not a rename of `Chrome Paint|Metallic
  # Colors`, so an ordinal-lookup miss here is silent (OverrideApplier.cs:52-55) exactly as it is
  # for the 15 volume assertions above. All three keys were checked against the 412 committed
  # records for collisions (0) and against the regenerated harvest additions (3/3 present).
  #
  # RE-MEASURED AND CORRECTED 2026-08-06, same run that settled the `Fluor Metallic` retraction.
  # These two were the ONLY place the repo had accepted an Arcturus hex as the colour of a
  # store-harvested pot, and they were asserted sight-unseen: a harvest addition is born
  # `hex: ''`, no swatch entry existed, so transcribing the retracted record's hex was the only
  # way to keep A colour. It kept the wrong one. Now that both records are in the archive WITH a
  # hex they are cross-check targets rather than fill targets of the very chart that coloured the
  # other five in their set, and `gen_paint_swatches.py` sampled greenstuffworld.com's own product
  # photos: 1706 #CC35B6 vs #BE68E3 (d=69.4) and 1702 #FF9D01 vs #F89D68 (d=103.2). Those are the
  # two worst disagreements in the set and the only two of seven outside the sampler's own d<=40
  # band -- the other five, being photo samples already, came back at d=0.
  #
  # THE SAMPLES ARE THE BETTER FACT, not merely the newer one. Contact sheet
  # data/review/swatches/green-stuff-world-chip-fluorescent.jpg shows all 8 rows at `high`
  # confidence with crop and extracted colour agreeing, and the same chart, same region, same run
  # reproduced Arcturus's `Fluor Metallic|Orange` #F96E33 BIT-IDENTICALLY on 1703 -- so the method
  # is not biased against Arcturus, it disagrees with it per value. A pastel peach (#F89D68) and a
  # pale lavender (#BE68E3) were never plausible for pots sold as fluorescent; #FF9D01 and #CC35B6
  # are what the pot looks like.
  #
  # AND YET THESE TWO VALUES ARE NOT CHANGED, for two reasons found in review that each defeat
  # the edit on their own.
  #
  # (1) IT WOULD SPLIT THE RECORD AND DUPLICATE ITS BARCODE. `hex` is part of the identity key
  # (PaintRecordAdapter.cs:11-14) and `OverrideApplier.Apply` runs on the FRESH list
  # (PaintCatalogApp.cs:256) BEFORE `Reconcile` (:497), so a new hex moves the fresh key. The only
  # bridge back is the auto-alias at PaintCatalogApp.cs:487-494, and its guard is
  # `if (string.IsNullOrEmpty(rec.Details.Hex))` -- it rescues a record whose stored hex is EMPTY.
  # Both of these hold a non-empty one, so the archived record would SURVIVE beside a newly minted
  # one, both carrying ean 8436574500653 / 8436574500615. That is 2 new duplicate barcodes, in a
  # change whose entire purpose is to clear 3 -- and worse than the ones it clears, which were at
  # least between visibly different ranges. (`aliases:` WOULD work here, unlike for the Arcturus
  # records above, because these two are harvest-minted so `consumed` never blocks them. It is a
  # real option if the value is ever worth changing.)
  #
  # (2) THE REPLACEMENT IS NOT TRUSTWORTHY EITHER. `sample_item` takes a per-channel MEDIAN
  # (pdf_chart.py:67-74), and fluorescent pigment is out of sRGB gamut by construction, so a JPEG
  # product photo clips it: the proposed #FF9D01 has median R=255 and median B=1, i.e. more than
  # half the sampled pixels railed in two channels. #EEFF34 (1701), #00FF49 (1700), #008B6E (1776)
  # and #FE0C32/#FE2E82 rail too. "This is what the pot looks like" overstates what a clipped
  # photo can say. The calibration figure quoted above is also weaker than it reads: 5 of its 7
  # cross-checks compare the sampler against hexes THIS SAMPLER wrote on an earlier run, which
  # measures determinism, not accuracy. Only 2 checks were independent and both disagreed.
  #
  # So: Arcturus's values stay, flagged as unreliable rather than replaced by something equally
  # unreliable at the cost of two duplicates. Settling this needs a colour source that does not
  # clip -- a printed swatch card, or the manufacturer's own colour data.
  Violet|Fluorescent:
    hex: '#BE68E3'
  Yellow-orange|Fluorescent:
    hex: '#F89D68'
  Chrome Paint|Chrome:
    hex: '#FCFDFF'

# --- P3: one upstream misspelling, corrected against Privateer Press's own line sheet ----------
# `Trollblod Highlight` is missing an `o`. Privateer Press's FORMULA P3 PAINT LINE sheet (April
# 2022, home.privateerpress.com/wp-content/uploads/2022/05/P3-Paint-Line-Web_2022_v2.pdf) prints
# `Trollblood Highlight`, PIP 93070, and its chip is #BBB4A2 -- byte-identical to this record's
# hex, so the sheet is naming THIS pot and not some other. Corroborated by retailers listing
# 93070 under the same spelling, and by the archive's own neighbours `Trollblood Base` and
# `Trollblood Blue`, which spell the word in full.
#
# It is also the ONLY name this pair of Privateer Press documents corrects. Their Mixing Guide
# disagrees with the archive on two more -- `Bootstrap Brown` against our `Bootstrap Leather`,
# `Sulphuric Yellow` against our `Sulfuric Yellow` -- and in both cases the ARCHIVE is right and
# the guide is the one with the typo: the line sheet prints `Bootstrap Leather` (PIP 93031) and
# `Sulfuric Yellow` (PIP 93026), and it also carries `Battlefiled Brown` for Battlefield Brown.
# Three typos in the guide against one in the archive, which is why names are taken from the line
# sheet and only colours from the guide.
#
# `name:` is new (see PaintOverride.Name) and the paired `aliases:` entry above is REQUIRED. The
# key below stays the MISSPELLING for as long as upstream emits it -- it is what the base parse
# produces, and rewriting it to the corrected name would silently disable the correction.
p3:
  Trollblod Highlight|Privateer Press Formula P3:
    name: Trollblood Highlight
