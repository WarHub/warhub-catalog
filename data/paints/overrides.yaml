# Hand-maintained paint overrides: `{brand-slug}` -> `{Name}|{Set}` -> fields.
# Applied AFTER the manufacturer bridge (data/paints/barcodes/*.yaml), so an entry here beats both
# the bridge and the VolumeTable. Keep every entry cited -- these are asserted facts.
#
# --- Discontinued Citadel paints (researched 2026-07-31 against GW's own storefront) -------------
# Discontinuation is an ABSENCE: the upstream source stops listing a paint and the trade sheets no
# longer carry a row for it, so nothing in the pipeline can assert it. It has to be recorded here.
#
# The 31 Air colours below were culled on 2022-06-13, when GW deleted 44 Air SKUs from its trade
# register, reissued 13 under new codes and dropped these for good. Confirmed independently against
# the live storefront: GW's Air range enumerates as "Showing 45 of 45" and none of these is in it,
# and each per-colour slug 404s while controls (Air-Thallax-Gold-2019, Air-Typhon-Ash-2019) return
# 200 with `Pot size: 24ml`. The XV-88 slug trap was checked both ways (Air-XV-88 and Air-XV88).
# 31 culled + 13 reissued + the 2 still-current below = the 44 the register deleted, exactly.
#
# NOT included, deliberately: Mechanicus Standard Grey and Mortarion Green Clear. They look culled
# from the trade data but are LIVE on GW's storefront with lastChanceToBuy:false -- merely out of
# stock. They were the two paints the bridge could not name-match, which is why they looked absent.
