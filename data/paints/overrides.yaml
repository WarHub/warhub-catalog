# --- Green Stuff World dipping inks: WHICH POT the bare record is (decided 2026-08-06) ----------
# 31 `volumeMl: 60` assertions and 31 `priceEur` assertions, one pair per colour. They are the
# second half of the `additions:` block at the top of this file; neither half is correct alone.
#
# THE DECISION, AND IT IS A DECISION. `Papyrus Dip` carries ean 8435646508412, priceEur 3.7375 and
# .../dipping-ink-60-ml-papyrus-dip.jpg. All three belong to sku 3481, the 60 ml pot, and are
# byte-identical to its evidence row on 31/31 records -- only `volumeMl: 17` disagrees. So the
# record is declared to BE the 60 ml pot, and the 17 ml pot is minted beside it. The rival reading
# (a 17 ml record wearing three of the 60 ml pot's fields) fits the same bytes; it is rejected
# because it needs three fields rewritten and this needs one, and because `imageUrl` is not
# overridable at all (PaintOverride, OverrideApplier.cs:251-288, has no such field and `Apply`
# never assigns ImageUrl), so under that reading the record would keep a 60 ml photo forever.
#
# WHY NOT JUST CORRECT THE ean, which is the obvious repair. Nothing in this pipeline can REMOVE a
# barcode from a surviving record: the displaced value is unioned straight back as `additionalEans`
# (OverrideApplier.cs:83, and PaintRecordAdapter.cs:31 does it again in Merge). A 60 ml pot's
# gtin13 would then be published as an alternate barcode of a 17 ml pot -- the exact "factual lie"
# report.py:200-203 says the ean-guard was loosened to avoid -- and since `_check_paints` keys
# holders on (brand, role) at :227-240, the demotion reports as `paint_moved` and exits 0 (only
# `lost`/`paint_lost` reaches the exit-5 branch at cli.py:355). That repair fails
# silently and green, which is worse than failing loudly.
#
# WHY THE RECORDS ARE NOT RENAMED TO `X 60 ml`, which would be the symmetric shape. All 31 are
# Arcturus-origin -- firstSeen 2026-07-10, no productCode; the partition is exact (220 Arcturus /
# 161 harvest over 381 records) and all 31 appear in the initial import a3ca2c6, which carries 220
# records and zero eans. The base source therefore re-asserts their identity key on every run, so
# `consumed` is seeded with it (CatalogReconciler.cs:40-46) and an `aliases:` entry is refused at
# :84. The three GSW aliases above only fire because `Green Stone Dip` and `Nightshade Purple Dip`
# are harvest-minted names Arcturus never supplied -- while "Nightsahde", the store's typo, IS in
# that import. Renaming these would need `retract:`: 31 deleted records, 31 firstSeen dates reset
# to today, 31 archived hexes to re-assert by hand. The asymmetry that buys (`Papyrus Dip` = 60 ml
# beside `Papyrus Dip 17 ml`) is a price already paid elsewhere in this set -- see `Nightsahde
# Purple Dip` beside `Nightshade Purple Dip 17 ml`.
#
# WHAT MOVES: NOTHING. No `ean:` is overridden anywhere in this block, so `BarcodeSet.Union` drops
# the one value equal to the primary and not a single `additionalEans` entry is written. The 31
# sixty-ml barcodes stay the primary `ean` of the same record in the same brand file, which
# `_check_paints` answers with no finding at all -- not even an informational `moved` -- and the 31
# seventeen-ml barcodes are new, so HEAD attests nothing about them. Predicted `warhub-data report
# --ean-guard` after the tool runs: paint_lost 0, paint_moved 0, exit 0. (Measured green on this
# tree before the edit, and again after it -- the guard reads brands/ and products/, and this
# commit changes neither.)
#
# THE ARCHIVE DOES NOT CHANGE IN THIS COMMIT, DELIBERATELY. Only the paint tool writes
# data/paints/brands/green-stuff-world.yaml and it is not run here: all 31 records still say
# `volumeMl: 17`, and the 31 minted pots do not exist yet. Reading this block as already applied is
# the mistake to avoid.
#
# DELIBERATELY NOT FIXED HERE, so the asymmetry is visible rather than an oversight. `volumeMl: 17`
# is wrong on 81 OTHER GSW records, two of which are dipping inks and will sit right beside these:
# `Green Stone Dip 60 ml` (3487) and `Nightsahde Purple Dip` (ean 8435646508580 = sku 3498, 60 ml).
# Neither is a collision -- their 17 ml siblings are ALREADY held correctly by `Green Stone Dip
# 17 ml` (4220) and `Nightshade Purple Dip 17 ml` (4231), so nothing is unhomed and there is
# nothing to mint; only the volume is wrong. Measured 2026-08-06, joining every record's ean to
# observations.jsonl on `hints.ml`: 369 records carry an ean, 369 join, 127 joins carry an ml hint,
# 112 contradict `volumeMl: 17` (60 ml x44, 240 ml x30, 30 ml x20, 400 ml x18). 31 of the 112 are
# this block; the other 81 are one brand-wide rule -- VolumeTable.cs:101, written unconditionally
# by VolumeEnricher.cs:26-30 -- which also stamps `container: dropper` on 18 aerosol cans. Fixing
# that is a C# change to the volume tables sized at 81 records + 18 containers, sharing no code, no
# failure mode and no barcode exposure with this one, and it will additionally have to cover the 31
# pots minted here: they are born at 17 ml, which is right, but their bare 60 ml partners are only
# right because of the `volumeMl: 60` lines below.
#
# THAT FOLLOW-UP HAS NOW LANDED (2026-08-06), and the count came out at 79, not 81: the two dipping
# inks named just above were taken by the `volumeMl: 60` lines in this very block, leaving 79. It is
# a SPLIT, because one mechanism does not fit them: 64 are three per-set rows in VolumeTable.cs
# (Flexible, Dry Brush, and one row for the three 400 ml spray sets, which also carries the 18
# aerosol containers), and the other 15 are per-record `volumeMl` assertions at the bottom of this
# section, because Primer/Varnish/Blackest Black are mixed-volume sets no constant can express. The
# 31 pots minted here are untouched by both: they are 17 ml, the brand-wide rule still says 17, and
# no `Dipping Inks` row was added precisely because that set is 36 evidenced 17s beside 33
# evidenced 60s.
