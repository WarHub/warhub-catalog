  # ---------------------------------------------------------------------------------------------
  # THE 15 THE VOLUME TABLE CANNOT REACH (2026-08-06). The other 64 of the 79 records that
  # contradicted `volumeMl: 17` are fixed in VolumeTable.cs by three per-set rows, because their
  # sets are volume-uniform AND fully evidenced. These 15 are not: their three sets are genuinely
  # MIXED, so a per-set constant is wrong by construction, not merely imprecise.
  #
  #   Primer          240 x3, 60 x6, and 2 records with NO ml at all
  #   Varnish          17 x4 (already right, untouched), 60 x4, 240 x1
  #   Blackest Black   17 x1 (already right, untouched), 60 x1
  #
  # `Gloss Black Primer` is the shape of the problem: greenstuffworld.com sells it as a 60 ml
  # bottle (sku 1743, 8436574501025) AND a 240 ml one (sku 4692, 8435646520520), two barcodes on
  # two records, and a `Primer` row would have to pick one and lie about the other. A `Primer` row
  # would ALSO stamp an ml figure on `Foam Primer and Coat - Black/Grey 250gr`, which are sold by
  # WEIGHT and carry no `hints.ml` -- see the known-wrong note at the bottom.
  #
  # EVERY VALUE HERE IS JOINED, NOT TYPED. Each record's own committed `ean` was looked up in
  # data/evidence/products/mfr-greenstuffworld/observations.jsonl and the asserted figure IS that
  # row's `hints.ml`, 15/15. A second independent signal agrees on all 15: the record's own name
  # already states the volume ("Matt Cream Primer 60ml", "Paint 60 ml"), and across all 79 the two
  # signals disagreed ZERO times. Each key names exactly one committed record (measured: 412
  # records, 412 distinct `{Name}|{Set}`, 0 collisions), so none of these is the silent no-op
  # `OverrideApplier.Apply`'s ordinal lookup turns a mistyped key into (OverrideApplier.cs:52-55).
  #
  # WHY A HAND ASSERTION AND NOT THE DURABLE MECHANISM. fe4a2dd's limitation applies here too: an
  # override has exactly one asserter and no regeneration re-confirms it. The generated manufacturer
  # bridge would be the durable home -- except `--barcodes` is a single FileInfo
  # (PaintCatalogApp.cs:41-44), not a directory like `--harvest`, and
  # .github/workflows/paint-catalog-update.yml:81 hardcodes the citadel-colour path, so a
  # green-stuff-world.yaml beside it would be read by NOTHING; and `BarcodeEnricher.Apply`'s
  # projection (BarcodeEnricher.cs:96-118) writes Ean/AdditionalEans/VolumeMl and four prices but
  # never Packaging, so it could not have carried the container half of this repair regardless.
  # The cost is paid HERE and only here, and it is bought back by
  # tools/acquisition/tests/test_paint_volume_gsw.py, which re-derives all 15 from the evidence on
  # every CI run -- so unlike the `volumeMl: 60` block above these are single-authored but not
  # single-asserted.
  #
  # NO BARCODE MOVES, exactly as above: no `ean:` or `additionalEans:` appears in this block, so
  # `BarcodeSet.Union` writes nothing and `_check_paints` has nothing to report.
  #
  # THE TWO KNOWN-WRONG RECORDS THIS COULD NOT REACH ARE NOW REACHED, by `weightG:` rather than by
  # an ml figure -- see the block after the volume assertions below. What was out of reach was
  # never the value, it was the CONTRACT: there was no way to say "sold by weight", and no way to
  # clear a volume at all. 254 GSW records still carry no `hints.ml` (the hint is on 158 of 477
  # observation rows), so no mechanism here can confirm or deny their 17; that gap is unchanged.
  Paint 60 ml|Blackest Black:
    volumeMl: 60
  Gloss Black Primer 60ml|Primer:
    volumeMl: 60
