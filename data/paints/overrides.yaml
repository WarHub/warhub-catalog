# Manual corrections to the paint catalog. Hand-edited; read by tools/WarHub.PaintCatalog.Tool
# (--overrides). Every section is keyed by brand slug and read independently, so a mistake in one
# section cannot silently disable another.
#
#   <brand-slug>:  "{Name}|{Set}" -> field overrides (productCode, hex, volumeMl, packaging, ean,
#                  additionalEans, priceGbp/Usd/Eur/Cad, supersededBy)
#

#   additions:     <brand-slug> -> list of MINTED paints (name, set, productCode, ean, imageUrl,
#                  supersededBy). For records a maintainer researched that NO upstream source
#                  supplies. Distinct from data/paints/harvest/*.yaml `additions:`, which are
#                  GENERATED from observed manufacturer listings and rewritten by the generator.
#   aliases:       <brand-slug> -> {new identity key: old identity key} (reconciler renames)
#   retract:       <brand-slug> -> [identity key] (drop from the archive)
#
# Minted paints are appended before the enrichment chain, so volume/container/type/finish/barcodes
# come from the same tables a native paint uses. They are born colour-less (hex "", r/g/b 0) like
# harvest additions; a swatch-extraction pass or an explicit `hex:` override fills the colour later.

additions:
  ak-interactive:
    # THE ONE PAINT IN THIS CATALOG THAT NOBODY SELLS. Warlord's listing for the Winter Blue
    # Soldiers set (warlord-games/AK17524) enumerates its contents and annotates one of them:
    #   - AK17082 WOLF BLUE GREY *Special color only for this set - not sold separately.*
    # Code, name, range and commercial status, all in the source's own words. Nothing STATED HERE
    # is inferred; the only thing missing is a product page, and the source explains why there is
    # none. That is a claim about the four keys below, not about the published record -- see the
    # note on derived fields at the end of this block.
    #
    # WHY IT IS MINTED RATHER THAN LEFT AS A REFUSAL, which is the opposite of the usual answer
    # in this repo. `unresolved:` is right when the CATALOG has a gap -- when a code names a paint
    # we simply failed to acquire, refusing says "go and look". Here there is nothing to go and
    # look at: no page exists, no future acquisition can find one, and the refusal would stand
    # forever while the evidence it needs sits committed three files away. A permanent refusal
    # over settled evidence is not caution, it is a record we declined to write.
    #
    # And this is the record that matters MOST, by the catalog's own stated purpose. The
    # equivalence pass argues it about discontinued paints: somebody holding a pot nobody makes
    # anymore is the single most likely person to need the catalog. A set-exclusive colour is the
    # extreme of that -- it has no page to search, no shop listing, no barcode to scan. Someone
    # holding this bottle and reading "AK17082 WOLF BLUE GREY" off the label has exactly one way
    # to find out what it is, and this is it.
    #
    # THE CODE IS THE IDENTIFIER, and it is real. AK's Quick Gen numbering runs AK17001-AK17079
    # for the 79 retail colours (complete in the archive, zero gaps), then AK17080 and AK17081 for
    # the 18 ml and 60 ml mediums, then this. AK allocated a catalogue number to a colour it makes
    # for one box -- the sequence is the evidence that the code is genuine rather than a typo.
    #
    # NO BARCODE, and none is obtainable. All 79 committed Quick Gen paints carry zero EANs, so a
    # barcode is missing for the whole RANGE, not just for this pot -- a colour that is never sold
    # on its own is the last one that would ever get a retail one. The `ean` key is therefore
    # absent rather than blank, and must stay absent: inventing one would be the only field on this
    # record with no basis at all.
    #
    # Born colour-less (hex "", r/g/b 0) like every other minted paint. `soldSeparately: false` is
    # the whole reason that field exists -- without it this publishes as status current /
    # availability unknown, indistinguishable from a pot you can walk in and buy.
    #
    # FOUR PUBLISHED FIELDS ARE DERIVED, NOT STATED, and saying so is the honest version of the
    # sentence at the top of this block. A human wrote exactly four keys here -- name, set,
    # productCode, soldSeparately. The committed record additionally carries volumeMl 18 and
    # container dropper, which come from VolumeTable's `["Quick Gen"], 18, "dropper"` row, and type
    # Standard / finish Matte from the classifiers. The volume rule is itself evidenced -- AK's own
    # full-range listing says "79 COLORS + 1 MEDIUM 18ML" -- but it is evidence about the RANGE, and
    # no source states the volume of THIS pot, which has no listing to state one. That is the same
    # treatment every minted paint in this file gets, and it is defensible; what was not defensible
    # was calling the result "fully-sourced" while four of its published fields came from a table.
    - name: Wolf Blue Grey
      set: Quick Gen
      productCode: AK17082
      soldSeparately: false

    # TWO 3RD-GEN SINGLES AK STOPPED SELLING BUT STILL SHIPS INSIDE BOXES. Both are enumerated by
    # AK's own set descriptions -- AK11253 "Grey Primer" in 4 sets, AK11388 "Harness & Uniform
    # Belts" in 2 -- and both answer NOTHING on ak-interactive.com today (live Store API query
    # 2026-08-09, exact-sku search, no result), while every other refused code from those same
    # sets either answered or turned out to be a brush.
    #
    # Same shape as reaper's 29107/29815, and minted for the same reason: a discontinued single
    # that a currently-sold box still contains is precisely the record someone holding the pot
    # needs, and the catalog is the only place left that can hold it. Both codes sit inside AK's
    # 3rd Gen AK11xxx block (502 codes committed), so they are gaps in a covered range rather than
    # products of some line nobody swept -- there is no descriptor change that would recover them.
    #
    # NO `soldSeparately` KEY, and the omission is the statement. AK17082 above carries `false`
    # because Warlord's listing SAYS "not sold separately". These two say nothing of the kind --
    # AK simply stopped listing them, which is a different fact, and absence is how this field
    # spells "no source said". Writing `false` here would launder a discontinuation into a
    # manufacturing decision.
    #
    # AK11388's `set` IS A GUESS, and this block used to be silent about the one field that is.
    # `set` is half the identity key, so it cannot be left absent the way `soldSeparately` can --
    # something has to be written, and nothing states it. Three signals disagree, measured over the
    # committed AK11xxx blocks 2026-08-11:
    #
    #   NUMBERING SAYS AFV.      AFV (3rd Gen) runs AK11301-AK11387 (n=80) and Figures (3rd Gen)
    #                            runs AK11401-AK11440 (n=40). AK11388 is the immediate successor of
    #                            AK11387, the last AFV code, in the otherwise empty gap between the
    #                            two blocks.
    #   SEMANTICS SAY FIGURES.   The only two sources that name it are AK11690 "WWII LUFTWAFFE
    #                            PILOT UNIFORM COLORS" and AK11691 "WWII US PILOT UNIFORM COLORS".
    #                            Harnesses and uniform belts on pilots is figure painting, not
    #                            armour.
    #   THE RECORD SAYS STANDARD, which is what is written below. Excluding this mint, Standard
    #                            (3rd Gen) runs AK11002-AK11262 (n=182); AK11388 sits 126 codes
    #                            above its top and is the only member above AK11262.
    #
    # AND THE CHOICE IS SELF-CONFIRMING, which is the trap worth naming: computed WITHOUT this mint
    # Standard reads AK11002-AK11262, computed WITH it the same block reads AK11002-AK11388. The
    # mint is the only thing that stretches the range far enough to cover its own code, so "it fits
    # in Standard" is an artefact of having put it there.
    #
    # Left as Standard rather than moved, deliberately. Moving it to AFV would trade one guess for
    # a better-argued guess and churn the identity key -- the brand record, two set-contents members
    # and a _liveness key -- while still asserting something no source says. The honest fix is to
    # stop the value looking settled. A source that states the range replaces this paragraph; AK's
    # four published 3rd Gen full-range maps do not, having been checked and not naming AK11388 at
    # all, which is itself consistent with a colour AK stopped listing.
    - name: Grey Primer
      set: Primer (3rd Gen)
      productCode: AK11253
    - name: Harness & Uniform Belts
      # INFERRED, not stated -- see the three-way disagreement above.
      set: Standard (3rd Gen)
      productCode: AK11388

  citadel-colour:
    # Games Workshop reformulated the Hexwraith Flame and Nighthaunt Gloom Technical paints with
    # Contrast chemistry and relaunched them IN the Contrast range on 2022-07-16 -- 18 ml, under a
    # new 991899600xx product-code block. GW's trade announcement of that wave: "We've also improved
    # the existing Hexwraith Flame and Nighthaunt Gloom Technical paints to benefit from the
    # ground-breaking science behind Contrast." (GW store slugs: contrast-hexwraith-flame-18ml-2022,
    # contrast-nighthaunt-gloom-18ml-2022.)
    #
    # These are TWO PRODUCTS, not a re-key of the Technical pots: new range, new volume, new
    # formula, new code block -- and `set` is part of the paint identity key (set|name|productCode|
    # hex), so each is a genuinely new identity. The Technical records stay, and point forward.
    #
    # Neither Arcturus5404/miniature-paints nor any harvested manufacturer source carries them,
    # which is why they are minted here rather than harvested. NO hex is asserted: the Technical
    # hex describes the OLD formula, so copying it across would be fabrication.
    - name: Hexwraith Flame
      set: Contrast
      productCode: '99189960060'
      source: Games Workshop trade announcement, 2022-07-16 Contrast wave
    - name: Nighthaunt Gloom
      set: Contrast
      productCode: '99189960061'
      source: Games Workshop trade announcement, 2022-07-16 Contrast wave
  # --- Green Stuff World dipping inks: the MISSING 17 ml pot of 31 colours (2026-08-06) --------
  # greenstuffworld.com sells these 31 colours in two pots -- 17 ml at EUR 2.125 and 60 ml at
  # EUR 3.7375, separate skus with separate gtin13s -- and the paint catalog has ONE record per
  # colour. `suffix_match` (gen_paint_harvest.py:1199) joins on the longest catalog name a store
  # title ENDS with, and GSW writes the volume mid-title ("Dipping ink 60 ml - PAPYRUS DIP"), so
  # both pots claimed the same bare archived name and first-wins gave that record the 60 ml row's
  # ean, priceEur and imageUrl. The 17 ml pot reached nothing: measured 2026-08-06, its 31
  # barcodes are held by no record in data/paints/brands/*.yaml, no product in
  # data/catalog/products/*.yaml, and appear nowhere under data/ outside the evidence file and
  # its cursor. These entries are that pot, and the field-override block at the bottom of this
  # file is the other half of the same repair -- read them together.
  #
  # THE GENERATOR CANNOT DO THIS, WHICH IS WHY EACH ENTRY CARRIES ITS OWN ean AND imageUrl.
  # Simulated 2026-08-06 with all 31 records already in the archive: bridge_gsw's output is
  # unchanged -- enrich 174, additions 161, candidates 142, +0/-0 on all three. `suffix_match`
  # stays volume-blind (norm("Dipping ink 17 ml - Papyrus Dip") ends with `papyrusdip`, never
  # `papyrusdip17ml`), so both rows still contest the bare key and both still land in
  # `candidates`, where a candidate carries no ean and no image (9789741). Minting is necessary
  # and not sufficient, exactly as suffix_match's own comment says.
  #
  # NOTHING BELOW IS TRANSCRIBED. Each entry is joined to the observations row whose `sku` is its
  # productCode: `ean` (all 31 pass the EAN-13 check digit), `imageUrl` (whose filename states the
  # volume: dipping-ink-17-ml-<slug>.jpg), and `hints.ml == 17` on all 31. `name` is
  # `gsw_clean_name` (gen_paint_harvest.py:1164) applied to the store title, spelling included --
  # so if bridge_gsw ever promotes these rows to `additions`, HarvestApplier runs first
  # (PaintCatalogApp.cs:210) and this block dedups on the identical {Name}|{Set}|{ProductCode}
  # triple (OverrideApplier.cs:132-141) instead of minting a twin.
  #
  # WHAT A PaintAddition CANNOT SAY (:291-302 -- no price, no volume, no hex), and where each of
  # those comes from instead:
  #   * priceEur: asserted per colour in the field-override block at the bottom of this file.
  #   * volumeMl: correct for free. AppendAdditions runs at PaintCatalogApp.cs:217, BEFORE
  #     VolumeEnricher (:223), and VolumeTable.cs:101's brand-wide rule ("Green Stuff World",
  #     null, 17, "dropper") is right for a 17 ml dropper. It is wrong for 81 other GSW records;
  #     that is the deferred change described at the bottom of this file.
  #   * hex: born empty, like 66 of the brand's 381 records. swatch-sources.yaml's `chip-dipping`
  #     item-image chart samples this exact shape from the catalog imageUrl -- `Green Stone Dip
  #     17 ml|Dipping Inks|4220` in data/paints/swatches/green-stuff-world.yaml is the precedent,
  #     minted the same way -- and the auto-alias pass (PaintCatalogApp.cs:483-490) then merges
  #     the hexed identity onto the hexless one instead of stranding it.
