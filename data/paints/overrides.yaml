    # twice. `Fluor Paint YELLOW` (1701) sampled #EEFF34 vs Arcturus's #F8FB48, d=22.7, inside the
    # sampler's own d<=40 band. Contact sheet: data/review/swatches/green-stuff-world-chip-
    # fluorescent.jpg -- 8 rows, every one `high` confidence, crop and extracted colour agree.
    # This is the calibration pair that did not exist before: the two sources never described the
    # same pot, because the swatch pass only fills EMPTY hex and the 7 have no productCode, so
    # `load_catalog` (gen_paint_swatches.py:140-142) skips them and always will.
    #
    # CORROBORATING, all measured 2026-08-06. Over all 477 rows of
    # data/evidence/products/mfr-greenstuffworld/observations.jsonl the store has exactly ONE
    # fluorescent category (fluorescent-acrylic-paints) holding exactly 10 individual paints,
    # 1700-1776, every title `Fluor Paint <COLOUR>`; across all 17 category slugs
    # (gen_paint_harvest.py:1092-1109) ZERO rows are a metallic fluorescent. Upstream's column
    # header is `Set`, not `Range` (GreenStuffWorld.md:4), it has no fluorescent grouping other
    # than this one, and its 9 `Fluor Metallic` names are GSW's 10 `Fluor Paint` colours MINUS
    # Turquoise -- 1776, the highest/newest code, which upstream simply predates. "Metallic" is a
    # qualifier Arcturus appends: it files GSW's `Candy Ink AMBER ORANGE` as `Candy Ink Metallic`
    # and `Chameleon Acrylic Paint` as `Chameleon Colorshift Metallic` too.
