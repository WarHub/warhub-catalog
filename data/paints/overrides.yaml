  #
  # `weightG:` IS THE CLEAR. There is no `volumeMl: null` here and there cannot be: YamlDotNet
  # cannot tell an absent key from an explicit null on an `int?`, so a coalescing override
  # (`over.VolumeMl ?? p.VolumeMl`, which is what this file's every other field still does) can
  # only ever REPLACE a volume, never withdraw one. Stating the mass is what withdraws it --
  # Models/NetContents.cs holds the rule and PaintRecordAdapter applies the same one to the
  # archive merge, so the committed 17 is dropped rather than re-inherited on the next run.
