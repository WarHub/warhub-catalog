# Retractions. `{Set}|{Name}|{ProductCode}|{Hex}` -- the same grammar as `aliases:` above and the
# same whole-string NameNormalizer pass, so readable casing here is cosmetic. Everything else must
# be exact: the ` - ` separators, the `(x4)` suffixes, and the trailing pipe an empty hex leaves.
#
# This is the ONLY code path in the pipeline that DELETES an archived record. Everything else is
# append-only; CatalogReconciler subtracts exactly this set (:52-55 on the input side, :104 on the
# output side) and nothing else. Keys are matched with an ORDINAL HashSet, so a mistyped key is a
# silent no-op with no error, no warning and no log line -- it looks exactly like success while
# the record stays. Every key below was GENERATED from the record it names rather than transcribed,
# then round-tripped through YAML and checked back against PaintRecordAdapter.IdentityKey: 23/23
# match, each exactly one archive record. `test_repo_data.py` pins that check.
#
# TWO GROUPS, and they are here for unrelated reasons. The 20 boxed sets below are the original
# block; the 3 Green Stuff World singles appended after them (2026-08-06) are the forced half of
# the `Fluor Metallic` set-naming question -- see the block comment that introduces them.
#
# The 20 are boxed MULTI-POT SETS published as if each were a single pot (maintainer decision
# 2026-08-05: a boxed set is a PRODUCT, not a paint). Each carries fabricated single-pot structure
# -- `container: dropper`, `hex: ''`, `volumeMl: 17` (reaper's says 15) -- describing a cardboard
# box that has no volume, no container and no colour. 19 green-stuff-world, 1 reaper; they are the
# only archive records anywhere whose NAME says set/collection and whose hex is empty.
#
# THE ORDER MATTERS, AND THE RE-HOME IS ALREADY DONE. Commit 9c62fb2 moved 516 boxed sets into the
# product catalog first. Each of the 19 Green Stuff World box GTINs is now the primary `ean` of
# exactly one `category: paint-set` product with `eanConfidence: confirmed`, under the id
# `green-stuff-world/<the very productCode its key below carries>` (8435646528441 ->
# green-stuff-world/13344 ... 8436574506310 -> green-stuff-world/10132). Uncovered: zero. Six of
# the 19 match by GTIN but NOT by name -- the products keep the full store titles ("Chameleon
# Acrylic Paint Set 1", "Paint Set - CHROME", "Metallic Paints Set - Colours/Gold/Silver") -- so a
# name-based re-verification reports false gaps; join by barcode. Reaper's set has no barcode on
# EITHER side (the paint record's `ean` is null and product reaper/09985 carries none), so it
# retracts with nothing to preserve. Commit 725dc0e taught `report --ean-guard` to call a barcode
# that crossed into the product catalog `moved` rather than `lost`, so these 19 report as moved
# and the run stays green; retracting BEFORE the re-home would have been 19 genuine losses.
#
# APPLIED. This paragraph used to say the opposite -- "the archive does not change in this commit,
# the 20 are still published" -- which was true when the block was written and false from the
# moment commit 2277fb1 ran the paint tool. Measured 2026-08-07: 0 set-shaped hexless records
# remain in either brand file, `report --ean-guard` reports the 19 GSW barcodes as `moved` (held
# by their product records) and exits 0. A comment describing a pending action AFTER it has been
# taken is worse than none: it tells the next reader the block is inert and invites them to
# "apply" it again.
#
# The generator stopped PROPOSING them in 6b3c930: all 20 sit in `candidates:` in
# data/paints/harvest/{green-stuff-world,reaper}.yaml under `reason: boxed set -- crosses to the
# product catalog` (by sku for the six GSW rows whose store title differs from the archived name),
# and none appears in either file's `enrich:` or `additions:`. They are therefore already absent
# from `fresh`, so it is the OUTPUT-side arm that does the work this run; the input-side arm guards
# a re-listing -- but only one AT THE SAME IDENTITY. The key includes hex, and all 20 are hexless,
# so if a source ever supplies a colour for one of these boxes the fresh key differs,
# `retracted.Contains(freshKey)` is false, and the auto-alias that would map the hex key back to
# the hexless one is itself refused (CatalogReconciler.cs:82 `!retracted.Contains(canonicalKey)`).
# The box would then be inserted as a brand-new record with today's firstSeen. Nil risk today
# (0 swatch keys, 0 enrich keys, 0 additions for all 20), and stated because "standing guard"
# overclaims otherwise.
#
# Nothing else in data/paints refers to them: 0 hits in equivalences.yaml (an empty hex is excluded
# from equivalence matching), 0 in swatches/*.yaml, 0 in the `additions:`/`aliases:`/field-override
# sections of this file, and 0 as any record's `supersedes`/`supersededBy` -- nor does any of the 20
# declare lineage of its own. Their 20 `_liveness.yaml` entries (all `lastSeen: '2026-07-24'`,
# `missStreak: 0`) become orphans the moment they leave `reconciled.Records`, and
# LedgerMaintenance.PruneOrphans deletes them -- but ONLY on a FULL run (PaintCatalogApp.cs:452
# `fullRun = authoritativeRun && brandFilter is empty`, :579). A `--brand` or `--sample` run
# retracts the records and leaves 20 stale ledger rows behind.
#
# ONE HAND-RUN CAVEAT, shared with the monument-pro-acryl `ean:` correction that lands beside this
# block. That correction hands three dropper records their own barcodes, so the three 1-Step
# barcodes they were wrongly carrying (655368408984 / 655368429989 / 655368417375) briefly belong
# to no record and `warhub-data report --ean-guard` exits 5 with three `paint_lost` findings.
#
# The window closes at COMMIT, not at the tool run. `check_ean_guard` diffs HEAD against the
# WORKING TREE (report.py `_head_yaml_files`/`_head_document`), so it is only ever comparing
# uncommitted edits: once HEAD carries the corrected `ean:` values, HEAD no longer attests the
# three old barcodes and there is nothing to find. An earlier draft of this comment said the
# window stayed open until the tool minted the 1-Step records, which was wrong about both the
# mechanism and the duration.
#
# CI is unaffected either way: the guard's only paint-side enforcement point is
# paint-catalog-update.yml, which runs it AFTER the tool (:102-108), and ci.yml does not run it.
retract:
  # --- AK: one pot listed twice, retracted (2026-08-07) ------------------------------------------
  # 194 records that are NOT products. The upstream Arcturus5404/miniature-paints tables emit one
  # row per (paint, BROWSING CATEGORY) -- AK.md:440 and :442 are two `AK706 Light Rust` rows
  # identical but for the third column, "AFV" and "General" -- and `set` is part of this repo's
  # paint identity key (set|name|productCode|hex, PaintRecordAdapter). So one pot filed under two
  # headings becomes two identities. MarkdownPaintParser reads the rows faithfully; the duplication
  # is inherited, not introduced, and the reader must NOT be "corrected".
  #
  # Verified before deleting anything: all 194 groups are byte-identical apart from `set` and the
  # `type` derived from it. No group is two genuinely different products. And AK itself does not
  # multi-file paints -- of 390 live products carrying a Serie slug, exactly 9 carry two, and all 9
  # are boxed sets or packs; ZERO single paints are multi-filed.
  #
  # WHICH ROW SURVIVES IS EVIDENCE, NOT PREFERENCE, and file order was rejected as the rule: it is
  # arbitrary, and for 89 of these the surviving label also decides the published `details.type`.
  #
  # ak-real-color -> keep `Real Colors - Standard`, `- Air`, `- AFV`; drop `- WWII`, `- Modern`,
  # `- Clear`. Two independent tests agree. (1) Containment: a set whose every coded member also
  # appears under another set is a browsing theme, and WWII is 144/144 = 100% re-listed, Modern
  # 31/31, Clear 6/6, while Air (65%) and AFV (66%) hold members of their own. (2) AK's own store
  # API lists only FOUR Real Colors facets -- RC Civil, RC Military, RC Standard, RC Markers. There
  # is no "Modern" and no "Clear" in AK's taxonomy at all, and `rc-standard-en` contains exactly
  # this block renumbered (RC801-826) INCLUDING the six clears, 31 old codes onto 26 new with
  # exactly five discontinued and no residue. `Modern` is byte-identical in membership to
  # `Standard`: two labels on one thing.
  #
  # ak-interactive -> keep `General`; drop the `AFV` and `Naval` halves. Both ARE real AK series
  # names, so this one is decided by what the colours are. All 12 shared codes are generic effects
  # (rust x5, chipping, tracks x2, mud, middle grey, medium brown, burnt umber) while AFV's
  # exclusive AK7xx members are nation/era camo (RAL Dunkelgelb, IDF Sinai Grey, 4BO Russian
  # Green). AK's own present-day successors for these colours sit in AK11001-11251, which is the
  # General Serie -- proved numerically: AK's product title says "236 references" and the live
  # evidence holds exactly 236 SKUs in that block, against AK11301-11399 for AFV, whose contents
  # are national (AK11383 "BRITISH LIGHT MUD - AFV"). AK730 Wooden Deck settles the shape: `Naval`
  # is the contiguous AK5001-5046 line plus AK730 alone, so its Naval tag is a subject
  # cross-listing, and Naval keeps its own Wooden Deck at AK5032.
