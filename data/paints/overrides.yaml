# Manual corrections to the paint catalog. Hand-edited; read by tools/WarHub.PaintCatalog.Tool
# (--overrides). Every section is keyed by brand slug and read independently, so a mistake in one
# section cannot silently disable another.
#
#   <brand-slug>:  "{Name}|{Set}" -> field overrides (productCode, hex, volumeMl, packaging, ean,
#                  additionalEans, priceGbp/Usd/Eur/Cad, supersededBy)
#

#   additions:     <brand-slug> -> list of MINTED paints (name, set, productCode, ean, imageUrl,
#                  supersededBy). For records a maintainer researched that NO upstream source
#                  supplies. Distinct from data/paints/harvest/*.yaml `additions:`, which are
#                  GENERATED from observed manufacturer listings and rewritten by the generator.
#   aliases:       <brand-slug> -> {new identity key: old identity key} (reconciler renames)
#   retract:       <brand-slug> -> [identity key] (drop from the archive)
#
# Minted paints are appended before the enrichment chain, so volume/container/type/finish/barcodes
# come from the same tables a native paint uses. They are born colour-less (hex "", r/g/b 0) like
# harvest additions; a swatch-extraction pass or an explicit `hex:` override fills the colour later.

additions:
  citadel-colour:
    # Games Workshop reformulated the Hexwraith Flame and Nighthaunt Gloom Technical paints with
    # Contrast chemistry and relaunched them IN the Contrast range on 2022-07-16 -- 18 ml, under a
    # new 991899600xx product-code block. GW's trade announcement of that wave: "We've also improved
    # the existing Hexwraith Flame and Nighthaunt Gloom Technical paints to benefit from the
    # ground-breaking science behind Contrast." (GW store slugs: contrast-hexwraith-flame-18ml-2022,
    # contrast-nighthaunt-gloom-18ml-2022.)
    #
    # These are TWO PRODUCTS, not a re-key of the Technical pots: new range, new volume, new
    # formula, new code block -- and `set` is part of the paint identity key (set|name|productCode|
    # hex), so each is a genuinely new identity. The Technical records stay, and point forward.
    #
    # Neither Arcturus5404/miniature-paints nor any harvested manufacturer source carries them,
    # which is why they are minted here rather than harvested. NO hex is asserted: the Technical
    # hex describes the OLD formula, so copying it across would be fabrication.
    - name: Hexwraith Flame
      set: Contrast
      productCode: '99189960060'
      source: Games Workshop trade announcement, 2022-07-16 Contrast wave
    - name: Nighthaunt Gloom
      set: Contrast
      productCode: '99189960061'
      source: Games Workshop trade announcement, 2022-07-16 Contrast wave
