#
# NOT included, deliberately: Mechanicus Standard Grey and Mortarion Green Clear. They look culled
# from the trade data but are LIVE on GW's storefront with lastChanceToBuy:false -- merely out of
# stock. They were the two paints the bridge could not name-match, which is why they looked absent.
army-painter:
  # Brainmatter Beige is stamped WP1405, which is Basilisk Brown's code. Two paints, one code, and
  # the source states no other. The correct code is WP1406, and that rests on three independent
  # things agreeing rather than on any one witness:
  #
  #  1. THE SEQUENCE. WP1401-WP1421 is strictly alphabetical, with no exception:
  #     Abomination Gore, Arid Earth, Babe Blonde, Banshee Brown, Basilisk Brown, [gap],
  #     Castle Grey, Centaur Skin, Combat Fatigues, Commando Green, Corpse Pale, Crusted Sore,
  #     Crypt Wraith, Cultist Robe, Dark Sky, Dirt Spatter, Drake Tooth, Dungeon Grey,
  #     Elemental Bolt, Elf Green, Elven Flesh. "Brainmatter Beige" sorts after Basilisk Brown
  #     and before Castle Grey -- exactly the gap. (The run breaks later, at WP1422 Orc Blood and
  #     WP1425 Dark Stone, where The Army Painter renamed colours without renumbering them. The
  #     argument is confined to the stretch where the rule demonstrably holds.)
  #  2. THE VACANCY. WP1406 is claimed by NOTHING in the 776-record army-painter archive, and it
  #     is the ONLY vacant code in that alphabetical stretch. A miscode leaves its true slot empty;
  #     a genuine second product at WP1405 would not.
  #  3. AN INDEPENDENT CATALOGUE. Mantic stocks the Warpaints line and lists WP1405 Basilisk Brown,
  #     WP1406 Brainmatter Beige, WP1407 Castle Grey (data/catalog/products/mantic-games.yaml) --
  #     a separate acquisition, from a separate site, whose neighbours match ours on both sides.
  #
  # Any one of these alone would be thin. Together they close: the gap the alphabet predicts, the
  # gap the archive actually has, and the code a second retailer prints are the same code.
  #
  # The paired `aliases:` entry below is REQUIRED, not belt-and-braces -- productCode is part of
  # the identity key, so rewriting it here mints a new record and strands the old one. The alias is
  # what makes the reconciler treat this as the correction it is, preserving firstSeen.
  Brainmatter Beige|Warpaints:
    productCode: WP1406

