# Manual corrections to the paint catalog. Hand-edited; read by tools/WarHub.PaintCatalog.Tool
# (--overrides). Every section is keyed by brand slug and read independently, so a mistake in one
# section cannot silently disable another.
#
#   <brand-slug>:  "{Name}|{Set}" -> field overrides (productCode, hex, volumeMl, packaging, ean,
#                  additionalEans, priceGbp/Usd/Eur/Cad, supersededBy)
#

#   additions:     <brand-slug> -> list of MINTED paints (name, set, productCode, ean, imageUrl,
#                  supersededBy). For records a maintainer researched that NO upstream source
#                  supplies. Distinct from data/paints/harvest/*.yaml `additions:`, which are
#                  GENERATED from observed manufacturer listings and rewritten by the generator.
#   aliases:       <brand-slug> -> {new identity key: old identity key} (reconciler renames)
#   retract:       <brand-slug> -> [identity key] (drop from the archive)
#
# Minted paints are appended before the enrichment chain, so volume/container/type/finish/barcodes
# come from the same tables a native paint uses. They are born colour-less (hex "", r/g/b 0) like
# harvest additions; a swatch-extraction pass or an explicit `hex:` override fills the colour later.

additions:
  citadel-colour:
    # Games Workshop reformulated the Hexwraith Flame and Nighthaunt Gloom Technical paints with
    # Contrast chemistry and relaunched them IN the Contrast range on 2022-07-16 -- 18 ml, under a
    # new 991899600xx product-code block. GW's trade announcement of that wave: "We've also improved
    # the existing Hexwraith Flame and Nighthaunt Gloom Technical paints to benefit from the
    # ground-breaking science behind Contrast." (GW store slugs: contrast-hexwraith-flame-18ml-2022,
    # contrast-nighthaunt-gloom-18ml-2022.)
    #
    # These are TWO PRODUCTS, not a re-key of the Technical pots: new range, new volume, new
    # formula, new code block -- and `set` is part of the paint identity key (set|name|productCode|
    # hex), so each is a genuinely new identity. The Technical records stay, and point forward.
    #
    # Neither Arcturus5404/miniature-paints nor any harvested manufacturer source carries them,
    # which is why they are minted here rather than harvested. NO hex is asserted: the Technical
    # hex describes the OLD formula, so copying it across would be fabrication.
    - name: Hexwraith Flame
      set: Contrast
      productCode: '99189960060'
      source: Games Workshop trade announcement, 2022-07-16 Contrast wave
    - name: Nighthaunt Gloom
      set: Contrast
      productCode: '99189960061'
      source: Games Workshop trade announcement, 2022-07-16 Contrast wave

# Renames. `{Set}|{Name}|{ProductCode}|{Hex}` (NOT the `{Name}|{Set}` grammar of the field
# overrides below), NEW key -> OLD key, whole-string NFKC/whitespace/case-normalized by
# NameNormalizer, so readable casing here is cosmetic. This is the ONLY rename path paints have:
# PaintRecordAdapter.Url => null deliberately disables URL-based rename detection, so without an
# entry here a changed name does not rename a record -- CatalogReconciler falls to step 4 and
# MINTS a new one, stranding the old.
aliases:
  green-stuff-world:
    # gsw_clean_name stopped erasing the store's LEADING volume token on 2026-08-05 (17 ml and
    # 60 ml dipping inks are different skus with different gtin13s and prices; erasing it
    # manufactured 32 (set, name) collisions that do not exist on the raw titles). Measured over
    # the 161 rows that reach `additions`: 3 names change, 158 byte-identical -- so these three
    # entries are the complete archive impact, and every other GSW record keeps its identity.
    #
    # `Green Stone Dip` is the one pair that reached `additions` rather than being folded by
    # suffix_match, so it minted TWICE under one name in commit 9200376 and is the SOLE ambiguous
    # {Name}|{Set} key in the whole 400-record GSW archive. Renaming both halves retires it.
    # `Nightshade Purple Dip` has no colliding twin (its 60 ml sibling is spelled "Nightsahde",
    # a store typo) -- it renames as collateral of the same rule, which is the price of the rule
    # being uniform.
    #
    # NO hexless variant of the 4220/4231 keys is written, deliberately. The tempting
    # belt-and-braces entry ('...|4220|' -> '...|4220|#4B5345') is NOT a no-op: it fires only
    # when SwatchApplier misses, and ApplyRename then assigns Hex = fresh.Hex, DESTROYING the
    # archived colour. The swatch keys in data/paints/swatches/green-stuff-world.yaml were
    # re-keyed to the new names in the same change so the swatch lands and `fresh` carries the
    # hex these keys assert. (Regenerating that file cannot do it: gen_paint_swatches.py's
    # ratchet emits no entry for a paint that already has hex, and carries the committed entry
    # forward verbatim under its old key.)
    'Dipping Inks|Green Stone Dip 60 ml|3487|': 'Dipping Inks|Green Stone Dip|3487|'
    'Dipping Inks|Green Stone Dip 17 ml|4220|#4B5345': 'Dipping Inks|Green Stone Dip|4220|#4B5345'
    'Dipping Inks|Nightshade Purple Dip 17 ml|4231|#533968': 'Dipping Inks|Nightshade Purple Dip|4231|#533968'

# Hand-maintained paint overrides: `{brand-slug}` -> `{Name}|{Set}` -> fields.
# Applied AFTER the manufacturer bridge (data/paints/barcodes/*.yaml), so an entry here beats both
# the bridge and the VolumeTable. Keep every entry cited -- these are asserted facts.
#
# --- Discontinued Citadel paints (researched 2026-07-31 against GW's own storefront) -------------
# Discontinuation is an ABSENCE: the upstream source stops listing a paint and the trade sheets no
# longer carry a row for it, so nothing in the pipeline can assert it. It has to be recorded here.
#
# The 31 Air colours below were culled on 2022-06-13, when GW deleted 44 Air SKUs from its trade
# register, reissued 13 under new codes and dropped these for good. Confirmed independently against
# the live storefront: GW's Air range enumerates as "Showing 45 of 45" and none of these is in it,
# and each per-colour slug 404s while controls (Air-Thallax-Gold-2019, Air-Typhon-Ash-2019) return
# 200 with `Pot size: 24ml`. The XV-88 slug trap was checked both ways (Air-XV-88 and Air-XV88).
# 31 culled + 13 reissued + the 2 still-current below = the 44 the register deleted, exactly.
#
# NOT included, deliberately: Mechanicus Standard Grey and Mortarion Green Clear. They look culled
# from the trade data but are LIVE on GW's storefront with lastChanceToBuy:false -- merely out of
# stock. They were the two paints the bridge could not name-match, which is why they looked absent.
citadel-colour:
  # Only the forward direction is declared; `supersedes` on the Contrast records is derived from
  # these, so the two directions cannot drift. Deliberately NOT expressed as a status change: the
  Balor Brown|Air:
    isDiscontinued: true
  Caledor Sky|Air:
    isDiscontinued: true
  Calgar Blue|Air:
    isDiscontinued: true
  Castellax Bronze|Air:
    isDiscontinued: true
  Chemos Purple|Air:
    isDiscontinued: true
  Death Korps Drab|Air:
    isDiscontinued: true
  Deathclaw Brown|Air:
    isDiscontinued: true
  Deathshroud Clear|Air:
    isDiscontinued: true
