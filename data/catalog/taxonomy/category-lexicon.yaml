reason: >-
  What a product's own NAME says, when no source publishes a taxonomy that says it. This is the
  last thing the categorize stage tries and the weakest signal it acts on -- a store's per-product
  filing and the paint catalog's barcode are both statements about the product, while a name
  pattern is an inference from how the product is written.


  IT EXISTS FOR THE SOURCES THAT PUBLISH NOTHING ELSE. mfr-gw-trade is the sole source for 3,330
  undecided products and carries only a stock-section code (4,160 distinct values over 6,822 rows
  -- an identifier, not a taxonomy) and a shipping-box code. What it does carry is names:
  `CODEX: SPACE WOLVES (HB) (FRANCAIS)`, `B: KHORNE RED 12ML JUC X6`, `WHITE DWARF 521 (FEB-26)`.


  EVERY ENTRY CARRIES ITS MEASUREMENT and that field is required, unlike a rule table's optional
  note. `measured` is: how many still-undecided products the pattern reaches, and how it scored
  against the products some OTHER evidence had already decided. Re-derive with
  scripts/measure_category_rules.py. Figures below are from 2026-08-25 over 30,771 products.


  THE COLOURLESS AGENTS WERE DELIBERATELY ABSENT until 2026-09-02, and the reason is worth keeping.
  `\bVARNISH\b`, `\bTHINNER\b`, `\bRETARDER\b`, `\bMEDIUM\b` and `\bFLOW IMPROVER\b` looked like
  obvious `hobby-auxiliary` entries by the boundary categories.yaml then drew (colour was the
  test), and measured against the committed evidence they scored 0%, 23%, 0%, 14% and 0% -- the
  sources overwhelmingly called them `paint` already. That was the boundary being wrong, not the
  sources, and the maintainer redrew it: `paint` is what a maker's chart lists, colour or not, and
  a `role` says what each pot is for. The entries now exist with the category the sources always
  gave them and the role the name states, each measured against the paint archive's own roles
  (scripts/measure_category_rules.py --axis role). `\bMEDIUM\b` remains a trap -- 75 of its 125
  category controls were paints whose COLOUR NAME contains the word (Medium Sea Grey, Medium Blue)
  -- so its entry carries the colour lookahead the goblingaming table uses.


  AN ENTRY MAY NAME A ROLE ALONE. The match is per axis (lexicon.py), so a role-only entry never
  blocks a category entry below it; it exists for the products whose category a shelf or a code
  already decided and whose role nothing else names.
entries:
  # `event` earns its place in the vocabulary here. categories.yaml added it provisionally with a
  # note that it must justify itself or be deleted; these are the products that justify it, and all
  # nine are genuine ticket rows (Mantic Open Day, Clash of Kings, Adepticon, Warmachine Nationals).
  - nameMatches: '\bTICKET\b'
    category: event
    measured: >-
      reaches 9 undecided; no independently-decided control exists (nothing in the catalog is
      stated `event`), so this rests on reading all nine names rather than on a score

  # BEFORE the book patterns, and that ordering is the whole reason this entry exists. `INDEX
  # CARDS: DARK ANGELS (ENG)` is a deck of reference cards, and the entry below matches `INDEX` at
  # the start of a name; without this line 146 card decks published as `book`. categories.yaml
  # settles it in as many words -- "Reference CARDS (datacards, stat cards) are `game-accessory`
  # -- they are played with, not read."
  - nameMatches: '\b(INDEX CARDS|DATACARDS?|DATASHEET CARDS|STAT CARDS)\b'
    category: game-accessory
    measured: >-
      reaches 146 undecided; of 92 controls 25 agree and 67 say `book` -- but every one of those
      67 is this stage's OWN earlier output (the `INDEX` entry below, and goblingaming's `Rules
      Supplements` shelf), not independent evidence. Judged on the vocabulary's explicit text
      rather than on that number; found by reading a sample of what the `INDEX` entry decided

  - nameMatches: '^\s*(CODEX|BATTLETOME|INDEX)\b'
    category: book
    measured: reaches 311 undecided; 45 controls, 45 agree (100%)
  - nameMatches: '\bWHITE DWARF\b'
    category: book
    measured: reaches 143 undecided; 8 controls, 8 agree (100%)
  - nameMatches: '\b(RULEBOOK|RULES MANUAL|CORE BOOK|ARMY BOOK|NOVEL|OMNIBUS|ANTHOLOGY)\b'
    category: book
    measured: reaches 143 undecided; 134 controls, 134 agree (100%)

  - nameMatches: '\b(T-SHIRT|HOODIE|MUG|POSTER|KEYRING|PIN BADGE|TOTE BAG)\b'
    category: merch
    measured: reaches 27 undecided; 37 controls, 37 agree (100%)

  - nameMatches: '\bOBJECTIVE MARKERS?\b'
    category: game-accessory
    measured: reaches 5 undecided; 1 control, 1 agrees
  - nameMatches: '\bDICE\b'
    category: game-accessory
    measured: >-
      reaches 348 undecided; 95 controls, 89 agree (94%) -- the six misses are 3 miniatures and 2
      merch rows whose names contain the word

  # A PRIMER DEPOSITS COLOUR, which is the test categories.yaml sets for `paint` in as many words,
  # and every product this reaches says the colour in its own name: `Colour Primer Alien Purple`,
  # `Vallejo Fantasy Color Primer Goblin Green`, `AFV Color Primer Panzer Yellow`, `Basic Primer
  # Black`. It is NOT one of the colourless agents this file's header refuses to adjudicate -- a
  # varnish, thinner or medium adds no pigment and a primer is nothing but pigment.
  #
  # THE `COLLECTION` GUARD IS LOAD-BEARING AND WAS FOUND BY READING, not by the score. Warlord
  # sells `Pike & Shotte Epic Battles - Thirty Years' War Primer Collection` and an English Civil
  # Wars twin, where "primer" is the OTHER English sense -- a beginner's introduction -- and the
  # products are miniatures starter sets. Two of the bare pattern's 54 hits, and both are the only
  # two ways it was wrong.
  # The role `primer` on this entry, measured 2026-09-03: 47 archive controls, 41 agree, the six
  # misses being Vallejo `<Colour> Primer` pots the archive read as colours at the time (an
  # archive gap since closed); decided 116 roles nothing else had named.
  - nameMatches: '\bPRIMER\b(?!\s+COLLECTION)'
    category: paint
    role: primer
    measured: >-
      reaches 52 undecided; 5 controls, 5 agree (100%). The control is thin because these are
      almost all `ret-radaddel` rows that nothing else stocks, so what stands behind it as much as
      the score is a read of all 52 names -- 49 Army Painter and Vallejo colour primers, 3 Warlord
      Colour Primer sprays
  # ...AND BEFORE `TERRAIN`, since 2026-09-02: Army Painter's four `Gamemaster: ... Terrain
  # Primer` sprays are primers.

  # THE COLOURLESS AGENTS, since 2026-09-02 (see the header). Narrow first: a varnish is named
  # before the mediums because `Gloss Varnish Medium` is a varnish; cleaners before mediums because
  # `Airbrush Cleaner & Thinner` is a cleaner. `\bPIGMENT\b` is guarded against Army Painter's
  # liquid `Pigment Toner` paints, AK's `Liquid Pigment` colours, and the binders and fixers,
  # which are mediums.
  - nameMatches: '\bVARNISH\b'
    category: paint
    role: varnish
    measured: >-
      19 archive controls, 19 agree (scripts/measure_category_rules.py --axis role,
      2026-09-03); decided 29 roles nothing else had named
  # `Stainless Steel Paint Brush Cleaner` is a jar (a tool) and `Cyanoacrylate Glue Cleaner` a
  # debonder; both surfaced as role-category-mismatch rows and neither cleans paint.
  - nameMatches: '(?<!PAINT BRUSH )(?<!GLUE )\b(CLEANER|RESTORER|STRIPPER)\b'
    category: paint
    role: cleaner
    measured: >-
      4 archive controls, 4 agree; decided 6
  # QUALIFIER FIRST (second reader, 2026-09-03): `MEDIUM` alone is a size on brushes, pipettes,
  # rocks and silicone tips and a colour word on a dozen pots; what makes it a medium is the word
  # before it (Glaze, Mixing, Lahmian, Metallic ...) or Vallejo's `Medium - Retarder` form. The
  # same pattern as Goblin Gaming's clause. FIXER is here because a pigment fixer is a medium.
  - nameMatches: '\b(THINNER|RETARDER|FLOW IMPROVER|FLOW AID|MASKING FLUID|LIQUID MASK|FIXER|DECAL (FIX|SOFTENER|SOLUTION))\b|\b(GLAZE|GLAZING|MIXING|WASH|CONTRAST|LAHMIAN|CHIPPING|SPEEDPAINT|XPRESS|AIRBRUSH|GLOSS|MATT|MATTE|SATIN|METAL|METALLIC|PEARL|GEL|TEXTILE|CRACKLE|FLUID|TRANSPARENT|CLEAR|POURING|WEATHERING|ACRYLIC|FLOW|DRYING|CELL|EFFECTS?|WET|PAINTING|STABILI[SZ]ER)\s+MEDIUMS?\b|\bMEDIUM\s*[-:]\s*[A-Z]|\bMEDIUM\s+(XPRESS|RETARDER|GLAZE)\b|\bMEDIUMS?\s+\d+\s?ML\b'
    category: paint
    role: medium
    measured: >-
      27 archive controls, 27 agree; decided 39
  - nameMatches: '(?<!LIQUID )\b(PIGMENTS?|WEATHERING POWDERS?)\b(?!\s+(TONER|BINDER|FIXER))'
    category: paint
    role: pigment
    measured: >-
      23 archive controls, 23 agree after the BINDER guard (Vallejo's Pigment Binder is a
      medium); decided 25
  - nameMatches: '\bTERRAIN\b'
    category: terrain
    measured: reaches 37 undecided; 116 controls, 113 agree (97%)

  # A RULEBOOK, A CODEX OR A NOVEL IS A BOOK by its own name. The words are the ones makers put on the
  # spine; `EBOOK`/`EPUB` are the digital editions categories.yaml files as `book` with digital
  # packaging.
  - nameMatches: '\b(RULEBOOK|SUPPLEMENT|CODEX|BATTLETOME|ARMY BOOK|CAMPAIGN BOOK|SOURCEBOOK|HANDBOOK|NOVEL|OMNIBUS|EBOOK|EPUB)\b'
    category: book
    measured: reaches 19 undecided; 670 controls, 666 agree (99.4%), 2026-09-02

  # A CARD PACK IS PLAYED WITH, NOT READ -- categories.yaml's boundary for reference cards.
  - nameMatches: '\bCARDS? (PACK|SET)\b'
    category: game-accessory
    measured: reaches 10 undecided; 56 controls, 55 agree (98.2%), 2026-09-02

  # A SPRUE IS A FRAME OF MINIATURES, sold as one; Warlord lists 30 Epic Battles sprues nothing
  # else placed. The cutter is the tool.
  - nameMatches: '\bSPRUES?\b(?!\s*CUTTER)'
    category: miniatures
    measured: reaches 27 undecided; 155 controls, 150 agree (96.8%), 2026-09-02

  # GW NAMES ITS OWN POTS `Citadel <range> Paint: <colour>` and its sprays `Citadel Paint: <colour>
  # Spray`, and a retailer that lists them without a barcode (gamenerdz, 6 products) used to reach
  # `paint` only through that store's department crumb, which also filed its brushes as paint. The
  # exclusions are the Citadel paint furniture -- `CITADEL PAINT BOX`, `CITADEL PAINT RACK` -- and
  # the sets and bundles the `packaging` axis and `paint-set` exist for. `CITADEL` must come
  # first: `How to Paint Citadel Miniatures` is a book.
  - nameMatches: '\bCITADEL\b[^:]*\bPAINT\b(?!\s*(?:SET|BOX|RACK|BUNDLE|AND|&|\+))'
    category: paint
    measured: >-
      reaches 6 undecided; 18 controls, 16 agree (89%) before the exclusions and 16 of 16 with
      them -- the two were the Paint Box and the Paint Rack (2026-09-02).


  # LAST, because it is the broadest. A volume in the name is how essentially every paint in this
  # catalog is written, and the misses are the contested colourless agents discussed in the header
  # plus basing materials sold by volume.
  - nameMatches: '\b\d+\s?ML\b'
    category: paint
    measured: >-
      reaches 1,550 undecided; 2,489 controls, 2,437 agree (98%) -- the 52 misses are 29 basing
      materials legacy-catalog states as `terrain` and 23 thinners/cleaners/glues, i.e. the
      colourless boundary this file deliberately does not decide
