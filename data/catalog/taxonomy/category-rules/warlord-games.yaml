manufacturer: warlord-games
reason: >-
  WARLORD NUMBERS ITS OWN RANGE NINE DIGITS, AND DIGITS 3-4 ARE THE PRODUCT TYPE. 2,695 published
  Warlord products carry a nine-digit code, and the pair at positions 3-4 behaves exactly the way
  Games Workshop's d34 does: measured 2026-09-01 over every one of them, 24 distinct values, and
  the ones this file names grade 96% against a control that never sees the code.


  THE CONTROL IS THE ONE `mfr-warlord-store.yaml` ALREADY USES and is built the same way: a
  manufacturer's own claim about its own goods, then another retailer's shelf
  (`ret-goblingaming`'s productType), then `legacy-catalog`'s category where it is not the
  `miniatures` fill that source declares in its descriptor, then the paint catalog's barcode.
  Warlord's own store is deliberately excluded -- this file exists for the products that store
  does not reach, and grading a code against the shelf that already decided them would prove
  nothing.


  WHAT THIS FILE IS FOR. `mfr-warlord-store.yaml` reads the store's `productType` and tags and
  decides most of the catalog; what it cannot reach is the 1,525 products only the frozen
  `legacy-catalog` import knows about -- discontinued lines, older editions, sprues sold on their
  own. Those have a Warlord product code and nothing else, and the code is enough for the eight
  model types below.


  d34 = 88, 89, 96 AND 99 ARE DELIBERATELY ABSENT, and each fails differently. 88 is the scenery
  and marker type and it holds both: `Black Powder Epic Battles: Waterloo - Hougoumont` beside
  `Bolt Action MDF Unit Pin Markers`, terrain and game-accessory on the same two digits, split by
  the GAME prefix rather than by the type (10 terrain / 3 miniatures over a control of 13, and the
  48 undecided are mostly markers). 99 is the bundle type -- `Bolt Action: Third Edition Rulebook
  (German) with miniature` and `US Army starter army` -- 24 book against 10 miniatures over 34,
  which is a real split and not noise. 89 grades 2 of 2 `miniatures` while both undecided names
  read `Konflikt '47 MDF Unit Pin Markers`, so the control is simply wrong there and two rows is
  not enough to say which way. 96 is five decal sheets with no control at all.
clauses:
  # THE MODEL TYPES. Eight values, one clause, because they behave identically and splitting them
  # would invite eight arguments about the same evidence. Per-value controls, all 2026-09-01:
  #
  #     20  n=271  control 204, 95.6%  (195 miniatures, 7 terrain, 2 game-accessory)
  #     22  n=258  control 120, 100%
  #     24  n=304  control  94,  93.6% (88 miniatures, 4 game-accessory, 2 terrain)
  #     26  n= 94  control  43, 100%
  #     30  n=529  control  45,  93.3% (42 miniatures, 2 game-accessory, 1 terrain)
  #     32  n=135  control  22, 100%
  #     50  n= 92  control   1, 100%
  #     51  n=343  control  16, 100%
  #
  # 545 graded products, 96.1% overall, and the disagreements are the same shape in each: a
  # scenery pack or a token set that shares a type with the models it is sold beside. The name
  # clauses in `category-lexicon.yaml` (`\bTERRAIN\b`, `\bDICE\b`, `\bOBJECTIVE MARKERS?\b`) run
  # after this table rather than before it, so they do not take those back -- which is the honest
  # cost, stated: about 4% of what this clause fills is not a model.
  - codeMatches: '^\d{2}(20|22|24|26|30|32|50|51)\d{5}$'
    category: miniatures
    note: 134 undecided; control 545, 96.1%

  # THE RULEBOOK TYPE. 10 is where Warlord files a rules product on its own -- `Bolt Action Core
  # Rule Book`, `Hail Caesar - Age of Bronze supplement`, `Black Powder II rulebook`. The type is
  # small and completely clean, and it is distinct from 99, which is the same book sold WITH a
  # miniature and splits accordingly.
  - codeMatches: '^\d{2}10\d{5}$'
    category: book
    note: 6 undecided; control 35, 100%

  # =============================================================================================
  # WHICH GAME. THE LEADING PAIR OF A NINE-DIGIT WARLORD CODE IS THE GAME LINE, and it grades
  # like a manufacturer's own filing because it is one. Measured 2026-09-02 against every product
  # whose game a SOURCE stated -- the frozen import where it was not the `bolt-action` fill, and
  # the store's own game tags -- 2,387 controls over 2,710 coded products:
  #
  #     10 hail-caesar          199, 99.0%       50 gates-of-antares     127, 100%
  #     11 epic-hail-caesar      29, 100%        64/65 judge-dredd        20, 100%
  #     15 spqr                   7, 100%        69/72 warlords-of-erehwon 59, 100%
  #     20 pike-and-shotte      116, 100%        74 victory-at-sea       156, 100%
  #     21 epic-pike-and-shotte  31, 100%        77 blood-red-skies      127, 100%
  #     30 black-powder         285, 100%        78 cruel-seas           101, 100%
  #     45 konflikt-47          165, 99.4%       79 black-seas            85, 100%
  #
  # `40` IS BOLT ACTION AND THE NUMBER NEEDS READING: 634 of its 756 controls say `bolt-action`
  # alone and another 115 say `achtung-panzer` AND `bolt-action`, so Bolt Action is IN the
  # membership 99.1% of the time and the clause proposes only that. `48` is the Achtung Panzer!
  # line and its own control says both games, 24 of 25, so it proposes both. `72` is Mythic
  # Americas, which runs on the Warlords of Erehwon rules and grades as that game 43 of 43.
  #
  # NOT HERE: `31` splits Epic Black Powder 54 / Black Powder 37 (the same Epic boxes filed both
  # ways) and decides nothing; `84`, `60`, `61`, `62` and `75` have no control at all -- `84` is
  # Warlord-coded Italeri terrain, the others are Doctor Who, Sláine, ABC Warriors and Project Z,
  # none of which this taxonomy has a word for.
  # THE PRODUCT'S OWN NAME NAMES THE GAME, and it is a claim the stage unites with the store's
  # shelves rather than a fill behind them (categorize/decide.py). Graded 2026-09-02 against the
  # store's own `productType` game on every product whose name carries one of these: Bolt Action
  # 122/122, Victory at Sea 155/155, Blood Red Skies 59/59, Black Seas 52/52, Konflikt '47 41/41,
  # Achtung Panzer! 25/25, Cruel Seas 20/20, Warlords of Erehwon 8/8, Judge Dredd 5/5, SPQR 2/2,
  # Epic Hail Caesar 37/37, Epic Pike & Shotte 45/45, Black Powder 15/15, Hail Caesar 27/28,
  # Pike & Shotte 53/55. The Epic lines come first and the plain names refuse an `Epic` on either
  # side, because `Black Powder Epic Battles: ...` is the Epic product. Epic Black Powder itself
  # grades 61/93 -- the remaining 32 are boxes the store types `Black Powder` while naming them
  # `Black Powder Epic Battles`, the same split its `31` code segment shows below, and the name is
  # the product line. Reach: 28 Bolt Action, 31 Epic Black Powder and 25 other products no source
  # had placed.
  - nameMatches: '\bBLACK POWDER EPIC BATTLES\b'
    gameSystems: [epic-black-powder]
  - nameMatches: '\bHAIL CAESAR EPIC BATTLES\b'
    gameSystems: [epic-hail-caesar]
  - nameMatches: '\bPIKE\s*&\s*SHOTTE EPIC BATTLES\b'
    gameSystems: [epic-pike-and-shotte]
  - nameMatches: '(?<!EPIC )\bBLACK POWDER\b(?!\s*EPIC)'
    gameSystems: [black-powder]
  - nameMatches: '(?<!EPIC )\bHAIL CAESAR\b(?!\s*EPIC)'
    gameSystems: [hail-caesar]
  - nameMatches: '(?<!EPIC )\bPIKE\s*&\s*SHOTTE\b(?!\s*EPIC)'
    gameSystems: [pike-and-shotte]
  - nameMatches: '\bBOLT ACTION\b'
    gameSystems: [bolt-action]
  - nameMatches: '\bBLACK SEAS\b'
    gameSystems: [black-seas]
  - nameMatches: '\bCRUEL SEAS\b'
    gameSystems: [cruel-seas]
  - nameMatches: "\\bKONFLIKT\\s*'?47\\b"
    gameSystems: [konflikt-47]
  - nameMatches: '\bVICTORY AT SEA\b'
