  - category: miniatures
    hintEquals: {productType: Loose - R+M}
  - category: miniatures
    hintEquals: {productType: loose P+M+R}
  - category: miniatures
    hintEquals: {productType: Box - Metal}
  - category: miniatures
    hintEquals: {productType: Box - Plastic}
  - category: miniatures
    hintEquals: {productType: Box - R+M}
  - category: miniatures
    hintEquals: {productType: Box - P+M}
  - category: miniatures
    hintEquals: {productType: Box - Plastic/Resin/Metal}
  - category: miniatures
    hintEquals: {productType: blister - resin/metal}
  - category: miniatures
    hintEquals: {productType: Blister - Resin}
  - category: miniatures
    hintEquals: {productType: Blister - Plastic}
  - category: miniatures
    hintEquals: {productType: Blister - wood}
  - category: miniatures
    hintEquals: {productType: plastic/metal/resin}
  - category: miniatures
    hintEquals: {productType: Plastic Sprues}
  - category: miniatures
    packaging: set
    hintEquals: {productType: Starter Set}

  # --- the rest ---------------------------------------------------------------------------------
  # THREE SPELLINGS OF ONE SHELF, and they are not a tidy-up: they were 92 undecided products.
  # This store types its `product_type` by hand and the third-party terrain arrived under
  # `terrain` (75), `MDF terrrain` (17, with the typo) and `MDF` (2) rather than under the
  # `Terrain` the table already knew. Every one of the 94 is a Sarissa Precision or Skytrex
  # laser-cut building, fence or scenery pack.
  - category: terrain
    hintEquals: {productType: Terrain}
  - category: terrain
    hintEquals: {productType: terrain}
  - category: terrain
    hintEquals: {productType: 'MDF terrrain'}
  - category: terrain
    hintEquals: {productType: MDF}
  - category: terrain
    hintEquals: {productType: 'Loose Wood'}
    note: 6 rows, all laser-cut MDF scenery sold as loose parts
  - category: miniatures
    hintEquals: {productType: Box}
    note: 4 North Star plastic boxed sets; the store's short form of `Box - Plastic` above
  # HUMBROL'S WEATHERING POWDERS sit on the Hobby shelves and are paint with role pigment
  # (second reader, 2026-09-03: nine `hornby-hobbies/AV00xx` records came out hobby-auxiliary).
  - category: paint
    role: pigment
    nameMatches: '\bWEATHERING POWDERS?\b'
    note: 9 rows, all Humbrol 45ml jars; no archive control, names read
  - category: hobby-auxiliary
    hintEquals: {productType: 'Hobby Supplies'}
  - category: book
    hintEquals: {productType: Book}
  - category: book
    hintEquals: {productType: Rules & Books}

  - category: hobby-auxiliary
    role: applicator
    hintEquals: {productType: Brushes}
  - category: hobby-auxiliary
    role: basing
    hintEquals: {productType: Basing}
  - category: hobby-auxiliary
    role: basing
    hintEquals: {productType: Bases}
  - category: hobby-auxiliary
    hintEquals: {productType: Hobby}
  - category: hobby-auxiliary
    hintEquals: {productType: Hobby Set}
  - category: hobby-auxiliary
    hintEquals: {productType: Decals}
  - category: hobby-auxiliary
    hintEquals: {productType: Decal}
  - category: hobby-auxiliary
    hintEquals: {productType: decals}
  - category: hobby-auxiliary
    hintEquals: {productType: Flag}
    note: Warlord's flags are printed sheets to fit to a model, not merchandise

  - category: game-accessory
    hintEquals: {productType: Dice}
  - category: game-accessory
    hintEquals: {productType: Gaming mat}

  # --- packaging only: the value names the FORM and says nothing about the contents -------------
  # THE DIGITAL SHELF IS TEXT, and the old note here -- "rules PDFs and gift vouchers alike" --
  # is no longer true of the data: there is not one gift voucher left on it. All 25 rows are text
  # PDFs (16 rulebooks and supplements, 4 painting guides), 4 of 4 graded say `book`, and every
  # one carries the `pdf` or `digital` tag.
  - category: book
    packaging: digital
    hintEquals: {productType: Digital}
    note: 25 rows; graded 4/4
  - category: book
    packaging: digital
    hintEquals: {productType: Free}
    note: >-
      19 rows, every name ending in PDF / FAQ / Errata / download and every one carrying both the
      `pdf` and `digital` tags. It was absent as a "merchandising state", which the word is and
      the shelf is not.
  # ===========================================================================================
  # THE TAGS. Everything above reads `productType`; from here down the signal is `tags`, which is
  # what reaches the ~2,556 products whose productType names a game instead of a format.
  #
  # BOOKS AND HOBBY GOODS FIRST -- see the ordering note in the header.
  #
  # `Reduced Rate VAT` is the cleanest of the book tags and worth its odd looks: it is a UK fiscal
  # class, books are zero- or reduced-rated, and only 3 of its 64 products also carry a troop tag.
  # `rules-books` is 57/57. The bare `book` tag is deliberately NOT here -- 25 of its 89 products
  # also carry a troop tag and are army bundles that merely CONTAIN a book (`Rattenkrieg - German
  # Veteran Starter Army with Armies of Germany`), and none of those 25 is in the graded set, so
  # its 40/40 overstates by an estimated 20%.
  - category: book
    hintContainsAny:
      tags: ['rules-books', 'Reduced Rate VAT']
    note: 57/57 and 39/39 against independent evidence; reach 162
  - category: book
    packaging: digital
    hintContainsAny:
      tags: ['pdf', 'ebook']
    note: 16/16 and 2/2; the form is in the tag as well as the category

  - category: hobby-auxiliary
    role: basing
    hintContainsAny:
      tags: ['bases-basing']
  - category: hobby-auxiliary
    role: tool
    hintContainsAny:
      tags: ['hobby-tools']
  - category: hobby-auxiliary
    hintContainsAny:
      tags: ['hobby-equipment', 'Hobby Supplies']
    note: >-
      40 of 41 graded across the four tags; the one miss is a single hobby-equipment row. Split by
      role on 2026-09-02: basing and tools name themselves, the other two tags are departments

  # MODELS. Two families, both of which describe the MODEL rather than the box: what kind of troop
  # it is, and what role it plays in a list. Neither can be anything but a miniature.
  - category: miniatures
    hintContainsAny:
      tags: ['infantry', 'infantry-squad', 'infantry-squads-teams', 'cavalry', 'vehicle', 'tank',
             'command', 'hq', 'Artillery', 'artillery-war-machines', 'plane', 'squadron', 'Vessel',
             'support-teams', 'anti-tank-guns', 'anti-aircraft-guns',
             'armoured-cars-recce-vehicles', 'transports-tows', 'self-propelled-guns', 'walker']
    note: 519 of 524 graded, 99.0%; reach 1,887
  - category: miniatures
    hintContainsAny:
      tags: ['platoon-rifle', 'platoon-armoured', 'platoon-artillery', 'platoon-heavy-weapon',
             'platoon-reconnaissance', 'platoon-engineer', 'unit-all-vehicles',
             'unit-armoured-vehicle', 'unit-infantry', 'unit-command', 'unit-anti-tank',
             'unit-mortars', 'unit-mmg', 'unit-medic', 'unit-observer', 'unit-transport',
             'unit-transports', 'unit-anti-aircraft', 'unit-artillery', 'unit-flamethrowers',
             'unit-snipers']
    note: 293 of 301 graded, 97.3%; reach 826
  - category: miniatures
    hintContainsAny:
      tags: ['blister', 'metal', 'warlord-resinplus']
    note: 65/65, 245/249 and 29/29; the material tags that survived grading

  # ===========================================================================================
  # WHICH GAME. These could not be written until `legacy-catalog` stopped asserting `bolt-action`
  # for 3,865 Warlord products, because that value WAS the grading set: measured against it, the
  # tag `GoA` scored 39 of 39 "bolt-action" while sitting on products named
  # `Boromite Engineers` and `Tsan Ra Torus Squad`. The contamination was in the truth, not the
  # tags.
  #
  # GRADED INSTEAD AGAINST THE STORE'S OWN `productType`, through
  # data/catalog/mappings/mfr-warlord-store.yaml -- a different field of the same listing, and one
  # that agrees with legacy 2,868 of 2,871 times inside the bucket where both speak. Figures below
  # are (graded products, purity).
  - gameSystems: [konflikt-47]
    hintContainsAny:
      tags: ['konflikt-47', 'Konflikt-47-10', 'K47-german', 'k47-USA', 'k47-british',
             'k47-Japanese', 'k47-Soviet', 'k47-Italian']
    note: 182/182 and 83/83
  - gameSystems: [victory-at-sea]
    hintContainsAny:
      tags: ['victory-at-sea', 'aircraft-carriers', 'cruisers', 'battleships', 'destroyers']
    note: 155/155
  - gameSystems: [blood-red-skies]
    hintContainsAny:
      tags: ['blood-red-skies', 'ACE']
    note: 138/138
  - gameSystems: [black-seas]
    hintContainsAny: {tags: ['black-seas']}
    note: 90/90
  - gameSystems: [cruel-seas]
    hintContainsAny: {tags: ['cruel-seas']}
    note: 33/33
  - gameSystems: [gates-of-antares]
    hintContainsAny:
      tags: ['gates-of-antares', 'beyond-the-gates-of-antares', 'GoA', 'algoryn', 'boromite',
             'ghar', 'isorian', 'concord', 'freeborn']
    note: 83/83 and 123/123 -- the tags whose grading was inverted by the fill
  - gameSystems: [warlords-of-erehwon]
    hintContainsAny: {tags: ['warlords-of-erehwon']}
    note: 9/9
  - gameSystems: [epic-hail-caesar]
    hintContainsAny: {tags: ['epic-hail-caesar']}
    note: 36/36
  - gameSystems: [epic-pike-and-shotte]
    hintContainsAny: {tags: ['epic-pike-shotte']}
    note: 46/47

  # THE PERIOD TAGS. Warlord's historical games each own a period, and the period tag is a
  # stronger signal than the game tag because it is applied consistently -- `black-powder` itself
  # grades only 90.2% (its misses are Epic Black Powder), while its two period tags are perfect.
  - gameSystems: [pike-and-shotte]
    hintContainsAny:
      tags: ['thirty-years-war-1618-1648', 'the-english-civil-wars-1642-1652']
    note: 92/92 and 86/86
  - gameSystems: [black-powder]
    hintContainsAny: {tags: ['napoleonic-wars-1789-1815', 'napoleonic-wars']}
    note: 186/186 and 94/94
  - gameSystems: [hail-caesar]
    hintContainsAny: {tags: ['hail-caesar', 'the-dark-ages']}
    note: 257 graded 98.1%, and 71/71

  # ACHTUNG PANZER IS PLAYED WITH BOLT ACTION KITS, and Warlord says so on the product page: the
  # `M24 Chaffee` description reads "This vehicle can also be used in games of Achtung Panzer!,
  # the game of close-quarters tank-on-tank combat". The tag grades 71.8% `bolt-action` against
  # the store's own productType, and that is not impurity -- it is the same kit being sold into
  # both, which is what a list is for. 124 rows.
  - gameSystems: [achtung-panzer, bolt-action]
    hintContainsAny: {tags: ['achtung-panzer', 'prepare-achtung-panzer']}
    note: 117 graded, 71.8% bolt-action -- both, not either

  # THE BARE `bolt-action` TAG IS A PERIOD, NOT A GAME, and it is deliberately absent. Warlord
  # runs FIVE World War Two games -- Bolt Action, Achtung Panzer!, Victory at Sea, Cruel Seas and
  # Blood Red Skies -- and tags the era on all of them, so `Victory at Sea - Type 1936A Destroyers`
  # carries `bolt-action` beside `victory-at-sea` and `destroyers`. It grades 96.2% against the
  # store's productType, and the 3.8% is not noise: it is every naval and air product in the WWII
  # range. Because the game axis ACCUMULATES every matching clause of the winning source -- which
  # is what lets Wyrd's `Malifaux Third Edition and The Other Side` products name both -- a
  # polysemous tag does not merely dilute, it manufactures a second membership.
  #
  # NEITHER IS A PERIOD OR A CAMPAIGN. `D-Day`, `late-war` and `zone-winter` were tried and
  # produce the same failure one step down: `80th D-Day anniversary Campaign Pack - Cruel Seas
  # PDF` is a Cruel Seas product that carries `D-Day`, so the clause handed it Bolt Action too.
  # What survives is the FORCE tags -- a nationality plus an army is a land-war formation, and
  # Bolt Action is Warlord's land-war game. `korean-war` is a Bolt Action supplement by name.
  - gameSystems: [bolt-action]
    hintContainsAny:
      tags: ['korean-war', 'blitzkrieg-germans', 'german-afrika-korps', 'german-waffen-ss',
             'italian-army']
    note: 92-155 graded each, 97.2-100%

  - packaging: bundle
    hintEquals: {productType: Bundle}
  - packaging: bundle
    hintEquals: {productType: bundle}
  - packaging: bundle
    hintEquals: {productType: Bunde}
    note: the store's own typo, 2 rows -- mapped as written because hintEquals is exact
