source: mfr-warlord-store
reason: >-
  store.warlordgames.com's `product_type` carries TWO axes in one field and only one of them is
  answerable here. About half its 70 values name a game line -- `Bolt Action` (1,188), `Black
  Powder` (401), `Hail Caesar` (261) -- which says nothing about what the product IS; those are
  left to the gameSystem mapping in data/catalog/mappings/mfr-warlord-store.yaml and are not
  clauses here. The other half names a MATERIAL AND PACKAGING format -- `Loose Metal` (245),
  `Box - Metal` (83), `blister - resin/metal` (36) -- and every one of those is a miniature,
  whatever it is a miniature FOR. Counts from
  data/evidence/products/mfr-warlord-store/observations.jsonl on 2026-08-25.


  THE MATERIAL VALUES ARE MAPPED TO `miniatures` AND NOT TO A PACKAGING. "Box - Plastic" is
  Warlord's word for how the thing ships, and it is tempting to read `Box -> set` and
  `Loose/Blister -> single` straight off it. That inference does not hold in either direction: a
  single large model ships in a box, and a blister routinely holds three infantry. Packaging is a
  separate axis with its own evidence, and a table that filled it from a shelf label would make
  60% of the catalog's unknown packaging look answered when it is not. Only the four values that
  literally NAME a packaging set one.


  CASING AND TYPOS ARE MAPPED AS THE STORE WROTE THEM -- `Paint set` beside `Paint Set`, `bundle`
  and `Bunde` beside `Bundle`, `decals` beside `Decals`. `hintEquals` is exact, and normalising
  here would be this file quietly claiming the store wrote something it did not. They cost one
  line each.


  FOUR VALUES ARE NOT PRODUCT CATEGORIES AT ALL and are deliberately absent: `Loyalty` (13),
  `No Discount Codes` (5), `Exclude` (2) and `Archive` (3) are merchandising states. `Accessory`
  (42) is absent for the opposite reason -- it is a real category and far too vague to place,
  since it covers dice, flags, tools and mats alike; its 42 rows split into 16 tools, 6 wet
  palettes, 13 Black Seas sails and rigging, 3 templates and a mug, and the tag clauses below
  reach 22 of them correctly while the shelf itself stays silent.


  `productType` REACHES ONLY HALF THE STORE. It is present on 4,856 rows, but around half of
  those name a game rather than a format, so the table above decides ~2,400 products and leaves
  ~2,556 undecided. THE TAGS REACH THE REST. Warlord tags every product with its troop type, its
  unit role, its material and its period -- 850 distinct values, a mean of 13 per row -- and the
  troop and role families are as clean a `miniatures` signal as this catalog has.


  MEASURED 2026-09-01 against an independent statement built four ways and never from this store:
  another manufacturer's own `category` hint for its own goods, `ret-goblingaming`'s productType
  shelf through its own committed table, `legacy-catalog`'s category where it is NOT the declared
  `miniatures` fill, and the paint catalog's barcodes. The base rate over the 1,110 graded store
  products is miniatures 52.0% / paint 33.6% / hobby-auxiliary 5.5% / book 5.1%, so a `miniatures`
  rule has to beat 52%, not 0%.

    troop-type family        519/524 = 99.0%     reach 1,887
    unit and platoon role    293/301 = 97.3%     reach   826
    book family               57/57  = 100%      reach   167
    hobby family              40/41  = 97.6%     reach    72
    material: blister         65/65  = 100%      reach   634
    material: metal          245/249 = 98.4%     reach 1,660
    material: warlord-resinplus 29/29 = 100%     reach    71


  CLAUSE ORDER IS LOAD-BEARING AND MEASURED. 77 products carry BOTH a troop tag and a book tag,
  and 46 of those are books by name -- `Bolt Action Campaign: Tough Gut`, `Operation Market Garden
  PDF`. If the miniatures clauses ran first they would take all 77. The book and hobby clauses
  therefore precede every miniatures clause.


  TWO MATERIAL TAGS ARE DECLINED WITH THEIR NUMBERS RATHER THAN OMITTED SILENTLY: `box-set` (390
  graded, 91.5%, reach 270) and `warlord-resin` (144, 92.4%, reach 285). Their impurity is books
  and terrain that also carry the tag, so running them after the book and hobby clauses would
  raise those figures -- but by how much is not measured, and an unmeasured 91.5% is not a basis
  for 555 claims. `sprue` (198 products) and `loose-item` (144) have a graded set of TWO each and
  are not evidence at all.


  AND THE TAGS THAT LOOK LIKE SIGNALS AND ARE ARTEFACTS, recorded so they are not tried again:
  `under-10` reads 86.5% paint and `over-10` 79.9% miniatures -- they are PRICE BANDS, and paint
  is the cheap half of the catalog. `0424` reads 98.6% paint, `0723` 98.5%, `0319` 95.2%
  hobby-auxiliary: every date-shaped tag is a RELEASE WEEK and reads as whatever launched that
  week. `eu` and `us` read 51.9% and 52.0%, which is the base rate exactly -- they are market
  flags. `deal` and `perfect-present` are promotions. None of these is mapped and none should be.

# GENERIC GOODS BELONG TO NO GAME, and Warlord tags them with every game they can be used in.
# `D6 Dice - white (30)` carries black-powder + black-seas + bolt-action + hail-caesar +
# pike-shotte; `Grassland Playing Mat 6'x4'` carries four. Each tag is individually true -- the
# dice ARE for Black Powder -- and their union is false, because a bag of dice is not a Black
# Powder product.
#
# THESE USED TO BE VETOES, AND A VETO WAS THE WRONG TOOL: it silenced the game axis, which left
# the dice `gameSystemsBasis: unknown` -- "not decided yet" about a product that is decided. A
# `generic` clause is the decision itself: no game and no setting, `not-applicable` on both axes.
# The rule engine reads a source's generic clause BEFORE its game clauses, which is what keeps the
# five game tags on the dice from being read at all.
#
# Same finding as Mantic's accessories shelves, arrived at the same way: by running the clauses and
# reading what came out with more than one game.
clauses:
  - generic: true
    hintEquals: {productType: Dice}
  - generic: true
    hintEquals: {productType: Gaming mat}
  - generic: true
    hintEquals: {productType: Basing}
  - generic: true
    hintEquals: {productType: Bases}
  - generic: true
    hintEquals: {productType: Brushes}
  - generic: true
    hintEquals: {productType: Hobby}
  - generic: true
    hintEquals: {productType: Hobby Set}
    note: tools, dice and mats -- sold for every game, belonging to none

  # --- paint -----------------------------------------------------------------------------------
  - category: paint
    hintEquals: {productType: Paint Pot}
  - category: paint
    hintEquals: {productType: Paint Pen}
  - category: paint
    hintEquals: {productType: Paint}
  - category: paint
    hintEquals: {productType: Spray Paint}
    note: >-
      Warlord resells The Army Painter's Colour Primers, which are sold AS colours -- a coloured
      spray is `paint` by the categories.yaml boundary, colourless undercoat would not be
  - category: paint-set
    packaging: set
    hintEquals: {productType: Paint Set}
  - category: paint-set
    packaging: set
    hintEquals: {productType: Paint set}

  # --- miniatures: every material/packaging value the store uses -------------------------------
  - category: miniatures
    hintEquals: {productType: Loose Metal}
  - category: miniatures
    hintEquals: {productType: Loose - Metal}
  - category: miniatures
    hintEquals: {productType: Loose Resin}
  - category: miniatures
