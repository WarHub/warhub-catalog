source: ret-gamenerdz
reason: >-
  gamenerdz.com publishes a schema.org breadcrumb trail, captured whole (PR #147) rather than as a
  single leaf, and the trail is a DEPARTMENT path: `Home > Miniatures > Infinity > Nomads >
  <product>`. Counts over the 2,471 rows carrying breadcrumbs, from
  data/evidence/products/ret-gamenerdz/observations.jsonl on 2026-08-25.


  THIS FILE IS ALMOST ENTIRELY REFUSALS, and that is the finding rather than a shortcoming.
  Measured with scripts/measure_category_rules.py against products a MANUFACTURER independently
  states a category for, gamenerdz's departments are not format axes at all:

    Miniatures (1,260 rows)  22 checkable products, 22 of them WRONG -- 8 Halo terrain sets,
                             Mantic terrain packs, 25/40/55mm scenery bases, a Kings of War
                             rulebook. The department is "things for miniatures games".
    Supplies (334)           25 checkable, 22 of them GW paint six-packs. It contains paint.
    Terrain & Accessories    15 checkable, 5 of them hobby-auxiliary. It spans two categories in
      (23)                   its own name, which is the same reason mfr-para-bellum's
                             `accessories-merchandise-more` is refused there.

  Only `Paint and Crafting` survives: 220 checkable products, 220 agree.


  DROPPING `Miniatures` COSTS NOTHING IN ACCURACY, which is the argument for dropping rather than
  keeping a 16%-wrong rule. The resolver's fallback already writes `miniatures` for anything no
  source decides, so a clause predicting `miniatures` adds no answer -- it adds only the CLAIM that
  the answer is evidence-backed. A claim that is wrong one time in six is worse than the honest
  `guessed` it would replace, and the whole point of `categoryBasis` is that the two can be told
  apart. A clause predicting anything else does add an answer, and is worth keeping at a lower bar.

clauses:
  # `Paint and Crafting` IS NOT MAPPED (removed 2026-09-02). It is the department, and its one
  # sub-crumb is `Supplies` -- paints and brushes alike, 308 products. Filing the department as
  # `paint` published 22 Citadel brushes, files, knives and painting handles as paint on this
  # store's word against goblingaming's `hobby-auxiliary`, and 49 tool-named products catalog-wide
  # rest on a department read. The store's other crumbs stay: each names a kind of thing. Paints
  # this store alone lists reach `paint` through the paint catalog's barcodes and the name lexicon.

  # THE TWO BOARD-GAME CRUMBS NEED A GUARD, and it is the same shape as the DATACARDS exception
  # this store's own department structure forces elsewhere. `Board Games` holds
  # `Aristeia! 30mm Hexagonal Bases (10)`, `Aristeia! Advanced Tactics Deck` and
  # `Godtear: Kailinn Champion Expansion`; `Boxed Games` holds `DATACARDS: CHAOS DAEMONS`, which
  # category-lexicon.yaml explicitly calls a game-accessory. A department that sells a game also
  # sells that game's bits, so the narrow name clauses run first.
  - category: game-accessory
    nameMatches: '\bDATA ?CARDS?\b'
  - category: hobby-auxiliary
    role: basing
    nameMatches: '\b\d+\s?MM\b.*\bBASES?\b'
    note: bare bases sold under a game's own department -- categories.yaml `miniatures` boundary
  - category: book
    nameMatches: '\b(HARDCOVER|HARDBACK|PAPERBACK)\b'
    note: 2 of 2 on the Board/Boxed Games crumbs (Traitor Legios, Shadow & Iron), both ISBN-barcoded (2026-09-02)
  - category: board-game
    hintContainsAny: {breadcrumbs: [Board Games]}
  - category: board-game
    hintContainsAny: {breadcrumbs: [Boxed Games]}
  - category: game-accessory
    hintContainsAny: {breadcrumbs: [Playmats]}
    note: a play surface, not modelled scenery -- categories.yaml `terrain` boundary
  - category: game-accessory
    hintContainsAny: {breadcrumbs: [Dice]}
