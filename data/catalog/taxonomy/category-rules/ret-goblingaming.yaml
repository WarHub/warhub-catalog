    hintEquals: {productType: Brushes}
  - category: hobby-auxiliary
    hintEquals: {productType: Basing Materials}
  - category: hobby-auxiliary
    hintEquals: {productType: Bases}
    note: a blank base is a component of the hobby, not a model -- categories.yaml `miniatures`
  - category: hobby-auxiliary
    hintEquals: {productType: Hobby Tools}
  - category: hobby-auxiliary
    hintEquals: {productType: Decals}
  - category: hobby-auxiliary
