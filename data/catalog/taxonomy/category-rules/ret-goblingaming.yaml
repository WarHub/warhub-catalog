source: ret-goblingaming
reason: >-
  goblingaming.com's Shopify `product_type` is a pure FORMAT taxonomy -- 31 distinct values over
  7,275 observations, and not one of them names a game system or a brand (those live in `tags` and
  `vendor`). That is unusual and it is why this store is mapped first: most Shopify product_type
  fields answer the game-line question instead, which says nothing about what the thing IS. Counts
  are from data/evidence/products/ret-goblingaming/observations.jsonl on 2026-08-25.


  FOUR VALUES ARE DELIBERATELY LEFT UNMAPPED, and they are the interesting part of this file.
  `Aerosols` (38) straddles the boundary categories.yaml itself flags as the thinnest in the
  vocabulary -- a coloured spray is `paint`, a colourless undercoat is `hobby-auxiliary`, and the
  shelf holds both. `Advent Calendars` (3) and `Expansions` (2) name a sales format whose contents
  decide the answer. Guessing any of them would put a wrong value where an honest "undecided" is
  more useful; they stay in the review file's worklist until something better decides them.


  `Paint Technical/Effects` (139) IS mapped, to `paint`, and it is the closest call here: GW's
  Technical range is mostly coloured effects but also contains Lahmian Medium, which is colourless
  and belongs in `hobby-auxiliary` by the stated boundary. The store's own claim wins until a human
  moves it (OBJECTIVES 5), and the colourless-medium adjudication is already an open item on the
  vocabulary itself rather than something this table should pre-empt.

clauses:
  # NARROW BEFORE BROAD, since 2026-09-02: a scan takes the first clause that answers the axis, so
  # the name guards and the shelves a `Scenery` tag rides on come before `Miniatures`. Every
  # number here is from the adjudication of that day's review rows.
  - category: game-accessory
    nameMatches: '\bDICE\b(?!\s+GAME)'
    note: >-
      Dice 61 + Dice Accessories 6 agree; 1 dice pack on the Miniatures shelf corrected, 3 untyped
      dice packs decided; the lookahead keeps `Invincible The Dice Game` out
  - category: hobby-auxiliary
    nameMatches: '\b\d+\s?MM\b.*\bBASES?\b'
    note: bases sold under a game's shelf are components (categories.yaml `miniatures`); 1 row, 0 collateral
  - category: book
    nameMatches: '\b(HARDCOVER|HARDBACK|PAPERBACK)\b|\((HB|PB)\)'
    note: Novels 115 + Rules Supplements 2 agree; 9 untyped Black Library rows decided, 1 paperback on the Miniatures shelf corrected
  - category: game-accessory
    hintEquals: {productType: Game Mats}
    note: a play surface, not modelled scenery -- categories.yaml `terrain` boundary
  - category: hobby-auxiliary
    hintEquals: {productType: Basing Materials}
  - category: hobby-auxiliary
    hintEquals: {productType: Bases}
  - category: hobby-auxiliary
    hintEquals: {productType: 'Model Bases'}
    note: >-
      the store uses both spellings for the same shelf -- `Bases` on 77 rows and `Model Bases` on
      2, and only the first was mapped; a blank base is a component of the hobby, not a model
      (categories.yaml `miniatures`)
  - category: terrain
    hintContainsAny: {tags: [Scenery]}
    note: >-
      9 rows on the Miniatures shelf carry it, 7 already terrain and 2 Civitas Imperialis buildings
      wrongly miniatures; the mats/basing/bases shelves above carry it on 13/4/1 rows and decide first

  - category: miniatures
    hintEquals: {productType: Miniatures}

  # A starter set feeds a wider game system, so it is (miniatures, set) rather than `board-game` --
  # categories.yaml's board-game boundary says exactly this. Both spellings are live in the store.
  - category: miniatures
    packaging: set
    hintEquals: {productType: Starter Sets}
  - category: miniatures
    packaging: set
    hintEquals: {productType: Starter Set}

  # COLOUR IS THE TEST (categories.yaml): the three paint shelves hold 75 colourless agents by
  # name -- thinners, cleaners, varnishes, mediums, palette paper -- 44 of them flagged colourless
  # in the paint catalog. The lookahead keeps the 25 `Medium <colour>` pots (Medium Sea Grey) in;
  # the 10 `Medium Mortar/Artillery/Walker` rows sit on the Miniatures shelf, which decides first.
  # Also reaches 3 Aerosols varnish sprays and one untyped brush.
  - category: hobby-auxiliary
    nameMatches: '\b(THINNER|CLEANER|RESTORER|VARNISH|RETARDER|FLOW IMPROVER|WET PALETTE|PALETTE PAPER|MASKING FLUID|STRIPPER)\b|\bMEDIUM\b(?!\s+(GREY|GRAY|BLUE|BROWN|GREEN|OLIVE|SEA|FLESH|SAND|RUST|ORANGE|YELLOW|SKIN|RED|TAN|OCHRE|VIOLET|PURPLE|PINK))'
  # A TEXTURE PASTE IS A BASING MATERIAL whoever lists it (categories.yaml `hobby-auxiliary`):
  # Vallejo's Diorama Effects range -- pumice, sand, earth, lava, water gels, foam -- was split by
  # this store between `Basing Materials` (14) and the paint shelves (33); 47 of 47 by name.
  - category: hobby-auxiliary
    nameMatches: '\bDIORAMA EFFECTS\b|\bTHICK MUD\b|\bWEATHERING EFFECTS\s+200ML\b'
  # A SET IS A SET on any shelf: 32 Vallejo sets filed under Paints/Airbrush Paints, named with
  # their count (`Face & Skin Tones Set 16x`); 43 Paint Sets rows agree, 0 hits elsewhere.
  - category: paint-set
    packaging: set
    nameMatches: '\bPAINT SET\b|\bSET\s*\d+\s?X\b'
  - category: paint
    hintEquals: {productType: Paints}
  - category: paint
    hintEquals: {productType: Airbrush Paints}
  - category: paint
    hintEquals: {productType: Paint Technical/Effects}
    note: see the header -- the store's claim, not an adjudication of the colourless boundary
  - category: paint
    hintEquals: {productType: Paint Marker}
    note: >-
      a marker deposits colour, which is the test categories.yaml sets for `paint`. KNOWN
      IMPRECISION: the shelf also holds marker SETS -- all 4 checkable products
      (army-painter/SM8001P-SM8004P, the Speedpaint Marker sets) are stated `paint-set` by the
      manufacturer, and this clause would say `paint`. It costs nothing today because a stated
      category outranks this stage entirely, and there is no discriminator in the row to narrow on
  - category: paint-set
    packaging: set
    hintEquals: {productType: Paint Sets}

  - category: terrain
    hintEquals: {productType: Scenery}

  # BEFORE `Rules Supplements`, which is where Goblin Gaming files Kill Team's datacard decks
  # alongside its actual supplements. A `mapped` decision outranks the name lexicon, so the
  # lexicon's own datacards entry cannot correct this one -- the narrow clause has to live here.
  # data/catalog/taxonomy/category-lexicon.yaml carries the canonical pattern and the reasoning;
  # this is the same rule applied one layer earlier, for the ~8 rows the shelf mislabels.
  - category: game-accessory
    nameMatches: '\b(INDEX CARDS|DATACARDS?|DATASHEET CARDS|STAT CARDS)\b'
    note: reference cards are played with, not read -- categories.yaml `book` boundary

  - category: book
    hintEquals: {productType: Rules Supplements}
  - category: book
    hintEquals: {productType: Novels}
  - category: book
    hintEquals: {productType: Magazines}
  - category: book
    hintEquals: {productType: RPG Books}

  # Used to BUILD and FINISH: brushes, basing, tools, decals, magnets, storage.
  - category: hobby-auxiliary
    hintEquals: {productType: Brushes}
  - category: hobby-auxiliary
    hintEquals: {productType: Hobby Tools}
  - category: hobby-auxiliary
    hintEquals: {productType: Decals}
  - category: hobby-auxiliary
    hintEquals: {productType: Painting Accessories}
  - category: hobby-auxiliary
    hintEquals: {productType: Magnets}
  - category: hobby-auxiliary
    hintEquals: {productType: Model Cases}
    note: >-
      storage is neither building nor playing; `hobby-auxiliary` is the nearest home the vocabulary
      offers and 4 rows do not justify an eleventh category

  # Used to PLAY: dice, tokens, mats, cards.
  - category: game-accessory
    hintEquals: {productType: Gaming Accessories}
  - category: game-accessory
    hintEquals: {productType: Dice}
  - category: game-accessory
    hintEquals: {productType: Dice Accessories}
  - category: game-accessory
    hintEquals: {productType: Tokens}
  - category: game-accessory
    hintEquals: {productType: Roleplaying Game Accessories}

  - category: board-game
    hintEquals: {productType: Board Games}
