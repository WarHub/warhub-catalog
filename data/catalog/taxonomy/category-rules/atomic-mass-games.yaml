manufacturer: atomic-mass-games
reason: >-
  ATOMIC MASS GAMES PREFIXES EVERY PRODUCT CODE WITH ITS GAME. `SWL107` is Star Wars: Legion,
  `SWP100` is Shatterpoint, `CP191` is Marvel: Crisis Protocol. Measured 2026-08-31 against every
  AMG product whose gameSystem is stated independently of the code: 336 of 336, 100.00%, with 84
  currently-unclassified products filled.


  IT IS CORROBORATED BY AN INDEPENDENT SIGNAL RATHER THAN ASSUMED. GameNerdz shelves 280 of these
  products under its own `Miniatures/<game>` breadcrumb; the code and the retailer agree on 278,
  and on the 2 they disagree the retailer is wrong and the catalog already says so -- `CP191 Adam
  Warlock, Moondragon & Quasar` and `CP224 X-Force Affiliation Pack` are shelved under Star Wars
  Legion and are plainly Marvel. Two independent signals agreeing on 278 is why this table is a
  measurement rather than a guess.


  `SWQ` is the quiet win: 64 of the 84 fills, 44/44 pure, and every one of its unclassified
  products is literally named `Star Wars: Legion - ...`. `SWZ` (X-Wing) and `SWM` (Armada) are
  mapped for completeness -- both are fully classified today and fill nothing, but a table that
  omitted them would silently start guessing the day a new one is acquired.

clauses:
  # THE CODE ANSWERS THE FORMAT QUESTION TOO -- but only after the names have taken the exceptions
  # out, and that ordering is the whole finding. AMG's terrain is INTERLEAVED THROUGH the model
  # numbering (`CP14`, `CP44`, `CP95`, `CP178-180`, `CPE05`, `SWP02/17/18/60`, `SWQ137`), so the
  # prefix cannot separate it -- the raw code block grades 130/169 = 77%. Every one of those
  # products is named `... Terrain Pack` or `... Terrain Collection`, and with the name clauses
  # ahead of it the same block grades 128 of 128 against `ret-goblingaming`'s productType.
  #
  # AMG'S OWN STORE IS NOT A SOURCE HERE. The undecided products are reached by `legacy-catalog`
  # (224), `ret-gamenerdz`'s `Miniatures` department (121, which its table refuses) and
  # `ret-radaddel` tags (76).
  - nameMatches: '\bTerrain\b'
    category: terrain
    note: >-
      20/21, and it adds a BASIS rather than an answer -- the name lexicon already reaches all of
      them. It is here so the model clause below cannot take them.
  - nameMatches: '\b(Card Pack|Card Collection|Kartenset|Dice Pack|Measuring Tools|Movement Tools|Mission Pack|Battle Deck|Conversion Kit)\b'
    category: game-accessory
    note: 21 fills; 24/25
  - codeMatches: '^(CPE|MCP|MCA|CP|CA|SWL|SWQ|SWP|SWZ|SWM)\d'
    category: miniatures
    note: 242 fills; 128/128 against ret-goblingaming, once the name clauses above have run

  # Longest prefixes first: `CPE` and `CP` share a stem, and first-match-wins would let the short
  # one swallow the long one.
  - codeMatches: '^MCP\d'
    gameSystems: [marvel-crisis-protocol]
  - codeMatches: '^MCA\d'
    gameSystems: [marvel-crisis-protocol]
  - codeMatches: '^CPE\d'
    gameSystems: [marvel-crisis-protocol]
  - codeMatches: '^CP\d'
    gameSystems: [marvel-crisis-protocol]
  - codeMatches: '^CA\d'
    gameSystems: [marvel-crisis-protocol]
    category: game-accessory
    note: >-
      all 6 read `Card Pack 2022/2023`, `War of Kings Crisis Card Pack`, `Operation - Zero
      Tolerance Character & Crisis Card Pack`. The category was never set on this block.
  - codeMatches: '^SWL\d'
    gameSystems: [star-wars-legion]
  - codeMatches: '^SWQ\d'
    gameSystems: [star-wars-legion]
  - codeMatches: '^SWP\d'
    gameSystems: [star-wars-shatterpoint]
  - codeMatches: '^SWZ\d'
    gameSystems: [star-wars-x-wing]
  - codeMatches: '^SWM\d'
    gameSystems: [star-wars-armada]
