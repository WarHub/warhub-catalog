source: mfr-warmachine
reason: >-
  warmachine.gg files 609 observations under 7 `product_type` values and every one of them answers
  the format question -- this is the cleanest taxonomy of any source in the repo. `Paint: paint`
  already exists in data/catalog/mappings/mfr-warmachine.yaml and is applied at ACQUIRE time, which
  is why 222 of these rows already carry a `category` hint; the rest of the vocabulary was dropped
  on the floor. Counts from data/evidence/products/mfr-warmachine/observations.jsonl on 2026-08-25.


  `Paint` is restated here rather than left to the acquire-time map. The two do not conflict -- a
  row with a stated category is `stated` and this stage never reaches it -- but a rule that exists
  in only one of the two places is a rule that stops applying the moment the other is retired, and
  the acquire-time category map is the thing this stage is meant to replace.


  `Product` (1) and `Wargame` (2) are unmapped: neither says anything.

clauses:
  - category: miniatures
    hintEquals: {productType: Miniatures}
  - category: paint
    hintEquals: {productType: Paint}
  - category: book
    hintEquals: {productType: Roleplaying Game}
    note: warmachine.gg's RPG shelf is the Iron Kingdoms rulebooks
  # BOTH DIGITAL SHELVES ARE TEXT, and both used to write nothing at all -- a clause that set only
  # `packaging` was skipped by the stage, so 24 products matched a committed rule and kept no value
  # from it. The old note said `Digital Download` "holds rules PDFs and STL files alike"; measured
  # 2026-09-01, there is not one STL on it. 12 of its 14 rows are `Iron Kingdoms: <title> (PDF)`,
  # the RPG rulebooks this table's own `Roleplaying Game` clause already calls books, and they line
  # up one-for-one with `vendor: Iron Kingdoms`. The other two are the Warmachine quick-start and
  # rules-only PDFs.
  - category: book
    packaging: digital
    hintEquals: {productType: Digital Download}
    note: 14 rows, 12 of them the PDF twin of a printed Iron Kingdoms book

  # `Free Resource` is a judgement rather than a measurement, and it is recorded as one: 8 of its
  # 10 rows are `... Build Instructions`, which the vocabulary has no real home for, and the other
  # two are a tournament pack and a lore PDF. Every one is a text document, so `book` is the
  # least-wrong value available -- if `hobby-auxiliary` ever grows an instructions boundary, this
  # is the clause to revisit.
  - category: book
    packaging: digital
    hintEquals: {productType: Free Resource}
    note: 10 rows, 8 of them build instructions

  # --- which GAME, from the storefront's own vendor field ----------------------------------------
  # Steamforged runs one storefront for several games and stamps each row with the line it belongs
  # to. Measured 2026-08-31: 550 of 550. `P3 Paints` and `Iron Kingdoms` are deliberately absent --
  # the first is paint (no game system applies) and the second is an RPG whose products are books.
  - gameSystems: [warmachine]
    hintEquals: {vendor: Warmachine}
  - gameSystems: [guild-ball]
    hintEquals: {vendor: Guild Ball}
  - gameSystems: [godtear]
    hintEquals: {vendor: Godtear}
  - gameSystems: [epic-encounters]
    hintEquals: {vendor: Epic Encounters}
  - gameSystems: [epic-encounters]
    hintEquals: {vendor: 'Epic Encounters: Local Legends'}
