manufacturer: mantic-games
reason: >-
  MANTIC NUMBERS ITS RANGE `MG` + TWO LETTERS FOR THE GAME + ONE OR TWO FOR THE FACTION + a
  number, and the faction letters are model kits. `MGKWO301` is a Kings of War Orc box; `MGDZA102`
  a Deadzone Asterian one. This is the same shape `corvus-belli.yaml` already reads, and it
  answers the format question for a population the store's shelves cannot.


  THE SHELVES CANNOT REACH THESE PRODUCTS, and not for the reason it looks like. 1,035 of the
  1,559 undecided Mantic products DO carry a `categories` hint -- the shelf that reaches them is a
  faction or game-line shelf (`kings-of-war` 141, `all-out-war-singles` 77, `deadzone` 52,
  `basilean` 37), which `mfr-manticgames.yaml` correctly refuses to read as a format. The other
  524 are DISCONTINUED products the WooCommerce store no longer lists, so they carry no shelf at
  all. Neither population is reachable by a source table, and both carry a product code.


  `M` IS THE SYSTEM BLOCK AND IS VETOED THROUGHOUT. Within each game, `MG<game>M<n>` is Mantic's
  miscellaneous shelf -- rulebooks in four languages, dice, mats, tokens, movement trays,
  two-player starter sets, a novel. `MGKWM04` is the Kings of War rulebook, not a Kings of War
  unit. Two exceptions are load-bearing and are why the negative lookaheads differ per block:
  `MGDZMN101/102/103` are Matsudan MINIATURES (hence `(?!M\d)`, not `(?!M)`), and `MGDB` is
  inverted -- `MGDBM*` is the DreadBall TEAM block and gets its own positive clause.


  MEASURED 2026-09-01. No source in this catalog independently states `miniatures`, so the
  `miniatures` clauses are graded two ways: against the decisions `mfr-manticgames.yaml` itself
  reached on the same code blocks from a different signal (216 of 216 agree), and against a full
  name read of every block -- 483 `MGKW` names, 79 `MGWP`, 65 `MGDZ`, 63 `MGFF`, 61 `MGAR`, 53
  `MGVA`, 16 `MGEW`. Two names were flagged in all of that and both are still miniatures
  (`Twilight Kin One-Click Ultimate Bundle`, `Trident Realm Complete Fleet Bundle`).

clauses:
  - codeMatches: '^MGKW(?!M\d|TC)[A-Z]'
    category: miniatures
    note: 403 fills; 80/80 against the shelf table. `TC` excluded -- TerrainCrate is not a KoW army
  - codeMatches: '^MGWEWD\d'
    category: miniatures
    note: 80 fills -- Mantic Direct's Walking Dead block
  - codeMatches: '^MGWP(?!M)[A-Z]'
    category: miniatures
    note: 61 fills; 18/18
  - codeMatches: '^MGAR(?!M)[A-Z]'
    category: miniatures
    note: 56 fills; 4/4
  - codeMatches: '^MGDZ(?!M\d)[A-Z]'
    category: miniatures
    note: 41 fills; 27/27. `(?!M\d)` not `(?!M)` -- MGDZMN* is the Matsudan range
  - codeMatches: '^MGFF(?!M)[A-Z]'
    category: miniatures
    note: 31 fills; 32/32
  - codeMatches: '^KSEW(?!M)[A-Z]'
    category: miniatures
    note: 15 fills -- the Epic Warpath Kickstarter block
  - codeMatches: '^MGWEVA\d'
    category: miniatures
    note: 12 fills; 8/8
  - codeMatches: '^MGEW(?!M)[A-Z]'
    category: miniatures
    note: 8 fills; 8/8
  - codeMatches: '^MGVA(?!M)[A-Z]'
    category: miniatures
    note: 3 fills; 50/50
  - codeMatches: '^MGDBM\d'
    category: miniatures
    note: >-
      3 fills; 20/21. INVERTED from every other block: for DreadBall, `M` is the team block rather
      than the system one.

  - codeMatches: '^MGDG'
    category: book
    packaging: digital
    note: 75 fills; 109/115. Mantic's digital range -- rulebooks, FAQs, rosters, scenario packs
  - codeMatches: '^VAL72\d'
    category: paint
    note: 82/82 -- Vallejo Game Color, resold under Mantic's own numbering
  - codeMatches: '^MGEV'
    category: event
    note: 17 fills; 50/51. Every name is a tournament, open day or playtest day
  - codeMatches: '^BF\d'
    category: hobby-auxiliary
    note: >-
      17 fills, no control. Army Painter Battlefields, resold: tufts, static grass, snow, razor
      wire, rocks. All 17 names read.

  # ===========================================================================================
  # WHICH GAME. FIVE SLUGS WERE ALREADY DECLARED IN `game-systems.yaml` AND REACHED NOTHING --
  # `epic-warpath`, `dungeon-saga`, `star-saga`, `hellboy` and `overdrive` have zero products
  # catalog-wide. The products exist, across four sources; no rule ever named them. This is the
  # cheapest decision in the residue: 197 products, and no taxonomy question to settle first.
  #
  # Each game is claimed three ways, because its products arrive from different places: Mantic's
  # own code, the shelf `mfr-manticgames.yaml` files it under, and the product's name (which is
  # what reaches the ret-goblingaming and ret-tistaminis rows, whose ids read
  # `epic-warpath-asterian-core-army-pack`).
  #
  # THE `epic` GUARD IS LOAD-BEARING. `gameSystems` accumulates every matching clause, so a bare
  # `\bwarpath\b` would hand every Epic Warpath product BOTH games. Epic Warpath is a separate
  # game at a different scale, not an edition of Warpath, and the lookbehind says so.
  - codeMatches: '^(MG|KS)EW'
    gameSystems: [epic-warpath]
  - nameMatches: '\bepic[ -]?warpath\b'
    gameSystems: [epic-warpath]
  - codeMatches: '^(MGDS|MGCD|KSDS)'
    gameSystems: [dungeon-saga]
  - nameMatches: '\bdungeon\s*saga\b'
    gameSystems: [dungeon-saga]
  - codeMatches: '^(MGHB|KSHB)'
    gameSystems: [hellboy]
  - nameMatches: '\bhellboy\b'
    gameSystems: [hellboy]
  - codeMatches: '^(MGSS|KSSS)'
    gameSystems: [star-saga]
  - nameMatches: '\bstar\s*saga\b'
    gameSystems: [star-saga]
  - codeMatches: '^MGOD'
    gameSystems: [overdrive]
  - nameMatches: '\boverdrive\b'
    gameSystems: [overdrive]

  # WARPATH IS A REAL, DISTINCT, RETIRED GAME, and the slug is minted here rather than folded.
  # Mantic's own history says Warpath was its 28mm mass-battle sci-fi game through three editions
  # and that "Firefight took over from Warpath at 28mm scale" in 2022. `legacy-catalog` had no word
  # for it and filed its products under `deadzone` and `firefight` -- which is not simply wrong,
  # because the MODELS are shared across all three and 50 of the 89 already publish
  # `[deadzone, firefight]` correctly. What is wrong is the omission, and it is sharpest on the
  # ten products that belong to Warpath ALONE: `Warpath: 2nd Edition Rulebook CLASSIC`,
  # `Warpath: First Strike (Novel)`, `Warpath Plastic Counter Set`, `Warpath Command Dice`,
  # `Warpath Objective Cards`, `Warpath: Operation Heracles Battle Set`.
  #
  # IT CLAIMS THE SYSTEM BLOCK ONLY -- `MGWPM*` -- AND NOT THE MODELS, which is the whole care
  # required here. Warpath's rulebook, novel, counter set, command dice, objective cards and
  # battle set belong to Warpath and nothing else. Its FACTION blocks are the shared sci-fi range,
  # and 50 of those 89 products already correctly publish `[deadzone, firefight]`; a clause
  # proposing `[warpath]` for them is not a superset of what they already say, so it would report
  # 14 disagreements and change nothing.
  #
  # WHETHER THOSE MODELS ARE ALSO WARPATH PRODUCTS IS A REAL QUESTION AND IT IS LEFT OPEN. Mantic
  # says the range is shared across the Warpath universe, which argues for
  # `[deadzone, firefight, warpath]` on all 89 -- but that would assert a third membership for
  # every model on the strength of a marketing sentence, including for products legacy files
  # under one game alone. The evidence that settled Deadzone/Firefight was a per-shelf purity
  # measurement against an independent control, and no such measurement exists for Warpath
  # because no source shelves it. Recorded here rather than guessed.
  # "WARPATH" NAMES BOTH THE GAME AND THE UNIVERSE, which is the same polysemy that made the bare
  # `bolt-action` tag unusable for Warlord -- and on a list-valued field a polysemous token does
  # not dilute an answer, it invents a membership. `Warpath: Firefight Rulebook` is a FIREFIGHT
  # book; `Warpath Universe` covers Deadzone, Firefight and Epic Warpath alike. Both lookarounds
  # are load-bearing: the lookbehind keeps Epic Warpath out (a different game at a different
  # scale, not an edition), the lookahead keeps the universe compounds out. 15 false
  # disagreements before the guard, and every one of them a product of another Warpath game.
  - codeMatches: '^MGWPM(?!103)'
    gameSystems: [warpath]
    note: MGWPM103 is the Warpath FIREFIGHT rulebook, as the header says; the other 9 of the block are Warpath's own
  - nameMatches: '(?<!epic[ -])\bwarpath\b(?!\s*(?:firefight|deadzone|universe))'
    gameSystems: [warpath]

  # VANGUARD IS DELIBERATELY NOT MINTED, and the arithmetic is the argument. Mantic calls it "the
  # sister game to Kings of War"; it has its own rulebook but "uses the existing Kings of War
  # miniature range", and its releases feed back into Kings of War through Clash of Kings. There
  # is no Vanguard shelf in `mfr-manticgames` at all, so the only signals are the code and the
  # name -- and 79 of its 80 products ALREADY publish `kings-of-war`. A `vanguard` slug would
  # decide exactly ONE currently-undecided product, and `kings-of-war` on a Vanguard warband box
  # is true rather than a lie. Same arithmetic refused `first-blood` for Para Bellum.

  # ===========================================================================================
  # WHAT THE THING IS, BY NAME -- because for Mantic the code cannot say and the store's shelves
  # will not. `mfr-manticgames` emits 197 WooCommerce category slugs over 2,826 rows, and they are
  # game and FACTION slugs: `basilean`, `firefight-enforcers`, `xirkaali`, `walking-dead-
  # collections`. A faction contains a rulebook, a dice pack and a regiment alike, so those slugs
  # answer WHICH GAME (which `mfr-manticgames.yaml` already reads them for) and not what the thing
  # is. Measured over the 705 products still undecided: the largest slug reaching any of them is
  # `kings-of-war` with 73, at 62.5% purity.
  #
  # THE CODE CANNOT SAY EITHER, and that was measured before this was written. Mantic's own
  # numbering does carry a product-kind digit block inside a prefix family -- `MGKW*` 1xx army
  # boxes, 2xx heroes, 3xx regiments, 4xx large models, 5xx bundles -- but it does not survive
  # contact with the web-exclusive line: `MGWEKW 1xx` holds `Kings of War Third Edition: Gamers
  # Bundle` and `Limited Edition 10th Anniversary Dice` next to the single resin characters, and
  # the whole `MGWE*` block grades 40-60% against independent evidence. 93 products carry the
  # literal string `BUNDLE` as their sku, which is WooCommerce's placeholder for a bundle product
  # and not an identifier at all.
  #
  # SO THE NAME IS WHAT IS LEFT, and Mantic writes very consistent ones. THE CONTROL IS RETAILER
  # SHELVES AND legacy-catalog's NON-FILL CLAIMS ONLY -- 325 Mantic products -- never
  # `mfr-manticgames.yaml`'s own output, which is the table these clauses sit beside.

  # SCENERY FIRST, because it is the one word that defeats the unit-name clause below: `The
  # Walking Dead Scenery Booster` and `Battlezones - Connector Booster Pack - Terrain Crate` are
  # the only two products in the control that clause gets wrong, and both say so in their names.
  - nameMatches: '\b(scenery|terrain ?crate|terraincrate|battlezones)\b'
    category: terrain
    note: 0 undecided of its own; control 16, 100%. It runs for the veto, not the fill.

  # THINGS READ. Mantic's book vocabulary, and it does not overlap its model vocabulary at all.
  - nameMatches: '\b(rulebook|rules|sourcebook|compendium|supplement|companion|almanac|novel|fiction|journal|mission book|gm screen|scenario book|hardback|softcover)\b'
    category: book
    note: 16 undecided; control 42, 100%

  # THINGS USED TO BUILD AND FINISH. No control exists -- nothing independent has decided any of
  # the eight -- and none is needed: `Army Painter Plastic Glue`, `Battlefields Basing Glue`,
  # `Army Painter Super Glue`, `Mantic Tape Measure`, `THE ARMY PAINTER RangeFinder Tape Measure`,
  # `Magic Super Glue Activator`, `Colour Forge Precision Glue Application Tips`, `Colour Forge
  # Super Glue Thick`. All eight names were read.
  - nameMatches: '\b(glue|brush(es)?|tape measure|clipper|hobby file|sanding|magnet)\b'
    category: hobby-auxiliary
    note: 8 undecided; no control, full name read

  # A BARE BASE IS A COMPONENT AND A MOVEMENT TRAY IS PLAYED WITH, which is the split
  # categories.yaml draws and the one Games Workshop's own d34 22 block already follows here.
  # Five base sets against eight trays, no control, all thirteen names read.
  - nameMatches: '\b(bases? set|modular plastic base|acrylic bases)\b'
    category: hobby-auxiliary
    note: 5 undecided; no control, full name read
  - nameMatches: '\bmovement tray\b'
    category: game-accessory
    note: 8 undecided; no control, full name read

  # A GAMING MAT BELONGS TO NO GAME and is not scenery -- the same call `mfr-manticgames.yaml`
  # already makes for its `neoprene-game-mats` shelf, reached here by name for the rows that shelf
  # does not carry.
  - nameMatches: '\b(battle ?mat|game ?mat|play ?mat|gaming mat|neoprene)\b'
    category: game-accessory
    note: 7 undecided; control 1

  # THE UNIT NAMES, AND THEY ARE THE BIGGEST SINGLE ANSWER IN THIS FILE. Kings of War's official
  # unit sizes are Troop, Regiment, Horde and Legion; DreadBall sells Teams and Boosters; Deadzone
  # and Firefight sell Squads, Warbands, Companies and Spearheads. Every one of those words names
  # a quantity of MODELS, and none of them appears on a Mantic book, deck or accessory -- which is
  # what the control says: 57 of 59, and both misses are the Scenery/TerrainCrate rows the veto
  # above takes first.
  - nameMatches: '\b(troop|regiment|horde|legion|booster|team|squad|warband|company|brigade|spearhead|army|battalion|starter set)\b'
    category: miniatures
    note: 163 undecided; control 59, 96.6% before the scenery clause above, 59/59 after

  # SPRUES, FRAMES AND THE MANTIC DIRECT PACKS. A sprue is a model however it is sold, and
  # `hero pack` / `command pack` / `upgrade pack` are Mantic Direct's names for single resin
  # figures and the parts that go with them.
  - nameMatches: '\b(sprue|frame|command pack|hero pack|upgrade pack)\b'
    category: miniatures
    note: 54 undecided; control 2

  # HOW IT IS PACKAGED. `packaging` is additive-only, so this fills a form the record does not have
  # and contradicts nothing. 93 of these products carry `BUNDLE` as their sku because that is what
  # WooCommerce writes for a bundle product; the rest say it in their own titles.
  - nameMatches: '\bbundle\b'
    packaging: bundle
    note: 145 undecided products name themselves a bundle

  # WHAT THIS TABLE CANNOT REACH, so the next person does not re-run the search. The name clauses
  # above took the residue from 705 products to 459; the blocks below are what is left, and each
  # figure is the population, not the remainder.
  #
  #   THE CODE BLOCKS WERE RE-TESTED 2026-09-01 AND STILL DO NOT ANSWER IT, now against a control
  #   built only from retailer shelves and legacy's non-fill claims (325 Mantic products).
  #   `MGWE<game>` + a digit block -- the shape Mantic's own Direct line documents, 1xx single
  #   resin figures and 5xx bundles -- reaches 103 undecided and grades 0 of 3: `MGWEAR001` is an
  #   MDF ship card tray and `MGWEAR501` a launch bundle, both inside the supposed model block.
  #   `MGWD1xx` grades 3 of 5. `MGC*` (2nd-edition codes, 23 products) and `MGDS\d\d` (Dungeon
  #   Saga boxed games, 18) have a control of ZERO and are left alone rather than filled on a
  #   reading of the prefix alone.
  #
  #   `BUNDLE` (93) -- the sku is literally the string BUNDLE, and the contents are genuinely
  #   heterogeneous: `Epic Warpath XL Terrain Bundle`, `The Raging Void & 4th Edition Rulebook
  #   Bundle`, `Undead Ghouls Horde`. Nothing in the row narrows it.
  #
  #   `MGWD` (82) -- The Walking Dead has NO sub-scheme. Terrain at 010-023, minis at 0201-0205,
  #   books at 027/029/175, card decks at 173/203/206, paint at 204/210, all interleaved.
  #
  #   `MGWE` (~170) -- Mantic Direct. A fifth are `... Bundle` and the bundles split across
  #   categories (`MGWEKW110` is books, `MGWEDZ501` terrain).
  #
  #   `MG<game>M` (~60) -- the system blocks this table vetoes. That is the residue by
  #   construction, and it is the right residue: a shelf holding a rulebook, a dice set, a
  #   movement tray and a gaming mat cannot be one category.
  #
  #   `MGTC`/`KSTC` TerrainCrate -- 140 of 180 terrain, 17 miniatures, 15 game-accessory. NOT a
  #   blanket terrain block, and only 6 fills were available anyway.
