manufacturer: corvus-belli
reason: >-
  CORVUS BELLI RANGES ITS CODES BY GAME. Infinity is the 28xxxx block plus the `GGB`/`BAI`/`WHP`
  supplement prefixes; Warcrow is `WW`/`PW`/`WCA`; Aristeia! is `CBARI`/`ARI<digit>`. Measured
  2026-08-31 against every Corvus Belli product whose gameSystem is stated independently of the
  code: 285 of 286 standalone, and 286 of 286 once the Aristeia clause below runs first.


  ARISTEIA IS FIRST BECAUSE THE RETAILERS GET IT WRONG. GameNerdz shelves nine Aristeia! products
  under its `Miniatures/Infinity` breadcrumb -- they are a different game -- and `285054` "30mm
  Bases" is an Aristeia item sitting inside the Infinity 28xxxx code range. Clause order is what
  fixes both, which is why no retailer breadcrumb table is added for this manufacturer: a table
  keyed on `Infinity` would fire on those nine before this one could correct them, and would score
  100% while doing it, because the products it damages are the ones with nothing to grade against.


  A NAME CONTAINING "ARISTEIA" IS NOT AN ARISTEIA PRODUCT. `280721 Miyamoto Mushashi Aristeia!
  outfit`, `280724 Major Lunah, Ex-Aristeia! Sniper` and `280770 Fiddler, Aristeia!'s ex-toymaker`
  are Infinity miniatures with Aristeia-flavoured names, and the catalog says so. That is why this
  table matches on the CODE and never on the name.


  Warcrow's 132 products are the whole reason the `WW`/`PW`/`WCA` clause exists: every one of them
  is currently unclassified, so no other signal in the corpus reaches them at all.

clauses:
  # --- WHAT THE THING IS, from the same code blocks -------------------------------------------
  # Corvus Belli's numbering answers the category question in four places, and its own source
  # publishes NO category hint at all -- `mfr-corvus-belli` emits `gameSystem` and `faction` and
  # nothing else -- so these clauses reach products no source table can. Each is a full name-read
  # of the block rather than a purity figure: nothing in the catalog independently states
  # `terrain`, `hobby-auxiliary` or `game-accessory` for a Corvus Belli product.
  - codeMatches: '^H00\d'
    category: terrain
    note: >-
      12 products, all prepainted scenery -- Precinct Sigma Building Holoads / Containers /
      Cubicle / Newsstands / Objective Room / Sentry Towers, District 5 Catwalk
  - codeMatches: '^GGB-'
    category: hobby-auxiliary
    role: basing
    note: >-
      9 scenic base sets -- `Dunes of Bourak (Round 25mm x8)`, `Nomad Crew Deck (Round 40mm x4)`.
      categories.yaml: "Bases sold on their own are `hobby-auxiliary`, not `miniatures`"
  - codeMatches: '^BAI\d'
    category: game-accessory
    note: 8 Command Consoles -- army-list reference dashboards, played with rather than read
  - codeMatches: '^2?286\d{3}'
    category: game-accessory
    note: 3 card decks -- Classified Objectives, Operations

  # THE 285xxx BLOCK IS NOT HERE, and the reason is a contradiction in the catalog rather than a
  # gap in the code. It is entirely scenery and bases, but it splits across two categories --
  # `2850(5[7-9]|6[0-2]|6[7-9]|8[6-7])` are Scenery Packs and `28505[1-4]` / `28506[4-6]` are
  # bases -- and the catalog already disagrees with itself inside it: `285071-285090 <n>mm Scenery
  # Bases, <Greek> Series` publish `terrain` while the identical `285091-285093 ... Zeta Series`
  # publish `hobby-auxiliary`. The same split repeats in Warcrow's `WW2000x` block. That wants a
  # human adjudication of the boundary, not a rule that picks a side quietly.
  #
  # `28[89]xxx` LOOKS like the book block (`Human Sphere N3`, `Third Offensive (Hardcover)`,
  # `N4 Core Rules`) and is contaminated 6-to-4 by `288100 INFINITY AFTERMATH: Limited Edition`
  # and `288303 Infinity: Endsong`. A name pattern would be the safer form if it is wanted.

  # THE BIG BLOCKS, which this file mapped around rather than through. `28[012]xxx` is the whole
  # Infinity model range and `WW0[1-6]` the whole Warcrow one -- between them 376 of the 480
  # undecided products, reached by nothing else: 456 of those are `ret-gamenerdz`-only and 280 of
  # them carry no taxonomy hint whatsoever. `mfr-corvus-belli` emits `gameSystem` and `faction`
  # and no category at all.
  #
  # THE NAME CLAUSES ABOVE MUST RUN FIRST, and the measurement says why: the `28[012]` block grades
  # 396/403 against ret-goblingaming's productType, and ALL SEVEN exceptions are the six
  # `... Paint Set w/ Exclusive Miniature` products and `280045 ITS Objectives Pack Alpha`. Taken
  # after them it is 396 of 396. A full name read of the 337 fills flagged one: `280547 Nomads
  # Reverend Custodiers (Hacker, Combi Rifle + Marker)`, where "Marker" is a weapon loadout.
  - nameMatches: '\bPaint Set\b'
    category: paint-set
    packaging: set
    note: 5 fills; 6/6
  - nameMatches: '\bObjectives? Pack\b'
    category: game-accessory
    note: 1/1 -- runs ahead of the model block, which it sits inside
  - codeMatches: '^28[012]\d{3}$'
    category: miniatures
    note: 337 fills; 396/396 once the two clauses above have run
  - codeMatches: '^WW0[1-6]'
    category: miniatures
    note: 39 fills; 66/66
  - codeMatches: '^P[VW]\d'
    category: miniatures
    note: >-
      22 fills; 4/4. The pre-order and exclusive-miniature block -- `PV` Infinity, `PW` Warcrow,
      every name an `... Exclusive Edition` or a character.
  - codeMatches: '^WHP-'
    category: book
    note: >-
      5 fills, no control. The Infinity novels -- `Airaghardt`, `By Fire and Sword`, `Downfall`,
      `Team Zed: Shell Game`, `Death Song`. Their existing `infinity` gameSystem clause is right:
      each novel has one setting, and it is Infinity's.

  # --- WHICH GAME ------------------------------------------------------------------------------
  # Aristeia! first -- it shares the Infinity code block and the Infinity retailer shelf.
  - codeMatches: '^(CBARI|ARI\d)'
    gameSystems: [aristeia]
  - codeMatches: '^285054$'
    gameSystems: [aristeia]
  - codeMatches: '^(WW|PW|WCA)'
    gameSystems: [warcrow]
  - codeMatches: '^28\d{4}'
    gameSystems: [infinity]
  - codeMatches: '^(GGB|BAI|WHP)'
    gameSystems: [infinity]
