manufacturer: north-star-military-figures
reason: >-
  NORTH STAR MAKES THE PLASTICS AND METALS FOR THREE OSPREY GAMES TITLES, and numbers each range
  for itself: `FGV`/`FGVP`/`FGX` Frostgrave, `OAKP` Oathmark, `SGVP` Stargrave. All 96 of its
  products here come off Warlord's webstore, which resells them.


  OSPREY IS NOT THE MANUFACTURER AND `BP` IS WHERE THAT SHOWS. Osprey publishes the rulebooks and
  North Star makes the figures; the two `BP17xx` rows are books carrying real Bloomsbury ISBNs
  (`9781472833044`, `9781472834683`) and they are already `book`, so the model clause below is
  written to leave them alone rather than to reach them.
clauses:
  - codeMatches: '^(FGVP?|FGX|OAKP|SGVP)\d+$'
    category: miniatures
    note: 10 undecided; control 77, 100%

  # WHICH GAME: the range prefix IS the game, and each game has its own setting in the taxonomy.
  # `FGV`/`FGVP`/`FGX` and the `FGAP` pre-painted sets are Frostgrave, `OAKP` is Oathmark, `SGVP`
  # is Stargrave. The two `BP` rows are Osprey rulebooks and are placed by name; every Stargrave
  # product carries its code, so no name clause is needed for it.
  - codeMatches: '^(FGVP?|FGX|FGAP)\d+$'
    gameSystems: [frostgrave]
  - codeMatches: '^OAKP\d+$'
    gameSystems: [oathmark]
  - codeMatches: '^SGVP\d+$'
    gameSystems: [stargrave]
  - nameMatches: '\bfrostgrave\b'
    gameSystems: [frostgrave]
  - nameMatches: '\boathmark\b'
    gameSystems: [oathmark]
