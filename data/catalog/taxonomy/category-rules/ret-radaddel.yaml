  # MIDDLE-EARTH IS THE ONE REAL GAME-SYSTEM OPPORTUNITY HERE: 126 products carry no system at all.
  # The apparent impurity is the GRADING SET, not the tag -- `Knights of Dol-Amroth (LOTR - Good)`
  # is currently labelled `blood-bowl` and `Rangers of Middle-Earth (LOTR - Good)` `necromunda`,
  # both `gameSystemBasis: code`, i.e. the GW code table mis-segmenting a Middle-earth product
  # code. The radaddel tag is right in every one of those disagreements. It cannot fix them -- a
  # rule only fills a hole -- so they will be REPORTED, which is what a maintainer needs to correct
  # the code table.
  - gameSystems: [middle-earth]
    hintContainsAny:
      tags: ['Middle-Earth - Good', 'Middle-Earth - Evil', 'Middle-Earth - Gelände',
