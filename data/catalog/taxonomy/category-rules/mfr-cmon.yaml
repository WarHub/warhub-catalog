  # --- miniatures lines -------------------------------------------------------------------------
  # A Song of Ice and Fire is CMON's one miniatures game with a taxonomy slug, and this shelf is
  # the largest single decision available anywhere in the residue: 165 products, every one a
  # Faction Pack, Attachment or unit box. The gameSystem is corroborated independently -- 137 of
  # 137 against products another source classified -- and the category rests on the same name-read
  # as the board games, over all 165. NOTE THE EN-DASH in the Tactics line; it is not a hyphen.
  - category: miniatures
    gameSystems: [asoiaf]
    hintEquals: {productLine: 'A Song of Ice & Fire: TMG'}
    note: 165 products; gameSystem 137/137 against independent evidence
  - category: miniatures
    gameSystems: [asoiaf]
    hintEquals: {productLine: 'A Song of Ice and Fire: Tactics – A Tabletop Skirmish Game'}
    note: 5 products; en-dash, not a hyphen
  - category: miniatures
    hintEquals: {productLine: 'Dark Age'}
    note: 9 warband boxes
  - category: miniatures
    hintEquals: {productLine: 'Wrath of Kings'}
    note: 6 starter boxes -- Goritsi, Hadross, Nasier

  # --- books ------------------------------------------------------------------------------------
  # `Broken Compass` is an RPG line: `Adventure Journal`, `Golden Age - Season 1`. One of its six
  # rows is a `Narrator Accessory Kit`, which is the known residue.
  - category: book
    hintEquals: {productLine: 'Broken Compass'}
    note: 6 rows, 5 of them books
  - category: book
    hintEquals: {productLine: "Assassin’s Creed Roleplaying Game"}
    note: the curly apostrophe is CMON's own; with a straight one the clause matched nothing (2026-09-02)
    note: >-
      1 row, the Animus Handbook core rules. The apostrophe in the productLine value is U+2019,
      not an ASCII quote

  # NO gameSystem CLAUSES BEYOND ASOIAF, and the reason is a taxonomy gap rather than a data one.
  # 22 of CMON's 24 product lines name a game `game-systems.yaml` has no word for -- Zombicide,
  # Marvel United, Massive Darkness, Bloodborne, Munchkin Dungeon, Trudvang Legends, Twilight
  # Imperium, Wrath of Kings, Dark Age and the rest. Minting 22 slugs is a taxonomy decision with
  # its own review; deciding their CATEGORY does not require it, which is why this file answers one
  # question and not the other.
