source: mfr-cmon
reason: >-
  EVERY ONE OF CMON'S 387 PRODUCTS IS UNDECIDED, and its `productLine` hint decides most of them.
  24 distinct values over 264 of 320 rows, and it is the cleanest small taxonomy in the catalog:
  each value is a game TITLE, and every row under it is that title's base game or a named
  expansion of it.


  IT WAS INVISIBLE. `mfr-cmon` appears nowhere in `data/review/categorize.yaml`'s `unmapped`
  worklist despite being 387-for-387 undecided, because `productLine` was not in
  `categorize/stage.py::TAXONOMY_HINTS` -- the same omission that hid `tradeCategory` until
  2026-08-25 and made the largest block of undecided products look like a source with nothing to
  offer.


  THERE IS NO CONTROL FOR `board-game`. Nothing in the catalog states that category for any
  product, so these clauses cannot be graded the way a paint clause can. What stands behind them
  is a read of all 72 names -- `Munchkin Dungeon: Cthulhu`, `Bloodborne: The Board Game - Chalice
  Dungeon`, `Marvel Zombies: Clash of the Sinister Six` -- against the boundary categories.yaml
  draws in as many words: "A standalone title that happens to contain miniatures is `board-game`."
  That is the same standing the lexicon's own entries have, and it is stated here rather than
  implied.


  THE 56 ROWS WITH NO `productLine` ARE NOT REACHABLE and are left alone: `Dune: War for Arrakis`,
  `God of War: The Board Game`, `Ethnos`, `XenoShyft`, `Stranger Things: Upside Down`. Almost all
  are board games, but there is no pattern to match -- only 56 individual titles, which is a
  name-lexicon question rather than a taxonomy one.

