manufacturer: games-workshop
reason: >-
  GAMES WORKSHOP NUMBERS ITS ENTIRE RANGE, and the number says which game a product belongs to.
  An 11-digit GW code is `d12 d34 d56 d78 serial`: d12 is the language/regional pack (60 English,
  01 French, 15 Chinese, 99 language-neutral), d34 is the product type (12 plastic kit, 03 codex,
  10 Black Library paperback, 18 paint pot, 24 White Dwarf, 85/86 Forge World), d56 is the GAME
  SYSTEM and d78 is the FACTION. Decoded and measured 2026-08-31 over the committed catalog.


  d56 alone predicts gameSystem at 95.2% over 4,076 independently-classified products, against
  44.2% for d34 and 53.6% for d78 -- so the signal is specifically there and not a coincidence of
  correlated digits. The clauses below take it from 95.2% to 99.89% by naming the four families
  that account for every disagreement, and the veto block is where three of them live.


  WHY THIS TABLE IS ALLOWED TO EXIST AT ALL: none of it is inference about what GW meant. The
  segments are GW's own filing, recovered from GW's own identifiers, and every mapping below is
  checked against products whose gameSystem was stated INDEPENDENTLY of the code -- by
  legacy-catalog or the Algolia store feed. LLM-labelled products were excluded from that
  measurement entirely; 1,195 GW products carry a Haiku label and grading a code rule against a
  guess would prove nothing.


  SIX SEGMENTS BECAME REAL SLUGS. Necromunda (05), Warhammer Underworlds (07), Blood Bowl (09),
  Aeronautica Imperialis (18), Legions Imperialis (26) and Adeptus Titanicus (03) were all filed
  as `other-games` before, because the taxonomy had no word for them -- the catalog was less
  specific than the manufacturer. See taxonomy/game-systems.yaml.

# Vetoes first, and each names the AXIS it silences. Every one of these is a family where the
# code cannot settle WHICH GAME, and a rule that answered anyway would be confidently wrong rather
# than silent -- but the same products' CATEGORY is not in doubt at all, and until `blocks` existed
# these vetoes were suppressing that answer too, for 1,635 products.
#
# THEY ARE ABOUT UNCERTAINTY, NOT ABOUT DUAL MEMBERSHIP, and the difference decides whether a list
# is the fix. Earlier notes here read as though these classes were products belonging to two games
# at once, which `gameSystems` could now express. MEASURED 2026-09-01 against independently-stated
# systems, they are not: they are HETEROGENEOUS classes, each product belonging to exactly one game
# the code does not name. Forge World's 670 split horus-heresy 331 / other-games 169 /
# middle-earth 76 / warhammer-40k 47 / the-old-world 46 / age-of-sigmar 1 -- it is a production
# line that makes kits for every GW game, not a game. Writing two slugs into the list for these
# would assert a membership no source claims.
noneOf:
  # FORGE WORLD is a production line, not a game: d34 85/86 spans six systems (counts above).
  # Vetoing the GAME costs nothing -- all 670 already carry one, so no coverage is lost and 21
  # errors go -- while the category is 99.8% `miniatures` on 410 independently-graded products.
  - codeMatches: '^\d{2}8[56]'
    blocks: [gameSystems]
    note: Forge World spans six systems; the code says which line, not which game

  # BLACK LIBRARY: d78 81 is a novel, and d56 then carries the SETTING of the fiction rather than a
  # game the product belongs to. 430 of them sit under d56 01, where the split between Warhammer
  # 40,000 and Horus Heresy is the book's period and no field encodes it -- measured 86.3%, which
  # is not deterministic. The ones whose segment is unambiguous are recovered by a clause below.
  - codeMatches: '^\d{6}81'
    blocks: [gameSystems]
    note: Black Library, setting is not the game

  # SEGMENTS WHERE THE STATED EVIDENCE ITSELF SPLITS (Custodes, Knights, Titans, Chaos). These
  # are the same shape as Forge World and not dual membership either: `3008/3043` grades
  # horus-heresy 56 / warhammer-40k 21, `0108/0117` grades warhammer-40k 105 / horus-heresy 5 /
  # other-games 3. Refusing 266 products removes the last 17 disagreements and is what takes the
  # ladder to 99.89%.
  - codeMatches: '^\d{4}30(08|43)'
    blocks: [gameSystems]
    note: mixed Horus Heresy / Warhammer 40,000 segment, 56 vs 21
  - codeMatches: '^\d{4}01(08|17)'
    blocks: [gameSystems]
    note: mixed Warhammer 40,000 / Horus Heresy segment, 105 vs 5
  - codeMatches: '^\d{2}12(01)99'
    blocks: [gameSystems]
    note: 40k plastic kits with a generic faction segment
  - codeMatches: '^\d{2}1202(01|07|13)'
    blocks: [gameSystems]
    note: Age of Sigmar plastic kits also sold into Warcry / Old World

clauses:
  # =============================================================================================
  # WHAT THE THING IS. d34 -- digits 3-4 -- is GW's PRODUCT TYPE, and it answers the category
  # question as cleanly as d56 answers the game one. Measured 2026-09-01 against a control built
  # from two sources that never see this code: `ret-goblingaming`'s productType shelf through its
  # own committed table (the repo's only pure format taxonomy) and `mfr-gw-algolia`'s facet tree
  # (`> Unit Type` / `> Force Organisation` -> miniatures, `> Game Rules` -> book, and so on).
  # The two controls were checked against EACH OTHER first: 1,647 of 1,668 agree, 98.7%.
  #
  # `ret-gamenerdz` IS EXCLUDED FROM THE CONTROL, and the exclusion is load-bearing. Its one
  # surviving clause maps a department called `Paint and Crafting`, which holds brushes, tools,
  # bases and painting handles alongside paint. Including it drops `d34=19 -> hobby-auxiliary`
  # from 100% to 54% purely because that store calls a drybrush a paint.
  #
  # EVERY CLAUSE HERE IS ANCHORED TO ELEVEN DIGITS. `codeMatches` is an unanchored `re.search`,
  # and 569 of the 9,262 GW codes are not GW codes at all -- 374 six-digit house numbers from a
  # German retailer import, 54 thirteen-digit barcodes, and a tail. Without `\d{7}$` a clause on
  # `^\d{2}05` would stamp `game-accessory` on `122353 Dark Angels: Datacards 9. Edition`.
  #
  # WHY THE CODE BEATS THE NAME LEXICON HERE, and it is not a preference. The 2,667 products
  # mfr-gw-trade is the sole source for are overwhelmingly not in English:
  # `CARTES TECHNIQUES:`, `DATENBLATTKARTEN:`, `TOME DE BATAILLE:`, `SCHRIFTROLLENKARTEN:`,
  # `TARJETAS DATOS:`. The lexicon's patterns are English by construction; a digit pair is not.

  # NARROWEST FIRST. Bare bases sit inside the character and plastic-kit segments, and
  # categories.yaml is explicit that a base sold on its own is a component, not a model.
  - nameMatches: '\b(BASES?|STEMS?)\b.*\b(SET|PACK|\d+\s?MM)\b|\b\d+\s?MM\b.*\bBASES?\b'
    category: hobby-auxiliary
    note: 13 products; control 46, 97.8%

  # THINGS PLAYED WITH. d34 05 is the card product type -- `DATACARDS:`, `INDEX CARDS:`,
  # `WARSCROLL CARDS:`, `PACK DE FACTION:`. 99.0% over a control of 102; both disagreements are
  # the control's, a datacard deck one store shelved `board-game` and a warscroll deck another
  # shelved `miniatures`.
  - codeMatches: '^\d{2}05\d{7}$'
    category: game-accessory
    note: 560 products; control 102, 99.0%

  # d34 22 is dice, tokens, movement trays and objective markers -- EXCEPT where d56 says
  # otherwise, and the exceptions are exactly where it breaks: 99 is bases and water pots (already
  # `hobby-auxiliary` by the clause below), 03 Titan weapon sets, 09 Blood Bowl pitches, 18 and 26
  # base packs. Raw purity is 50%; with those five excluded it is 24 of 24.
  - codeMatches: '^\d{2}22(?!99|03|09|18|26)\d{7}$'
    category: game-accessory
    note: 66 products; control 24, 100%

  # THINGS READ. Three separate book types, measured separately because they are separate ranges:
  # 04 hardbacks and campaign supplements, 10 Black Library paperbacks, 03 codexes and battletomes.
  - codeMatches: '^\d{2}04\d{7}$'
    category: book
    note: 543 products; control 109, 98.2% -- both misses are Adeptus Titanicus supplements
  - codeMatches: '^\d{2}10\d{7}$'
    category: book
    note: 337 products; control 100, 99.0%
  - codeMatches: '^\d{2}03\d{7}$'
    category: book
    note: 193 products; control 54, 100%

  # THINGS USED TO BUILD AND FINISH. 51 is the transfer-sheet type (its Legion subset also decides
  # a game system, further down); 19/21/23 are brushes, glue and tools. The existing paint clauses
  # below reach these same types where d56 is 99; these two reach the rest.
  - codeMatches: '^\d{2}51\d{7}$'
    category: hobby-auxiliary
    note: 8 products; control 29, 100%
  - codeMatches: '^\d{2}(19|21|23)\d{7}$'
    category: hobby-auxiliary
    note: 4 products; control 25, 100%

  # MODELS. 85/86 is Forge World -- vetoed above for the GAME, because the line supplies six of
  # them, and 99.8% `miniatures` on a control of 410 regardless. That veto used to suppress this
  # answer too; `blocks: [gameSystems]` is what lets both be true.
  - codeMatches: '^\d{2}8[56]\d{7}$'
    category: miniatures
    note: 674 products; control 410, 99.8% -- the single miss is one terrain piece
  - codeMatches: '^\d{2}01\d{7}$'
    category: miniatures
    note: 323 army and starter boxes; control 21, 100%
  - codeMatches: '^\d{2}07\d{7}$'
    category: miniatures
    note: 118 character and upgrade kits; control 282, 100% once the BASES clause has run
  - codeMatches: '^\d{2}(06|11|80|81)\d{7}$'
    category: miniatures
    note: 167 single-model kits; control 457, 99.8%

  # NOT HERE, AND THIS IS THE ONE JUDGEMENT WORTH ARGUING WITH: d34 12, the plastic-kit type.
  # 1,165 undecided products, and the largest single block left in the catalog -- but it is 95.5%
  # `miniatures` against a control of 3,028, and BOTH independent controls agree on the residue
  # (goblingaming 4.3%, algolia 5.0%). The 122 misses are TERRAIN -- `Skull Altar`,
  # `Awakened Wyldwood`, `Skaven Gnawholes`, `Battlezone: Manufactorum` -- and they are not
  # code-separable: they spread across d56 01 and 02 and every d78. Terrain does not appear
  # anywhere in GW's product code.
  #
  # A 4.5% error rate would be the loosest claim in this repo, so the products stay undecided and
  # the handle is recorded instead: `sscCode` section 64 is GW's terrain section, 83% pure on a
  # control of 24, and would recover 39 of the 122. It cannot be written today because no clause
  # form matches a PREFIX of a hint -- `hintEquals` is exact and `hintContainsAny` is exact
  # membership. That is one clause form away, and it is the right next move on this table.

  # ---------------------------------------------------------------------------------------------
  # HOW MANY, AND ARE THEY THE SAME THING. `packaging` is additive-only, so these fill a form the
  # record does not have and never contradict a source.
  #
  # GW's trade sheets are the dense population the vocabulary predicted: 912 products name a
  # multiple in their own title, 887 of them paint. The `X1` guard is not decorative --
  # `SPACE MARINE HEROES BLISTER PACK (X1)` is a single.
  - nameMatches: '\((?!1[- ])\d{1,3}[- ]PACK\)|\bX\s?([2-9]|\d{2,3})\b'
    packaging: multipack
    note: 912 products, 875 of them a case of six identical pots

  # d34 02 is GW's WEB BUNDLE section, and it is the cleanest packaging signal in the whole code:
  # `Angel's Wrath Intervention Force Web Bundle`, `Adeptus Mechanicus Codex Collection`,
  # `2 x Imperial Knights: Renegade`. categories.yaml's test for `bundle` -- the components are
  # themselves products a shop sells alone -- holds for every name in it. The CATEGORY is
  # deliberately absent: a bundle of codexes and a bundle of kits are not the same thing, and the
  # 51 products divide between them with no signal to say which.
  - codeMatches: '^\d{2}02\d{7}$'
    packaging: bundle
    note: 51 web bundles; the only population `bundle` has beyond legacy's 19

  - nameMatches: '\b(EBOOK|EPUB|iBOOK|INTERACTIVE .{0,20}EDITION)\b|\(PDF\)'
    packaging: digital
    note: 8 products

  # =============================================================================================
  # WHICH GAME.
  # KILL TEAM has no segment of its own -- it lives inside 01 and 02 -- so it is claimed by name,
  # BEFORE the segment clauses. Until `kill-team` existed this had to be a veto, because the only
  # honest options were "call it 40k" (wrong for the ones GW files under other-games) or "skip it".
  # A slug turns 189 skipped products into decided ones. `K/T` and `WHU`-style contractions are
  # GW's own abbreviations on trade rows.
  - nameMatches: '\bKILL[ -]?TEAM\b|\bKILLZONE\b|\bK/T\b|\bK/TEAM\b'
    gameSystems: [kill-team]

  # A LEGION TRANSFER SHEET is Horus Heresy even though it sits in the 40k segment: d34 51 is the
  # transfer-sheet product type and the Legion sheets are period-specific.
  - codeMatches: '^\d{2}5101'
    gameSystems: [horus-heresy]

  # d56 == 99 IS NOT A GAME SEGMENT. It is what GW uses for things that belong to no game: paints
  # (d34 18), paint sets (17), brushes (19), sprays (20), glue (21), bases and dice (22), tools and
  # cases (23). Measured: 1,193 products, 1,149 of them unclassified. The 44 that carried a value
  # were all LLM guesses and all wrong -- `CONTRAST: ASURMEN BLUE` had even acquired the faction
  # `aeldari` from the colour's name. These decide a CATEGORY and deliberately no game system.
  - codeMatches: '^\d{2}(17|18)99'
    category: paint
  - codeMatches: '^\d{2}2099'
    category: paint
  - codeMatches: '^\d{2}(19|21|22|23)99'
    category: hobby-auxiliary
  # WHITE DWARF is a magazine, in every segment. 131 products, every name `WHITE DWARF <n> (...)`.
  - codeMatches: '^\d{2}24'
    category: book

  # The segments themselves. Every one of these is 100% pure against independently-stated evidence
  # once the vetoes above have run; the two that are not (01 at 92.4% and 30 at 94.0% raw) are
  # carried there by the veto block rather than by a lower bar.
  - codeMatches: '^\d{4}01'
    gameSystems: [warhammer-40k]
  - codeMatches: '^\d{4}02'
    gameSystems: [age-of-sigmar]
  - codeMatches: '^\d{4}03'
    gameSystems: [adeptus-titanicus]
  - codeMatches: '^\d{4}05'
    gameSystems: [necromunda]
  - codeMatches: '^\d{4}07'
    gameSystems: [warhammer-underworlds]
  - codeMatches: '^\d{4}09'
    gameSystems: [blood-bowl]
  - codeMatches: '^\d{4}14'
    gameSystems: [middle-earth]
  - codeMatches: '^\d{4}18'
    gameSystems: [aeronautica-imperialis]
  - codeMatches: '^\d{4}26'
    gameSystems: [legions-imperialis]
  - codeMatches: '^\d{4}27'
    gameSystems: [the-old-world]
  - codeMatches: '^\d{4}30'
    gameSystems: [horus-heresy]
