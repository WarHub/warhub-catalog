    hintEquals: {productType: Through the Breach Miniatures}
  - category: miniatures
    hintEquals: {productType: Vagrantsong Miniatures}
  - category: miniatures
    packaging: set
    hintEquals: {productType: Malifaux Core Box}
  - category: miniatures
