source: mfr-wyrd-store
reason: >-
  wyrd-games.net files 618 observations under 62 `product_type` values, and unusually its values
  are game line AND format at once -- "Malifaux Miniatures", "The Other Side Fate Deck",
  "Vagrantsong Apparel". The format half is what is read here; the game-line half already has a
  home in data/catalog/mappings/mfr-wyrd-store.yaml. Because the two are fused, every clause is an
  exact value and the table is long rather than clever: 47 of the 62 values, covering 604 of the
  618 rows. Counts from data/evidence/products/mfr-wyrd-store/observations.jsonl on 2026-08-25.


  IT IS THE ONLY SOURCE THAT EXERCISES `merch`, and that is what makes it worth mapping in full
  despite its size. Wyrd sells apparel, patches, keychains, plush toys, posters, jigsaw puzzles
  and colouring books beside its miniatures; under the old fallback every one of them published as
  `miniatures`. A vocabulary value with no source behind it is a value nobody can check.


  A BOX OF MINIATURES IS `miniatures`, WHATEVER WYRD CALLS THE BOX. "Malifaux Core Box", "Keyword
  Box", "Iconic Box", "Versatile Box", "Faction Pack", "Starter Box", "Unit Box", "Character Box",
  "Titan Box", "Allegiance Box" are all crews of models; `packaging` is where the box-ness belongs
  and categories.yaml says so explicitly ("a model kit stays `miniatures` however many models are
  in the box -- count and form are the `packaging` axis, not this one"). They are mapped to
  (miniatures, set), which is the one packaging inference this file makes and it makes it only
  where the value literally contains the word.


  UNMAPPED: "Product" and "Wargame" say nothing; "Vagrantsong Iconic", "Malifaux Rotten Harvest
  Limited Edition" and "Vagrantsong Expansion" name an edition rather than a thing; "Gift Card"
  is neither a good nor an event.

clauses:
  # --- miniatures, loose and boxed ---------------------------------------------------------------
  - category: miniatures
    hintEquals: {productType: Malifaux Miniatures}
  - category: miniatures
    hintEquals: {productType: Malifaux Classics}
