# WHAT A PRODUCT IS, on three independent axes.
#
# Until this file existed neither axis was declared anywhere. `models/catalog.py` typed both
# `category` and `packaging` as bare `str | None`, nothing validated either, and the values in use
# had been minted ad hoc by five unrelated mechanisms -- the legacy .NET import, three source
# mapping files, gw-trade's `Range` column, reaper's page kind, and `resolve/crossover.py`'s
# per-clause stamps. The same shelf of goods consequently got three different answers: GW's varnish
# publishes `paint` (its source says so), AK's thinner publishes `hobby-auxiliary` (a crossover
# clause says so), and Vallejo's varnish publishes `miniatures` (nothing said anything).
#
# THE AXES ARE INDEPENDENT AND THE FIRST TWO ARE ALWAYS ANSWERABLE. `category` is WHAT THE THING
# IS; `packaging` is WHAT FORM IT COMES IN; `role` (axis 3, below) is WHAT A HOBBY SUPPLY IS FOR,
# and is answerable only for the two categories that are hobby supplies. A boxed set of miniatures
# is (miniatures, set); a 6-pot case of one paint is (paint, multipack, colour); a pot of varnish
# is (paint, single, varnish); a PDF rulebook is (book, digital). Collapsing axes -- which is what
# a single `category` carrying `paint-set` does -- forces a choice between saying what a thing is
# and saying how many of it you get, and `paint-set` is the scar from having made that choice once
# already. It stays published (see `paint-set` below); it is not repeated. `role` exists because
# the same collapse had happened a second time, quietly: until 2026-09-02 `paint` meant "deposits
# colour", so a varnish had to be `hobby-auxiliary` for no better reason than not being a colour.
#
# NOTHING IN THIS FILE RE-VALUES ANY RECORD ON ITS OWN. It declares the vocabulary and gives every
# value a boundary a human can apply. `status: current` values may be written by anything;
# `status: legacy` values are ones the catalog already contains, recorded here so validation
# accepts today's data unchanged, each carrying the `mapsTo` that a later phase will migrate it by
# -- with its own measurement and its own PR. Declaring and migrating in one step would hide a data
# change inside a documentation change.
#
# Populations below are measured on `origin/catalog/acquisition` (fc3ff62), 2026-08-21, over 30,747
# products. "lexicon" figures are first-match counts from a deliberately crude name regex and are
# ORDERS OF MAGNITUDE, not classifications -- they exist to show a value has a real population
# behind it, not to classify anything. Nothing reads them.

schemaVersion: 1

# ---------------------------------------------------------------------------------------------
# AXIS 1 -- `category`: what the thing IS.
#
# One flat axis, closed vocabulary, exactly one value per product. Flat because the consumer-facing
# question ("is this a model, a book, or a pot of paint?") is flat, and because game-systems and
# factions -- the two taxonomies this repo already publishes -- are flat for the same reason.
#
# The six values already in the published catalog are FROZEN in spelling. A published field is a
# consumer contract (docs/OBJECTIVES.md 3): renaming `paint-set` to fix the axis confusion above
# would silently drop every consumer filtering on it. The vocabulary grows; it does not churn.
categories:
  - slug: miniatures
    label: Miniatures
    status: current
    definition: >-
      Models and the sprues, bodies, upgrade frames and bases sold as models. The catalog's bulk.
      A model kit stays `miniatures` however many models are in the box -- count and form are the
      `packaging` axis, not this one.
    boundary: >-
      Bases sold on their own are `hobby-auxiliary`, not `miniatures`: a blank base is a component
      of the hobby, not a model. Bases included IN a kit are simply part of that kit.
    measured: >-
      28,793 published today -- but see `categoryBasis`, only 1,954 of the whole catalog's
      categories rest on evidence at all.

  - slug: paint
    label: Paint
    status: current
    definition: >-
      Anything a maker's paint chart lists: a pot, bottle, dropper, jar, can or aerosol sold inside
      a painting range, whether or not it deposits colour. One product per record; `role` (axis 3)
      says what each is FOR -- colour, primer, varnish, medium, cleaner, texture or pigment.
    boundary: >-
      THE RANGE IS THE TEST, NOT THE COLOUR. Until 2026-09-02 this entry read "colour is the test"
      and filed every colourless medium, varnish, thinner and cleaner under `hobby-auxiliary`, and
      the catalog never agreed with itself about it: GW's Lahmian Medium published `paint` on its
      maker's word while AK's identical thinners published `hobby-auxiliary` on a crossover stamp,
      and 81 rows of data/review/categorize.yaml were the paint archive arguing with that
      boundary. The maintainer redrew it: a painting recipe lists its mediums and varnishes beside
      its colours, and the makers' own charts list them together. So a varnish, medium, thinner,
      retarder, flow improver, masking fluid, cleaner, texture paste or pigment sold within a paint
      range is `paint`, and the archive's `colourless` flag is a fact about the paint rather than a
      reason to file it elsewhere. Brushes, glue, putty and bases from the same maker are
      `hobby-auxiliary`: no chart lists them. Several different pots in one box are `paint-set`
      (below) and carry `packaging: set`; several of the same pot are (paint, multipack).
    measured: >-
      5,517 published on 2026-09-02, 1,354 of them sharing a barcode with the paint archive. The
      archive marks 146 of its 8,521 records `colourless` (102 barcoded) and 56 products sit on
      those barcodes: 29 were `hobby-auxiliary` (27 by a store's shelf, 2 by override) and 27
      `paint` (13 by a maker's word, 12 by a shelf, 2 by the barcode) -- the split this redrawing
      ends.

  - slug: paint-set
    label: Paint set
    status: current
    frozen-reason: >-
      An AXIS COLLAPSE, published and therefore permanent. This value says both "paint" and "more
      than one", which is precisely the confusion the `packaging` axis exists to end. It is kept
      spelled exactly as-is because consumers filter on it. New records that would qualify are
      still written here for consistency, and ALSO carry `packaging: set` -- so a consumer that
      wants the clean cut can take (category, packaging) and ignore this value's double duty.
    definition: >-
      A boxed assortment of DIFFERENT paints sold as one unit.
    boundary: >-
      Several pots of the SAME colour is a `multipack`, not a set -- a GW 6-pack of one Citadel
      colour is (paint, multipack).
    measured: 517 published, from `resolve/crossover.py` stamps.

  - slug: terrain
    label: Terrain
    status: current
    definition: >-
      Scenery a game is played over or around -- ruins, buildings, barricades, forests, hills, mats
      sold as battlefields.
    boundary: >-
      A neoprene playmat is `game-accessory` (it is a play surface, not modelled scenery); a
      modelled ruin is `terrain`.
    measured: >-
      148 published; 381 name-lexicon hits catalog-wide, so the published figure is a
      floor and the gap is what the categorize stage is for.

  - slug: book
    label: Book
    status: current
    definition: >-
      Anything whose content is text -- codexes, battletomes, army books, rulebooks, campaign
      supplements, novels, anthologies, magazines.
    boundary: >-
      Digital editions are `book` with `packaging: digital`, NOT a separate category: an eBook
      codex is the same thing as the printed codex, differently delivered. Reference CARDS
      (datacards, stat cards) are `game-accessory` -- they are played with, not read.
    measured: 98 published; 861 lexicon hits.

  - slug: hobby-auxiliary
    label: Hobby auxiliary
    status: current
    definition: >-
      Things that BUILD, HOLD, APPLY and BASE without being models, colour, or anything a paint
      chart lists: brushes, sponges, palettes, clippers, files, drills, knives, glue, greenstuff and
      putty, plasticard, magnets, basing materials (flock, tufts, gravel, sand, blank bases),
      decals and transfers, airbrush hardware, hobby lamps and mats. `role` (axis 3) says which:
      applicator, tool, basing or build.
    boundary: >-
      A liquid, paste, powder or aerosol sold inside a paint range is `paint` whatever its colour
      -- the primer, the varnish and the thinner all moved there on 2026-09-02 (see `paint`), which
      is where this entry's old "thinnest boundary in the file" went. Basing PASTES in a pot
      (texture paints) are `paint` with role `texture`; loose basing MATERIALS in a bag are
      `hobby-auxiliary` with role `basing`. A wet palette is a tool, and so is the paper for it.
    measured: >-
      1,390 published on 2026-09-02. A name lexicon over them reads 274 as tools or brushes, 257
      as basing materials, 92 as the thinners, mediums and varnishes this redrawing returns to
      `paint`, 164 as sets, and places 557 nowhere -- mostly a store's whole hobby department
      filed under one word, which the boundary flip that follows this vocabulary re-measures.

  - slug: game-accessory
    label: Game accessory
    status: new
    definition: >-
      Things used to PLAY rather than to build: dice, cards and card decks, datacards, tokens,
      counters, templates, measuring tools, objective markers, playmats, sleeves, deck boxes.
    boundary: >-
      A rulebook is `book`; a datacard is `game-accessory`. Dice sold as merchandise (a novelty
      set in a branded tin) are still `game-accessory` -- the object decides, not the shelf.
    measured: >-
      596 lexicon hits. GW's product-code classes are the strong signal here rather than
      names -- class 6005 (datacards) measured 85.9-100% pure per sub-class -- and the 357
      crude-regex mislabels found under `legacy-catalog`'s default are mostly dice and card packs.

  - slug: board-game
    label: Board game
    status: new
    definition: >-
      A self-contained game sold as a game rather than as an army or a supplement -- box, board,
      components, rules.
    boundary: >-
      A miniatures game's starter set is (miniatures, set), not `board-game`: it feeds a wider
      game system. A standalone title that happens to contain miniatures is `board-game`.
    measured: >-
      48 lexicon hits; cmon's residual population is the real one (Marvel United, Dune,
      Teen Titans Go!) and is not name-detectable without the store taxonomy Phase 2 captures.

  - slug: merch
    label: Merchandise
    status: new
    definition: >-
      Branded goods that are not hobby equipment -- apparel, mugs, totes, posters, art prints, pin
      badges, keyrings, dice bags.
    boundary: >-
      A dice BAG is `merch`; the dice in it are `game-accessory`. Art books are `book`.
    measured: >-
      65 lexicon hits. Small and deliberately so -- it exists mainly so a t-shirt has an
      honest home instead of being a miniature.

  - slug: event
    label: Event
    status: new
    definition: >-
      Not a good at all -- tickets, entry passes, tournament registrations, preview-event access.
    boundary: >-
      Nothing is shipped. If a ticket includes an exclusive model, the model gets its own record
      where the manufacturer gives it one; the ticket stays an `event`.
    measured: >-
      9 lexicon hits -- the THINNEST value in this file, and named as such. The real
      evidence is store taxonomy this repo does not capture yet: ret-goblingaming carries a
      "Local Events" product_type and mfr-warlord-store a "Ticket" one, both discarded at acquire
      time today. It is declared now so the value exists the moment Phase 2 records that signal;
      if that capture lands and the population is still single digits, delete it.

# ---------------------------------------------------------------------------------------------
# AXIS 2 -- `packaging`: what form it comes in.
#
# UNPUBLISHED, and that is why this axis can be designed at all. `packaging` is on the internal
# `CanonicalModels.ProductRecord` the publisher reads, but it is NOT among the fields
# `Documents.cs::ProductRecord` emits -- so nothing downstream has ever seen it and no consumer
# contract constrains it. Measured: populated on 12,347 of 30,747 products, and EVERY ONE of those
# comes from `legacy-catalog` (12,354 single / 336 box / 90 starter / 19 bundle observations). No
# live source has ever emitted a packaging hint. The axis is effectively greenfield.
#
# The question this axis answers is: HOW MANY THINGS, AND ARE THEY THE SAME THING? That is the
# whole axis. Marketing distinctions that do not change the answer (is it a "starter"? a
# "battleforce"? a "launch box"?) are not values here -- they are naming, and the name is already
# published.
packaging:
  - slug: single
    label: Single
    status: current
    definition: One unit of one thing.
    measured: 11,914 published, all from legacy-catalog.

  - slug: multipack
    label: Multipack
    status: new
    definition: >-
      Several of the SAME unit in one package -- a trade case of six identical paint pots, a
      10-pack of one base size. `quantity` carries how many where a source states it.
    boundary: >-
      Same thing repeated. The moment the contents differ it is a `set`.
    measured: >-
      1,085 name-lexicon hits (`X6`, `(6-PACK)`, `x36`). GW's trade sheets are the dense
      population -- their paint case descriptions are explicitly `... (6-PACK)` / `... X6`.

  - slug: set
    label: Set
    status: new
    definition: >-
      Several DIFFERENT units sold as one package -- boxed sets, army sets, starter sets, paint
      sets. `contentSkus` carries what is inside where a source states it (375 products today).
    boundary: >-
      Absorbs what legacy called `box` and `starter`. A "starter set" is a set; being an entry
      point is positioning, not form, and nothing consumes it.
    measured: >-
      323 boxed-set + 526 starter lexicon hits; 517 `paint-set` products are set-formed
      by definition.

  - slug: bundle
    label: Bundle
    status: current
    definition: >-
      Several separately-sold PRODUCTS packaged or priced together, where each component has (or
      could have) its own catalog record.
    boundary: >-
      The test against `set` is whether the components are themselves products a shop sells alone.
      This is the weakest boundary on this axis and the smallest population; if it cannot be
      decided reliably from evidence it should be merged into `set` rather than guessed.
    measured: 19 published (legacy) against 320 name-lexicon hits.

  - slug: digital
    label: Digital
    status: new
    definition: >-
      No physical package -- eBooks, PDFs, STL files, download codes.
    boundary: >-
      The CATEGORY is unchanged by delivery: a PDF codex is (book, digital), an STL model set is
      (miniatures, digital). This is why there is no `digital` category.
    measured: 440 name-lexicon hits (eBook/PDF/STL/digital/download).

  # Values the catalog already contains that this file does NOT endorse going forward. Validation
  # accepts them so today's data passes unchanged; the migration to `mapsTo` is a separate phase
  # with its own before/after measurement, because it changes 426 records and a data change must
  # never ride inside a vocabulary declaration.
  - slug: box
    label: Box (legacy)
    status: legacy
    mapsTo: set
    definition: legacy-catalog's word for a multi-item box.
    measured: 326 published.

  - slug: starter
    label: Starter (legacy)
    status: legacy
    mapsTo: set
    definition: legacy-catalog's word for an entry-point box.
    measured: 88 published.

# ---------------------------------------------------------------------------------------------
# AXIS 3 -- `role`: what a hobby supply is FOR.
#
# `category` says a thing is `paint` or `hobby-auxiliary`; it cannot say whether the pot is a
# colour or the varnish that goes over it, or whether the auxiliary is a brush or a bag of tufts.
# Before this axis existed the vocabulary answered that question by MIS-FILING: a varnish was
# `hobby-auxiliary` because it was not a colour, which made `category` carry two facts at once
# (what a chart lists, and what deposits colour) and disagree with every maker's own chart. The
# facts are separated the way `packaging` was separated from `category`: `category` says which
# shelf the thing belongs to, `role` says what it does there.
#
# ONE VALUE PER PRODUCT, closed vocabulary, answerable ONLY for `paint` and `hobby-auxiliary`. A
# miniature, a book and a set carry none: a set (`paint-set`, or anything with `packaging: set`)
# is a container whose members carry their own roles, reachable through the set-contents relation,
# and a role on the box would be a tie rule nobody asked for (maintainer decision, 2026-09-02).
#
# THE PAINT ARCHIVE CARRIES THE SAME FIELD with the same slugs, decided by the range and name of
# each record, and there it is held to an invariant the tool enforces by failing its run: a
# `varnish`, `medium` or `cleaner` must be `colourless: true`, and a `colourless` record must not
# be a `colour`. Through the barcode join that gives the product side a role for every joined pot;
# the rest are decided by a source's shelf, a maker's range or the product's name, and `roleBasis`
# says which -- the same words `categoryBasis` uses, plus `paint-archive` for the join.
#
# THE FINER GRAIN OF A COLOUR -- wash, contrast, metallic, air -- IS NOT A ROLE. The paint archive
# publishes it as `type` and `finish`, and stating it here too would give one fact two homes that
# can disagree. If the product catalog ever carries it, it is a separate property derived from the
# archive through the join (maintainer's direction, 2026-09-02), never more values on this axis.
#
# Populations are from the design measurement of 2026-09-02 (a crude name lexicon over the 5,517
# `paint` and 1,390 `hobby-auxiliary` products, and over the 8,521 archive records), and are
# orders of magnitude for the same reason the category figures are.
roles:
  - slug: colour
    label: Colour
    status: current
    definition: >-
      Deposits colour: base, layer, wash, shade, ink, glaze, contrast, dry, metallic and effect
      paints, and coloured sprays. The archive's `type` and `finish` carry the finer grain.
    boundary: >-
      A coloured primer is `primer` -- its purpose decides, not its pigment. A tinted varnish is
      still `varnish`; a coloured basing paste is `texture`. Sold in a box of several: no role.
    measured: >-
      About 4,000 of the `paint` products and 7,900 of the archive's records by name; the bulk of
      both.

  - slug: primer
    label: Primer
    status: current
    definition: >-
      Undercoat, coloured or clear: primer sprays, brush-on and airbrush primers, gesso,
      microfiller, surface primers.
    boundary: >-
      A primer is `paint` however it is packaged -- an aerosol undercoat is (paint, single,
      primer). The old vocabulary put a colourless undercoat in `hobby-auxiliary`; it does not.
    measured: About 190 `paint` products and 74 archive records by name.

  - slug: varnish
    label: Varnish
    status: current
    definition: >-
      A clear protective or finishing coat of any sheen: varnish, sealer, clear coat, clear lacquer,
      'Ardcoat, Stormshield, Munitorum Varnish, Mr Hobby's Clear and Super Clear, Tamiya's Clear.
    boundary: >-
      Colourless by definition, and the archive's invariant says so. A tinted "smoke" clear is a
      `colour`; a matting AGENT mixed into paint (Flat Base) is a `medium`.
    measured: About 30 `paint` products, 26 more filed `hobby-auxiliary`, and 65 archive records.

  - slug: medium
    label: Medium
    status: current
    definition: >-
      Goes into or under the paint to change how it behaves: mixing, glaze, contrast and wash
      mediums, retarder, flow improver, stabilizer, thinner, reducer, flat and clear bases, pigment
      binder, crackle, chipping, gel, textile, pearl and metal mediums, liquid mask and masking
      fluid, decal fix and softener, terrain fixer.
    boundary: >-
      Colourless by definition. A thinner is a medium (it enters the paint); a cleaner is not (it
      never does). The word MEDIUM in a colour name (Medium Sea Grey) is a colour.
    measured: About 45 `paint` products, 66 more filed `hobby-auxiliary`, and 74 archive records.

  - slug: cleaner
    label: Cleaner
    status: current
    definition: >-
      Never enters the paint: airbrush cleaner, brush cleaner and restorer, paint stripper.
    boundary: >-
      Colourless by definition. Sold inside a paint range (Vallejo Auxiliaries, Warpaints) it is
      `paint`; a rag or a cleaning pot is `hobby-auxiliary` with role `tool`.
    measured: A handful; the design lexicon folded them into its 45 thinner names.

  - slug: texture
    label: Texture
    status: current
    definition: >-
      Pastes, gels and grounds sold in a pot for surfaces: texture paints, basing pastes
      (Astrogranite, Stirland Mud), snow, mud and earth effects, water effects and still water,
      crackle paste, pumice.
    boundary: >-
      In a pot, from a paint range: `paint`. Loose material in a bag -- sand, gravel, flock,
      tufts -- is `hobby-auxiliary` with role `basing`.
    measured: About 200 `paint` products and 320 archive records by name.

  - slug: pigment
    label: Pigment
    status: current
    definition: Dry pigments and weathering powders.
    boundary: >-
      A liquid "pigment toner" or a metallic "fairy dust" paint is a `colour`; a jar of powder is
      a pigment.
    measured: About 50 `paint` products and 35 archive records by name.

  - slug: applicator
    label: Applicator
    status: current
    definition: >-
      Puts paint on: brushes, sponges, foam applicators, dotting tools, airbrushes.
    boundary: >-
      An airbrush COMPRESSOR, hose or needle is a `tool`; the airbrush itself applies paint. A
      brush SET is (hobby-auxiliary, set) with no role.
    measured: Most of the 274 tool-like names among `hobby-auxiliary` products.

  - slug: tool
    label: Tool
    status: current
    definition: >-
      Cuts, holds, shapes and lights: clippers, knives, files, drills, tweezers, sculpting tools,
      palettes and wet palettes, cutting mats, paint handles and holders, racks, lamps, magnifiers,
      airbrush hardware, empty dropper bottles, mixing balls.
    boundary: >-
      A palette holds paint, it does not apply it; an empty bottle is a tool even when the paint
      archive lists it beside the paints.
    measured: The rest of the 274.

  - slug: basing
    label: Basing
    status: current
    definition: >-
      Loose materials for a base or a diorama: flock, static grass, tufts, leaves, gravel, sand,
      slate, snow flakes, cork, and blank bases of every size.
    boundary: >-
      A basing paste in a pot is `paint` with role `texture`; a bag of the dry stuff is here.
      Bases included IN a kit are part of the kit (see `miniatures`).
    measured: Most of the 257 texture-like names among `hobby-auxiliary` products.

  - slug: build
    label: Build
    status: current
    definition: >-
      Joins and fills: plastic and super glue, PVA, putty and greenstuff, milliput, plasticard,
      brass rod, magnets, pins, sprue goo, gap filler.
    boundary: >-
      Exists so that every `hobby-auxiliary` record answers "what is it for" (maintainer decision,
      2026-09-02): a supply that neither applies, cuts, nor bases, builds. A sprue CUTTER is a tool.
    measured: Not separated by the design lexicon; a population to measure when the rules land.
