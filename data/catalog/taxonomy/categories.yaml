# WHAT A PRODUCT IS, on two independent axes.
#
# Until this file existed neither axis was declared anywhere. `models/catalog.py` typed both
# `category` and `packaging` as bare `str | None`, nothing validated either, and the values in use
# had been minted ad hoc by five unrelated mechanisms -- the legacy .NET import, three source
# mapping files, gw-trade's `Range` column, reaper's page kind, and `resolve/crossover.py`'s
# per-clause stamps. The same shelf of goods consequently got three different answers: GW's varnish
# publishes `paint` (its source says so), AK's thinner publishes `hobby-auxiliary` (a crossover
# clause says so), and Vallejo's varnish publishes `miniatures` (nothing said anything).
#
# THE TWO AXES ARE INDEPENDENT AND BOTH ARE ALWAYS ANSWERABLE. `category` is WHAT THE THING IS;
# `packaging` is WHAT FORM IT COMES IN. A boxed set of miniatures is (miniatures, set); a 6-pot
# case of one paint is (paint, multipack); a PDF rulebook is (book, digital). Collapsing them --
# which is what a single `category` carrying `paint-set` does -- forces a choice between saying
# what a thing is and saying how many of it you get, and `paint-set` is the scar from having made
# that choice once already. It stays published (see `paint-set` below); it is not repeated.
#
# NOTHING IN THIS FILE RE-VALUES ANY RECORD ON ITS OWN. It declares the vocabulary and gives every
# value a boundary a human can apply. `status: current` values may be written by anything;
# `status: legacy` values are ones the catalog already contains, recorded here so validation
# accepts today's data unchanged, each carrying the `mapsTo` that a later phase will migrate it by
# -- with its own measurement and its own PR. Declaring and migrating in one step would hide a data
# change inside a documentation change.
#
# Populations below are measured on `origin/catalog/acquisition` (fc3ff62), 2026-08-21, over 30,747
# products. "lexicon" figures are first-match counts from a deliberately crude name regex and are
# ORDERS OF MAGNITUDE, not classifications -- they exist to show a value has a real population
# behind it, not to classify anything. Nothing reads them.

schemaVersion: 1

# ---------------------------------------------------------------------------------------------
# AXIS 1 -- `category`: what the thing IS.
#
# One flat axis, closed vocabulary, exactly one value per product. Flat because the consumer-facing
# question ("is this a model, a book, or a pot of paint?") is flat, and because game-systems and
# factions -- the two taxonomies this repo already publishes -- are flat for the same reason.
#
# The six values already in the published catalog are FROZEN in spelling. A published field is a
# consumer contract (docs/OBJECTIVES.md 3): renaming `paint-set` to fix the axis confusion above
# would silently drop every consumer filtering on it. The vocabulary grows; it does not churn.
categories:
  - slug: miniatures
    label: Miniatures
    status: current
    definition: >-
      Models and the sprues, bodies, upgrade frames and bases sold as models. The catalog's bulk.
      A model kit stays `miniatures` however many models are in the box -- count and form are the
      `packaging` axis, not this one.
    boundary: >-
      Bases sold on their own are `hobby-auxiliary`, not `miniatures`: a blank base is a component
      of the hobby, not a model. Bases included IN a kit are simply part of that kit.
    measured: >-
      28,793 published today -- but see `categoryBasis`, only 1,954 of the whole catalog's
      categories rest on evidence at all.

  - slug: paint
    label: Paint
    status: current
    definition: >-
      A pot, bottle, dropper or spray whose purpose is to deposit colour. One colour per record.
    boundary: >-
      COLOUR IS THE TEST. A medium, varnish, thinner, retarder, flow improver or masking fluid is
      `hobby-auxiliary` even when its manufacturer sells it inside a paint range and even when the
      paint catalog carries it -- `data/paints/brands/*.yaml` marks exactly these with
      `colourless: true` (146 records, 102 of them barcoded). Today the catalog disagrees with
      itself here: GW's Lahmian Medium publishes `paint` because mfr-gw-trade's Range column says
      so, while AK's identical thinners publish `hobby-auxiliary` because a crossover clause says
      so. This boundary is what the disagreement gets adjudicated against; it does not resolve it
      by itself, and a source's own claim still wins until a human moves it (OBJECTIVES 5).
    measured: 1,178 published; 1,594 rest on a source claim.

  - slug: paint-set
    label: Paint set
    status: current
    frozen-reason: >-
      An AXIS COLLAPSE, published and therefore permanent. This value says both "paint" and "more
      than one", which is precisely the confusion the `packaging` axis exists to end. It is kept
      spelled exactly as-is because consumers filter on it. New records that would qualify are
      still written here for consistency, and ALSO carry `packaging: set` -- so a consumer that
      wants the clean cut can take (category, packaging) and ignore this value's double duty.
    definition: >-
      A boxed assortment of DIFFERENT paints sold as one unit.
    boundary: >-
      Several pots of the SAME colour is a `multipack`, not a set -- a GW 6-pack of one Citadel
      colour is (paint, multipack).
    measured: 517 published, from `resolve/crossover.py` stamps.

  - slug: terrain
    label: Terrain
    status: current
    definition: >-
      Scenery a game is played over or around -- ruins, buildings, barricades, forests, hills, mats
      sold as battlefields.
    boundary: >-
      A neoprene playmat is `game-accessory` (it is a play surface, not modelled scenery); a
      modelled ruin is `terrain`.
    measured: >-
      148 published; 381 name-lexicon hits catalog-wide, so the published figure is a
      floor and the gap is what the categorize stage is for.

  - slug: book
    label: Book
    status: current
    definition: >-
      Anything whose content is text -- codexes, battletomes, army books, rulebooks, campaign
      supplements, novels, anthologies, magazines.
    boundary: >-
      Digital editions are `book` with `packaging: digital`, NOT a separate category: an eBook
      codex is the same thing as the printed codex, differently delivered. Reference CARDS
      (datacards, stat cards) are `game-accessory` -- they are played with, not read.
    measured: 98 published; 861 lexicon hits.

  - slug: hobby-auxiliary
    label: Hobby auxiliary
    status: current
    definition: >-
      Things used to BUILD and FINISH models without being models or colour: brushes, clippers,
      files, glue, greenstuff, basing materials, flock, tufts, decals and transfers, airbrush
      hardware, and every colourless medium/varnish/thinner (see `paint`).
    boundary: >-
      Primer and spray undercoat sit here rather than in `paint` when they are colourless or
      purpose-built as undercoat; a coloured spray sold as a paint colour is `paint`. This is the
      thinnest boundary in the file and the one most likely to need revisiting from real data.
    measured: 13 published; 1,284 lexicon hits -- the largest gap of any value here.

  - slug: game-accessory
    label: Game accessory
    status: new
    definition: >-
      Things used to PLAY rather than to build: dice, cards and card decks, datacards, tokens,
      counters, templates, measuring tools, objective markers, playmats, sleeves, deck boxes.
    boundary: >-
      A rulebook is `book`; a datacard is `game-accessory`. Dice sold as merchandise (a novelty
      set in a branded tin) are still `game-accessory` -- the object decides, not the shelf.
    measured: >-
      596 lexicon hits. GW's product-code classes are the strong signal here rather than
      names -- class 6005 (datacards) measured 85.9-100% pure per sub-class -- and the 357
      crude-regex mislabels found under `legacy-catalog`'s default are mostly dice and card packs.

  - slug: board-game
    label: Board game
    status: new
    definition: >-
      A self-contained game sold as a game rather than as an army or a supplement -- box, board,
      components, rules.
    boundary: >-
      A miniatures game's starter set is (miniatures, set), not `board-game`: it feeds a wider
      game system. A standalone title that happens to contain miniatures is `board-game`.
    measured: >-
      48 lexicon hits; cmon's residual population is the real one (Marvel United, Dune,
      Teen Titans Go!) and is not name-detectable without the store taxonomy Phase 2 captures.

  - slug: merch
    label: Merchandise
    status: new
    definition: >-
      Branded goods that are not hobby equipment -- apparel, mugs, totes, posters, art prints, pin
      badges, keyrings, dice bags.
    boundary: >-
      A dice BAG is `merch`; the dice in it are `game-accessory`. Art books are `book`.
    measured: >-
      65 lexicon hits. Small and deliberately so -- it exists mainly so a t-shirt has an
      honest home instead of being a miniature.

  - slug: event
    label: Event
    status: new
    definition: >-
      Not a good at all -- tickets, entry passes, tournament registrations, preview-event access.
    boundary: >-
      Nothing is shipped. If a ticket includes an exclusive model, the model gets its own record
      where the manufacturer gives it one; the ticket stays an `event`.
    measured: >-
      9 lexicon hits -- the THINNEST value in this file, and named as such. The real
      evidence is store taxonomy this repo does not capture yet: ret-goblingaming carries a
      "Local Events" product_type and mfr-warlord-store a "Ticket" one, both discarded at acquire
      time today. It is declared now so the value exists the moment Phase 2 records that signal;
      if that capture lands and the population is still single digits, delete it.

# ---------------------------------------------------------------------------------------------
# AXIS 2 -- `packaging`: what form it comes in.
#
# UNPUBLISHED, and that is why this axis can be designed at all. `packaging` is on the internal
# `CanonicalModels.ProductRecord` the publisher reads, but it is NOT among the fields
# `Documents.cs::ProductRecord` emits -- so nothing downstream has ever seen it and no consumer
# contract constrains it. Measured: populated on 12,347 of 30,747 products, and EVERY ONE of those
# comes from `legacy-catalog` (12,354 single / 336 box / 90 starter / 19 bundle observations). No
# live source has ever emitted a packaging hint. The axis is effectively greenfield.
#
# The question this axis answers is: HOW MANY THINGS, AND ARE THEY THE SAME THING? That is the
# whole axis. Marketing distinctions that do not change the answer (is it a "starter"? a
# "battleforce"? a "launch box"?) are not values here -- they are naming, and the name is already
# published.
packaging:
  - slug: single
    label: Single
    status: current
    definition: One unit of one thing.
    measured: 11,914 published, all from legacy-catalog.

  - slug: multipack
    label: Multipack
    status: new
    definition: >-
      Several of the SAME unit in one package -- a trade case of six identical paint pots, a
      10-pack of one base size. `quantity` carries how many where a source states it.
    boundary: >-
      Same thing repeated. The moment the contents differ it is a `set`.
    measured: >-
      1,085 name-lexicon hits (`X6`, `(6-PACK)`, `x36`). GW's trade sheets are the dense
      population -- their paint case descriptions are explicitly `... (6-PACK)` / `... X6`.

  - slug: set
    label: Set
    status: new
    definition: >-
      Several DIFFERENT units sold as one package -- boxed sets, army sets, starter sets, paint
      sets. `contentSkus` carries what is inside where a source states it (375 products today).
    boundary: >-
      Absorbs what legacy called `box` and `starter`. A "starter set" is a set; being an entry
      point is positioning, not form, and nothing consumes it.
    measured: >-
      323 boxed-set + 526 starter lexicon hits; 517 `paint-set` products are set-formed
      by definition.

  - slug: bundle
    label: Bundle
    status: current
    definition: >-
      Several separately-sold PRODUCTS packaged or priced together, where each component has (or
      could have) its own catalog record.
    boundary: >-
      The test against `set` is whether the components are themselves products a shop sells alone.
      This is the weakest boundary on this axis and the smallest population; if it cannot be
      decided reliably from evidence it should be merged into `set` rather than guessed.
    measured: 19 published (legacy) against 320 name-lexicon hits.

  - slug: digital
    label: Digital
    status: new
    definition: >-
      No physical package -- eBooks, PDFs, STL files, download codes.
    boundary: >-
      The CATEGORY is unchanged by delivery: a PDF codex is (book, digital), an STL model set is
      (miniatures, digital). This is why there is no `digital` category.
    measured: 440 name-lexicon hits (eBook/PDF/STL/digital/download).

  # Values the catalog already contains that this file does NOT endorse going forward. Validation
  # accepts them so today's data passes unchanged; the migration to `mapsTo` is a separate phase
  # with its own before/after measurement, because it changes 426 records and a data change must
  # never ride inside a vocabulary declaration.
  - slug: box
    label: Box (legacy)
    status: legacy
    mapsTo: set
    definition: legacy-catalog's word for a multi-item box.
    measured: 326 published.

  - slug: starter
    label: Starter (legacy)
    status: legacy
    mapsTo: set
    definition: legacy-catalog's word for an entry-point box.
    measured: 88 published.
