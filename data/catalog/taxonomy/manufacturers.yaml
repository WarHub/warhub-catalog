manufacturers:
  - slug: games-workshop
    name: Games Workshop
    codePattern: '\d{11}'
    codeStrip: [GWS, GW-]
    gs1Prefixes: ['5011921']
    # GW-Local: tistaminis.com vendors its new GW stock this way (taxonomy matching is
    # casefolded, so one spelling also covers GW-LOCAL). Live-verified 2026-07-13.
    # GW-Web / GW-OOP: same store, same brand-format tagging convention, discovered on a
    # full 100-page live enumeration of tistaminis.com/products.json 2026-07-13 (Plan 5
    # Task 1). Confirmed by product sample: "GW-Web" skus are raw GS1 5011921xxxxxx
    # barcodes (e.g. sku 5011921221493, "High Elves Ellyrian Reavers"); "GW-OOP" titles
    # are GW lines (Chaos Space Marines, Blood Bowl, Middle-earth SBG). Casefolded
    # matching also covers "GW-WEB".
    vendorNames: [Games Workshop, Citadel, Forge World, GW-Local, GW-Web, GW-OOP]
  - slug: atomic-mass-games
    name: Atomic Mass Games
    codePattern: '(SWL|SWP|SWM|CP|AMG)[A-Z]?\d+[A-Z]*'
    vendorNames: [Atomic Mass Games]
  - slug: cmon
    name: CMON
    codePattern: 'CMN[A-Z0-9]+'
    vendorNames: [CMON, Cool Mini or Not]
  - slug: corvus-belli
    name: Corvus Belli
    codePattern: '\d{6}'
    codeStrip: [COR]
    vendorNames: [Corvus Belli]
  - slug: mantic-games
    name: Mantic Games
    codePattern: '[A-Z]{2,10}\d{2,6}[A-Z]*'
    vendorNames: [Mantic Games, Mantic]
  - slug: para-bellum
    name: Para Bellum
    codePattern: 'PB[A-Z]?\w+'
    vendorNames: [Para Bellum, Para Bellum Wargames]
  - slug: steamforged-games
    name: Steamforged Games
    codePattern: 'SF[A-Z0-9-]+'
    # Steamforged tags vendor per in-house game line rather than by company name, and since
    # 2026-08 those lines are split across TWO of its own Shopify stores -- mfr-steamforged
    # (steamforged.com) and mfr-warmachine (warmachine.gg). One vendorNames list spans both: a
    # vendor string means the same brand whichever store serves it, and the store split is a
    # fact about sources, not about who makes the product.
    #
    # Guild Ball/Godtear/Epic Encounters (+ the "Local Legends" variant) are exactly the game
    # lines the retired .NET tool's own vendorMap attributed to "Steamforged Games" (git show
    # 1593ee1^:tools/WarHub.ProductCatalog.Tool/ProductCatalogApp.cs, ~line 1154).
    #
    # Iron Kingdoms and P3 Paints were EXCLUDED here until 2026-08-12, listed alongside the
    # store's genuinely-licensed board-game/RPG tags (Dark Souls, Elden Ring, Monster Hunter,
    # ...) on the grounds that the old tool never scraped them either. That was a
    # misclassification: the licensed tags are third-party IP Steamforged only publishes,
    # whereas Warmachine, Iron Kingdoms and Formula P3 are all brands Steamforged BOUGHT
    # outright from Privateer Press in 2024 and now owns. The 2026-08 store split made the
    # error visible -- warmachine.gg carries all three together as one in-house catalogue --
    # so they are attributed here. Live probe 2026-08-12: 361 Warmachine, 222 P3 Paints, 25
    # Iron Kingdoms, 1 app-subscriber variant. All 222 P3 skus match codePattern above (the
    # range was re-coded to SF* after the acquisition), so they resolve like any other product.
    # The licensed board-game/RPG tags remain excluded, unchanged.
    #
    # "Steamforged Games - Tradeshow" is deliberately NOT here despite naming the company: all
    # 4 products under it (both stores) are Baron of Dice accessories -- skus BOD001-BOD003,
    # 0 of 4 matching codePattern -- i.e. another maker's goods on a Steamforged booth.
    # See docs/research/2026-08-12-steamforged-warmachine-store-split.md.
    vendorNames: [Steamforged Games, Steamforged, Warmachine, 'Warmachine (app subscribers only)', Guild Ball, Godtear, Epic Encounters, 'Epic Encounters: Local Legends', Iron Kingdoms, P3 Paints]
  - slug: warlord-games
    name: Warlord Games
    codePattern: '[0-9]{9,12}(-[0-9]{1,2})?|(?=[A-Z0-9-]*[A-Z])[A-Z0-9-]{6,}'
    # Warlord-BLISTER / Warlord-WEB: tistaminis.com's brand-format tagging convention
    # (same pattern as GW-Local/GW-Web/GW-OOP above) for Warlord Games stock. Discovered
    # on a full 100-page live enumeration of tistaminis.com/products.json 2026-07-13
    # (Plan 5 Task 1); "Warlord-BLISTER" alone was 77 products in a 1,500-product sample
    # -- by far the largest unmapped tracked-brand vendor string found. Confirmed by
    # product sample: titles/skus are Warlord Games lines (Hail Caesar sku WGH-IR-22,
    # Bolt Action sku WGB-RI-130).
    vendorNames: [Warlord Games, Warlord-BLISTER, Warlord-WEB]
  - slug: wyrd-games
    name: Wyrd Games
    codePattern: 'WYR\d+[A-Z ]*'
    # giveusyourmoneypleasethankyou-wyrd.com (own Shopify store, probed 2026-07-13) uses these 5
    # vendor tag variants across its ~707 products (518 "Wyrd Miniatures - Online Store", 185
    # "Wyrd", 2 "Wyrd Games", 1 "Wyrd Miniatures", 1 "WYRD - PROMO") -- all the same company's
    # own catalog, no other vendor observed. See task-6-report.md.
    vendorNames: [Wyrd Games, Wyrd Miniatures, Wyrd, 'Wyrd Miniatures - Online Store', 'WYRD - PROMO']
  # --- Paint manufacturers (paint harvest sources; see
  # docs/research/2026-07-23-paint-manufacturer-harvest-design.md) ---
  - slug: vallejo
    name: Vallejo
    codePattern: '\d{2}\.\d{3}'
    # GS1 prefix verified by the paint tool's EanComputer (computed Vallejo EANs are
    # 8429551 + code digits + check digit).
    gs1Prefixes: ['8429551']
    vendorNames: [Vallejo, Acrylicos Vallejo, AV]
  - slug: ak-interactive
    name: AK Interactive
    # WIDENED 2026-08-26 BY PREFIX, and that distinction is the whole point. The old pattern
    # `(AK|RC|ABT)\s?\d{2,5}[A-Z]?(-[A-Z0-9]+)?` codes 1,094 of this source's 1,253 observations.
    # The 159 it misses are not a ragged edge: they are whole product FAMILIES whose article
    # numbers carry a longer letter prefix -- AKABT (69 rows, the Abteilung 502 oils), AKAD (48,
    # Artistic Dense acrylics), ABTP (15) and ABTPF (3, pigments), AKG (14, gouaches), AKPACK (4,
    # signature bundles). Every family fails 100%, singles and sets alike. 32 of those rows reach
    # the product catalog through `crossoverToProducts` and the resolver's identity floor then
    # refuses them -- ak-interactive.com publishes no barcode anywhere, so a row whose sku will not
    # normalize has no addressable identity at all and would publish under a slug of the shop's
    # title. They are conflicts.yaml's `paint-set-without-identity` and
    # `hobby-auxiliary-without-identity` rows, including the AKABT111/112/113 thinners.
    #
    # THE SOURCE DESCRIPTOR SAYS THIS CANNOT BE FIXED THIS WAY, and it is right about one shape of
    # widening and wrong about the other. `mfr-ak-interactive.yaml` says "a pattern loose enough to
    # swallow the item numbers would code the range strings too". Measured over the committed
    # evidence, both shapes:
    #
    #   loosen the TRAILING letters  `(AK|RC|ABT)\s?\d{1,5}[A-Z]*...`
    #       codes 1,099 of 1,253 -- and codes 4 of the 5 range strings, because after
    #       space-stripping `AK 3G RANGE AFV` is `AK` + `3` + `GRANGEAFV`. The warning holds.
    #   extend the PREFIX (this change)
    #       codes 1,247 of 1,253 -- and codes 0 of the 5 range strings, because `AK3GRANGEAFV`
    #       still has letters after its digit run and `RANGEAKAD` has no digit run at all.
    #
    # So the five freehand range strings stay refused, which is correct: "AK 3G RANGE AFV",
    # "AK 3G RANGE FIG", "AK 3G RANGE AIR", "AK 3G RANGE GENERIC" and "RANGE AKAD" are the shop's
    # own range pages, not product identities, and the descriptor already says so. They are the
    # only SKUs in the whole 1,253-row file that contain a space.
    #
    # ENUMERATED RATHER THAN `AK[A-Z]*`, which measures identically (1,247 of 1,253) but would code
    # any future letter salad this source ships.
    #
    # `AKM`/`AKMQ` ARE DELIBERATELY ABSENT although they are real AK prefixes (the playmarker
    # lines). This source observes none of them -- they arrive only from `ret-goblingaming` and
    # `legacy-catalog` -- and goblingaming states them with its own variant suffix, so admitting
    # them codes 67 entities as `ak-interactive/AKM002-SINGLE`: a RETAILER'S variant marker
    # published as AK's article number, which trades one unstable id for another. Measured both
    # ways: with AKM the identity-floor refusals go 32 -> 5 and 124 published ids are replaced by
    # 150; without it the refusals go 32 -> 5 just the same, and 1 id is replaced by 27. Same
    # outcome for the thing this change is for, a hundredth of the churn. The cost is that
    # `ak-interactive/animal-green-playmarker` keeps its title slug and the AKM014 product code
    # stays dropped.
    codePattern: '(AKABT|AKAD|AKPACK|AKG|AK|ABTPF|ABTP|ABT|RC)\s?\d{1,5}[A-Z]?(-[A-Z0-9]+)?'
    vendorNames: [AK Interactive, AK-Interactive]
  - slug: army-painter
    name: The Army Painter
    # BNDL added 2026-08-05 for the boxed sets crossing into the product catalog
    # (mfr-armypainter.yaml crossoverToProducts): thearmypainter.com numbers its bundles
    # BNDL212/224/230, outside the range prefixes. Codes 48 of the 49 selected sets. TL/BR were
    # considered and rejected -- they are the BRUSH set prefixes, which that block vetoes anyway,
    # and adding them measures 52 of 56 rather than the 55 an earlier estimate claimed. The last
    # uncoded row is 75005 "D&D Undead Paint Set"; left as a name slug rather than widening
    # further to chase one row.
    codePattern: '(WP|AW|CP|SM|GM|QS|BF|ST)\d{4}[A-Z]?|BNDL\d{3,4}'
    # EAN 5713799314009 observed live on thearmypainter.com variant barcode (Warpaints
    # Fanatic: Moldy Wine, WP3140P) -> GS1 Denmark company prefix.
    gs1Prefixes: ['5713799']
    # thearmypainter.com (own Shopify store, probed 2026-07-23) tags every product with
    # vendor "The Army Painter (B2C)".
    vendorNames: [The Army Painter, 'The Army Painter (B2C)', Army Painter]
  - slug: monument-hobbies
    name: Monument Hobbies
    # Widened 2026-08-05 for the boxed sets crossing into the product catalog
    # (mfr-monument.yaml crossoverToProducts): the old 'MPA-[A-Z0-9]+' matched no set at all
    # (0 of 21) because it cannot cross the SECOND hyphen in MPA-SET-ACON, and the store also
    # ships AMP- (AMP Colors) and MEA- prefixes. Codes 21 of 21 sets.
    codePattern: '(MPA|AMP|MEA)-[A-Z0-9-]+'
    # UPC-12 655368409059 observed live on monumenthobbies.com variant barcode
    # (Pro Acryl 1-Step 501) -> EAN-13 zero-padded prefix.
    gs1Prefixes: ['0655368']
    vendorNames: [Monument Hobbies]
  - slug: turbo-dork
    name: Turbo Dork
    codePattern: 'TDK\d+(_\d)?'
    vendorNames: [Turbo Dork, TurboDork]
  - slug: mr-hobby
    name: Mr Hobby
    # Item codes are a 1-4 letter line prefix + 1-4 digits (+ rare letter suffix): C74, H55,
    # N32, GX112, SMS1, SP2, XC01, CMC04, SF284, B601, WTT111, PSMS01... (live site + catalog
    # brand data, 2026-07-24). Letters optional because the catalog's Mr Color / Mr Metal
    # Color productCodes are stored as bare digits ('74', '218') with the C prefix implied.
    codePattern: '[A-Z]{0,4}\d{1,4}[A-Z]?'
    # No gs1Prefixes on purpose: mr-hobby.com publishes no JAN/EAN anywhere (live-probed
    # 2026-07-24 across EN+JA detail pages, no ld+json/gtin either) -- nothing verified to pin.
    vendorNames: [Mr Hobby, GSI Creos, Mr. Hobby]
  - slug: green-stuff-world
    name: Green Stuff World
    # mpn paint numbers off product-page microdata (3220 Wonka Violet etc.). Widened 3,4 -> 3,5
    # on 2026-08-05 so the boxed sets crossing into the product catalog
    # (mfr-greenstuffworld.yaml crossoverToProducts) are addressable by code rather than by a
    # slug of the store title: 5-digit mpns code 69 of 69 sets, and across ALL 477 committed GSW
    # observations the widened pattern yields 477 DISTINCT codes with zero collisions. Only 2
    # non-set rows change code-ness (11947 "Maxx Darth Black Paint 17 ml", 12020 "Maxx Darth
    # Paint 60 ml"), and neither reaches the paint bridge through this file: gen_paint_harvest.py
    # never loads the taxonomy -- its Catalog.by_code is built from data/paints/brands/*.yaml
    # productCode values -- so the paint catalog is untouched by this widening.
    codePattern: '\d{3,5}'
    # Three GS1 prefixes observed across the full 477-product snapshot 2026-07-24:
    # 8435646 (241), 8436574 (217), 8436554 (19 -- the Chameleon line + 1 fluor).
    gs1Prefixes: ['8435646', '8436574', '8436554']
    vendorNames: [Green Stuff World, GSW]
  - slug: reaper
    name: Reaper
    # 5-digit skus straight off reapermini.com's embedded line-page data (09001 Red Brick,
    # 29237 UV Reactive, 08906 LTPK). No gs1Prefixes: no EAN/UPC appears anywhere in the
    # site's data (live-mapped 2026-07-24) -- add one only once a real barcode is observed.
    codePattern: '\d{5}'
    vendorNames: [Reaper, Reaper Miniatures]
  - slug: scale75
    name: Scale75
    # Verified against the mfr-scale75 snapshot's full sku inventory (2026-07-24, 562/562
    # skus match 'PREFIX-\d{2,3}'): SC 103 (Scalecolor 63 + Metal N' Alchemy 24 + Inktensity
    # 16 share one SC numbering), SDP 128 (Drop & Paint), SART 84 (Artist), SW 64 (Warfront),
    # SIN 48 (Instant), SFG 48 (Fantasy & Games), SCG 48 (Scalecolor Games), SFL 24 (Flow),
    # SFX 8 (FX Fluor), SFLOW 5 (Floww oils), SSE 2 (Prism effect sets). SZ75 (Zodiac minis)
    # deliberately NOT matched -- not paint.
    codePattern: '(SFLOW|SART|SCG|SDP|SFG|SFL|SFX|SIN|SSE|SC|SW)-?\d{2,3}'
    # No gs1Prefixes: the store publishes no barcodes at all (variant barcode null store-wide,
    # live-verified 2026-07-24) -- add one only once a real Scale75 EAN is observed somewhere.
    # Live store vendor string is 'SCALE75 - HOBBIES & GAMES' (all caps, 2026-07-24); matching
    # is casefolded so the mixed-case spelling below also covers it.
    vendorNames: ['SCALE75 - Hobbies & Games', 'Scale75', 'SCALE75']
