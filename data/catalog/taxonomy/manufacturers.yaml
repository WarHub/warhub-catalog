    codePattern: '\d{3,5}'
    # Three GS1 prefixes observed across the full 477-product snapshot 2026-07-24:
    # 8435646 (241), 8436574 (217), 8436554 (19 -- the Chameleon line + 1 fluor).
    gs1Prefixes: ['8435646', '8436574', '8436554']
    vendorNames: [Green Stuff World, GSW]
  - slug: reaper
    name: Reaper
    # 5-digit skus straight off reapermini.com's embedded line-page data (09001 Red Brick,
