manufacturers:
  - slug: games-workshop
    name: Games Workshop
    codePattern: '\d{11}'
    codeStrip: [GWS, GW-]
    gs1Prefixes: ['5011921']
    # GW-Local: tistaminis.com vendors its new GW stock this way (taxonomy matching is
    # casefolded, so one spelling also covers GW-LOCAL). Live-verified 2026-07-13.
    # GW-Web / GW-OOP: same store, same brand-format tagging convention, discovered on a
    # full 100-page live enumeration of tistaminis.com/products.json 2026-07-13 (Plan 5
    # Task 1). Confirmed by product sample: "GW-Web" skus are raw GS1 5011921xxxxxx
    # barcodes (e.g. sku 5011921221493, "High Elves Ellyrian Reavers"); "GW-OOP" titles
    # are GW lines (Chaos Space Marines, Blood Bowl, Middle-earth SBG). Casefolded
    # matching also covers "GW-WEB".
    vendorNames: [Games Workshop, Citadel, Forge World, GW-Local, GW-Web, GW-OOP]
  - slug: atomic-mass-games
    name: Atomic Mass Games
    # WIDENED 2026-08-27. The old pattern allowed ONE letter between the range prefix and the
    # digits, so it read `AMGP1` but not `AMGSWQ102` -- and `SWQ` is Atomic Mass's largest current
    # range. Measured: 258 of 1,169 observations coded before, 794 after. The rest are
    # `ret-radaddel` house numbers (340, all 6 digits, correctly left alone).
    #
    # `AMG` moves into codeStrip because it is a STORE prefix, not a range prefix -- gamenerdz
    # writes `AMGMCP21` for what legacy writes `MCP21`. The trailing `[A-Z]*` sits OUTSIDE the named
    # group so a language/edition letter does not mint a second code.
    #
    # `FFG` IS DELIBERATELY NOT STRIPPED, and that was measured rather than assumed. Fantasy Flight
    # numbered the Marvel Crisis Protocol range `MSG07` where Atomic Mass numbers it `CP07`; the two
    # are the same product and share a barcode. Stripping `FFG` codes the old row as `MSG07`, which
    # fuses it with `CP07` and costs one of the two codes. Left unstripped, `FFGMSG07` normalizes to
    # nothing and joins by barcode exactly as it did before -- one record, the AMG code, no loss.
    codePattern: '(?P<code>[A-Z]{2,4}\d+)[A-Z]*'
    codeStrip: [AMG]
    vendorNames: [Atomic Mass Games]
  - slug: cmon
    name: CMON
    codePattern: 'CMN[A-Z0-9]+'
    vendorNames: [CMON, Cool Mini or Not]
  - slug: corvus-belli
    name: Corvus Belli
    # WIDENED 2026-08-27, and the named group is the point. Corvus Belli's own SKU is a 6-digit
    # code optionally followed by a 4-digit suffix -- `280873` and `280873-0990` are the same
    # product -- and 405 of its 794 codes appear BOTH ways across the sources here. Matching both
    # as distinct codes would split 405 products; refusing the suffixed form would drop most of the
    # corpus, since `mfr-corvus-belli` writes 231 of its 298 rows suffixed. `(?P<code>...)` names
    # the part that is the identity, and `normalize_code` returns that.
    #
    # The second branch covers the lettered ranges the same stores use (`CBARI23`, `WW20009-0073`,
    # `GGB-DBR25`). `CVB` joins `COR` in codeStrip: it is `ret-gamenerdz`'s house prefix on 874
    # rows. Measured: 51 of 2,116 observations coded before, 2,024 after.
    #
    # THE LETTERED BRANCH DROPS THE SAME SUFFIX THE NUMERIC ONE DOES, since 2026-09-02. It used to
    # swallow it -- `WW01001-0006` (goblingaming) and `WW01001` (gamenerdz) were two codes and two
    # records for one Warcrow box, 32 times over. The lazy quantifier and the optional group are
    # what make `fullmatch` leave the suffix out of the named group.
    codePattern: '(?P<code>\d{6})(-\d{4})?|(?P<lettered>[A-Z]{2,4}[A-Z0-9-]*?\d{2,})(-\d{4})?'
    codeStrip: [COR, CVB]
    vendorNames: [Corvus Belli]
  - slug: mantic-games
    name: Mantic Games
    codePattern: '[A-Z]{2,10}\d{2,6}[A-Z]*'
    # TWO RETAILER SPELLINGS OF MANTIC'S OWN `MG` PREFIX, both from `ret-gamenerdz` and neither
    # ever written by Mantic. Measured 2026-09-02: `MAN…` and `MGC…` appear on 0 of 1,993 rows from
    # manticgames.com and 0 of 1,463 legacy rows, and 92 + 20 times on gamenerdz -- `MANKWR407` is
    # `MGKWR407`, `MGCKWR401` is `MGKWR401`. `MGC` LOOKED LIKE AN EDITION MARKER and is not: the
    # "Kings of War 2nd Edition" in gamenerdz's titles is its own labelling, and for the 8 pairs
    # where it says "Regiment" against Mantic's "Troop", Mantic's own page URL and image still say
    # `regiment` -- the page was renamed, the box and its barcode were not. Every one of the 112
    # pairs shares a barcode with the `MG` row it stands for.
    codeRewrite:
      - match: 'MAN([A-Z]+\d.*)'
        replace: 'MG\1'
        reason: gamenerdz prefix swap, 92 rows, 0 on the maker's own store
      - match: 'MGC([A-Z]+\d.*)'
        replace: 'MG\1'
        reason: gamenerdz prefix swap, 20 rows, 0 on the maker's own store
      - match: 'MGKW(VA[A-Z]\d.*)'
        replace: 'MG\1'
        reason: gamenerdz files Vanguard under Kings of War, `MGKWVAK102` for Mantic's `MGVAK102`; 3 rows
    vendorNames: [Mantic Games, Mantic]
  - slug: para-bellum
    name: Para Bellum
    codePattern: 'PB[A-Z]?\w+'
    vendorNames: [Para Bellum, Para Bellum Wargames]
  - slug: steamforged-games
    name: Steamforged Games
    codePattern: 'SF[A-Z0-9-]+'
    # `ret-gamenerdz` WRITES A COMPANY PREFIX STEAMFORGED DOES NOT USE. Steamforged numbers its
    # ranges `SF` + line + `-` + number -- `SFGT-023` (Godtear), `SFIK-MER320` (Iron Kingdoms),
    # `SFEE-012` (Epic Encounters) -- and gamenerdz writes `SFG` + line + number with no hyphen:
    # `SFGGT023`, `SFGIKMER320`, `SFGEE012`. Its `SFGT` is SF+GT, not SFG+T. 132 pairs, every one
    # sharing a barcode with the maker's row; the 24 Godtear pairs read differently only because
    # gamenerdz names the champion and followers where Steamforged names the expansion.
    # gamenerdz writes the same prefix three ways -- `SFGGT023`, `SFGGT-023` and, on the Warmachine
    # range, `SFSF-IKCRX055` for the maker's `SFIK-CRX055` -- and one rewrite per shape covers them.
    codeRewrite:
      - match: 'SFG([A-Z]{2})([A-Z]*)-?(\d.*)'
        replace: 'SF\1-\2\3'
        reason: gamenerdz, 132 rows; the two-letter line code is what the maker hyphenates after
      - match: 'SFSF-([A-Z]{2})(.*)'
        replace: 'SF\1-\2'
        reason: gamenerdz's doubled company prefix on the Warmachine range
    # Steamforged tags vendor per in-house game line rather than by company name, and since
    # 2026-08 those lines are split across TWO of its own Shopify stores -- mfr-steamforged
    # (steamforged.com) and mfr-warmachine (warmachine.gg). One vendorNames list spans both: a
    # vendor string means the same brand whichever store serves it, and the store split is a
    # fact about sources, not about who makes the product.
    #
    # Guild Ball/Godtear/Epic Encounters (+ the "Local Legends" variant) are exactly the game
    # lines the retired .NET tool's own vendorMap attributed to "Steamforged Games" (git show
    # 1593ee1^:tools/WarHub.ProductCatalog.Tool/ProductCatalogApp.cs, ~line 1154).
    #
    # Iron Kingdoms and P3 Paints were EXCLUDED here until 2026-08-12, listed alongside the
    # store's genuinely-licensed board-game/RPG tags (Dark Souls, Elden Ring, Monster Hunter,
    # ...) on the grounds that the old tool never scraped them either. That was a
    # misclassification: the licensed tags are third-party IP Steamforged only publishes,
    # whereas Warmachine, Iron Kingdoms and Formula P3 are all brands Steamforged BOUGHT
    # outright from Privateer Press in 2024 and now owns. The 2026-08 store split made the
    # error visible -- warmachine.gg carries all three together as one in-house catalogue --
    # so they are attributed here. Live probe 2026-08-12: 361 Warmachine, 222 P3 Paints, 25
    # Iron Kingdoms, 1 app-subscriber variant. All 222 P3 skus match codePattern above (the
    # range was re-coded to SF* after the acquisition), so they resolve like any other product.
    # The licensed board-game/RPG tags remain excluded, unchanged.
    #
    # "Steamforged Games - Tradeshow" is deliberately NOT here despite naming the company: all
    # 4 products under it (both stores) are Baron of Dice accessories -- skus BOD001-BOD003,
    # 0 of 4 matching codePattern -- i.e. another maker's goods on a Steamforged booth.
    # See docs/research/2026-08-12-steamforged-warmachine-store-split.md.
    vendorNames: [Steamforged Games, Steamforged, Warmachine, 'Warmachine (app subscribers only)', Guild Ball, Godtear, Epic Encounters, 'Epic Encounters: Local Legends', Iron Kingdoms, P3 Paints]
  - slug: warlord-games
    name: Warlord Games
    # A TRAILING `K` IS WARLORD'S OWN STORE SPELLING, NOT A PRODUCT: `403011012K` and `WGB-BI-35K`
    # on 89 store rows and the frozen import, `403011012` and `WGB-BI-35` on every retailer.
    # Measured 2026-09-02, the store carries NO pair of codes differing only by the `K`, so the
    # named groups leave it out and 31 published records stop holding two spellings of one code.
    codePattern: '(?P<num>[0-9]{9,12})K?(-[0-9]{1,2})?|(?P<alpha>(?=[A-Z0-9-]*[A-Z])[A-Z0-9-]{5,}?)K?'
    # Warlord-BLISTER / Warlord-WEB: tistaminis.com's brand-format tagging convention
    # (same pattern as GW-Local/GW-Web/GW-OOP above) for Warlord Games stock. Discovered
    # on a full 100-page live enumeration of tistaminis.com/products.json 2026-07-13
    # (Plan 5 Task 1); "Warlord-BLISTER" alone was 77 products in a 1,500-product sample
    # -- by far the largest unmapped tracked-brand vendor string found. Confirmed by
    # product sample: titles/skus are Warlord Games lines (Hail Caesar sku WGH-IR-22,
    # Bolt Action sku WGB-RI-130).
    #
    # THE OTHER EIGHT STRINGS WERE MEASURED OFF THE STORE ITSELF, 2026-09-01, by paging
    # store.warlordgames.com/products.json (5,892 products, 44 distinct vendor strings). A vendor
    # this file does not know is not a product filed elsewhere -- `shopify.py` counts it
    # `skipped_unknown_vendor` and DROPS THE ROW -- so every string below was 100% absent from the
    # live evidence while the products themselves sat in the catalog off the frozen legacy import.
    #
    # `Warlord Games - web exclusive` (107), `Warlord Games Ltd` (2) -- the store's own label
    # variants. Nothing to decide; they were simply unlisted.
    #
    # `Skytrex` (145) + `Warlord Games/Skytrex` (32) -- Skytrex Ltd of Loughborough, which Warlord
    # ACQUIRED in November 2020 and runs as a sister company. This is the same call the top of this
    # file already makes for Citadel and Forge World: a wholly-owned brand is its parent's. Half
    # the range carries Warlord's own 9-digit numbering (`408800045 Bolt Action Objective Marker
    # Set - Great Britain`) and half carries Skytrex's (`GABIONS01`, `OTT02`), which is what a
    # subsidiary looks like mid-absorption and is not a reason to split it out.
    #
    # `War World Scenics` (28) and `Playmats.eu` (4) -- suppliers, not brands, and the SKU says so:
    # every one of the 32 rows carries a Warlord 9-digit code, and the 28 static-grass tubs are
    # Warlord's own `Battlefields & Basing` range ("from War World Scenics", in Warlord's copy).
    # The vendor field names who manufactured it; the product is Warlord's.
    #
    # `Wargames Factory` (9) -- the US plastics company behind the Saxon Fyrd and Numidian sprues.
    # It stopped trading between 2016 and 2019 and Warlord, its exclusive distributor since 2016,
    # has held and modified the tooling since; 8 of the 9 rows carry Warlord's numbering.
    #
    # `ITALERI` (9) -- co-branded rather than resold. Italeri S.p.A. tools the 1:56 Bolt Action
    # vehicles under agreement with Warlord, who packages and numbers them (`402013057 M24 Chaffee
    # Light Tank`). Italeri's OWN kits are not in this catalog, so the string means the Warlord
    # product every time it appears here.
    vendorNames: [Warlord Games, Warlord-BLISTER, Warlord-WEB, 'Warlord Games - web exclusive',
                  Warlord Games Ltd, Skytrex, 'Warlord Games/Skytrex', War World Scenics,
                  Playmats.eu, Wargames Factory, ITALERI]
  - slug: wyrd-games
    name: Wyrd Games
    codePattern: 'WYR\d+[A-Z ]*'
    # giveusyourmoneypleasethankyou-wyrd.com (own Shopify store, probed 2026-07-13) uses these 5
    # vendor tag variants across its ~707 products (518 "Wyrd Miniatures - Online Store", 185
    # "Wyrd", 2 "Wyrd Games", 1 "Wyrd Miniatures", 1 "WYRD - PROMO") -- all the same company's
    # own catalog, no other vendor observed. See task-6-report.md.
    vendorNames: [Wyrd Games, Wyrd Miniatures, Wyrd, 'Wyrd Miniatures - Online Store', 'WYRD - PROMO']
  # --- Brands Warlord Games RESELLS on its own webstore -------------------------------------------
  #
  # WHY THEY ARE HERE AND NOT UNDER `warlord-games`. store.warlordgames.com is a shop as well as a
  # manufacturer's site, and 1,012 of its 5,892 products are somebody else's -- measured 2026-09-01
  # off its own `products.json`. Every one of those products is ALREADY IN THIS CATALOG, filed
  # under `warlord-games`, because the frozen legacy import took the manufacturer from the path it
  # scraped (`warlord-games/<game>/<faction>/<slug>`) and had no other answer available. Naming the
  # vendor here does not add a product; it moves one that is already published to the company that
  # made it, through `SourceDescriptor.manufacturerIsShelf`.
  #
  # NONE OF THESE IMPLIES A HARVEST. A manufacturer entry is an identity, not a source: `reaper`
  # has stood here for months with its products arriving from one retailer. What an entry buys is
  # that `T510C` publishes as `sarissa-precision/T510C` rather than as a Warlord product, and that
  # the store's own `product_type` -- `Terrain`, `Bases`, `Basing`, `Rules & Books`, `Paint Pen` --
  # reaches the record at all.
  #
  # THE LINE BETWEEN THIS BLOCK AND THE EIGHT STRINGS ADDED TO `warlord-games` ABOVE IS THE PRODUCT
  # CODE. A supplier whose output ships under Warlord's numbering and a Warlord range name is
  # making Warlord's product; a company whose own article numbers are on the box is making its own.
  # The codes below are all the second kind.
  #
  # THE LONG TAIL IS DELIBERATELY LEFT UNMAPPED: 14 vendor strings carrying one product each, plus
  # `Freesia Enterprise Ltd` (13), `Dave Taylor` (18), `Shaggy Dog` (5), `Tabletop Workshop` (6),
  # `4Ground` (2) and `Gripping Beast` (4) which ARE mapped below because their ranges are coherent
  # and coded. The singletons include a model shop (`HANNANTS`), a magnet supplier
  # (`First4magnets`) and several one-off resales; each would be a manufacturer entry for one
  # record, and they stay where they are -- which changes nothing about them, since that is where
  # they already are.
  - slug: sarissa-precision
    name: Sarissa Precision
    # 329 products, the largest third-party range on the store and the reason this block exists.
    # Laser-cut MDF terrain, 15mm and 28mm, sold across eight letter series that the catalog had
    # filed as Warlord product codes: `T` Rome/ancients, `M` North American and ACW, `J` Dark Ages,
    # `L` English timber-framed, `K` Pacific, `N` WWII North-West Europe, `B` feudal Japan AND
    # acrylic bases, `R0xx` armoured trains. Sarissa Precision Limited (company 08421922, Langley
    # Mill) is independent -- no acquisition; it also cuts to order for other companies, which is
    # why a few of its rows carry a Warlord code and stay uncoded here.
    #
    # THE PATTERN REQUIRES A LETTER, and that is what keeps Warlord's own numbering out: the six
    # rows on this vendor carrying a 9-digit Warlord code (`409913015 US LCVP Landing Craft`) are
    # Warlord products Sarissa cut, and an all-digit code must not become a Sarissa identity.
    codePattern: '(?=[A-Z0-9_-]*[A-Z])[A-Z0-9][A-Z0-9_-]{2,}'
    vendorNames: [Sarissa, 'Warlord Games/Sarrisa']
  - slug: north-star-military-figures
    name: North Star Military Figures
    # 97 products. Nottingham; makes and sells the plastic and metal ranges for three Osprey Games
    # titles -- `FGV`/`FGAP` Frostgrave, `OAKP` Oathmark, `SGVP` Stargrave. OSPREY IS NOT THE
    # MANUFACTURER: it publishes the rulebooks, North Star makes the figures, and a catalog that
    # recorded the publisher would be wrong about every box.
    codePattern: '[A-Z]{2,4}\d{2,4}'
    vendorNames: [Northstar, North Star Military Figures]
  - slug: micro-art-studio
    name: Micro Art Studio
    # 69 products, all `H00xxx`: pre-painted HDF terrain licensed for Bolt Action, made in Gdynia.
    #
    # FIVE DIGITS, NOT THREE, AND THE WIDTH IS LOAD-BEARING. Sarissa numbers its Waterloo buildings
    # `H003`-`H008` (La Belle Alliance, Hougoumont, La Haye Sainte) on the same letter. Keying on
    # the letter alone would hand one company's buildings to the other.
    codePattern: 'H\d{5}|[A-Z]{2,}BUNDLE'
    vendorNames: [Micro Art Studio]
  - slug: renedra
    name: Renedra
    # 37 products: injection-moulded plastic bases and terrain kits. Renedra also tools for Perry,
    # North Star and Warlord themselves, so the same caution as Sarissa applies -- what is recorded
    # here is the range Renedra sells under its own name and numbers `REN-*`, `RN*` or by object
    # (`BARFENCE`, `GRAVES2`, `PICKETFENCE`).
    codePattern: '(?=[A-Z0-9_-]*[A-Z])[A-Z0-9][A-Z0-9_-]{2,}'
    vendorNames: [Renedra]
  - slug: perry-miniatures
    name: Perry Miniatures
    # 33 products. Alan and Michael Perry's own company; 28mm historical metal and plastic. The
    # codes carry a space in eight of them (`ACW 120`, `BH 90-BRIG`), which is why the class here
    # is wider than the others.
    codePattern: '(?=[A-Z0-9 _-]*[A-Z])[A-Z][A-Z0-9 _-]{2,}'
    vendorNames: [Perry Miniatures]
  - slug: hornby-hobbies
    name: Hornby Hobbies
    # 35 products under THREE vendor strings, and they are one company: Hornby Hobbies Ltd bought
    # Humbrol and Airfix in 2006 and still owns both. Splitting them would put `A06014 Heinkel He111
    # P-2` and `AV0014 Weathering Powder Smoke` under different manufacturers for no reason a
    # consumer would recognise.
    #
    # `R7xxx` (Hornby model-railway scenic trees) is the range that made this necessary: it shares
    # the letter `R` with Sarissa's armoured-train series `R001`-`R034`, and the four-digit width
    # separates them exactly as `H` separates Micro Art Studio from Sarissa above.
    codePattern: 'R7\d{3}|A[0-9A-Z]\d{4}[A-Z]?'
    vendorNames: [Hornby, Humbrol, Airfix]
  - slug: freesia-enterprise
    name: Freesia Enterprise
    # 13 products, all `FEPT*`: the Paint Tamer brush range, handmade in Japan. Freesia is also The
    # Army Painter's Japanese distributor, which is not what these rows are -- Paint Tamer is
    # Freesia's own brand.
    codePattern: 'FEPT[A-Z0-9]*'
    vendorNames: [Freesia Enterprise Ltd, Freesia Enterprise]
  - slug: dave-taylor-miniatures
    name: Dave Taylor Miniatures
    # 18 products: self-published hobby art books (`THE ART OF...` volumes, `28 Collected`). 16 of
    # the 18 are numbered by ISBN-13 and two by the imprint's own `DTM` code, so the pattern takes
    # both. An ISBN is a real product code for a book and the right identity to publish under.
    codePattern: '97[89]\d{10}|DTM\d+'
    vendorNames: [Dave Taylor, Dave Taylor Miniatures]
  - slug: shaggy-dog-publishing
    name: Shaggy Dog Publishing
    # 5 products: `Talking Miniatures` and `The Stuff of Legends`, ISBN-numbered, with signed
    # editions carrying a suffix on the same ISBN. Founded by Warlord's John Stallard PERSONALLY,
    # which is not the same thing as Warlord owning it -- unlike Skytrex above, so it is separate.
    codePattern: '97[89]\d{10}[A-Z]*|SOLTM'
    vendorNames: [Shaggy Dog, Shaggy Dog Publishing]
  - slug: tabletop-workshop
    name: Tabletop Workshop
    # 6 products, `28MED*`: hard-plastic modular 28mm medieval buildings.
    codePattern: '28[A-Z]{3,}'
    vendorNames: [Tabletop Workshop]
  - slug: gamers-grass
    name: GamersGrass
    # 6 products, `GGLP-*`: the Laser Plants range. Portuguese, Torres Vedras.
    codePattern: 'GG[A-Z]*-[A-Z0-9]+'
    vendorNames: [Gamers Grass, GamersGrass]
  - slug: four-ground
    name: 4Ground
    # 2 products, `28S-WAW-*`: pre-painted laser-cut MDF. 4Ground Publishing ceased trading in 2022
    # and the range continues through a sister company, which is exactly the case OBJECTIVES 1
    # exists for -- a closure never removes data.
    codePattern: '\d{2}[A-Z]-[A-Z]{2,4}-\d+'
    vendorNames: [4Ground, Four Ground]
  - slug: gripping-beast
    name: Gripping Beast
    # 4 products, `GBP*` plus one `CONQUEST1` bundle: Dark Ages plastics.
    codePattern: '(?=[A-Z0-9]*[A-Z])[A-Z]{2,}[A-Z0-9]*\d'
    vendorNames: [Gripping Beast]
  - slug: wargames-illustrated
    name: Wargames Illustrated
    # 20 products, `WI4xx`: single print issues of the monthly magazine, which Warlord's store
    # files under the non-taxonomy product type `No Discount Codes`. A magazine issue is a `book`
    # in this catalog's vocabulary and belongs to no game system.
    codePattern: 'WI\d{3}'
    vendorNames: [Wargames Illustrated]
  # --- Paint manufacturers (paint harvest sources; see
  # docs/research/2026-07-23-paint-manufacturer-harvest-design.md) ---
  - slug: vallejo
    name: Vallejo
    # `\d{5}` AND `VAL` STRIPPED, ADDED 2026-08-27, because the dotted form alone matched NOTHING
    # that reaches the product catalog. Vallejo prints its codes as `70.886`, but no source in this
    # repo writes them that way: `ret-goblingaming` says `VAL70886` (1,201 rows) or bare `70886`
    # (10), and `mfr-vallejo` -- which is `catalog: paints` and never reaches this resolver anyway
    # -- says `71282`. Measured before this change: 0 of 2,295 vallejo product observations
    # normalized to a code, so every one of the 2,270 published Vallejo products was a slug of some
    # shop's title. That is what fused `vallejo/green-grey-18ml-model-colour` -- two DIFFERENT
    # paints, 70886 and 70971, that one retailer happens to name identically.
    #
    # `\d{5}` cannot swallow a shop's house number here: `ret-radaddel` numbers its Vallejo listings
    # 6 digits (1,084 of 1,084 measured), so they stay uncoded, which is correct -- they are
    # radaddel's numbers, not Vallejo's.
    codePattern: '\d{2}\.\d{3}|\d{5}'
    codeStrip: [VAL]
    # GS1 prefix verified by the paint tool's EanComputer (computed Vallejo EANs are
    # 8429551 + code digits + check digit).
    gs1Prefixes: ['8429551']
    vendorNames: [Vallejo, Acrylicos Vallejo, AV]
  - slug: ak-interactive
    name: AK Interactive
    # WIDENED 2026-08-26 BY PREFIX, and that distinction is the whole point. The old pattern
    # `(AK|RC|ABT)\s?\d{2,5}[A-Z]?(-[A-Z0-9]+)?` codes 1,094 of this source's 1,253 observations.
    # The 159 it misses are not a ragged edge: they are whole product FAMILIES whose article
    # numbers carry a longer letter prefix -- AKABT (69 rows, the Abteilung 502 oils), AKAD (48,
    # Artistic Dense acrylics), ABTP (15) and ABTPF (3, pigments), AKG (14, gouaches), AKPACK (4,
    # signature bundles). Every family fails 100%, singles and sets alike. 32 of those rows reach
    # the product catalog through `crossoverToProducts` and the resolver's identity floor then
    # refuses them -- ak-interactive.com publishes no barcode anywhere, so a row whose sku will not
    # normalize has no addressable identity at all and would publish under a slug of the shop's
    # title. They are conflicts.yaml's `paint-set-without-identity` and
    # `hobby-auxiliary-without-identity` rows, including the AKABT111/112/113 thinners.
    #
    # THE SOURCE DESCRIPTOR SAYS THIS CANNOT BE FIXED THIS WAY, and it is right about one shape of
    # widening and wrong about the other. `mfr-ak-interactive.yaml` says "a pattern loose enough to
    # swallow the item numbers would code the range strings too". Measured over the committed
    # evidence, both shapes:
    #
    #   loosen the TRAILING letters  `(AK|RC|ABT)\s?\d{1,5}[A-Z]*...`
    #       codes 1,099 of 1,253 -- and codes 4 of the 5 range strings, because after
    #       space-stripping `AK 3G RANGE AFV` is `AK` + `3` + `GRANGEAFV`. The warning holds.
    #   extend the PREFIX (this change)
    #       codes 1,247 of 1,253 -- and codes 0 of the 5 range strings, because `AK3GRANGEAFV`
    #       still has letters after its digit run and `RANGEAKAD` has no digit run at all.
    #
    # The five freehand range strings were left refused on that basis until 2026-08-27, when the
    # maker's own product pages showed them to be boxed products with skus -- see the RANGE
    # alternative below. They are still the only SKUs in the whole 1,253-row file with a space.
    #
    # ENUMERATED RATHER THAN `AK[A-Z]*`, which measures identically (1,247 of 1,253) but would code
    # any future letter salad this source ships.
    #
    # `AKM`/`AKMQ` ARE DELIBERATELY ABSENT although they are real AK prefixes (the playmarker
    # lines). This source observes none of them -- they arrive only from `ret-goblingaming` and
    # `legacy-catalog` -- and goblingaming states them with its own variant suffix, so admitting
    # them codes 67 entities as `ak-interactive/AKM002-SINGLE`: a RETAILER'S variant marker
    # published as AK's article number, which trades one unstable id for another. Measured both
    # ways: with AKM the identity-floor refusals go 32 -> 5 and 124 published ids are replaced by
    # 150; without it the refusals go 32 -> 5 just the same, and 1 id is replaced by 27. Same
    # outcome for the thing this change is for, a hundredth of the churn. The cost is that
    # `ak-interactive/animal-green-playmarker` keeps its title slug and the AKM014 product code
    # stays dropped.
    # THE `RANGE` ALTERNATIVE, ADDED 2026-08-27, REVERSES A REFUSAL THIS FILE ARGUED FOR. Five AK
    # skus contain a space and were left uncoded on the grounds that they are "shop range pages,
    # not product identities". ak-interactive.com says otherwise: /product/3gen-afv-full-range/
    # publishes `SKU: AK 3G RANGE AFV`, price 220,00 EUR, "80 colors in total", 8kg, shipped in one
    # 50x35x33cm box. That is a boxed product with the maker's own article number, and the identity
    # floor exists to stop a record being named after a shop's TITLE -- which a maker's sku is not.
    #
    # `normalize_code` strips spaces before matching, so the sku becomes `AK3GRANGEAFV` and the id
    # becomes `ak-interactive/AK3GRANGEAFV`: stable across a retitle, which is the whole point.
    # IT ENUMERATES THE TWO RANGE FAMILIES ON PURPOSE, against this file's own "KINDS, NOT MEMBERS"
    # rule, because the kind-level version is demonstrably unsafe: `[A-Z0-9]*RANGE[A-Z0-9]*` also
    # matches a shop TITLE -- "3GEN AFV Series Full Range" space-strips to `3GENAFVSERIESFULLRANGE`
    # and would become a product code. That is precisely the failure the identity floor exists to
    # prevent, so the looser form trades the bug it fixes for the bug it was guarding against.
    # `test_ak_interactive_codes_its_letter_prefixed_families_but_not_the_range_pages` pins both
    # halves: the five skus code to themselves, and two title-shaped strings still refuse.
    codePattern: '(AKABT|AKAD|AKPACK|AKG|AK|ABTPF|ABTP|ABT|RC)\s?\d{1,5}[A-Z]?(-[A-Z0-9]+)?|AK3GRANGE[A-Z]+|RANGEAKAD'
    vendorNames: [AK Interactive, AK-Interactive]
  - slug: army-painter
    name: The Army Painter
    # BNDL added 2026-08-05 for the boxed sets crossing into the product catalog
    # (mfr-armypainter.yaml crossoverToProducts): thearmypainter.com numbers its bundles
    # BNDL212/224/230, outside the range prefixes. Codes 48 of the 49 selected sets. The last
    # uncoded row is 75005 "D&D Undead Paint Set"; left as a name slug rather than widening
    # further to chase one row.
    #
    # TL/BR ADDED 2026-08-26, REVERSING THE NOTE THAT STOOD HERE. It said "TL/BR were considered
    # and rejected -- they are the BRUSH set prefixes, which that block vetoes anyway, and adding
    # them measures 52 of 56 rather than the 55 an earlier estimate claimed." Both halves are about
    # the CROSSOVER SELECTION -- which of this paint source's rows get pulled into the product
    # catalog as boxed sets -- and that is a different code path from `Taxonomy.normalize_code`.
    # TL and BR rows reach the product catalog anyway, from `legacy-catalog` and from retailers who
    # stock Army Painter tools and brushes, and for those the pattern decides whether the record
    # gets a product code or a slug of somebody's shop title.
    #
    # Measured 2026-08-26 over the resolved catalog: 47 published ids are replaced by 46, every one
    # of them under army-painter, and the swap is name-slug -> article number
    # (`army-painter/hobby-knife` -> `army-painter/TL5034`, `army-painter/basecoating-brush` ->
    # `army-painter/BR7003`). 47 for 46 because two slugs that were separate records collapse onto
    # one code. No conflict count moves -- this fixes identity, not disagreement -- and
    # `report --ean-guard` reports 0 lost, every barcode following its record to the coded id.
    #
    # `(-[A-Z0-9]+)?` is deliberately NOT appended to this alternative, unlike ak-interactive's:
    # measured both ways, it changes nothing here (same 47/46), and leaving it off keeps a
    # retailer's variant suffix out of Army Painter's article numbers.
    #
    # A TRAILING `P` IS A SPELLING AND EVERY OTHER TRAILING LETTER IS A PRODUCT, measured
    # 2026-09-02 on thearmypainter.com's own rows: `WP8057P` is `WP8057` (689 rows carry the `P`,
    # the frozen import and Warlord's store write it without), while `GM1010C` is the Combo and
    # `…S` the Satin, each with a barcode of its own. So the named groups keep any letter but `P`,
    # and the `P?` outside them is what the group leaves behind. 20 published records held both
    # spellings before this.
    codePattern: '(?P<paint>(WP|AW|CP|SM|GM|QS|BF|ST)\d{4}[A-OQ-Z]?)P?|(?P<bundle>BNDL\d{3,4})|(?P<tool>(TL|BR)\d{4}[A-OQ-Z]?)P?'
    # EAN 5713799314009 observed live on thearmypainter.com variant barcode (Warpaints
    # Fanatic: Moldy Wine, WP3140P) -> GS1 Denmark company prefix.
    gs1Prefixes: ['5713799']
    # thearmypainter.com (own Shopify store, probed 2026-07-23) tags every product with
    # vendor "The Army Painter (B2C)".
    vendorNames: [The Army Painter, 'The Army Painter (B2C)', Army Painter]
