    # Live store vendor string is 'SCALE75 - HOBBIES & GAMES' (all caps, 2026-07-24); matching
    # is casefolded so the mixed-case spelling below also covers it.
    vendorNames: ['SCALE75 - Hobbies & Games', 'Scale75', 'SCALE75']
