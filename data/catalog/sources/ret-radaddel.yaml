id: ret-radaddel
kind: retailer
strategy: shopify
baseUrl: https://radaddel.de
scope:
  currency: eur
politeness:
  # Unchanged. Live probe 2026-08-18: 80/80 detail fetches returned 200 at this rate, while a
  # ~2.5 rps sample of 400 handles drew a 39.5% error rate. Do not raise it.
  rps: 0.5
contract:
  # PORTED SHAPE, matching every other `strategy: shopify` descriptor in this repo
  # (mfr-steamforged, mfr-warmachine, mfr-warlord-store, mfr-wyrd-store, ret-goblingaming,
  # ret-tistaminis -- all six gate name+sku, none gates ean).
  #
  # WHY `ean: 0.5` DID NOT SURVIVE THE PORT, and why this is not a floor being lowered to go
  # green. Under sitemap-structured-data the budget rations ENUMERATION, so `result.observations`
  # was the set of pages actually fetched this run and an ean fill-rate over it measured exactly
  # what the old comment claimed: whether extraction still works. Under shopify the budget rations
  # only the per-handle DETAIL fetch; enumeration is full on every run (runner.py:84-97 states
  # this as the assumption that makes the unconditional minCount check safe), so
  # `result.observations` is the whole attributed population and an ean rate over it measures
  # budget/population, not extraction health. Measured live 2026-08-18 at --budget 200:
  # 199 barcodes off 200 detail fetches (99.5% -- extraction is fine) against 7,691 observations
  # = 0.026, so the old gate fails at 4 every night and, because contract checks run before
  # cursor_store.save, the 199 confirmed eans are never persisted: every run re-slices the same
  # head and fails identically. It cannot converge. Gating the bulk fields instead is what makes
  # the accumulate-over-nights mechanism work -- verified: exit 0, cursor holds 199 eans.
  #
  # minCount RAISED FROM 0, not lowered. The old 0 was correct for a strategy whose enumeration
  # was itself budgeted ("partial by design"); shopify enumerates fully every run, so a floor is
  # meaningful here and its absence would leave an enumeration collapse silent. Evidence-based at
  # ~85% of observed, the convention used by the sibling descriptors: live run 2026-08-18 saw
  # 11,733 products store-wide, 7,691 attributed to tracked manufacturers (4,042 dropped as
  # unknown vendor). 0.85 * 7,691 = 6,537.
  minCount: 6537
  maxDropPct: 30
  requiredFieldRates:
    # Measured on the same run over all 7,691 attributed observations: name 1.000, sku 1.000.
    name: 1.0
    sku: 0.8

# THIS STORE'S ARTICLE NUMBER IS ITS LISTING ID -- see SourceDescriptor.skuIsListingId.
#
# WHY IT IS SET HERE AND NOWHERE ELSE. This source changed strategy on 2026-08-21
# (`sitemap-structured-data` -> `shopify`, the port the `contract` block above documents), and the
# key shape changed with it: 4,095 observations are still keyed `ret-radaddel:/<path>` from the
# old extractor, 7,709 are keyed `ret-radaddel:<handle>` from the new one. Nothing prunes the old
# generation, so 3,820 listings are in the ledger twice.
#
# The two generations differ in exactly the way that matters here: the old one carries a barcode on
# 3,614 of 4,095 rows, the new one on 1,959 of 7,709, because `shopify` budgets the per-handle
# detail fetch and accumulates barcodes over nights. So the newer copy of a listing is typically
# anchorless -- no code (this store's sku is a 6-digit house number that matches no manufacturer's
# codePattern; measured: 0 of 11,804 rows normalize to a product code) and no barcode -- and it
# founds an entity of its own under a slug of the German shop title.
#
# WHAT SAYS THE TWO GENERATIONS ARE THE SAME LISTING. Measured 2026-08-26 over the committed
# evidence: 3,819 sku groups, and of the 638 where BOTH generations carry a barcode, 638 agree and
# 0 disagree. No group disagrees on the manufacturer either. That is the bijection this flag
# asserts, and `join.py` re-checks it per group on every run rather than trusting this comment.
skuIsListingId: true
