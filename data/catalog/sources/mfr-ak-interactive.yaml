id: mfr-ak-interactive
kind: manufacturer
# Feeds the PAINT catalog: gen_paint_harvest.py projects these observations onto
# data/paints/. Without this the product resolver publishes every paint a second time.
catalog: paints
strategy: woo-paints
baseUrl: https://ak-interactive.com
scope:
  manufacturer: AK Interactive
  # WPML store: without lang=en the Store API answers in the default locale (live-verified
  # 2026-07-23: Spanish names/permalinks).
  extraParams:
    lang: en
  # Store categories to sweep (Store API accepts category=<slug>, live-verified 2026-07-23
  # with X-WP-Total counts): paints-acrylics 999 (3GEN singles/sets, washes, dense), quick-gen
  # 112, abteilung502 119 (oils; includes a few books -- bridge filters), spray lines 25+25.
  # real-colors has no working category slug on the EN store; that range stays covered by the
  # Arcturus base set.
  categories:
    - paints-acrylics
    - quick-gen
    - abteilung502
    - ak-spray-colors
    - ak-spray-primers
politeness:
  # ak-interactive.com's WAF 403s any UA containing a bot token -- including the robots.txt
  # fetch itself (live matrix 2026-07-23: bot UA 403, curl 200, browser 200). Their robots.txt
  # rules allow us (only Amazon bots are disallowed); uaProfile swaps the identification string
  # so robots.txt can actually be FETCHED and honored -- evaluation stays pinned to the
  # canonical bot token (see runner.py).
  uaProfile: browser
  rps: 0.5
  timeoutSeconds: 60
contract:
  # ~1,280 raw category memberships minus overlaps (quick-gen/set products are also in
  # paints-acrylics); floor set after the first committed snapshot (2026-07-23 run: see
  # evidence dir) -- generous because this source is run on demand, not on a schedule.
  minCount: 700
  maxDropPct: 50
  requiredFieldRates:
    name: 1.0
    sku: 0.9
# Boxed multi-pot sets are PRODUCTS, not paints -- see resolve/crossover.py for the shared
# evaluator gen_paint_harvest.py refuses the same rows with.
crossoverToProducts:
  reason: >
    Boxed multi-pot sets are PRODUCTS, not paints (maintainer decision 2026-08-05).
    Measured 2026-08-05 over all 1,142 observations: this block selects 285 -- 216 by
    category slug, 153 by title, and NEITHER signal contains the other (132 category-only,
    69 title-only). That is why both clauses are present and why the predicate cannot be
    a single shared rule across sources.
    29 of the 285 fail the resolver's identity floor and land in review/conflicts.yaml as
    `set-without-identity` rather than crossing: ak-interactive.com publishes ZERO barcodes
    anywhere (0 of 1,142 observations carry an ean), so a row whose sku does not match this
    manufacturer's codePattern has no addressable identity at all and would publish under a
    slug of its store title. The 29, exactly: AKABT301-311 (11), AKAD102-109 (8), the four
    "AK 3G RANGE AFV/AIR/FIG/GENERIC", AKG25, AKG26, AKPACK74, AKPACK78, AKABT1000 and
    "RANGE AKAD". Deliberately NOT fixed by widening the codePattern here: that list mixes
    real item numbers with freehand RANGE STRINGS which are not product identities at all,
    and a pattern loose enough to swallow the former would code the latter too. Surfacing
    them as a reviewable list is the point.
    The remaining 256 cross code-anchored and barcode-less; they are ~1% of the catalog by
    count and contribute nothing to the EAN coverage the repo's guards measure.
  category: paint-set
  anyOf:
    - hintContainsAny: {categorySlugs: [3rd-set, paints-acrylics-sets, b2b-3gen-sets]}
    - nameMatches: '\b(SET|COLLECTION|FULL RANGE|BRIEFCASE|WOODEN BOX)\b'
