id: mfr-ak-interactive
kind: manufacturer
# Feeds the PAINT catalog: gen_paint_harvest.py projects these observations onto
# data/paints/. Without this the product resolver publishes every paint a second time.
catalog: paints
strategy: woo-paints
baseUrl: https://ak-interactive.com
scope:
  manufacturer: AK Interactive
  # WPML store: without lang=en the Store API answers in the default locale (live-verified
  # 2026-07-23: Spanish names/permalinks).
  extraParams:
    lang: en
  # Store categories to sweep (Store API accepts category=<slug>, live-verified 2026-07-23
  # with X-WP-Total counts): paints-acrylics 999 (3GEN singles/sets, washes, dense), quick-gen
  # 112, abteilung502 119 (oils; includes a few books -- bridge filters), spray lines 25+25.
  # real-colors has no working category slug on the EN store; that range stays covered by the
  # Arcturus base set.
  categories:
    - paints-acrylics
    - quick-gen
    - abteilung502
    - ak-spray-colors
    - ak-spray-primers
    # ADDED 2026-08-09, and chosen by what AK's own boxed sets ask for rather than by browsing the
    # category tree. Acquiring the 256 sets' contents produced 30 refusals over 14 distinct codes;
    # querying the Store API for each showed 8 of them are products AK SELLS TODAY, in exactly
    # these two categories -- AK479/480/488 (Xtreme Metal Aluminium family) and AK012/AK014
    # (Streaking Grime), AK088/AK089 (chipping fluids), AK636 (Starship Detail Wash). The sets were
    # naming paints the sweep could not see.
    #
    # This is the case where "extend the descriptor and re-acquire" is genuinely the fix -- worth
    # saying because the same sentence was WRONG for mfr-reaper one commit ago, where no page
    # existed to point at. The difference is checkable, not a matter of taste: here the products
    # answer a live Store API query and name their own category slug.
    #
    # NARROWEST PAIR THAT DOES THE JOB. `paints-weathering` (196) and `metallic-paint` (48) would
    # also cover them and pull in several times as much; these two are 84 + 27 and were picked by
    # intersecting the categories the 8 refused skus actually carry. Weathering singles and Xtreme
    # Metal are paints by AK's own taxonomy (both sit under its `paints` parent), which is the only
    # authority this repo accepts for what a manufacturer sells.
    - xtreme-metal-paints
    - paints-weathering-single
politeness:
  # ak-interactive.com's WAF 403s any UA containing a bot token -- including the robots.txt
  # fetch itself (live matrix 2026-07-23: bot UA 403, curl 200, browser 200). Their robots.txt
  # rules allow us (only Amazon bots are disallowed); uaProfile swaps the identification string
  # so robots.txt can actually be FETCHED and honored -- evaluation stays pinned to the
  # canonical bot token (see runner.py).
  uaProfile: browser
  rps: 0.5
  timeoutSeconds: 60
contract:
  # ~1,280 raw category memberships minus overlaps (quick-gen/set products are also in
  # paints-acrylics); floor set after the first committed snapshot (2026-07-23 run: see
  # evidence dir) -- generous because this source is run on demand, not on a schedule.
  minCount: 700
  maxDropPct: 50
  requiredFieldRates:
    name: 1.0
    sku: 0.9
# Boxed multi-pot sets are PRODUCTS, not paints -- see resolve/crossover.py for the shared
# evaluator gen_paint_harvest.py refuses the same rows with.
crossoverToProducts:
  reason: >
    Boxed multi-pot sets are PRODUCTS, not paints (maintainer decision 2026-08-05).
    BOTH SIGNALS ARE LOAD-BEARING HERE: the category slug and the title each select rows the
    other misses, and NEITHER is a subset of the other. That is why both clauses are present
    and why the predicate cannot be one shared rule across sources -- greenstuffworld.com's
    title signal is a strict superset of its category signal and reapermini.com's category
    signal does nearly all the work, so the same rule would be wrong for all three.
    A MINORITY FAIL THE RESOLVER'S IDENTITY FLOOR and land in review/conflicts.yaml as
    `set-without-identity` rather than crossing: ak-interactive.com publishes ZERO barcodes
    anywhere (no observation from this source carries an ean), so a row whose sku does not
    match this manufacturer's codePattern has no addressable identity at all and would
    publish under a slug of its store title. They are of two kinds: real item numbers
    (AKABT301-311, AKAD102-109, AKG25, AKG26, AKPACK74, AKPACK78, AKABT1000) and freehand
    RANGE STRINGS which are not product identities at all ("AK 3G RANGE AFV/AIR/FIG/GENERIC",
    "RANGE AKAD"). Deliberately NOT fixed by widening the codePattern: a pattern loose enough
    to swallow the former would code the latter too. Surfacing them as a reviewable list is
    the point, so the list lives in conflicts.yaml where it stays current, not here.
    The rest cross code-anchored and barcode-less, and contribute nothing to the EAN coverage
    the repo's guards measure.
    RE-DERIVE any of the above with `crossover.matches` over
    data/evidence/products/mfr-ak-interactive/observations.jsonl, and the refusals by counting
    `set-without-identity` in data/review/conflicts.yaml. Counts are deliberately not quoted
    here: this source is re-harvested, and a number in this field goes stale silently because
    nothing validates it.
  category: paint-set
  anyOf:
    # FIRST, because clause order decides the stamp where clauses overlap (crossover.py::
    # matched_clause) and this one is the narrow case. AK sells auxiliary AGENTS out of the same
    # paint categories the sweep now covers: thinners, burnishing fluids and the two chipping
    # fluids the boxed sets enumerate (AK088 "Worn Effects Acrylic Fluid", AK089 "Heavy Effects
    # Acrylic Fluid"). They are products -- AK sells them, sets contain them, someone holding one
    # needs to identify it -- but they are not COLOURS, and the paint catalog is a catalog of
    # colours. Crossing them keeps them addressable without asserting they are paint.
    #
    # `category: hobby-auxiliary` rather than the block's `paint-set`: stamping an agent as a
    # boxed set would be the same structural lie this block exists to fix, one level down.
    #
    # IT APPLIES TO THE WHOLE SOURCE, NOT ONLY THE NEWLY SWEPT CATEGORIES, and that is the thing to
    # know before touching the word list. It was added alongside the xtreme-metal-paints and
    # paints-weathering-single sweep and most of its hits sit there (XTREME CLEANER & THINNER, the
    # PRIMER AND MICROFILLER sprays, PHOTOETCH BURNISHING, Metal burnishing fluid, Wet/Worn/Heavy
    # Effects Fluid) -- but a `nameMatches` clause is evaluated against EVERY row this source
    # observes, so it also claims solvent-named rows from elsewhere in the catalogue: AKABT111 /
    # AKABT112 / AKABT113 (odourless, matt-effect and fast-dry thinners), AK712, AK1566, ABT116 and
    # AK1018. Those are auxiliaries and belong here, but none of them matches any OTHER clause in
    # this block, so this clause ADMITS them to the product catalog rather than merely restamping
    # rows that were already crossing. Widening the word list widens the catalog, not just a stamp.
    #
    # The word list is deliberately narrow and anchored: BURNISHING and MICROFILLER name processes,
    # THINNER/CLEANER name solvents, and `\bFLUID\b` is a whole word so it cannot catch a colour
    # named e.g. "Fluid Blue" -- nor a weathering product named for its effect rather than its
    # medium, which is why "MEDIUM RUST DEPOSITS" is NOT matched despite reading like one. No
    # committed AK archive name matches the list at all. Re-derive both with
    # crossover.clause_matches over data/evidence/products/mfr-ak-interactive/observations.jsonl
    # and over the names in data/paints/brands/ak-interactive.yaml.
    - nameMatches: '\b(THINNER|CLEANER|BURNISHING|MICROFILLER|FLUID)\b'
      category: hobby-auxiliary
    - hintContainsAny: {categorySlugs: [3rd-set, paints-acrylics-sets, b2b-3gen-sets]}
    - nameMatches: '\b(SET|COLLECTION|FULL RANGE|BRIEFCASE|WOODEN BOX)\b'
