id: mfr-reaper
kind: manufacturer
# Feeds the PAINT catalog: gen_paint_harvest.py projects these observations onto
# data/paints/. Without this the product resolver publishes every paint a second time.
catalog: paints
strategy: reaper
baseUrl: https://www.reapermini.com
scope:
  manufacturer: Reaper
  # The six real /paints/* data pages (live-mapped 2026-07-24, RE-VERIFIED 2026-08-08): each
  # embeds its line's full product array in the inline Vue bootstrap (`paints: [...]`) -- one GET
  # per page is the entire request footprint. Every other /paints/<slug> is a catch-all serving the
  # data-less marketing page.
  #
  # THIS LIST IS COMPLETE, and that had to be established rather than assumed, because
  # strategies/reaper.py used to blame a missing entry here for the four 29xxx codes that resolve
  # to nothing. Re-mapped live 2026-08-08: the /paints index links exactly 7 pages -- these 6 plus
  # /paints/msp2, which carries no data blob -- and the 6 still hold exactly 541 unique skus.
  # There is no High Density page and no page for 29107/29137/29143/29815. Nothing added here
  # could have closed that gap; the site names those paints only inside set contents, which is
  # where the strategy now reads them from.
  # ORDER MATTERS: the first page claiming a sku wins, so set-kind pages come
  # first -- triad/set skus recur on the singles pages (09819-22 triads on core-colors, Bones
  # Ultra-Coverage sets 09976-81 on bones, 09967-68 on pathfinder, LTPK 08906-07 on
  # paint-sets) and must keep their set identity. `line` labels are the site's own page names.
  linePages:
    - {path: /paints/learn-to-paint-kits, line: Learn to Paint Kits, kind: set}
    - {path: /paints/paint-sets, line: Paint Sets, kind: set}
    - {path: /paints/master-series-paints-triads, line: Master Series Paints Triads, kind: set}
    - {path: /paints/master-series-paints-core-colors, line: Master Series Paints Core Colors, kind: single}
    - {path: /paints/master-series-paints-bones, line: Master Series Paints Bones, kind: single}
    - {path: /paints/master-series-paints-pathfinder-colors, line: Master Series Paints Pathfinder Colors, kind: single}
politeness:
  # HISTORY (2026-07-24): first landed POLICY-BLOCKED, then activated the same day by owner
  # decision via a blanket `ignoreRobots: true`. robots.txt's `User-agent: *` group allows
  # everything this strategy fetches (all /paints/* pages, no crawl-delay, clean 200s to the
  # canonical bot UA) -- but the site also carries Cloudflare's managed AI-crawl-control block
  # (`User-agent: ClaudeBot / Disallow: /`), which this repo's robots enforcement THEN honored
  # as disallowing ourselves, so run_source refused at preflight until that opt-out was added.
  #
  # RESOLVED (2026-08-05): `ignoreRobots` is REMOVED, because the only thing it worked around is
  # gone. acquire/robots.py no longer checks the ClaudeBot token at all (maintainer decision --
  # see that module's docstring for the reasoning, the measured evidence AND the honest
  # counter-argument), so this source now passes the ordinary robots preflight on its own merits,
  # under the `*` group that actually addresses us. Dropping the flag is the STRICTER choice, not
  # the looser one: full per-request enforcement and Crawl-delay honouring are switched back on
  # for this source, so if reapermini.com ever narrows its `*` group or names us, we stop --
  # whereas `ignoreRobots` would have kept fetching regardless. Re-verified live 2026-08-05:
  # `*` -> `Allow: /` with no Crawl-delay, and the six configured /paints/* pages return 200 to
  # the canonical bot UA. The shop's /search/* tree is never fetched regardless.
  #
  # No `uaProfile: browser` here, deliberately: reapermini.com serves the canonical bot UA and a
  # browser UA identically (live 2026-08-05, /paints/master-series-paints-core-colors: bot 200,
  # browser 200), so the override would be unjustified UA-cloaking for zero benefit.
  rps: 0.5
contract:
  # Evidence-based floor (~85% of observed): live snapshot 2026-07-24 counted 555 blob items
  # across the six pages, 541 unique skus after cross-page dedupe (439 singles + 116 sets -
  # 14 recurrences). 541 * 0.85 = 459.9 -> 455. Re-measured 2026-08-08: the six pages still yield
  # exactly 555 items and 541 unique skus, plus 35 set-only paints (see below) for 576 total, so
  # the floor keeps its original meaning and is left alone -- raising it to track the new total
  # would just make a genuine line-page outage harder to see.
  minCount: 455
  maxDropPct: 30
  requiredFieldRates:
    name: 1.0
    sku: 1.0
    # Drift guard on the images array shape: ~97% of LINE-PAGE blob items carry a main image
    # filename (8 of 267 core singles and a handful of sets shipped image-less on 2026-07-24).
    #
    # LOWERED 0.9 -> 0.85 on 2026-08-08, and that is loosening a number to STOP it lying rather
    # than to dodge it. The 35 set-only paints carry no image BY CONSTRUCTION -- a set-member
    # reference names the paint but its `filename` depicts the referenced sku as sold, which for a
    # 12-bottle special order is a case of bottles (strategies/reaper.py::_set_only_paints). They
    # therefore dilute this rate permanently and for a reason that has nothing to do with image
    # drift: 533 of 541 with images before (98.5%, 47 image-less rows of headroom), 533 of 576
    # after (92.5%, only 15). At 0.9 the guard would now fire after 15 line-page images went
    # missing instead of the ~47 it was calibrated for, and a fire would be ambiguous between real
    # drift and Reaper simply naming more paints inside sets. 0.85 restores ~38 rows of headroom,
    # which is the sensitivity this line was actually written to have.
    imageUrl: 0.85
# Boxed multi-pot sets are PRODUCTS, not paints -- see resolve/crossover.py for the shared
# evaluator gen_paint_harvest.py refuses the same rows with.
crossoverToProducts:
  reason: >
    Boxed multi-pot sets are PRODUCTS, not paints (maintainer decision 2026-08-05).
    Measured 2026-08-05 over all 541 observations, re-measured 2026-08-08 over all 576
    (the 35 set-only paints are category "paint" and none of their names carries a set
    word -- "12 Bottle Lot Special Order: Khaki Shadow" has no SET/COLLECTION token --
    so the selection is unchanged): this block selects 115 -- 114 that
    reapermini.com itself labels hints.category "paint-set" (triads, LTPK kits, the
    $659.99 full range) plus exactly 1 the title catches that the category misses, 09985
    "Sophie's Mystery Paint Set", which the store labels hints.category "paint". The
    category signal therefore does the heavy lifting here and the title alone would select
    only 19 -- the OPPOSITE direction to greenstuffworld.com, which is why the predicate
    is declared per source rather than shared.
    All 115 are code-anchored (115/115 normalize under reaper's `\d{5}` codePattern), so
    none hits the identity floor; the site publishes zero barcodes anywhere, so all 115
    cross with no EAN. 09985 is a SECOND re-home case: it is published as a paint today
    with hex '' and no EAN, so there is no barcode to move and the paint record still
    needs retracting separately -- the EAN guard will not notice either way.
    Set-membership evidence (hints.contentSkus) crosses over intact as of 2026-08-07:
    CanonicalProduct.contentSkus carries it, 29 sets / 802 refs. 114 of these 115 already
    carry hints.category "paint-set", so the
    category stamp below is a no-op for them and a correction for 09985 -- and for all 431
    rows the other five sources label "paint".
  category: paint-set
  anyOf:
    - hintEquals: {category: paint-set}
    - nameMatches: '\b(SET|COLLECTION|FULL RANGE|BRIEFCASE|WOODEN BOX)\b'
