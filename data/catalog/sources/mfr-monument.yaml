id: mfr-monument
kind: manufacturer
# Feeds the PAINT catalog: gen_paint_harvest.py projects these observations onto
# data/paints/. Without this the product resolver publishes every paint a second time.
catalog: paints
strategy: shopify-paints
baseUrl: https://monumenthobbies.com
scope:
  # Store default currency confirmed live 2026-07-23 via /cart.js -> "USD".
  currency: usd
  # monumenthobbies.com is multi-vendor (Tri Art, Mesko Pinsel, Printify merch, ...): only
  # Monument's own products are in scope for the paint harvest.
  vendors: [Monument Hobbies]
  # Live probe 2026-07-23: 333 products; paint-relevant types below (179 Paint Singles,
  # 21 Paint Sets, 5 Paint Mediums, 10 Primers, 4 Spray Paints). Sets kept as evidence
  # (set EANs are real retail EANs); the harvest bridge projects singles only.
  includeTypes: [Paint Singles, Paint Sets, Paint Mediums, Primers, Spray Paints]
politeness:
  # Same Shopify bot management as mfr-armypainter: bot-token UA gets a persistent 429 on
  # /products.json (live matrix 2026-07-23: bot UA 429, browser UA 200). One-off snapshot
  # source; pacing unchanged.
  uaProfile: browser
  rps: 0.5
budget:
  pagesPerRun: 40
contract:
  # Evidence-based floor (~85% of observed): live probe 2026-07-23 counted 197 products in
  # the included types with vendor Monument Hobbies. 197 * 0.85 = 167.5 -> 165.
  minCount: 165
  maxDropPct: 30
  requiredFieldRates:
    name: 1.0
    sku: 0.9
# Boxed multi-pot sets are PRODUCTS, not paints -- see resolve/crossover.py for the shared
# evaluator gen_paint_harvest.py refuses the same rows with.
crossoverToProducts:
  reason: >
    Boxed multi-pot sets are PRODUCTS, not paints (maintainer decision 2026-08-05).
    Measured 2026-08-05 over all 197 observations: this block selects 21, and the two
    signals agree EXACTLY (productType "Paint Sets" 21, title 21, same rows) -- both are
    kept anyway so a retitled box or a retyped product still crosses on the other. 19 of
    the 21 carry a real retail EAN (the scope comment above already notes set EANs are
    real); the 2 without are code-anchored, so none hits the identity floor.
    All 21 need the widened `(MPA|AMP|MEA)-[A-Z0-9-]+` codePattern in
    data/catalog/taxonomy/manufacturers.yaml -- the old `MPA-[A-Z0-9]+` cannot match the
    second hyphen in MPA-SET-ACON, and codes 0 of 21 without it.
  category: paint-set
  anyOf:
    - hintEquals: {productType: Paint Sets}
    - nameMatches: '\b(SET|COLLECTION|FULL RANGE|BRIEFCASE|WOODEN BOX)\b'
