id: mfr-armypainter
kind: manufacturer
# Feeds the PAINT catalog: gen_paint_harvest.py projects these observations onto
# data/paints/. Without this the product resolver publishes every paint a second time.
catalog: paints
strategy: shopify-paints
# Apex host, matching the C# ShopifyPaintSource's base URL. The www host 301s robots.txt, which
# used to be a hard blocker here (the robots fetcher refused to assume permission on any redirect)
# and is why this line said "No www"; as of 2026-08-12 acquire/robots.py follows robots.txt
# redirects per RFC 9309 sec 2.3.1.2, so www would work too -- apex is now just the host we
# already harvest from, not a workaround. Don't re-derive the old reason from this comment.
baseUrl: https://thearmypainter.com
scope:
  # Store default currency confirmed live 2026-07-23 via /cart.js -> "USD".
  currency: usd
  # Live probe 2026-07-23: 898 products; product_type "Paint" 487, "Spray" 33 (Colour Primer
  # rasters), and "" 274 -- several real paint ranges ship untyped (e.g. some Warpaints
  # Fanatic singles, Speedpaint Marker) so the empty type must stay in. Triads/bundles/brush
  # products caught downstream by the harvest bridge, which classifies ranges/singles.
  includeTypes: [Paint, Spray, '']
politeness:
  # This shop's Shopify bot management 429s any bot-token UA on /products.json regardless of
  # pacing (live matrix 2026-07-23: bot UA 429, browser UA 200, repeatable after cooldown).
  # uaProfile swaps the identification string only; pacing stays 0.5 rps and runs are one-off
  # snapshots, not scheduled.
  uaProfile: browser
  rps: 0.5
budget:
  pagesPerRun: 400
contract:
  # Evidence-based floor (~85% of observed): live enumeration 2026-07-23 kept 794 products
  # after the includeTypes filter (487+33+274). 794 * 0.85 = 674.9 -> 670.
  minCount: 670
  maxDropPct: 30
  requiredFieldRates:
    name: 1.0
    sku: 0.9
# Boxed multi-pot sets are PRODUCTS, not paints -- see resolve/crossover.py for the shared
# evaluator gen_paint_harvest.py refuses the same rows with.
crossoverToProducts:
  reason: >
    Boxed multi-pot sets are PRODUCTS, not paints (maintainer decision 2026-08-05).
    Measured 2026-08-05 over all 794 observations: this block selects 49 (56 title hits
    minus 7 vetoed), 40 of them carrying an EAN, 48 of 49 code-anchored once army-painter
    gains the `BNDL\d{3,4}` alternative in manufacturers.yaml.
    TITLE IS THE ONLY LEVER HERE: thearmypainter.com exposes no usable set category --
    hints.productType takes only the three values Paint, Spray and '' across all 794 rows,
    none of which distinguishes a box from a dropper.
    The single exact tag value `brushset` vetoes exactly the 7 brush sets (TL5065P,
    TL5066P, TL5067P, TL5068P, TL5069P, TL5070P, BR7055P) while the four genuine airbrush
    paint sets AW8001P-AW8004P survive -- their tags are `Airbrush Warpaints` and
    `SDS Airbrush Sets`, which CONTAIN the substring but are not the value. Matching is
    exact value membership, never substring (see resolve/crossover.py); a substring test
    would veto all four real sets to exclude the 7.
    DELIBERATE NON-SELECTION: the tag `tap-shop-bundles-set` was considered and rejected.
    It carries 110 rows and would select 110 on its own (none of them brush sets) or 117
    unioned with the title clause, against 49 today. Either way it pulls in
    WP8082P/WP8083P/WP8084P ("Historical: WWII American/British/German" -- note none
    matches the title regex, so only the tag signal reaches them), whose EANs
    5713799808201 / 5713799808300 / 5713799808409 are ALREADY published as
    warlord-games/WP8082, /WP8083 and /WP8084 ("Warpaints Fanatic: World War II
    American/German/British Paint Set", verified in data/catalog/products/warlord-games.yaml
    on 2026-08-05). Selecting them would ship 3 day-one `cross-manufacturer-ean` conflicts.
    That misattribution is real and pre-existing --
    ret-tistaminis vendors Army Painter stock under Warlord-BLISTER/Warlord-WEB and
    manufacturers.yaml maps those to warlord-games -- but fixing it means deciding whether
    that vendor tag can still be trusted as a manufacturer signal, which touches more than
    three records. Deferred to its own change; if a later change switches this source to
    the tag signal, those 3 conflicts appear immediately.
    75005 "D&D Undead Paint Set" is the one row that stays a name slug after the taxonomy
    widening; left as-is rather than widening the pattern further to chase a single row.
  category: paint-set
  anyOf:
    - nameMatches: '\b(SET|COLLECTION|FULL RANGE|BRIEFCASE|WOODEN BOX)\b'
  noneOf:
    - hintContainsAny: {tags: [brushset]}
