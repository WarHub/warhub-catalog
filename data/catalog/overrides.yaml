# Human decisions that outrank every source. NOTHING MACHINE-WRITTEN BELONGS HERE.
#
# It held 3,182 LLM classifications until 2026-08-31, merged in by a `classify --apply` step
# that no longer exists. That gave a Haiku guess the authority of a maintainer's judgement --
# `apply_overrides` runs last, so 1,819 of them were deciding published records over the
# sources that contradicted them. `resolve` now reads
# data/catalog/classifications/products.yaml directly and applies a classification only where
# the evidence said nothing, recording `gameSystemBasis: classified`.
#
# `retract` and `products` are both still honoured, for entries a PERSON writes.
#
# KILL TEAM, 2026-08-31. The maintainer decided Kill Team is a game system in its own right
# rather than a corner of Warhammer 40,000 -- see taxonomy/game-systems.yaml. Splitting a slug
# is a decision, and these are its consequences: products whose own name says KILL TEAM but
# which were filed under 40k or `other-games` because no better word existed when they were
# resolved. They are listed one by one, and here rather than applied by the rule, because the
# rule's contract is that it fills what nothing claimed and never overwrites a claim -- a
# maintainer moving a product between systems is exactly the thing overrides.yaml is for.
retract: []
products:
  # THE 2026-09-02 ADJUDICATION OF data/review/categorize.yaml, per product where no rule settles
  # the class. Evidence per row is in the PR that landed them; in one line each:
  #   AK11500 is a thinner and AK9511 wet-palette paper (radaddel's own tags say so); Vallejo 28890
  #   and 28900 are brush restorer/cleaner, `colourless` in the paint catalog, and radaddel's
  #   Farbsets collection is not a set; WP8112 is a ten-pot set Warlord's store typed `Paint Pot`;
  #   WP8124/25 are ten- and twenty-pot sets goblingaming filed as paint and the maker's snapshot
  #   predates; CBARI38 is a card deck; the two Maxx Darth pots are GSW's blackest-black acrylic
  #   on a supplies shelf; the seven game rows follow the maker's own pages (an AoS painting guide,
  #   a Tzeentch battalion, a Mortal Realms issue-500 dwarf, a Mark III box GW files as 40k, two
  #   Mantic products Mantic sells into two games, a Konflikt '47 Open Day hero); and the three
  #   setting rows are a 40k novel, an AoS anthology and a WWII radar station that belong to a
  #   universe and to no game.
  ak-interactive/AK11500:
    category: hobby-auxiliary
  ak-interactive/AK9511:
    category: hobby-auxiliary
  vallejo/28890:
    category: hobby-auxiliary
    packaging: single
  vallejo/28900:
    category: hobby-auxiliary
    packaging: single
  army-painter/WP8112:
    category: paint-set
  army-painter/WP8124:
