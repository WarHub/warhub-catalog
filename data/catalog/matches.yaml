  'ret-tistaminis:mantic-armada-seas-of-dread-book': ['5060924982320']
  'ret-tistaminis:mantic-armada-scenery-pack-fantasy-terrain': ['5060924982320']
  # ARMIES OF THE UNITED STATES, and this one is NOT a typo -- it is a barcode two products share
