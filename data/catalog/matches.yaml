  # ONE STORE PUT A GAMES WORKSHOP BARCODE ON A WARLORD BOX, and the catalog published it as that
  # box's confirmed alternate barcode. `5011921171835` is GENESTEALER CULTS: BIOPHAGUS: Games
  # Workshop's own trade sheet asserts it under GW code 99070117012 (`mfr-gw-trade:99070117012`),
  # with an explicit `hints.supersedes` naming the barcode it replaced (5011921110988, 2021-11-29),
  # and `ret-goblingaming`, `legacy-catalog` and an `arc-wargameportal` capture keyed on GW's own
  # SS Code 51-44 all agree. Prefix 5011921 holds 6,309 published products and 6,309 of them are
  # games-workshop -- this is the single exception in the whole range.
  #
  # The Warlord side is contradicted by Warlord. `mfr-warlord-store:italian-paracadutisti-weapons-
  # teams` -- Warlord's own store, same sku 402215810 -- says `5060917991070`, as do
  # `ret-goblingaming` and `legacy-catalog`; 5060917 holds 584 published products, all Warlord.
  # Only this one tistaminis row says otherwise, and its ten neighbouring Italian Paracadutisti
  # rows in the same file all carry 5060917 barcodes.
  #
  # WHY THE EXISTING GUARD DID NOT CATCH IT. `resolve/corroborate.py`'s `bridged` test asks whether
  # a losing barcode was ever carried on the SURVIVING product code. This row carries the CORRECT
  # Warlord sku alongside the wrong barcode, so the test passes, `bridged` is empty, and the GW
  # barcode is absorbed as "a retired version of this Warlord product" and stamped `confirmed`.
  # The test never looks at the GS1 prefix, which is the signal that would have caught it.
  'ret-tistaminis:bolt-action-italian-paracadutisti-weapons-team': ['5011921171835']
