  # --- THE LAST SIX FUSED RECORDS (2026-08-27) -------------------------------------------------
  # Five are one shape: `legacy-catalog` carries ANOTHER code's barcode, and because a second
  # source asserts that barcode under its real code, the wrong value wins its own code's vote and
  # the automated consensus test cannot see it. Each name is identical on both codes -- these are
  # re-codes and book/bundle pairs, not different products with different names -- so the name
  # cannot discriminate and the standing rule applies unopposed: the barcode identifies the box,
  # the SKU is a catalogue number. Moving the row splits the records without asserting lineage.
  #
  # Claws of Karanak: GW's trade sheet calls 99120201148 "WARCRY: CLAWS OF KARANAK" (5011921182114)
  # and 99120201247 "BLADES OF KHORNE: CLAWS OF KARANAK" (5011921259533) -- two releases of one
  # sculpt. legacy has the Warcry barcode on the Blades code.
  'legacy-catalog:games-workshop/age-of-sigmar/grand-alliance-chaos/claws-of-karanak': '99120201148'
  # Volturnos / Akhelian King is one dual-build kit re-coded 99120219017 -> 99120219028; the trade
  # sheet gives each code its own barcode and three rows carry the retired code's.
  'legacy-catalog:games-workshop/age-of-sigmar/grand-alliance-order/akhelian-king': '99120219017'
  'legacy-catalog:games-workshop/age-of-sigmar/grand-alliance-order/volturnos-high-king-of-the-deep': '99120219017'
  'ret-goblingaming:volturnos-high-king-of-the-deep': '99120219017'
  # Three Warlord books where the ISBN belongs to the plain book and legacy hung it on the
  # code Warlord's own store gives a different barcode: Hail Caesar Army Lists (101010003 per
  # ret-goblingaming), Glory Hallelujah! (WG-BP009 per ret-goblingaming), Iron Coffins
  # (481010002 per ret-tistaminis -- the same book/bundle split as Armies of the United States).
  'legacy-catalog:warlord-games/hail-caesar/german/hail-caesar-army-lists-biblical-to-early-medieval-supplement': '101010003'
  'legacy-catalog:warlord-games/bolt-action/american/glory-hallelujah': 'WG-BP009'
  'legacy-catalog:warlord-games/achtung-panzer/british/iron-coffins-achtung-panzer-supplement-with-stanley-christopherson-special-miniature': '481010002'
