  #
  # `resolve/join.py` unions by (manufacturer, ean), so a single barcode written against the wrong
  # product code does not just publish a wrong number -- it FUSES the two products into one record
  # and the loser stops existing. 25 `ean-mismatch` entities held more than one product code that
  # way, 76 codes in 25 records; `warlord-games/403205802` alone held nine.
  #
  # HOW EACH ONE WAS DECIDED, and the first answer was wrong. The repo's standing rule is that a
  # barcode beats a SKU for identity (`supersession-stale-code` re-homing rests on it), so the
  # obvious reading is "the code went stale, move the row to the barcode's owner". Measured against
  # the makers' own product NAMES, that is backwards for this population: in 35 of the 41 candidate
  # rows the row's name matches what the maker calls the row's OWN code, and matches nothing about
  # the barcode's owner. The rule only holds where the SKU is a lister's catalogue number going
