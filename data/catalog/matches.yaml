  # TWELVE MDF TERRAIN PIECES WERE WEARING TWELVE TUBS OF BASING MATERIAL'S BARCODES, and the
  # (manufacturer, ean) union in resolve/join.py fused each pair into one record: `warlord-games/
  # 849110025` currently publishes as "Battlefields & Basing: Desert Sand (180ml)" with the WW2
  # Normandy high Wall with Gate folded into it, and `warlord-games/H00134` does not exist.
  #
  # THE BLOCK IS CONTIGUOUS AND THE ERROR IS LOCALISED. Every `H001xx` legacy row carries
  # `hints.eanSource: shopify:flipsidegaming.com` -- the barcode is a BACKFILL from a third-party
  # shop, not from Warlord. For H00123-H00134 that backfill landed on `5060917992xxx`; for every
  # other H001 row that has a barcode at all (H00158, H00159, H00161, H00162, H00192, H00193) it
  # landed on `5907652xxxxx` and agrees with `ret-tistaminis` exactly, 6 of 6. So legacy's H001
  # barcodes are normally right and this is a bounded run of 12, not a systematic disagreement.
  #
  # WHICH SIDE IS WRONG, WITHOUT GUESSING. Each rejected value is ALREADY the confirmed primary of
  # a different published product in this catalog, independently asserted there by legacy AND
  # ret-tistaminis AND (for several) ret-radaddel: 5060917992091 is 849110025 Desert Sand,
  # 5060917992213 is 849110014 Spring 2mm Static Grass, and so on through the block. One barcode
  # cannot be two products, and the terrain has its own: `ret-tistaminis` gives each of these 12
  # skus a `5907652…` value, the prefix all 34 MDF-terrain observations in the ledger use and that
  # nothing else in the catalog uses. Sequence is not the argument -- the independent claim on the
  # other product is.
