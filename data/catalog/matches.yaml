# --- `ean-mismatch`, DELIBERATELY LEFT (rewritten 2026-08-27, third pass) ----------------------
# 10 rows, down from 46. NO entity in the catalog holds two products any more, so every one of
# these is one product about which sources disagree -- which is what the type is for. Each loser is
# retained in its own record's `additionalEans` and the record is stamped `conflicted`;
# `report --ean-guard` reports 0 lost against them. What follows is why each is CORRECT rather than
# unfinished, because "needs an external scan" was the wrong answer and it is worth not repeating.
#
# FOUR ATOMIC MASS ROWS ARE A CURATED SOURCE'S JUNK BARCODE, and the measurement says so plainly.
# Across every atomic-mass-games observation carrying a barcode, prefix 0841333 has 670 from FIVE
# independent sources (ret-gamenerdz, legacy-catalog, ret-goblingaming and both barcode databases).
# Every other prefix -- 0765490, 0765674, 0764563, 0763473, 0198913, 0765495, 0925453, 0167940,
# 0764538 -- is `legacy-catalog` ALONE, 22 observations in total, none corroborated by anything.
# CP269, SWQ144, SWQ15 and SWL98 are four of those 22. The resolver already does the right thing:
# it makes the corroborated 0841333 value the primary and keeps legacy's in `additionalEans`.
# They are NOT rejected, and that is deliberate -- each is currently PUBLISHED in additionalEans,
# so rejecting it would delete a barcode this catalog has shipped, to fix nothing that is broken.
#
# `games-workshop/warhammer-40-000-paints-tools-set` IS two real products -- radaddel articles
# 126289 (5011921196951) and 135801 (5011921260256) are two different GW paint+tools sets. They
# cannot be split: NO source gives either one a product code. GW's own trade sheet does not carry
# either barcode (checked across the whole ledger; only ret-radaddel asserts them), so both records
# would fall back to a slug of the same shop title and re-merge on the id. A GW harvest that picks
# up either barcode separates them on its own.
#
# `warlord-games/H00133` -- legacy has a Battlefields & Basing pot's barcode (5060917992084) on the
# Normandy Wall. It is the 13th row of the block corrected under rejectEans, left out on purpose:
# nothing else in the catalog holds that value, so rejecting it deletes a barcode published since
# the original legacy migration and fuses nothing in return.
#
# THE REMAINING THREE -- `mantic-games/MGWD173`, `corvus-belli/281131`, and the fourth AMG row --
# are one source against one source with no third to break the tie, and the makers publish no
# barcode to check against (manticgames.com carries `sku` and no GTIN at all, verified 2026-08-27).

# --- `supersession-stale-code`, DELIBERATELY LEFT (2026-08-26) ----------------------------------
# 15 rows in data/review/conflicts.yaml, and all 15 are a MECHANISM REPORTING ITSELF rather than a
# problem. Each names an observation whose listed sku is one side of a supersession declared above
# while its barcode belongs to the other side, and resolve/join.py places it by BARCODE and drops
# the stale code. That is the behaviour the archival split depends on -- it is what puts a
# retailer's live price and url on the record a shopper can actually buy and leaves the other
# record attested by its own archived manufacturer evidence -- so the count moves with the number
# of DECLARED pairs a bridging retailer still lists, not with anything being wrong.
#
# Every one of the 15 is a pair declared in this file, and the 28 entities involved are all
# present in data/catalog/products/games-workshop.yaml with `supersedes`/`supersededBy` written on
# both sides. No barcode among them is duplicated or lost.
#
# ONE THING WORTH KNOWING BEFORE READING THE LIST, because the field name invites the wrong
# reading: `barcode_code` is NOT "the surviving side". `pair_owner` in resolve/join.py is built
# from `kind: manufacturer` observations only, so `barcode_code` is whichever side GW's own trade
# sheet exclusively asserts that barcode under, and the declared direction never enters. Three of
# the 15 therefore re-home onto the declared RETIRED record: Mortisan Boneshaper
# (99120207208 listed, 99070207021 owns the barcode; declared 99070207021 -> 99120207208) and the
# two Boingrot Bounderz / Squig Hoppers rows (99120209152 listed, 99120209100 owns it; declared
# 99120209100 -> 99120209152). That is correct under the ownership rule -- a barcode a MANUFACTURER
# asserts under code C is C's -- and both of those retired codes are `archived: false` in GW's
# China Order Form, i.e. still live. It does mean a curated row's name and url land on the retired
# record, which is how `games-workshop/99120209100` comes to publish as "Boingrot Bounderz" when no
# GW source calls that code anything but "GLOOMSPITE GITZ SQUIG HOPPERS". That is a separate defect
# in resolve/attributes.py's `foreign` set (it guards `sku` and not the descriptive fields) and it
# wants its own change with its own measurement, not a supersession edit.
