  #   'Vagrantsong: Fool’s Gold – Bonus Scenario' is coded WYR11602 (the maker agrees) but carries
  #   0812152034167, which the maker gives to WYR11604 'Vagrantsong: Hide Yourself Away (Fox Sis'.
  'legacy-catalog:wyrd-games/malifaux/general/vagrantsong-fools-gold-bonus-scenario': ['0812152034167']
