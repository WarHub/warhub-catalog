# Hand-maintained: forced entity joins/aliases/lineage the deterministic resolver (resolve/join.py)
# cannot infer on its own. `joins` maps one observation key (source_id:key) belonging to the
# entity being folded in -> the surviving entity id it should merge into; `aliases` maps a
# retired entity id -> its surviving replacement id; `supersessions` LINKS two entities that both
# keep their own record. See resolve/join.py's docstring and data/review/join-proposals.yaml's
# header for the promotion procedure. After editing, re-run `warhub-data resolve` then
# `warhub-data report --ean-guard`.
#
# Note: the "surviving" id on the right of a JOIN isn't always the entity that was named as the
# join's target when promoted from join-proposals.yaml -- resolve/join.py's own anchor-priority
# rule (curated > manufacturer > retailer > archive > barcode-db) decides which side's id actually
# survives once the two groups merge, so a few entries below point at the OTHER side's id (the
# one carrying the higher-priority evidence) to avoid a spurious unresolved-forced-join conflict.
# `supersessions` has no such quirk: nothing merges, so both ids are exactly as written and the
# direction is the real one (retired -> current).
#
# JOIN or SUPERSESSION?
#   * `joins` -- the two sides are ONE product record: an archive/duplicate page, a listing with no
#     code of its own, a second store page for the same SKU. Nothing is destroyed by merging them.
#   * `supersessions` -- the two sides are one product across TWO product codes (a re-code, a
#     repackaging, a new edition of the same box). Folding those destroys a real product code and
#     usually a real barcode, and people own the old box for decades: both records are kept and
#     linked instead. resolve/join.py additionally BARS the union-find from re-merging a declared
#     pair through a shared barcode (every GW pair below is bridged by a retailer still listing the
#     retired code while carrying the current barcode).
# Do NOT link a pair whose CONTENTS differ -- a material change (metal -> resin), a roster/content
# change, an edition-content change, or a premium/limited-variant line make them DISTINCT products
# with no lineage at all.
joins:
  # --- THE TWO ARCHIVE CAPTURES (2026-08-27) ---------------------------------------------------
  # wargameportal.com is an `archive` source, so its rows are point-in-time captures with no
  # barcode. Both captures are recent (archiveTimestamp 2025-05-21 and 2025-10-06) and the site is
  # still live and still selling both items, so its current pages are usable corroboration -- with
  # the caveat that a shop can change what sits at a URL, which is why neither ruling rests on the
  # page alone.
  #
  # ARCANE RUINS. The competing records are `99122799001` (current, barcode, filed by legacy under
  # the-old-world/scenery, stocked by three retailers) and `99129999003` (discontinued, NO barcode,
  # known only from one archived GW webstore page, and sitting in GW's `9999` placeholder range).
  # The live page describes a Warhammer: The Old World terrain kit -- obelisk, arches, columns, 55
  # components -- and the capture postdates The Old World's launch.
  'arc-wargameportal:/products/arcane-ruins': games-workshop/99122799001
  # CHAOS WARRIORS, and here the shop's own shelf label is wrong while its components are right.
  # The capture carries sku `83-06`, which is GW's SS Code, and only two of the four candidates
  # have it: 99120201047 and 99120201131. That alone eliminates the two Warhammer: The Old World
  # codes (SS Codes 08-07 and 08-21) -- even though the live page files the product under "The Old
  # World / Warriors of Chaos". The page's own description settles which is right and contradicts
  # its own label: "10 Chaos Warriors ... 97 plastic components ... 10x Citadel 32mm ROUND Bases".
  # Round bases are Age of Sigmar; The Old World kit is ranked on squares. Between the two
  # Slaves to Darkness codes, 99120201047 is discontinued and 99120201131 is current and already
  # carries radaddel and gamenerdz listings, and the shop was actively listing this in 2025-10.
  #
  # A SHOP'S CATEGORY IS A SHELF, NOT A CLAIM ABOUT THE PRODUCT -- the same thing that put Army
  # Painter tools under `warlord-games` two layers down.
  'arc-wargameportal:/products/chaos-warriors': games-workshop/99120201131
  # --- `ambiguous-join` SETTLED FROM THE SHOP'S OWN BARCODE (8 rows, 2026-08-27) ---------------
  # Each is a `ret-radaddel` listing with no product code and no barcode IN THE LEDGER, whose name
  # matches two coded entities -- so `resolve/join.py` refuses to pick and the row founds an entity
  # named after the German shop title. The earlier note said these clear themselves once the
  # nightly's `shopify` detail-fetch budget reaches the handle. It has not yet, but the shop already
  # publishes the answer: radaddel.de is a Shopify store and `/products/<handle>.json` carries the
  # variant barcode. Read 2026-08-27, one request per handle:
  #
  #   speedpaint-most-wanted-set-2-0        5713799806009
  #   chaos-space-marines-raptors-1         5011921273355
  #   legiones-astartes-mkiv-tactical-squad 5011921266753
  #   ogor-mawtribes-butcher                5011921266906
  #   ogor-mawtribes-ironguts               5011921266876
  #   warriors-of-chaos-chaos-warriors      5011921266920
  #   star-wars-legion-at-st-walker         841333134983
  #   star-wars-legion-range-troopers       841333134754
  #
  # Every one of those is already a published product's confirmed primary here, so the join states
  # only WHICH entity the listing belongs to -- no barcode is invented, and the value will arrive in
  # the ledger on its own when the budget reaches the handle, at which point these become no-ops.
  #
  # SEVEN LAND ON A NAME CANDIDATE. THE EIGHTH REFUTES THE NAME, which is the reason not to settle
  # this family by picking between the candidates: `ogor-mawtribes-butcher` scans as 5011921266906,
  # which is `games-workshop/99120213044` -- GW's own catalogue calls that kit "Cleavers/Gutseers"
  # and it is neither candidate. The shop names it for one of the two units it builds.
  'ret-radaddel:speedpaint-most-wanted-set-2-0': army-painter/WP8060P
  'ret-radaddel:chaos-space-marines-raptors-1': games-workshop/99120102259
  'ret-radaddel:legiones-astartes-mkiv-tactical-squad': games-workshop/99123001085
  'ret-radaddel:ogor-mawtribes-butcher': games-workshop/99120213044
  'ret-radaddel:ogor-mawtribes-ironguts': games-workshop/99120213041
  'ret-radaddel:warriors-of-chaos-chaos-warriors': games-workshop/99122701018
  'ret-radaddel:/star-wars-legion-at-st-walker': atomic-mass-games/SWQ10
  'ret-radaddel:/star-wars-legion-range-troopers': atomic-mass-games/SWQ89
  # Archived GW webstore page for the Baneblade carrying that store's own SKU (60100181151) rather
  # than the multi-build kit's code. A store SKU on a dead page is not product-code lineage, and no
  # barcode is at stake, so this stays a fold.
  'arc-gw-webstore:/en-GB/Baneblade': games-workshop/99120105107
  # Warlord's store has literal duplicate ("-copy") pages for these three books, both sides LIVE.
  # A CMS duplicate is one product record, not lineage -- splitting them would publish two current
  # records for one book.
  'mfr-warlord-store:germania-hail-caesar-supplement-copy': warlord-games/109910007
  'mfr-warlord-store:hail-caesar-age-of-bronze-supplement-copy': warlord-games/109910010
  'mfr-warlord-store:hail-caesar-rulebook-spanish-language-richard-i-the-lionheart-special-figure': warlord-games/101010004SP
  # --- `ambiguous-join` adjudications, 2026-08-26 ------------------------------------------------
  # Each of these is a listing with no product code and no barcode whose name slug matches two or
  # more coded entities under one manufacturer, so `resolve/join.py`'s name-join pass refuses to
  # pick and the row founds an entity named after the shop's own title. The four below are the ones
  # some OTHER field of the SAME listing decides. The eight that nothing decides are left as
  # conflicts on purpose, with their reasons recorded under `ambiguous-join, DELIBERATELY LEFT`
  # at the end of this file -- guessing one would publish a price and a stock level against the
  # wrong box.
  #
  # This store's own sku IS the product code, with a store suffix `normalize_code` does not strip
  # (it strips `-EN` only). `60220599003` is a real published GW code, and the listing's
  # `hints.tags` independently carry the bare string "OLD". The competing candidate `60050599005`
  # is the one the NAME matches -- a name is marketing text and a code is an identifier, and this
  # store publishes exactly one Orlock Gang Tactics Cards page, so there is no second listing the
  # code could belong to.
  'ret-goblingaming:necromunda-orlock-gang-tactics-cards-old': games-workshop/60220599003
  # THE SAME STORE ALREADY HAS THE OTHER CANDIDATE, ANCHORED BY A BARCODE. `ret-tistaminis:
  # warhammer-40000-introductory-set` (no suffix) carries ean 5011921199280, which is
  # 60010199059's own primary, so that page is not in question. This `-1` page is the store's
  # second listing of the title -- different tags (Orks vs Tyranids), different availability,
  # different image -- and the remaining candidate is 60010199079. A Shopify `-1` handle is NOT
  # by itself evidence of a distinct product (the `-copy` pages above are one product each); what
  # decides it here is that the first page is already spoken for by a barcode.
  'ret-tistaminis:warhammer-40000-introductory-set-1': games-workshop/60010199079
  # Same shape, within radaddel: article 129886 is live in this store's CURRENT generation and
  # already resolves onto 99122701005, so article 136605 is a second, distinct article and the
  # remaining candidate is 99122701019.
  'ret-radaddel:warriors-of-chaos-chaos-knights-1': games-workshop/99122701019
  # Same shape: article 133518 is live in the current generation and already resolves onto
  # 99120599109 (Palanite Enforcer Weapons & Upgrades), so article 132807 is the other one --
  # 99120599079, the discontinued Necromunda: Enforcer Weapons & Upgrades.
  'ret-radaddel:necromunda-enforcer-weapons-upgrades': games-workshop/99120599079
# `{observation key: correct manufacturer slug}` -- see Matches.reassignManufacturer in
# resolve/join.py for what this is and what the bar for an entry is.
#
# ALL THIRTEEN ENTRIES ARE ONE DEFECT, MEASURED 2026-08-26. A wargame store's catalogue filed
# somebody else's hobby accessory under the store's own brand, and the catalog believed it. Every
# one of them raised BOTH a `cross-manufacturer-ean` and an `ean-shared` conflict, because the real
# manufacturer's own entity for the same item already existed and already held the same barcode.
#
# THE EVIDENCE IS THE GS1 COMPANY PREFIX PLUS THE ITEM'S OWN MANUFACTURER, and both are in this
# repo. Over the published catalog, primary barcodes only: prefix 5713799 holds 657 products, 649
# army-painter and 8 warlord-games; prefix 8435568 holds 907, 902 ak-interactive and 5
# warlord-games. The minorities are exactly the ids below. Warlord's own ranges (5060917, 584
# products) are 100% clean in the other direction, so this is not Warlord sharing a prefix.
# And Warlord's OWN STORE sells these same items and attributes every one of them to Army Painter
# or AK Interactive in its Shopify `vendor` field (`mfr-warlord-store:sculpting-tools`,
# `:miniature-model-magnets`, `:warpaints-fanatic-world-war-ii-*-paint-set`, ...).
#
# WHERE THE WRONG ANSWER CAME FROM. Eleven are `legacy-catalog`, whose manufacturer IS the path the
# old .NET pipeline filed the record under -- `migrate/legacy.py` builds the observation key prefix
# and the `manufacturer` field from the same `manufacturerSlug` string, so a record under
# `warlord-games/bolt-action/general/` is attributed to Warlord by construction, with nothing
# anywhere in the row claiming Warlord made it. Three are `ret-tistaminis`, whose Shopify `vendor`
# on the Army Painter WWII paint sets literally reads "Warlord Games"; this was predicted three
# weeks before it happened, in `data/catalog/sources/mfr-armypainter.yaml`, naming these exact
# three barcodes and these exact three ids.
#
# NOT USED AS EVIDENCE: any of these records' own url slugs or image filenames.
reassignManufacturer:
  # AK Interactive 3rd-gen varnishes and playmarkers. GS1 8435568.
  'legacy-catalog:warlord-games/bolt-action/general/matt-varnish-100-ml': ak-interactive
  'legacy-catalog:warlord-games/bolt-action/general/satin-varnish-100-ml': ak-interactive
  'legacy-catalog:warlord-games/bolt-action/general/gloss-varnish-100-ml-3gen': ak-interactive
  'legacy-catalog:warlord-games/bolt-action/general/ultra-matte-varnish-100-ml': ak-interactive
  'legacy-catalog:warlord-games/bolt-action/general/animal-green-playmarker': ak-interactive
  # Army Painter tools and brushes. GS1 5713799.
  'legacy-catalog:warlord-games/bolt-action/general/sculpting-tools': army-painter
  'legacy-catalog:warlord-games/bolt-action/general/miniature-model-magnets': army-painter
  'legacy-catalog:warlord-games/bolt-action/general/small-drybrush': army-painter
  # The same legacy path, same GS1 prefix, but no army-painter twin exists yet so these two raise
  # no conflict today. They are the identical defect and are corrected with their siblings rather
  # than left to surface as a conflict the next time an Army Painter harvest reaches them.
  'legacy-catalog:warlord-games/bolt-action/general/large-drybrush': army-painter
  'legacy-catalog:warlord-games/bolt-action/general/kolinsky-masterclass-brush': army-painter
  # Army Painter Warpaints Fanatic WWII sets, sold through Warlord and vendored "Warlord Games".
  # The Army Painter's own store asserts all three barcodes under WP8082P/WP8083P/WP8084P.
  'ret-tistaminis:ww2-american-paint-set': army-painter
  'ret-tistaminis:ww2-german-paint-set': army-painter
  'ret-tistaminis:ww2-british-paint-set': army-painter
# `{observation key: [barcodes to disbelieve]}` -- see Matches.rejectEans in resolve/join.py.
rejectEans:
  # THE SIXTH, AND THE ONLY ONE WHERE OWNERSHIP IS GENUINELY UNKNOWN. Mantic asserts 5060924988162
  # for BOTH MGVAF202 (Vanguard Centaur Chief) and MGKWN208 (Kings of War Centaur Chief) -- the
  # same shape as Warlord's Rift Dice, but with no third source to outvote it: Mantic publishes no
  # barcodes on its own site (checked 2026-08-27, `sku` and no GTIN in its JSON-LD) and a web
  # search surfaced no listing carrying this value. It may even be correct -- one sculpt sold under
  # two range codes can legitimately share a barcode, as Warlord's Armies of the United States ISBN
  # does. What is NOT tenable is the two products being one record. `ret-gamenerdz` gives MGVAF202
  # its own 5060469664040, so rejecting the duplicate from THAT side splits them while leaving each
  # code a barcode some source attests and losing nothing. Which of the two Mantic meant is still
  # open; a harvest that ever publishes a barcode will settle it.
  'mfr-manticgames:20610': ['5060924988162']
  # --- THE LAST FUSIONS THE WIDER CODE COVERAGE MADE VISIBLE (5 rows, 2026-08-27) --------------
  # Once Vallejo, Corvus Belli and Atomic Mass had real codes, the catalog-wide test for a fused
  # record became answerable: an entity holding two UNRELATED codes AND two barcodes. There are 16,
  # and these five are the ones where a source's barcode contradicts the code its own name backs.
  # Three are the manufacturer's own store getting it wrong and being outvoted by everyone else,
  # which is the same shape as the Rift Dice.
  'legacy-catalog:warlord-games/bolt-action/british/humber-mk-ii-iv-armoured-car': ['5060917990653']
  'mfr-manticgames:474732': ['5060924987080']
  'mfr-manticgames:499623': ['5060924985475']
  'mfr-warlord-store:blitzkrieg-early-war-german-army': ['5060200846780']
  'ret-tistaminis:is-2-heavy-tank-2025': ['5060393705819']
  # --- WHAT THE WIDENED CODE PATTERNS EXPOSED (5 rows, 2026-08-27) -----------------------------
  # Giving Vallejo, Corvus Belli and Atomic Mass real product codes turned name-slug collisions
  # into ordinary code-anchored records, and left exactly eight entities holding two unrelated
  # codes. Five are a wrong barcode; two are a wrong code (see reassignCodes); one is below.
  #
  # VALLEJO PROVES ITSELF. The taxonomy already records that a Vallejo EAN is `8429551` + the
  # 5-digit code + a check digit -- the paint tool computes them that way. Measured over every
  # Vallejo observation carrying both: 1,050 of 1,056 obey it. Of the six that do not, two are
  # books with real ISBNs, one is a malformed value that collides with nothing, and these three
  # are a barcode that encodes a DIFFERENT Vallejo code -- which is what fused them.
  'ret-goblingaming:model-air-grey-violet': ['8429551712590']                     # encodes 71259, row is 71128
  'ret-goblingaming:vallejo-weathering-effects-40ml-black-splash-mud': ['8429551738088']   # encodes 73808, row is 73806
  'ret-goblingaming:vallejo-weathering-effects-40ml-light-brown-splash-mud': ['8429551738057'] # encodes 73805, row is 73804
  # ARC TROOPERS was re-coded SWL70 -> SWQ133 and `legacy-catalog` carries the OLD barcode on the
  # NEW code, fusing the two. `ret-gamenerdz` gives SWQ133 its own 0841333133788, so rejecting the
  # stale value leaves both codes standing with a barcode each.
  'legacy-catalog:atomic-mass-games/star-wars-legion/general/arc-troopers': ['0764563786985']
  # THE ONE BARCODE THAT BELONGS TO NEITHER PRODUCT. `legacy-catalog` put 0144329993091 on BOTH the
  # Star Wars: Legion Core Set (SWL01) and the Clone Wars Core Set (SWL44), and no other source
  # knows either product. Its GS1 prefix is 014432, which matches nothing in this catalog -- Atomic
  # Mass and Fantasy Flight both publish under 0841333 (359 products, 100%). Looked up 2026-08-27
  # across several independent retail listings: SWL01 is 0841333104436 and SWL44 is 0841333109202,
  # so the published value is neither. It is rejected from the SWL01 row only, which splits the two
  # records while leaving the value published on SWL44 exactly where it has been since the original
  # legacy migration (`git log -S 0144329993091` -> 8797654) -- this repo does not drop a barcode it
  # has published. The two real UPCs are recorded here rather than injected: they came from the web,
  # not from a source in the ledger, and evidence is the truth here (OBJECTIVES 5). A harvest that
  # observes them will correct both records on its own.
  'legacy-catalog:atomic-mass-games/star-wars-legion/general/star-wars-legion-core-set': ['0144329993091']
  #
  # --- THE SIX THE LEDGER ALONE COULD NOT SETTLE (8 rows, 2026-08-27) --------------------------
  #
  # These were recorded as undecidable when the fused entities were split, on the grounds that the
  # MAKER's own code-to-barcode map was not a clean bijection. That test was too narrow: it asked
  # only whether one source could settle it, and never asked whether the sources AGREE. All six
  # resolve on a cross-source count, and in two of them it is the manufacturer that is wrong.
  #
  # VERIFIED AGAINST THE LIVE STORES 2026-08-27, because "the maker is wrong" is a claim that has
  # to survive the obvious objection that our copy of its data is stale. It is not stale --
  # store.warlordgames.com serves these today, `updated_at` 2026-08-27:
  #     452610003 Rift Dice Green => 5060917996914
  #     452610002 Rift Dice Grey  => 5060917996914
