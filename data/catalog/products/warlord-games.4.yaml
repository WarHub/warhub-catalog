    imageUrl: https://cdn.shopify.com/s/files/1/0255/0949/4864/files/482414007_KV-85HeavyTank01.jpg?v=1724242314
    description: |-
      The KV-85 was a stopgap concept, utilising KV-1S hull mated to a turret previously designed for the KV-13 ‘universal tank’ concept, armed with the powerful D5-T 85mm cannon. Designed to address concerns that the well-armoured KV-1 lacked the firepower to deal with larger German tanks, the KV-85 was only produced in small numbers, but proved a dangerous foe for Panthers and Tigers.

      Pairing a well-armoured chassis with a powerful main gun, the KV-85 is a great choice for any Soviet Armoured Platoon, where it provides a survivable and lethal counter to enemy armour. When deployed as a pair or trio, they can threaten even the largest enemy tanks!

      This vehicle can also be used in games of Achtung Panzer!, the game of close-quarters tank-on-tank combat, perfectly suited for duelling with the German ‘big cats’ on the Eastern Front. Full rules can be found in the Achtung Panzer! rulebook.

      Box contains one resin and metal KV-85 heavy tank, Bolt Action Order Dice, waterslide decals, Bolt Action: Third Edition stat card, and Achtung Panzer! Tank Datacard and tokens.

      *Note: Models supplied unassembled and unpainted*
