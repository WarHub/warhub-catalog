    name: Chi-Nu with compression cannon
    manufacturer: warlord-games
    productCode: '455211201'
    sku: '455211201'
    gameSystems:
      - konflikt-47
    faction: japanese
    gameSystemsBasis: stated
    settings:
      - world-war-two
    settingsBasis: derived
    category: miniatures
