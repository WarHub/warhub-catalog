    url: https://www.warhammer.com/en-GB/shop/getting-started-with-age-of-sigmar-2024-eng
    imageUrl: https://www.warhammer.com/app/resources/catalog/product/920x950/60040299158_AoSGettingStarted1.jpg
    description: |-
      Warhammer Age of Sigmar is an action-packed, strategic tabletop wargame. No matter which of the many unique factions of warriors, monsters, and strange creatures you choose to play, you'll have an opportunity to carve out your slice of the near-infinite Mortal Realms. Amidst the chaos and battles, you'll collect, build, and paint your ever-growing army, then play nail-biting games against other Warhammer Age of Sigmar fans to see who emerges victorious! This magazine will give you the information you need to plunge into the strange and beautiful Mortal Realms. Your adventure starts here!

      Inside this 88-page magazine, you'll find loads of information about the fantasy setting of Warhammer Age of Sigmar – including the eight realms and the people and creatures who dwell there. You'll then be able to read about every aspect of the Warhammer Age of Sigmar hobby, from collecting armies of stunning Citadel miniatures, painting them in the colours of your choice, and leading them into battle in a thrilling tabletop wargame.

      **This package also includes the following multipart plastic miniatures:**
      - 1x Stormcast Eternals Liberator on a scenic base
      - 1x Skaven Clanrat on a scenic base

      These push-fit miniatures are designed to be pushed off their frames without using clippers, can be assembled without glue, and are supplied unpainted – we recommend using Citadel Colour paints.
