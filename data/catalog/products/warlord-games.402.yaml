    description: |-
      Defend the Motherland and take the war to the Axis with the Soviet Army Infantry Platoon!

      The backbone of the Soviet Union’s military might was its vast abundance of manpower, enabling the desperate defences and grand offensives that raged across the Eastern Front, and *Bolt Action* tables.

      This box contains 30 infantry models in ‘summer’ uniforms, allowing you to build a huge variety of Soviet units. On each sprue, you’ll find a wide range of weaponry, including Mosin-Nagant rifles and carbines, DPM light machine guns, a PRTD anti-tank rifle, and of course lots of submachine guns, just to name a few. There’s also a captured German Panzerfaust, a scoped sniper’s rifle, and plenty of extra pieces such as megaphones, camouflage capes, and even a ‘liberated’ chicken to allow you to build even more units from this kit, and add character to your force. We’ve even included a dog, for all of your canine needs! A full set of heads in helmets and another in NKVD caps gives you yet more options - this kit really can do it all!

      The following units from Armies of the *Soviet Union: Third Edition* can be assembled, among many others:

      - Platoon Commander
      - Commissar
      - Medic
      - Rifle Squad
      - Light Machine Gun Squad
      - Submachine Gun Squad
      - Guards Squad
      - NKVD Squad
      - Anti-Tank Rifle Team
      - Sniper Team

      The kit can also be used to make a wide range of spotters and forward observers, or combined with many other kits - the possibilities are endless!

      *Sculpted by Wojciech Flis. Studio miniatures painted by Andrés Amián.*

