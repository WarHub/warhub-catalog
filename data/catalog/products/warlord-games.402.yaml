      The world's first paratroopers to be used in large numbers, the German *Fallschirmjäger* were at the tip of the spear when war broke out in 1939. They led daring assaults on strategic targets, such as the fortress at Eben Emael, enabling the following *Panzers* to overrun Europe. The *Fallschirmjäger's* greatest achievement would be the seizing of Crete in the face of more numerous British and Commonwealth forces during 1941. This pyrrhic victory meant that they were never again used in airborne operations, but instead fought as highly motivated infantry, their special equipment making them tenacious.

      This box contains 30 infantry models with a range of weapons and equipment, wearing quilted winter uniforms, perfect for the unforgiving snowy woodland terrain of the Battle of the Bulge, the bleak steppes of the Eastern Front or the mountains of Italy. Each frame includes a range of head options including the distinctive *Fallschirmjäger* helmets, peaked caps and officers' caps, and a variety of weapon types with which to equip your troops. Kar 98K rifles, both StG 44 and FG42 assault rifles, a variety of German and captured submachine guns, both MG34 and MG42 light machine guns with ammunition belts and boxes, plus a *Panzerfaust*, will all serve you well on the tabletop.

