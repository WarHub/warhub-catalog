    description: |-
      Sherman Firefly was a British invention that mounted the powerful 17 pdr anti-tank gun on a Sherman hull. Making its debut on D-Day with one Firefly per troop, it soon became highly valued as the only British tank capable of defeating the Panther and Tiger tanks it faced in Normandy at standard combat ranges. In recognition of this, German tank and anti-tank gun crews were instructed to attack Fireflies first. Over 2,000 were made, and by late 1944 numbers had increased to two per troop.

      Often known as the 'Charlie' tanks in the field because of the 'c' denoting them as rearmed with the 17-pdr, the nickname 'Firefly' was unofficial and referred to the huge muzzle blast.

      As with all of our plastic vehicle kits, the Firefly comes with its own sheet of waterslide decals with a variety of unit markings, tank names, and other identifying markings to give your model that additional touch of realism when it takes to the tabletop battlefield!

      In games of Bolt Action the Sherman Firefly is a medium tank with a super-heavy anti-tank gun with a reduced HE charge. It can be included in any British armoured platoon.

      This vehicle can also be used in games of Achtung Panzer!, the game of close-quarters tank-on-tank combat, its rules can be found in the Achtung Panzer! rulebook.

