      - AVRE \(Armoured Vehicle Royal Engineers\) with 290mm Petard Mortar \(aka the flying dustbin!\)

      In games of Bolt Action the Churchill is a heavy tank, with a range of gun options described above, including the Petard Mortar that counts as a short ranged heavy howitzer. It can be included in any amoured platoon.

