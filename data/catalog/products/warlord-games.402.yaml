      Infantry weapons teams are a key component of any Bolt Action army, providing great tactical flexibility for your force. This boxed set provides your Italian Alpini army with three of the most prevalent and useful such teams, as well as Bolt Action Order Dice to field them, arming you with the tools to tackle a variety of battlefield situations, and presenting your opponent with multiple challenges to overcome. It contains:

      **Anti-Tank Team \(0-1 per Rifle Platoon or 0-3 per Heavy Weapons Platoon\):**

      The Solothurn anti-tank rifle was a cross between a true anti-tank rifle and a light anti-tank gun. Anti-tank teams are ideally suited for hunting lighter enemy vehicles, like transports, armoured cars and light tanks.

      **Sniper Team \(0-1 per Rifle Platoon\):**

      The Italian army had no specialist sniper rifle, but a skilled marksman could make any scoped rifle deadly enough. In Bolt Action, snipers are accurate, long-range weapons that deny their targets the benefits of cover, and can pick out enemy squad leaders and NCOs from within a squad.

      **Light Mortar Team \(0-2 per Rifle Platoon or 0-5 per Heavy Weapons Platoon\):**

      The Brixia 45mm light mortar was a powerful and successful weapon in the hands of properly trained soldiers. Light mortars lob shells high over the field, at a relatively short range. Though they are inaccurate at first \(not that a lucky six won’t result in an early hit!\) they get more accurate as they range in, provided the target stays put! They are also capable of firing smoke shells to lay down a smoke screen for your troops as they advance.

      Box contains six Warlord Resin Italian Alpini figures, three Bolt Action Order dice, and plastic bases.

