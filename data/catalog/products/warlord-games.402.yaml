      Brave the cold \(and enemy fire\) with the British & Canadian Infantry \(Winter\) Platoon!

      British and Commonwealth forces in North-West Europe found themselves having to contend with inclement weather just as often as they did with German opposition. Fortunately, they could count on fighting bundled up in plenty of warm clothing, allowing them to maintain the relentless Allied advance into Germany - and on the *Bolt Action* tabletop!

      This box contains 30 infantry models in winter clothing, including greatcoats and leather jerkins, along with a huge variety of weapons and equipment, allowing you to build a wide range of British or Canadian units themed around the latter period of WWII in Europe. Included on each sprue are Lee-Enfield rifles, Sten submachine guns, Bren light machine guns, a PIAT anti-tank launcher, light mortar, flamethrower, and even minesweeping equipment - to name but some of the contents! The box also includes a range of head options, including the famous ‘tin hat’ helmets, cold-weather balaclavas, General Service caps, and bonnets for Scottish units, as well as a plethora of options allowing you to make officer teams and other specialist units.

