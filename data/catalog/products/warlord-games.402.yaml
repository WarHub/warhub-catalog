      Inspired by the powerful [British Churchill Crocodile](https://store.warlordgames.com/products/churchill-crocodile-flamethrowing-tank) and their own experiences in the Pacific with other versions of flamethrower tanks, the US army ordered some 100 Sherman Crocodile variants from the British.

