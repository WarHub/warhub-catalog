      Lead the charge with the M3 Grant Medium Tank!

      First seeing combat in British hands in 1942, the M3 Medium Tank was designed to serve as an interim tank while the M4 Sherman was developed and put into production. Despite this, it was by no means a poor vehicle, boasting excellent mechanical reliability and powerful firepower, albeit in a somewhat archaic layout.

      This kit allows you to build the M3, with the British-specification welded turret \(known to the British in this configuration as the ‘Grant’\), a powerful Medium tank for the mid-war period. In games of *Bolt Action* we treat the M3 as a Medium tank with a 9+ damage value, armed with a medium anti-tank gun in the hull, and a light anti-tank gun in the turret, plus a medium machine gun! You can also field the Grant in games of *Achtung Panzer!*, and its rules can be found in the *Iron Coffins* supplement.

      Whether in the Western Desert, the jungles of Burma, or defending Britain against a hypothetical invasion, you can do it with a Grant!

      Box contains one plastic M3 Grant medium tank, decal sheet, *Bolt Action* vehicle stat card, and vehicle damage markers.

      *Studio models painted by Darek Wyrozebski*

