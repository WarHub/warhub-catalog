      - Platoon Commander
      - Rifle Section with light machine gun and submachine gun options
      - Engineers Section with light machine gun, flamethrower, and submachine gun options
      - PIAT Team
      - Light Mortar Team
      - Flamethrower Team
      - Sniper Team

      You can also make spotters for indirect fire units and other infantry squads such as Corps of Military Police Sections, or combine this box with other infantry kits - the possibilities are endless!

