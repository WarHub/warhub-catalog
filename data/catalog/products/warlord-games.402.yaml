      In games of Bolt action the 88 can be included in Artillery Platoons using the 88mm Flak 36 army list entry. It is a superheavy anti-tank gun on a rotating platform with the option to fire as a medium howitzer, making it the most versatile artillery in the game, and can be towed by the Sd.Kfz 7 half-track.

