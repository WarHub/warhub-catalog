    description: |-
      Containing a medium machine gun team, a medium mortar team, two officers, a medic helping a comrade, and a radio operator that would serve well as a forward observer, this Support Group boxed set is the ideal basis of an Italian Alpini Heavy Weapons Platoon! It also provides you with three Bolt Action Order Dice to use them in game.

      **Breda M37 Medium Machine Gun Team \(0-5 per Heavy Weapons Platoon\):**

      The most successful and most commonly used machine gun in Italian service was the Breda M37 8mm air-cooled weapon. A medium machine gun team is capable of laying down a withering hail of fire, the bane of enemy infantry caught out in the open.

      **Medium Mortar team \(0-5 per Heavy Weapons Platoon\):**

      Like so many nations, the Italian Army made good use of mortars, such as the Mortaio da 81/14 Modello. A medium mortar lobs shells high over the battlefield. Inaccurate at first, they range in over the course of a game, provided their targets don’t move, of course.

      **HQ \(1 Officer Team per Platoon, 0-1 Medic per Rifle Platoon, 0-1 Forward Observer per Rifle Platoon\):**

      For every platoon in your army, you’ll need a Platoon Commander. This box contains two officers, which can be used as commanders for any platoon type, a forward observer, which could easily act as spotter or as a an extra man in your officer team, and a medic to serve in a Rifle Platoon.

      Box contains four metal Italian HQ figures, one metal Breda M37 Medium Machine Gun with three Italian Alpini crew, one metal Medium Mortar with three Italian Alpini crew, three Bolt Action Order dice, and plastic bases.

      *Models supplied unassembled and unpainted*
