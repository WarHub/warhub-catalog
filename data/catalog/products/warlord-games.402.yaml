    description: |-
      With both heavy firepower and staying power, the IS-2 Heavy Tank is fantastic addition to any Soviet Armoured Platoon.

      The Iosef Stalin tank was designed to replace the old KV heavy tank and was a far better-designed machine with thick frontal armour and a huge 122mm gun. Despite this, and the heavy tank classification given to it by the Russians, the IS-2 was only of comparable weight to the German Panther. The IS-2 was intended as a breakthrough tank, so it was given a weapon suitable for firing a powerful HE round to clear out enemy strongpoints. After some indecision, the Red Army settled on the same A19 gun-howitzer that was used by the Russian artillery.

      The IS-2 Heavy Tank mounts a heavy anti-tank gun in its turret making it a prime candidate to fulfil an anti-tank role in your *Bolt Action* Soviet Armoured Platoon. With a high Damage Value of 10+, it should also prove a significant challenge for your opponent to repel.

      The box also comes with a sprue of plastic Soviet infantry poised to represent a Tank Riders squad \(*Armies of the Soviet Union*, page 35\), a small five-man squad armed with SMGs that can appropriate the IS-2 as an impromptu transport!

      Box contains one plastic IS-2 Heavy Tank, a sprue of Soviet Infantry \(6 men\), decal sheet, and vehicle damage markers.

