      Brave the cold and push into Germany with *Crossing the Rhine*, the winter British & Canadian starter army!

      In their thick winter clothing and packing a huge amount of weaponry, these determined British infantrymen are ready to advance to battle on the *Bolt Action* tabletop. With an enormous amount of firepower at its disposal, this force is incredibly versatile and ready to take on all comers.

      This *Bolt Action* starter army gives you a battle-ready force of British troops that you can field in games as soon as they’re assembled. At the core of the force is a Rifle Platoon comprising an officer, a pair of ten-man infantry sections, and a two-man sniper team, plus an Engineer Platoon with two five-man sections each toting a powerful flamethrower, and another officer. All of these are built out of the included plastic sprues and show just some of the enormous variety of included weapons!

