      <p><strong>INCLUDES: 14 COLORS, RESIN BUST (1:16 SCALE) &amp; STEP-BY-STEP TUTORIAL GUIDE BY KIRILL KANAEV (28 PAGES)</strong></p>
      <p>Would you like to develop your figure painting techniques and add the effect of sunlight to your figures?<br />
      Kirill Kanaev, arguably the world&#8217;s finest figure painter, explains step-by-step how to get started with this technique and guides you through its application on a bust (included in the set) so that you can then transfer the technique and concepts to any other figure.</p>
      <p>Achieve the perfect balance between warmth and depth. This selection of colors is specially designed to help you create natural lighting effects on your figures. Use warm tones of light to highlight areas directly illuminated by the sun and apply cool tones of shadow to recessed areas or surfaces facing away from the light source. The included guide explains step-by-step the technique and how to achieve the best results by working in gradual layers, blending from warm highlights to cool shadows to achieve realistic contrast and depth.</p>
      <p>Whether you are a beginner or an experienced painter, this set offers everything you need to achieve realistic contrast, vibrant highlights, and atmospheric shadows. Ideal for figures, dioramas, and competition and exhibition pieces.</p>
      <p>Includes the following 3GEN colors:</p>
      <ul>
