    url: https://ak-interactive.com/product/signature-set-rafa-archiduque-sudan-campaign-1881-1899-28mm-wargame-paint-set/
    imageUrl: https://ak-interactive.com/wp-content/uploads/2022/08/AK11773_web.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>This set contains a personal selection by <strong>Rafa Archiduque</strong> of shades for painting 28mm miniatures for the Sudan Campaign.</p>
      <p>&nbsp;</p>
      <p>The shades can also be extrapolated to figures of other scales. Although the range of shades could be much wider, you will find the necessary colors for projects of this war. The shades are selected to paint 28mm miniatures with the triad system, a base color plus one, two or even three lights if necessary.</p>
      <p>&nbsp;</p>
      <p>The Sudan campaign was a British colonial war that lasted from 1881 to 1899 and pitted the followers of the Madhis (Ansar) against British forces and the Khedivate of Egypt. The British army at first wore its characteristic scarlet jacket, then during a period of the campaign they wore a gray uniform and finally the khaki one. Some units such as the Camel Corps had a blue-gray jacket. The Egyptian infantry had a white uniform in summer and blue in winter with a red fez.</p>
      <p>&nbsp;</p>
      <p>The clothing of the Madhis (Ansar) was very colorful, using fabrics of different shades of white and a range of cream, beige and earth tones. Later they also used a type of clothing called jibbah in which colorful geometric patches were typical.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/white-intense/">AK11001 White</a></li>
      <li><a href="https://ak-interactive.com/product/sky-grey-standard/">AK11012 Sky Grey</a></li>
      <li><a href="https://ak-interactive.com/product/french-blue-standard/">AK11166 French Blue</a></li>
      <li><a href="https://ak-interactive.com/product/ivory-standard/">AK11004 Ivory</a></li>
      <li><a href="https://ak-interactive.com/product/rock-grey-standard/">AK11007 Rock Grey</a></li>
      <li><a href="https://ak-interactive.com/product/light-earth-standard/">AK11115 Light Earth</a></li>
      <li><a href="https://ak-interactive.com/product/dark-sand-standard/">AK11033 Dark Sand</a></li>
      <li><a href="https://ak-interactive.com/product/radiant-flesh-standard/">AK11053 Radiant Flesh</a></li>
      <li><a href="https://ak-interactive.com/product/medium-sand-standard/">AK11034 Medium Sand</a></li>
      <li><a href="https://ak-interactive.com/product/middle-stone-standard/">AK11124 Middle Stone</a></li>
      <li><a href="https://ak-interactive.com/product/tan-earth-standard/">AK11121 Tan Earth</a></li>
      <li><a href="https://ak-interactive.com/product/orange-brown-standard/">AK11101 Orange Brown</a></li>
      <li><a href="https://ak-interactive.com/product/carmine-standard/">AK11091 Carmine</a></li>
      <li><a href="https://ak-interactive.com/product/scarlet-red-standard/">AK11087 Scarlet Red</a></li>
      <li><a href="https://ak-interactive.com/product/base-flesh-figures/">AK11401 Base Flesh</a></li>
      <li><a href="https://ak-interactive.com/product/red-brown-figures/">AK11434 Red Brown</a></li>
      <li><a href="https://ak-interactive.com/product/dark-shadow-flesh-figures/">AK11405 Dark Shadow Flesh</a></li>
      <li><a href="https://ak-interactive.com/product/leather-brown-standard/">AK11110 Leather Brown</a></li>
      </ul>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set contiene una selección personal realizada por <strong>Rafa Archiduque</strong> de tonos para pintar miniaturas en 28mm para la Campaña del Sudán.</p>
      <p>&nbsp;</p>
      <p>Los tonos también son extrapolables a figuras de otras escalas. Aunque el abanico de tonos podría ser mucho más amplio, encontraréis los colores necesarios para proyectos de esta contienda. Los tonos están seleccionados para pintar las miniaturas de 28mm con el sistema de triadas, un color base más una, dos o hasta tres luces si es necesario.</p>
      <p>&nbsp;</p>
      <p>La campaña del Sudán fue una guerra colonial británica que duró desde 1881 hasta 1899 y enfrentó a los seguidores del Madhis (Ansar) contra las fuerzas británicas y el Jedivato de Egipto. El ejército británico al principio vestía su característica chaqueta escarlata, luego durante un periodo de la campaña llevaron un uniforme gris y por último el de color caqui. Algunas unidades como los Camel Corps tenían una chaqueta gris azul. La infantería egipcia tenía un uniforme blanco en verano y azul en invierno con un fez rojo.</p>
      <p>&nbsp;</p>
      <p>La ropa del Madhis (Ansar) era muy variopinta, utilizando telas de diferentes tonos de blancos y un abanico de tonalidades cremas, beige y tierra. Más tarde utilizaron también un tipo de ropa llamado jibbah en el que eran típicos parches geométricos de colores.</p>
      <p>&nbsp;</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/white-intense/">AK11001 White</a></li>
      <li><a href="https://ak-interactive.com/product/sky-grey-standard/">AK11012 Sky Grey</a></li>
