      <p>Desde el otoño de 1940, sus superficies superiores se pintaban en verde oliva (Kenttävihreä) y negro (Musta), mientras que para pintar las inferiores se utilizaba Aluminium Dope (pintura adecuada disponible por separado en la gama Xtreme Metal), gris claro (Vaaleanharmaa) o DN-azul claro (DN-Väri &#8211; de hecho, el RLM 65 alemán).</p>
