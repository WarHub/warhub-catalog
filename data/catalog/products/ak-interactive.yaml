      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p><strong>Gabriele Esposito</strong> es uno de los historiadores militares más reputados del mundo, especializado en uniformología.</p>
      <p>Sus intereses y conocimientos abarcan desde las civilizaciones antiguas hasta los conflictos postcoloniales modernos.</p>
      <p>En los últimos años ha realizado investigaciones sobre los ejércitos de distintos países y las ha publicado con las editoriales y revistas más importantes del sector de la historia militar alrededor del mundo.</p>
      <p>Para AK-Interactive es el autor de la nueva serie &#8220;Ejércitos de la Historia&#8221;, que pretende abarcar los ejércitos más importantes del pasado con un análisis completo y accesible.</p>
      <p>Este set de AK-Interactive incluye <strong>18 colores acrílicos</strong> especialmente útiles para pintar los uniformes del periodo napoleónico, ya que comprende varios tonos de azul, el<br />
      color que llevaban la mayoría de las unidades militares de Napoleón, así como otros colores que eran muy populares en los uniformes como el rojo y el verde.</p>
      <p>El set también incluye colores especiales necesarios para pintar los distintivos de rango que llevan los oficiales y suboficiales.</p>
