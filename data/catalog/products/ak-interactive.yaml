      <p>Un juego de pintura acrílica de 3ª Generación con ocho colores indispensables para pintar modelos de aviones alemanes utilizados a mediados de la Segunda Guerra Mundial.</p>
      <p>Esto incluye la reproducción de esquemas de camuflaje de uso común como la combinación RLM 02/71/65 aplicada a los cazas diurnos (desde finales de 1939) y a los cazas pesados (desde la primavera de 1940) hasta aproximadamente mediados de 1941 y los esquemas RLM 74/75/76 (a veces con moteado adicional RLM 02 o 70) empleados a partir de entonces en las categorías de aviones mencionadas, así como en los cazas nocturnos; y el esquema RLM 70/71/65 utilizado para pintar bombarderos, aviones de ataque a tierra y de reconocimiento hasta finales de 1944.</p>
      <p>También se incluyen los esquemas RLM 66 y RLM 02, que se utilizaron para pintar cabinas y superficies interiores. El RLM 70 se utilizó como color estándar de las palas de las hélices durante toda la guerra.</p>
