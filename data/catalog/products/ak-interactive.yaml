    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>A 3rd Generation acrylic paint set featuring the six basic camouflage colors used for painting vehicles of British and Commonwealth forces deployed in North Africa and the Mediterranean from mid-1940 to the spring of 1943.</p>
      <p>Silver Grey No.28, Slate No.34 and Light Stone No.61 or Portland Stone No.64 were used for the so-called Caunter Scheme employed from July 1940 until October 1941, when a single overall color of Light Stone No.61 (sometimes replaced with Portland Stone No.64) was introduced.</p>
      <p>In December 1941, application of camouflage patterns in a chosen color was allowed.</p>
      <p>In October 1942, Desert Pink ZI was introduced as the new basic color, with Dark Olive Green PFI to be used for patterning.</p>
      <p>These would remain the official standard colors until April 1943.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
