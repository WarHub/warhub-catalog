      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set de seis pinturas acrílicas de 3ª Generación es esencial para pintar modelos de los aviones de ala fija utilizados por la Royal Navy Fleet Air Arm desde 1945 hasta 2006.</p>
      <p>Durante ese periodo, la FAA adoptó en primer lugar el esquema Extra Dark Sea Grey/Sky, que se modificó en la segunda mitad de la década de 1950 sustituyendo el Sky por el White como color de la parte inferior. A finales de la década de 1960, la flota de Buccaneer cambió al acabado general Extra Dark Sea Grey. Los Sea Harrier que iban a participar en la Guerra de las Malvinas en 1982, fueron repintados en ruta con el esquema Gris Mar Medio / Gris Camuflaje (Cebada), aplicándose este último color sólo a la parte inferior de las alas y a la cola horizontal. Tras la guerra de las Malvinas, la flota de Sea Harrier recibió un acabado general en gris mar oscuro, que fue sustituido por el gris mar medio a mediados de la década de 1990.</p>
