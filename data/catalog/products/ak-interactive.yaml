      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>This set of eight 3rd Generation acrylic paints is indispensable for painting the authentic colors of the Soviet Air Force from the 1930s until the mid-1941.</p>
      <p>Before 1937, Soviet aircraft were typically painted with Protective Green on the upper surfaces and Grey-Blue on the undersides. Around 1937, an overall AE-9/AII Light Grey finish had been introduced and used on such aircraft as Tupolev SB bombers, but it was replaced around the end of 1938 with overall AE-8/AII Aluminium finish that had been carried by such aircraft as Tupolev SB and DB-3 bombers and UT-2 trainers. At the same time, other aircraft such as I-15bis and U-2 were painted in a two-color scheme introduced in February 1937, consisting of AII Green upper surfaces and AII Aluminium undersides. From June 1940 the standard camouflage colors were to be green for the upper surfaces (A-19f Grass Green for all metal aircraft and AII Green for mixed construction ones) and light blue for the undersides (A-18f Light Grey-Blue for all metal aircraft and AII Light Blue for mixed construction ones).</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/protective-green-1920s-1930s-afv/">AK11371 Protective Green 1920s-1930s</a></li>
      <li><a href="https://ak-interactive.com/product/grey-blue-1920s-1930s-air/">AK11907 Grey-Blue 1920s-1930s</a></li>
      <li><a href="https://ak-interactive.com/product/ae-9-aii-light-grey-air/">AK11908 AE-9/AII Light Grey</a></li>
      <li><a href="https://ak-interactive.com/product/aluminium-metallic-2/">AK11207 AE-8/AII Aluminium</a></li>
      <li><a href="https://ak-interactive.com/product/aii-green-air/">AK11909 AII Green</a></li>
      <li><a href="https://ak-interactive.com/product/aii-light-blue-air/">AK11910 AII Light Blue</a></li>
      <li><a href="https://ak-interactive.com/product/a-18f-light-grey-blue-air/">AK11912 A-18f Light Grey-Blue</a></li>
      <li><a href="https://ak-interactive.com/product/a-19f-grass-green-air/">AK11913 A-19f Grass Green</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este juego de ocho pinturas acrílicas de 3ª Generación es indispensable para pintar los colores auténticos de la Fuerza Aérea Soviética desde la década de 1930 hasta mediados de 1941.</p>
      <p>Antes de 1937, los aviones soviéticos se pintaban normalmente con Verde Protector en las superficies superiores y Gris-Azul en las inferiores. Alrededor de 1937, se había introducido un acabado general AE-9/AII Gris claro que se utilizaba en aviones como los bombarderos Tupolev SB, pero fue sustituido a finales de 1938 por el acabado general AE-8/AII Aluminio que llevaban aviones como los bombarderos Tupolev SB y DB-3 y los entrenadores UT-2. Al mismo tiempo, otros aviones como el I-15bis y el U-2 fueron pintados con un esquema bicolor introducido en febrero de 1937, consistente en superficies superiores de color Verde AII y superficies inferiores de Aluminio AII. A partir de junio de 1940, los colores de camuflaje estándar serían el verde para las superficies superiores (A-19f Verde Hierba para todos los aviones de metal y AII Verde para los de construcción mixta) y el azul claro para las partes inferiores (A-18f Gris-Azul Claro para todos los aviones de metal y AII Azul Claro para los de construcción mixta).</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/protective-green-1920s-1930s-afv/">AK11371 Protective Green 1920s-1930s</a></li>
      <li><a href="https://ak-interactive.com/product/grey-blue-1920s-1930s-air/">AK11907 Grey-Blue 1920s-1930s</a></li>
      <li><a href="https://ak-interactive.com/product/ae-9-aii-light-grey-air/">AK11908 AE-9/AII Light Grey</a></li>
      <li><a href="https://ak-interactive.com/product/aluminium-metallic-2/">AK11207 AE-8/AII Aluminium</a></li>
      <li><a href="https://ak-interactive.com/product/aii-green-air/">AK11909 AII Green</a></li>
      <li><a href="https://ak-interactive.com/product/aii-light-blue-air/">AK11910 AII Light Blue</a></li>
      <li><a href="https://ak-interactive.com/product/a-18f-light-grey-blue-air/">AK11912 A-18f Light Grey-Blue</a></li>
      <li><a href="https://ak-interactive.com/product/a-19f-grass-green-air/">AK11913 A-19f Grass Green</a></li>
      </ul>
