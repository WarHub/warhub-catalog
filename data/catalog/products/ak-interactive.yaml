      <li><a href="https://ak-interactive.com/product/amt-11-blue-grey-air/">AK11917 AMT-11 Blue-Grey</a></li>
      <li><a href="https://ak-interactive.com/product/amt-12-dark-grey-air/">AK11918 AMT-12 Dark Grey</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set de ocho pinturas acrílicas de 3ª Generación es esencial para pintar maquetas de la mayoría de los aviones utilizados por la Fuerza Aérea Soviética durante la Segunda Guerra Mundial.</p>
      <p>Contiene el color A-14 Interior Steel Grey que se utilizaba habitualmente para pintar cabinas y otras superficies interiores, y siete colores de camuflaje cuya inclusión permite representar todos los esquemas de camuflaje estándar: Esquema AMT-4/AMT-6/AMT-7 utilizado para todos los aviones militares de construcción mixta desde mediados de 1941 hasta el verano de 1943; Esquema AMT-11/AMT-12/AMT-7 utilizado para los aviones de combate de construcción mixta desde el verano de 1943 hasta el final de la guerra; Esquema AMT-1/AMT-4/AMT-12/AMT-7 utilizado para la pintura de aviones de construcción mixta, no de combate, desde el verano de 1943 hasta el final de la guerra. Los colores A-21m y A-24m se utilizaron para pintar las superficies superiores de aviones no de combate totalmente metálicos, desde el verano de 1943 hasta el final de la guerra; los otros colores utilizados junto con ellos fueron A-32m (tercer color de la superficie superior) y A-28m (partes inferiores) &#8211; AMT-12 y AMT-7 podrían utilizarse como sus análogos aproximados.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
