      <p>Este juego de pintura acrílica de 3ª Generación contiene los seis colores de camuflaje más utilizados para pintar los aviones de la Luftwaffe que operaban en el Teatro de Operaciones del Mediterráneo.</p>
      <p>Los colores RLM 78 y RLM 79 se introdujeron en 1941 como colores base para su uso en el desierto, junto con el RLM 80, que debía aplicarse como color adicional de camuflaje de la superficie superior a nivel de depósito o unidad. En 1942, los tonos RLM 78 y 79 utilizados anteriormente fueron sustituidos por las nuevas variantes de estos colores. Varios cazas Messerschmitt Bf 109 que habían sido pintados de fábrica en colores tropicales también fueron entregados a las unidades que operaban en el Frente Oriental. Es posible que el color azul RLM 83 se utilizara para camuflar aviones que operaban sobre aguas del Mediterráneo a finales de la guerra.<br />
