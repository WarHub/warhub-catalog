      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Kristof Pulinckx perfeccionó sus habilidades bajo la influencia de la ahora famosa escuela belga, a partir de la cual desarrolló su propio estilo único.</p>
      <p>A finales de la década de los 90 se hizo famoso en la escena internacional del modelismo y rápidamente se dio a conocer por sus técnicas de envejecimiento y desconchados extremos.</p>
      <p>También ha contribuido con innumerables artículos en multitud de publicaciones e idiomas.</p>
      <p>Su personalidad sencilla y accesible hace que Kristof sea un invitado bienvenido en los principales eventos de modelismo de todo el mundo y es muy conocido por sus demostraciones y talleres.</p>
      <p>Este set de AK Interactive incluye 18 colores acrílicos especialmente útiles para reproducir efectos de desconchones en vehículos militares, naves de ciencia ficción, vehículos civiles, escenografía, etc.</p>
