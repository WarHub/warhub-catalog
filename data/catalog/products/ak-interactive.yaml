      <p>This set is specially developed for painting models of RAF UK-based aircraft used from the 1947 to the mid-1960s.</p>
      <p>It contains three Xtreme Metal paints intended for reproducing the overall Aluminium/High Speed Silver finishes applied to day fighters from 1947 to 1953 and bombers during the 1950s, as well as the natural metal finish of the BAC Lightning interceptors. From 1953 the RAF day fighter fleet adopted an upper surface camouflage scheme of Dark Sea Grey and Dark Green, which are provided in this set as 3rd Generation acrylic paints. The undersides of these aircraft remained silver until 1965.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-dark-sea-grey-bs381c-638-air/">AK11851 RAF Dark Sea Grey BS381C/638</a></li>
      <li><a href="https://ak-interactive.com/product/raf-dark-green-air/">AK11840 RAF Dark Green</a></li>
      <li><a href="https://ak-interactive.com/product/xtreme-metal-aluminium/">AK479 Aluminium</a></li>
      <li><a href="https://ak-interactive.com/product/xtreme-metal-dark-aluminium/">AK480 Dark Aluminium</a></li>
      <li><a href="https://ak-interactive.com/product/xtreme-metal-matte-aluminium-30-ml/">AK488 Matte Aluminium</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set está especialmente desarrollado para pintar modelos de aviones de la RAF con base en el Reino Unido utilizados desde 1947 hasta mediados de los años 60.</p>
      <p>Contiene tres pinturas Xtreme Metal destinadas a reproducir los acabados generales Aluminium/High Speed Silver aplicados a los cazas diurnos de 1947 a 1953 y a los bombarderos durante la década de 1950, así como el acabado metálico natural de los interceptores BAC Lightning. A partir de 1953, la flota de cazas diurnos de la RAF adoptó un esquema de camuflaje en la superficie superior de Gris Mar Oscuro y Verde Oscuro, que se proporcionan en este juego como pinturas acrílicas de 3ª Generación. La parte inferior de estos aviones permaneció plateada hasta 1965.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-dark-sea-grey-bs381c-638-air/">AK11851 RAF Dark Sea Grey BS381C/638</a></li>
      <li><a href="https://ak-interactive.com/product/raf-dark-green-air/">AK11840 RAF Dark Green</a></li>
