    url: https://ak-interactive.com/product/wwii-us-navy-usmc-aircraft-colors/
    imageUrl: https://ak-interactive.com/wp-content/uploads/2021/09/AK11729_web.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>This 3rd Generation acrylic paint set is essential for painting models of US Navy and Marine Corps aircraft used during World War II.</p>
      <p>At the end of December 1940, all carrier-based aircraft of US naval aviation were ordered to be painted Light Grey overall. In August 1941, it was decided that the upper surfaces of carrier-based aircraft belonging to the Battle Force of the Pacific Fleet should be painted in Blue-Grey, whilst their lower areas would retain the Light Grey color. In the coming months, more aircraft were gradually ordered to be painted in this scheme. The case was clarified in February 1942, when all carrier and shore-based aircraft were ordered to be painted in Blue-Grey/Light Grey scheme. In January 1943, a new tri-color camouflage scheme for carrier-based aircraft was introduced, this consisting of Sea Blue, Intermediate Blue and Insignia White colors. The painting scheme for fighter aircraft was simplified to Deep Sea Blue overall in mid-March 1944. This order was expanded to include all carrier-based aircraft in June 1944 (effectively October 1944) and would remain valid until the mid-1950s.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/light-gull-grey-fs-16440-air/">AK11866 M-485 Light Grey (Light Gull Grey FS 16440)</a></li>
      <li><a href="https://ak-interactive.com/product/m-485-blue-grey-air/">AK11865 M-485 Blue-Grey</a></li>
      <li><a href="https://ak-interactive.com/product/dark-sea-blue-standard/">AK11190 Sea Blue (Dark Sea Blue)</a></li>
      <li><a href="https://ak-interactive.com/product/deep-sea-blue-air/">AK11864 Deep Sea Blue</a></li>
      <li><a href="https://ak-interactive.com/product/ocean-gray-fs35164-afv/">AK11341 Intermediate Blue (Ocean Gray FS 35164)</a></li>
      <li><a href="https://ak-interactive.com/product/insignia-white-fs-17875-air/">AK11868 Insignia White (FS 17875)</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set de pintura acrílica de 3ª Generación es esencial para pintar maquetas de aviones de la Marina de EE.UU. y del Cuerpo de Marines utilizados durante la Segunda Guerra Mundial.</p>
      <p>A finales de diciembre de 1940, se ordenó que todos los aviones con base en portaaviones de la aviación naval estadounidense se pintaran de color gris claro en general. En agosto de 1941, se decidió que las superficies superiores de los aviones con base en portaaviones pertenecientes a la Fuerza de Batalla de la Flota del Pacífico se pintarían en azul-gris, mientras que sus zonas inferiores conservarían el color gris claro. En los meses siguientes, se ordenó gradualmente que más aviones fueran pintados en este esquema. El caso se aclaró en febrero de 1942, cuando se ordenó que todos los aviones de portaaviones y con base en tierra fueran pintados en el esquema Azul-Gris/Gris Claro. En enero de 1943, se introdujo un nuevo esquema de camuflaje tricolor para los aviones basados en portaaviones, consistente en los colores Azul Marino, Azul Intermedio y Blanco Insignia. A mediados de marzo de 1944, el esquema de pintura de los aviones de combate se simplificó al azul marino. Esta orden se amplió para incluir a todos los aviones basados en portaaviones en junio de 1944 (efectivamente en octubre de 1944) y seguiría siendo válida hasta mediados de la década de 1950.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/light-gull-grey-fs-16440-air/">AK11866 M-485 Light Grey (Light Gull Grey FS 16440)</a></li>
      <li><a href="https://ak-interactive.com/product/m-485-blue-grey-air/">AK11865 M-485 Blue-Grey</a></li>
      <li><a href="https://ak-interactive.com/product/dark-sea-blue-standard/">AK11190 Sea Blue (Dark Sea Blue)</a></li>
      <li><a href="https://ak-interactive.com/product/deep-sea-blue-air/">AK11864 Deep Sea Blue</a></li>
      <li><a href="https://ak-interactive.com/product/ocean-gray-fs35164-afv/">AK11341 Intermediate Blue (Ocean Gray FS 35164)</a></li>
      <li><a href="https://ak-interactive.com/product/insignia-white-fs-17875-air/">AK11868 Insignia White (FS 17875)</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div></p>
