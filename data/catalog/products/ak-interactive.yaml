      <p>Un juego de pinturas acrílicas de 3ª Generación con los cuatro colores indispensables para pintar modelos de aviones camuflados con el esquema Asia Menor de EE.UU.</p>
      <p>Este acabado de camuflaje se aplicó a todos los aviones de combate iraníes desde 1965 aproximadamente. Esto incluía los F-86F suministrados anteriormente (algunos de los cuales se entregaron a Etiopía en 1970) y los aviones F-5A/B, F-4D/E y F-14A. También se utilizó en los F-5A/B jordanos, algunos de los cuales se vendieron a Grecia en la década de 1980.</p>
