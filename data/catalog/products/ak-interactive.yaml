      <p><strong>GAMA COMPLETA de PANEL LINERS (7 x 30ml)<br />
      Nuevo tapón con pincel de precisión y un nuevo envase de 30 ml.</strong></p>
      <p>Los paneladores de precisión están formulados con una mezcla de productos en base enamel que permiten que la pintura discurra por capilaridad de forma eficiente pero sin esparcirse ni teñir grandes zonas. La base enamel es ideal para panelar ya que evita la tensión superficial de los productos acrílicos y la pintura discurre con facilidad por los detalles.</p>
      <p>Los paneladores de precisión disponen de un pincel muy afilado y con pocas fibras. Estas fibras son más largas que un pincel normal, para permitir cargar más pintura, que es lo que necesitamos en el proceso de panelado y poder remarcar líneas estructurales en una sola pasada. La precisión del pincel permite dejar discurrir la pintura alrededor de los detalles y en las hendiduras sin salirnos y controlando el efecto.</p>
      <p>Contiene:</p>
      <ul>
