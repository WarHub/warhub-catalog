      <p>3GEN paints feature the most sophisticated formula for acrylic paints to date. They provide excellent coverage, incredible adhesion, and highly pigmented matte colors. Thanks to their formula, they prevent clogging when used with an airbrush while maintaining maximum coverage even when heavily diluted.</p>
