    imageUrl: https://ak-interactive.com/wp-content/uploads/2021/08/AK11724_web.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>A set of 3rd Generation acrylic paints including the four colors that had been most commonly used for painting RAF aircraft camouflaged in the Temperate Land Scheme.<br />
      Dark Green and Dark Earth were the standard upper surface colors for day fighters from 1938 until August 1941, whilst the bombers (except Mosquitos) used them until the end of World War II. Sky was introduced as the underside color for day fighter aircraft in June 1940, but in late November 1940 it was ordered that the under surface of the port wing on day fighter aircraft of Fighter Command was to be painted black. In April 1941 the all-Sky underside finish was re-introduced for day fighters (until August). Day bombers (except Mosquitos) used Sky as the underside color, with Night being applied to the under surfaces of the night bombers which formed the backbone of the Bomber Command as the latter had switched to night time operations early in the war.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-dark-green-air/">AK11840 RAF Dark Green</a></li>
      <li><a href="https://ak-interactive.com/product/raf-dark-earth-air/">AK11841 RAF Dark Earth</a></li>
      <li><a href="https://ak-interactive.com/product/raf-sky-fs-34424-air/">AK11844 RAF Sky</a></li>
      <li><a href="https://ak-interactive.com/product/ijn-q1-anti-glare-blue-black-air/">AK11895 RAF Night (Blue-Black)</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Un juego de pinturas acrílicas de 3ª Generación que incluye los cuatro colores más utilizados para pintar los aviones de la RAF camuflados en el Esquema de Tierras Templadas.<br />
      Verde Oscuro y Tierra Oscura fueron los colores estándar de la superficie superior para los cazas diurnos desde 1938 hasta agosto de 1941, mientras que los bombarderos (excepto los Mosquitos) los utilizaron hasta el final de la Segunda Guerra Mundial. El RAF Sky se introdujo como color de la parte inferior de los cazas diurnos en junio de 1940, pero a finales de noviembre de 1940 se ordenó que la parte inferior del ala de babor de los cazas diurnos del Mando de Cazas se pintara de negro. En abril de 1941 se reintrodujo el acabado negro en la parte inferior de los cazas diurnos (hasta agosto). Los bombarderos diurnos (excepto los Mosquitos) utilizaron el cielo como color inferior, mientras que la noche se aplicó a las superficies inferiores de los bombarderos nocturnos, que formaban la columna vertebral del Mando de Bombarderos, ya que este último había pasado a realizar operaciones nocturnas a principios de la guerra.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-dark-green-air/">AK11840 RAF Dark Green</a></li>
      <li><a href="https://ak-interactive.com/product/raf-dark-earth-air/">AK11841 RAF Dark Earth</a></li>
      <li><a href="https://ak-interactive.com/product/raf-sky-fs-34424-air/">AK11844 RAF Sky</a></li>
      <li><a href="https://ak-interactive.com/product/ijn-q1-anti-glare-blue-black-air/">AK11895 RAF Night (Blue-Black)</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div></p>
