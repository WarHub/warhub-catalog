      <p>With this Sergio Vilches signature set you will be able to emulate the color formulas of one of the most talented and renowned painters of the moment.</p>
      <p>&nbsp;</p>
      <p><strong>Includes 14 3Gen colors chosen by the artist and the miniature Shimbarashe</strong>, an anthropomorphic warrior designed on a Champion <strong>30mm scale, with a real size of 48mm</strong>, exclusive edition for this set by <strong>Yedharo Models</strong>.</p>
