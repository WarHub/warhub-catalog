      <p>This set of six 3rd Generation acrylic paints is essential for painting models of the fixed wing aircraft used by the Royal Navy Fleet Air Arm from 1945 until 2006.</p>
      <p>During that period, the FAA had firstly adopted the Extra Dark Sea Grey/Sky scheme which was modified in the second half of the 1950s by replacing Sky with White as the underside color. In the late 1960s, the Buccaneer fleet switched to Extra Dark Sea Grey overall finish. The Sea Harriers that were to participate in the Falklands War in 1982, were repainted en route into Medium Sea Grey / Camouflage (Barley) Grey scheme, the latter color being applied only to the undersides of the wings and horizontal tail. After the Falklands War the Sea Harrier fleet received an overall finish of Dark Sea Grey, which was replaced with Medium Sea Grey in the mid-1990s.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-sky-fs-34424-air/">AK11844 RAF Sky</a></li>
