      <p>Las pinturas 3GEN poseen la fórmula más sofisticada para pinturas acrílicas hasta el momento. Aportan una excelente cobertura, un agarre increíble, y colores mates muy pigmentados. Gracias a su fórmula evitan las obstrucciones al aplicarse con aerógrafo, manteniendo la máxima cobertura aun diluidas en grandes ratios.</p>
