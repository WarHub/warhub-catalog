      <p>The selected colors allow for representing the most commonly used painting schemes: RLM 63 overall (Heinkel He 51), RLM 63 upper surfaces with RLM 65 undersides (Messerschmitt Bf 109 D and E); RLM 61/62/63 camouflage patterns with RLM 65 undersides (Dornier Do 17 E/F, Heinkel He 45, He 51, He 70 and He 111, Henschel Hs 123 and Hs 126, Junkers Ju 52, Ju 86 and Ju 87 A, Messerschmitt Bf 109 B) and RLM 70/71 splinter patterns with RLM 65 undersides (Dornier Do 17 P, Henschel Hs 126, Junkers Ju 87 B, Messerschmitt Bf 109 B).</p>
