      <p>The six colors included in this 3rd Generation acrylic paint set are specially designed to help the modeler in creating a realistic appearance for all types of wheels and tracks on vehicles.</p>
      <p>This set contains a Black color to represent new tires and Rubber Black color intended for worn older tires.</p>
      <p>Also included are two different track colors: a Rusty Track color for reproducing fresh rust that might be observed on the tracks of an abandoned AFV, and a Dark Track color that accurately represents the appearance of operational tracks.</p>
      <p>Finally, we provide a Dust color and a Dry Light Mud color, which will allow you to easily recreate convincing dirt and dust effects on your wheels and tracks using such methods as the dry brush technique.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/black-intense/">AK11029 Black.</a></li>
      <li><a href="https://ak-interactive.com/product/rubber-black-standard/">AK11027 Rubber/Tires (Rubber Black).</a></li>
      <li><a href="https://ak-interactive.com/product/hull-red-standard/">AK11108 Rusty Tracks (Hull Red).</a></li>
      <li><a href="https://ak-interactive.com/product/burnt-umber-standard/">AK11111 Dark Tracks (Burnt Umber).</a></li>
      <li><a href="https://ak-interactive.com/product/grimy-grey-standard/">AK11008 Dust Color (Grimy Grey).</a></li>
      <li><a href="https://ak-interactive.com/product/decomposed-flesh-standard/">AK11058 Dry Light Mud Color (Decomposed Flesh).</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Los seis colores incluidos en este set de pintura 3Gen están seleccionados específicamente para crear una apariencia realista en todo tipo de ruedas y orugas de cualquier vehículo.</p>
      <p>El set incluye un color negro para representar neumáticos nuevos, mientras que el desgaste de los neumáticos más antiguos está representado por un color gris oscuro (caucho).</p>
      <p>También se incluyen dos tonos de colores de cadenas: un color rojizo para representar óxido fresco como se podría observar en las orugas de un AFV abandonado, y el tono Dark Tracks que simula con precisión la apariencia de cadenas operativas.</p>
      <p>Finalmente, incluye dos tonos, el tono Dust y el tono Dry Light Mud, que le permitirán ensuciar y empolvar ruedas y orugas fácilmente para obtener una apariencia natural utilizando diferentes técnicas como la del pincel seco.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/black-intense/">AK11029 Black.</a></li>
      <li><a href="https://ak-interactive.com/product/rubber-black-standard/">AK11027 Rubber/Tires (Rubber Black).</a></li>
      <li><a href="https://ak-interactive.com/product/hull-red-standard/">AK11108 Rusty Tracks (Hull Red).</a></li>
      <li><a href="https://ak-interactive.com/product/burnt-umber-standard/">AK11111 Dark Tracks (Burnt Umber).</a></li>
      <li><a href="https://ak-interactive.com/product/grimy-grey-standard/">AK11008 Dust Color (Grimy Grey).</a></li>
      <li><a href="https://ak-interactive.com/product/decomposed-flesh-standard/">AK11058 Dry Light Mud Color (Decomposed Flesh).</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div></p>
