      <p>This set contains the six camouflage colors that are essential for painting models of RAF Coastal Command (CC) and Royal Navy Fleet Air Arm (FAA) aircraft used during World War II. Included are the standard upper surface colors of the Temperate Sea Scheme that had been adopted in 1939, ie. Dark Slate Grey and Extra Dark Sea Grey, and the four colors that had been used for painting the undersides of the aircraft finished in the TSS: Sky Grey (from 1939 to September 1940), Sky (from September 1940 onwards on FAA aircraft and part of CC torpedo bombers and long range fighters), Black (applied instead of Sky for night operations on FAA aircraft and to part of CC torpedo bombers and long range fighters) and Insignia White (anti-submarine aircraft of FAA and CC). It must be noted that in February 1943 Extra Dark Sea Grey was specified as the single upper surface color for most of the RAF aircraft used in coastal duties. FAA made the same switch after the war.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-sky-fs-34424-air/">AK11844 RAF Sky</a></li>
