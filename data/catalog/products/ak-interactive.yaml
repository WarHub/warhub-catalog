    url: https://ak-interactive.com/product/israeli-air-force-colors/
    imageUrl: https://ak-interactive.com/wp-content/uploads/2021/08/AK11752_web.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>This set of eight 3rd Generation acrylic paints is essential for painting models of most of the aircraft used by the Israeli Air Force from the late 1960s, onwards.</p>
      <p>After the Six Day War, the Israeli Air Force introduced a camouflage scheme consisting of an upper surface pattern of FS 30219 Dark Tan, FS 33531 Sand and FS 34227 Green, with the undersides in FS 35622 Light Blue. This desert scheme remained a standard for most of the IAF tactical aircraft and helicopters until the early 1980s, although many tactical aircraft introduced in the 1970s, such as the F-4E, carried this scheme until the end of their service. An exception were the A-4H/N, whose manufacturer used a different green tone for the camouflage pattern, ie. FS 34258 Green. The air superiority grey scheme, consisting of FS 36320 Dark Ghost Grey and FS 36375 Light Ghost Grey, was introduced with the entry of the F-15A/B at the end of 1976, for all aircraft assigned to high altitude missions, including the Kfir C2, E-2C and RF-4E. With the delivery of the first F-16s in 1980, the standard desert scheme for combat aircraft was modified by replacing the FS 34227 Green with WWII RAF Sky (FS 34424), and FS 35622 Light Blue with FS 36375 Light Ghost Grey, respectively. This modified scheme was later applied to the Kfir C7 and late C2 variants, and the F-15I.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/tan-earth-standard/">AK11121 Tan Earth FS 30219</a></li>
      <li><a href="https://ak-interactive.com/product/sand-fs-33531-air/">AK11869 Sand FS 33531</a></li>
      <li><a href="https://ak-interactive.com/product/ral-6011-resedagrun-afv/">AK11311 Pale Green FS 34227 (RAL 6011)</a></li>
      <li><a href="https://ak-interactive.com/product/green-fs-34258-air/">AK11876 Green FS 34258</a></li>
      <li><a href="https://ak-interactive.com/product/duck-egg-blue-fs-35622-air/">AK11880 Duck Egg Blue FS 35622</a></li>
      <li><a href="https://ak-interactive.com/product/raf-sky-fs-34424-air/">AK11844 Sky FS 34424</a></li>
      <li><a href="https://ak-interactive.com/product/dark-ghost-grey-fs-36320-air/">AK11887 Dark Ghost Grey FS 36320</a></li>
      <li><a href="https://ak-interactive.com/product/light-ghost-grey-fs-36375-air/">AK11888 Light Ghost Grey FS 36375</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este conjunto de ocho pinturas acrílicas de 3ª generación es esencial para pintar modelos de la mayoría de los aviones utilizados por la Fuerza Aérea de Israel desde finales de la década de 1960 en adelante.</p>
      <p>Después de la Guerra de los Seis Días, la Fuerza Aérea Israelí introdujo un esquema de camuflaje que consistía en un patrón de superficie superior de FS 30219 Dark Tan, FS 33531 Sand y FS 34227 Green, con las partes inferiores en FS 35622 Light Blue. Este esquema desértico se mantuvo como estándar para la mayoría de los aviones y helicópteros tácticos de la IAF hasta principios de la década de 1980, aunque muchos aviones tácticos introducidos en la década de 1970, como el F-4E, llevaron este esquema hasta el final de su servicio. Una excepción fueron los A-4H/N, cuyo fabricante utilizó un tono verde diferente para el patrón de camuflaje, es decir, FS 34258 Verde. El esquema gris de superioridad aérea, compuesto por el FS 36320 Gris Fantasma Oscuro y el FS 36375 Gris Fantasma Claro, se introdujo con la entrada del F-15A/B a finales de 1976, para todos los aviones asignados a misiones de gran altitud, incluidos el Kfir C2, el E-2C y el RF-4E. Con la entrega de los primeros F-16 en 1980, el esquema estándar del desierto para los aviones de combate se modificó sustituyendo el FS 34227 Verde por el WWII RAF Sky (FS 34424), y el FS 35622 Azul Claro por el FS 36375 Gris Fantasma Claro, respectivamente. Este esquema modificado se aplicó posteriormente al Kfir C7 y a las últimas variantes del C2, así como al F-15I.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/tan-earth-standard/">AK11121 Tan Earth FS 30219</a></li>
      <li><a href="https://ak-interactive.com/product/sand-fs-33531-air/">AK11869 Sand FS 33531</a></li>
      <li><a href="https://ak-interactive.com/product/ral-6011-resedagrun-afv/">AK11311 Pale Green FS 34227 (RAL 6011)</a></li>
      <li><a href="https://ak-interactive.com/product/green-fs-34258-air/">AK11876 Green FS 34258</a></li>
      <li><a href="https://ak-interactive.com/product/duck-egg-blue-fs-35622-air/">AK11880 Duck Egg Blue FS 35622</a></li>
      <li><a href="https://ak-interactive.com/product/raf-sky-fs-34424-air/">AK11844 Sky FS 34424</a></li>
      <li><a href="https://ak-interactive.com/product/dark-ghost-grey-fs-36320-air/">AK11887 Dark Ghost Grey FS 36320</a></li>
      <li><a href="https://ak-interactive.com/product/light-ghost-grey-fs-36375-air/">AK11888 Light Ghost Grey FS 36375</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div></p>
