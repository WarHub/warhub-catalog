      <p>*Step-by-step bilingual tutorial guide <strong>(English/Spanish)</strong></p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p><strong>INCLUYE:</strong> <strong>14 COLORES, BUSTOS DE RESINA (ESCALA 1:16) Y GUÍA TUTORIAL PASO A PASO DE KIRILL KANAEV (28 PÁGINAS).</strong></p>
      <p>¿Te gustaría desarrollar tus técnicas de pintura de figuras y añadir el efecto de la luz solar a tus modelos? Kirill Kanaev, posiblemente el mejor pintor de figuras del mundo, explica paso a paso cómo iniciarte en esta técnica y te guía en su aplicación sobre un busto (incluido en el set), para que luego puedas transferir los conceptos y la técnica a cualquier otra figura.</p>
      <p>Consigue el equilibrio perfecto entre calidez y profundidad. Esta selección de colores está especialmente diseñada para ayudarte a crear efectos de iluminación natural en tus figuras. Utiliza tonos cálidos de luz para resaltar las áreas directamente iluminadas por el sol y aplica tonos fríos de sombra en las zonas hundidas o en superficies que no reciben luz directa. La guía incluida explica paso a paso la técnica y cómo obtener los mejores resultados trabajando en capas graduales, fundiendo desde los brillos cálidos hasta las sombras frías para lograr un contraste realista y profundidad.</p>
      <p>Tanto si eres principiante como pintor experimentado, este set te ofrece todo lo necesario para conseguir contrastes realistas, brillos vibrantes y sombras atmosféricas. Ideal para figuras, dioramas y piezas de concurso o exhibición.</p>
      <p>Incluye los siguiente colores 3GEN:</p>
