      <p>A 3rd Generation acrylic paint set featuring eight colors indispensable for painting models of German aircraft used in the mid-World War II period.</p>
      <p>This includes reproducing such commonly used camouflage schemes as the RLM 02/71/65 combination applied to day fighters (from the late 1939) and heavy fighters (from the spring of 1940) until approx. mid-1941 and the RLM 74/75/76 (sometimes with additional RLM 02 or 70 mottling) schemes employed onwards on the aforementioned categories of aircraft as well as on the night fighters; and the RLM 70/71/65 scheme used for painting bomber, ground-attack and reconnaissance aircraft until late 1944.</p>
      <p>Also included are RLM 66 and RLM 02 which were used for painting cockpits and interior surfaces. RLM 70 was used as the standard propeller blade color throughout the entire war.</p>
