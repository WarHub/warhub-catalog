      <p>Está desarrollado técnicamente a través de un copolímero acrílico acuoso ultrarresistente para pintar con máximo poder de cubrición y resistencia.</p>
      <p>Es una pintura acrílica autonivelante de acabado mate que facilita los procesos de weathering una vez aplicada la capa base.</p>
      <p>Sus aditivos de alta calidad nos proporcionan una capacidad multiadherente jamás vista, además de una elevada durabilidad.</p>
      <p>Su baja viscosidad hace ideal utilizarla con aerógrafo, aunque también puede usarse con pincel.</p>
      <p><strong>DUAL EXO scenery</strong> presenta unos colores basados en el <strong>mismo sistema de pintura pero con un acabado mate</strong>, y están diseñados para pintar cualquier tipo de escenario.</p>
      <p>&nbsp;</p>
      <p>1. Perfecto agarre en caulquier material.<br />
      2. Permite aplicar cualquier tipo de weathering gracias a su resistencia.<br />
      3.Acabado mate.</p>
      <p>&nbsp;</p>
      <p><strong>Volumen: 2 x 60ml</strong></p>
      <p>&nbsp;</p>
      <p>**Mira <a href="https://www.youtube.com/watch?v=Mntg3sjhkO8">aquí</a> el vídeo sobre<strong> cómo utilizarlo</strong>.</p>
