      <p>Raul Garcia Latorre is a renowned sculptor, but he is also a great painter and expert in Scottish history and tartans.</p>
      <p>In this set he focuses on explaining how to paint tartans and following the colors of the different families and how to represent them in miniatures.</p>
      <p>The most important thing is the pattern, understanding how the threads work in the weave and how the squares are formed.</p>
      <p>The key is the overlapping of the colors, as they are the sum of the threads.</p>
      <p>It also provides the perfect colors to recreate the wear, with browns and grays, as well as the colors needed to make the highlights and shadows.</p>
