      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>A 3rd Generation acrylic paint set featuring the six colors essential for painting models of Soviet Army vehicles used during World War II. Protective Green paint was introduced in the 1920s and remained in use in the 1930s, with some older equipment probably still carrying it at the eve of war.</p>
      <p>The same concerned the 3B AU/ZB AU paint introduced as the base color in the first half of 1930s. Green 4BO was developed in 1937 and entered mass production in 1940, becoming the standard color of Soviet military vehicles throughout the war.</p>
      <p>Dark Brown 6K and Sand 7K were introduced as disruptive camouflage colors around 1939, but their use was quite limited: most vehicles and equipment remained green overall.</p>
      <p>On the other hand, Washable White Paint was commonly used in the winter periods.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/russian-green-4bo-afv/">AK11368 Russian Green 4BO.</a></li>
      <li><a href="https://ak-interactive.com/product/russian-dark-brown-6k-afv/">AK11369 Russian Dark Brown 6K.</a></li>
      <li><a href="https://ak-interactive.com/product/russian-sand-7-afv/">AK11370 Russian Sand 7K.</a></li>
      <li><a href="https://ak-interactive.com/product/3b-au-zb-au-afv/">AK11387 3B AU/ZB AU.</a></li>
      <li><a href="https://ak-interactive.com/product/protective-green-1920s-1930s-afv/">AK11371 Protective Green 1920s-1930s</a></li>
      <li><a href="https://ak-interactive.com/product/washable-white-paint-afv/">AK11372 Washable White Paint.</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set de pintura acrílica 3en ha sido diseñado para reproducir los colores utilizados por los vehículos del Ejército Rojo durante el período 1935-1945.</p>
      <p>Este set incluye 4BO, 7K, 6K, 3BAU y tono protector verde para el período de entreguerras.</p>
      <p>Este set también incluye un color de pintura blanca lavable que imita el blanco aplicado en el campo de batalla por los soldados rusos cuando sus tanques operaban en lugares cubiertos de nieve.</p>
      <p>Este producto está hecho con la misma fórmula que el producto utilizado por el ejército soviético, por lo que puede ser desconchado y retirado como ocurría en los vehículos reales.</p>
      <p>Para garantizar la precisión histórica de su modelo terminado, las pinturas AK se han diseñado teniendo en cuenta el efecto de reducción de escala.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/russian-green-4bo-afv/">AK11368 Russian Green 4BO.</a></li>
      <li><a href="https://ak-interactive.com/product/russian-dark-brown-6k-afv/">AK11369 Russian Dark Brown 6K.</a></li>
      <li><a href="https://ak-interactive.com/product/russian-sand-7-afv/">AK11370 Russian Sand 7K.</a></li>
      <li><a href="https://ak-interactive.com/product/3b-au-zb-au-afv/">AK11387 3B AU/ZB AU.</a></li>
      <li><a href="https://ak-interactive.com/product/protective-green-1920s-1930s-afv/">AK11371 Protective Green 1920s-1930s</a></li>
      <li><a href="https://ak-interactive.com/product/washable-white-paint-afv/">AK11372 Washable White Paint.</a></li>
      </ul>
