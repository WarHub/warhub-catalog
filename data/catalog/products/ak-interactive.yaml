      <p>With this<strong> set of 108 paints</strong> <strong>for Wargames</strong>, you will have a selection of 3GEN colors to paint your armies and terrains.</p>
      <p>These colors have been selected by players and professional painters.</p>
      <p>• Budget-friendly combo.<br />
