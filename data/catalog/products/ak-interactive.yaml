      <p>Un juego de pinturas acrílicas de 3ª Generación con cuatro colores necesarios para pintar modelos de aviones camuflados en el Esquema de Caza Diurno, que fue adoptado por el Mando de Caza de la RAF en agosto de 1941 y se mantuvo en uso hasta 1947 (en la práctica incluso hasta finales de la década de 1940).</p>
      <p>Incluye los colores de la superficie superior Verde Oscuro y Gris Océano, el color inferior Gris Mar Medio y el color Cielo utilizado para pintar las bandas de cola y las hélices.</p>
      <p>El esquema de caza diurno también lo llevaban las variantes de bombardero Mosquito. Los colores Dark Green y Medium Sea Grey se utilizaron para pintar los aviones de caza nocturnos de la RAF desde el otoño de 1942 hasta principios de la década de 1950.</p>
