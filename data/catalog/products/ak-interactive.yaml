      <p>Contiene dos versiones del color inferior RLM 76 (incluyendo la variación verde-azul vista en aviones como el Fw 190 D-9 y el Bf 109 K-4), tres versiones del color de la superficie superior RLM 81 (dos tonos caqui y uno verde oscuro, este último erróneamente identificado como RLM 83 en el pasado) que fueron reproducidos en base a las fórmulas oficialmente aprobadas para ser usadas dependiendo del suministro de componentes disponibles de un fabricante de pintura en particular; y el color de la superficie superior RLM 82 (también se aprobaron tres fórmulas para este color, pero dan como resultado tonos de verde muy similares).</p>
