  - id: ak-interactive/AK19300
    name: MASTER ACRYLIC WASH SET – FULL RANGE (18 COLORS)
    manufacturer: ak-interactive
    productCode: AK19300
    sku: AK19300
    category: paint-set
    status: current
    availability: in_stock
    firstSeen: '2026-07-23'
    priceEur: 43.88
    url: https://ak-interactive.com/product/master-acrylic-wash-set-full-range-18-colors/
    imageUrl: https://ak-interactive.com/wp-content/uploads/2025/11/AK19300.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>Make your miniatures stand out with the easiest, fastest, and most effective shading.</p>
      <p>Washes are the simplest and most effective way to add definition to your miniatures.<br />
      Applied over the base coat, the darker pigments in the washes flow into the crevices and recesses, creating natural shadows that instantly bring every detail to life. They also serve to enhance volume and add depth to details.</p>
      <p>This new acrylic formula, designed for brush application, offers total control to achieve perfect shading. By working the wash as you apply it, you can build it up in the desired area. They can be used individually or combined with each other to achieve the exact contrast and definition you are looking for on different base tones.</p>
      <p>The differences between shades, washes, and paints with contrasting effects, in the context of miniature painting (e.g., Warhammer, D&amp;D, etc.), lie in their consistency, behavior, and the effect they produce on the miniature.<br />
      Washes are more liquid and have less surface tension. They are applied over base colors to create realistic shadows. They flow into crevices and folds to darken deep areas and define the details and edges of figures. They do not require a clear base, and their color is chosen according to the base tone on which they will be applied.</p>
      <p>&nbsp;</p>
      <p><a class="btnarticl" href="https://ak-masters.com/app/pdf/Folleto_A5_ACRYLIC_WASHES.pdf" target="_blank" rel="noopener">Dossier ACRYLIC WASHES</a></p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Haz que tus miniaturas destaquen con el sombreado más fácil, rápido y efectivo.</p>
      <p>Los lavados son la forma más sencilla y efectiva de añadir definición a tus miniaturas.<br />
      Aplicados sobre la capa base, los pigmentos más oscuros de los lavados fluyen hacia las hendiduras y recovecos, creando sombras naturales que dan vida al instante a cada detalle. También sirven para realzar el volumen y aportar profundidad a los detalles.</p>
      <p>Esta nueva fórmula acrílica, diseñada para su aplicación con pincel, ofrece un control total para lograr un sombreado perfecto. Trabajando el lavado mientras lo aplicas, puedes intensificarlo en la zona deseada. Se pueden usar individualmente o combinarse entre sí para lograr el contraste y la definición exacta que buscas sobre diferentes tonos base.</p>
      <p>Las diferencias entre shades, washes y pinturas con efectos de contraste, en el contexto del pintado de miniaturas (p. ej., Warhammer, D&amp;D, etc.), radican en su consistencia, comportamiento y el efecto que producen en la miniatura.<br />
      Los washes son más líquidos y tienen menos tensión superficial. Se aplican sobre los colores base para crear sombras realistas. Fluyen hacia las hendiduras y pliegues para oscurecer las zonas profundas y definir los detalles y bordes de las figuras. No requieren una base clara, y su color se elige de acuerdo con el tono base sobre el que se aplicarán.</p>
      <p>&nbsp;</p>
      <p><a class="btnarticl" href="https://ak-masters.com/app/pdf/Folleto_A5_ACRYLIC_WASHES_ES.pdf" target="_blank" rel="noopener">Dossier ACRYLIC WASHES</a></p>
      <p></div></p>
