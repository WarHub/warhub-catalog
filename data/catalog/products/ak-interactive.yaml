    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>A 3rd Generation acrylic paint set featuring six colors used for painting vehicles of the German Afrika Korps in North Africa from early 1941 to May 1943.</p>
      <p>Most of the vehicles and equipment initially shipped to Africa were painted RAL 7021 Dunkelgrau overall.</p>
      <p>In March 1941, the first camouflage colours specifically intended for use in Africa were selected:<br />
      RAL 8000 Gelbbraun and RAL 7008 Graugrün. These colors were to cover two thirds and one third of vehicle’s surface, respectively.</p>
      <p>In March 1942, they were replaced by RAL 8020 Braun and RAL 7027 Grau.</p>
      <p>The set also includes RAL 1001 Elfenbein vehicle interior color.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/ral-7021-dunkelgrau-afv/">AK11316 RAL 7021 Dunkelgrau.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-7008-graugrun-afv/">AK11313 RAL 7008 Graugrün.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-8000-gelbbraun-afv/">AK11327 RAL 8000 Gelbbraun.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-7027-grau-afv/">AK11317 RAL 7027 Grau.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-8020-braun-afv/">AK11331 RAL 8020 Braun.</a></li>
      <li><a href="https://ak-interactive.com/product/cremeweiss-afv/">AK11333 RAL 1001 Elfenbein (Cremeweiss).</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Los vehículos Deutsche Afrika Korps fueron pintados con cuatro colores principalmente: RAL: 8000 y RAL7008 hasta marzo de 1942; RAL 8020 y RAL7008 después de marzo de 1942.</p>
      <p>Además, el color base, RAL7021, quedaba expuesto cuando los colores del camuflaje se desconchaba y desgastaba.</p>
      <p>Los colores se ajustan sutilmente a las maquetas teniendo en cuenta el factor de reducción de escala.</p>
      <p>Afrika Korps set satisfará al ojo más exigente de los modelistas que exigen colores históricamente correctos.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/ral-7021-dunkelgrau-afv/">AK11316 RAL 7021 Dunkelgrau.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-7008-graugrun-afv/">AK11313 RAL 7008 Graugrün.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-8000-gelbbraun-afv/">AK11327 RAL 8000 Gelbbraun.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-7027-grau-afv/">AK11317 RAL 7027 Grau.</a></li>
