      <p>Set de 4 pinturas acrílicas 3Gen para vehículos pintados en verde ruso 4BO.</p>
      <p>Esta selección de colores ofrece la combinación perfecta de tonos para aplicar la técnica de la modulación.</p>
      <p>Cada color es diferente y combinado permite crear un efecto óptico de modulación de luz.</p>
      <p>Los cuatro tonos permiten obtener la transición sutil de color, y se recomienda no evitar ningún color.</p>
      <p>Las pinturas se pueden mezclar para obtener variaciones sutiles en los tonos para zonas mayores o para escalas más grandes.</p>
