      <p>*To thin <strong>3GEN</strong> acrylic paints you can use an acrylic thinner such as <a href="https://ak-interactive.com/product/ak11500-thinner-100ml/"><strong>AK11500</strong> </a>or <a href="https://ak-interactive.com/product/acrylic-thinner/"><strong>AK712</strong></a>.</p>
      <p><strong>*</strong>To thin the <strong>Xtreme Metal </strong>range paints it is necessary to use <a href="https://ak-interactive.com/product/xtreme-cleaner/"><strong>AK470</strong> </a>Xtreme Thinner &amp; Cleaner, do not use acrylic thinners.</p>
      <p>Included are two different olive drab shades that were used for painting the anti-glare panels, and three different shades of aluminium, which allow for representing the difference between the panels made from various metal sheets and aluminium-painted, fabric-skinned control surfaces. Indispensable for painting your P-38 Lightning, P-47 Thunderbolt, P-51 Mustang, B-17G Flying Fortress, B-24 Liberator, B-25 Mitchell or B-26 Marauder models and many others!</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/dark-olive-drab-41-air/">AK11860 Dark Olive Drab 41</a></li>
      <li><a href="https://ak-interactive.com/product/ana-613-olive-drab-air/">AK11863 ANA 613 Olive Drab</a></li>
      <li><a href="https://ak-interactive.com/product/xtreme-metal-aluminium/">AK479 Aluminium</a></li>
      <li><a href="https://ak-interactive.com/product/xtreme-metal-dark-aluminium/">AK480 Dark Aluminium</a></li>
      <li><a href="https://ak-interactive.com/product/xtreme-metal-matte-aluminium-30-ml/">AK488 Matte Aluminium</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este juego de dos pinturas <strong>(ACRILICAS)</strong> de 3ª Generación y tres pinturas Xtreme Metal <strong>(NO ACRILICAS) </strong>es esencial para pintar maquetas de la mayoría de los aviones utilizados por las Fuerzas Aéreas del Ejército de los Estados Unidos desde finales de 1943 hasta el final de la Segunda Guerra Mundial y poco después.</p>
      <p>*Para diluir las pinturas acrilicas <strong>3GEN</strong> puede usar un diluyente acrílico como <a href="https://ak-interactive.com/es/producto/ak11500-thinner-100ml/"><strong>AK11500</strong> </a>o <a href="https://ak-interactive.com/es/producto/acrylic-thinner/"><strong>AK712</strong></a></p>
      <p>*Para diluir el rango de pinturas <strong>Xtreme Metal</strong> es necesario usar <a href="https://ak-interactive.com/es/producto/xtreme-cleaner/"><strong>AK470</strong> </a>Xtreme Thinner &amp; Cleaner, no use diluyentes acrilicos.</p>
      <p>Se incluyen dos tonos diferentes de verde oliva que se utilizaron para pintar los paneles antideslumbrantes, y tres tonos diferentes de aluminio, que permiten representar la diferencia entre los paneles fabricados con diversas láminas de metal y las superficies de control pintadas de aluminio y con revestimiento de tela. Indispensable para pintar sus modelos P-38 Lightning, P-47 Thunderbolt, P-51 Mustang, B-17G Flying Fortress, B-24 Liberator, B-25 Mitchell o B-26 Marauder, ¡y muchos otros!</p>
