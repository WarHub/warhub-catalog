    imageUrl: https://ak-interactive.com/wp-content/uploads/2021/12/AK11758_web.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>The Clear series of colors is specially designed to make the paint transparent while maintaining the other qualities of the 3GEN acrylic range. This feature makes it especially useful when tinting the translucent parts of our models such as windows, headlights, aircraft canopies, optics, etc.. In this way we can modify the color of these objects while still maintaining their transparency. They can also be used to modify the color of metallic parts or to make glazes to vary the tone of already painted elements. It is a product of universal compatibility, being able to be applied on any type of paint without reacting or damaging the finish of the area where we use it.</p>
      <p>&nbsp;</p>
      <p>This 3Gen set contains 6 acrylic paints essential for painting clear parts and any clear effects on your models.</p>
      <p>Perfect to use for indicators, sirens, smoked and tinted windows,or fantasy works.</p>
      <p>The intensity and transparency of the pigments make these paints very special.</p>
      <p>They can be applied by brush, taking advantage of the 3rd generation high coverage and adhesion.</p>
      <p>&nbsp;</p>
      <p>The set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/clear-red-standard/">AK11213 Clear Red</a></li>
      <li><a href="https://ak-interactive.com/product/clear-blue-standard/">AK11214 Clear Blue</a></li>
      <li><a href="https://ak-interactive.com/product/clear-smoke-standard/">AK11215 Clear Smoke</a></li>
      <li><a href="https://ak-interactive.com/product/clear-green-standard/">AK11216 Clear Green</a></li>
      <li><a href="https://ak-interactive.com/product/clear-yellow-standard/">AK11217 Clear Yellow</a></li>
      <li><a href="https://ak-interactive.com/product/clear-orange-standard/">AK11218 Clear Orange</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>La serie de colores tipo Clear está especialmente diseñada para que la pintura sea transparente, manteniendo el resto de cualidades de la gama de acrílicos 3GEN. Esta característica la hace especialmente útil a la hora de teñir las piezas traslúcidas de nuestras maquetas como pueden ser cristales, ventanillas, carlingas, faros, etc. De esta forma modificaremos el color de dichos objetos sin que estos dejen de ser transparentes. También pueden utilizarse para modificar el color de elementos metalizados o realizar veladuras para variar la tonalidad de elementos ya pintados. Es un producto de una compatibilidad universal, pudiéndose aplicar sobre cualquier tipo de pintura sin que reaccione dañando el acabado de la zona donde la utilicemos.</p>
      <p>Este set 3G contiene 6 pinturas acrílicas esenciales para pintar cualquier efecto transparente en tus maquetas.</p>
      <p>Indicado para pintar piezas tranparentes y realizar intermitentes, sirenas, cristales ahumados y polarizados, o trabajos de fantasía.</p>
      <p>La intensidad y transparencia de los pigmentos hacen que estas pinturas sean muy especiales.</p>
      <p>Se pueden aplicar con pincel, aprovechando la alta cobertura y adherencia de 3ª generación.</p>
      <p>&nbsp;</p>
      <p>El set contiene:</p>
