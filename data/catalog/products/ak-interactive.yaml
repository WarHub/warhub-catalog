      <li><a href="https://ak-interactive.com/product/raf-dark-slate-grey-air/">AK11849 RAF Dark Slate Grey</a></li>
      <li><a href="https://ak-interactive.com/product/raf-extra-dark-sea-grey-bs381c-640-air/">AK11850 RAF Extra Dark Sea Grey</a></li>
      <li><a href="https://ak-interactive.com/product/insignia-white-fs-17875-air/">AK11868 Insignia White (FS 17875)</a></li>
      <li><a href="https://ak-interactive.com/product/black-intense/">AK11029 Black</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set contiene los seis colores de camuflaje esenciales para pintar los modelos de aviones del Mando Costero (CC) de la RAF y del Fleet Air Arm (FAA) de la Royal Navy utilizados durante la Segunda Guerra Mundial. Se incluyen los colores estándar de la superficie superior del Esquema del Mar Templado que se había adoptado en 1939, es decir. Dark Slate Grey y Extra Dark Sea Grey, y los cuatro colores que se habían utilizado para pintar la parte inferior de los aviones acabados en el TSS: Sky Grey (de 1939 a septiembre de 1940), Sky (a partir de septiembre de 1940 en aviones de la FAA y parte de los bombarderos torpederos y cazas de largo alcance del CC), Black (aplicado en lugar de Sky para operaciones nocturnas en aviones de la FAA y a parte de los bombarderos torpederos y cazas de largo alcance del CC) e Insignia White (aviones antisubmarinos de la FAA y el CC). Hay que señalar que en febrero de 1943 se especificó el Gris Mar Extra Oscuro como único color de la superficie superior para la mayoría de los aviones de la RAF utilizados en tareas costeras. La FAA hizo el mismo cambio después de la guerra.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
