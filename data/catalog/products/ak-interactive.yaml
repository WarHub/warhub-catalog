      <p>Raúl García Latorre es un reconocido escultor, pero también es un gran pintor y experto en historia escocesa y sus tartanes.</p>
      <p>En este set se explica cómo pintar tartanes y seguir los colores de las diferentes familias y cómo representarlos en miniaturas.</p>
