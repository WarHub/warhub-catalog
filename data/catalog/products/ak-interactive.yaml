      <p>This camouflage finish was applied to all Iranian combat aircraft since around 1965. This included the earlier supplied F-86Fs (some of which were delivered to Ethiopia in 1970) and the F-5A/B, F-4D/E and F-14A aircraft. It was also used on Jordanian F-5A/Bs, some of which were sold to Greece in 1980s.</p>
