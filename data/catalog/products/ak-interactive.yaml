      <p><em><strong>Odorless acrylic fluid to create Scratches Effects.</strong></em></p>
      <p>&nbsp;</p>
      <p>Odorless and effective acrylic product to replace hairspray and to get realistic effects of wear and scratches on our models. First we paint our model with a dark color or the base color that we want to see under the scratches. Then we apply with a brush or directly from an airbrush a generous coat to our model. Finally we apply a layer of acrylic paint over the area, which will be the outermost layer of paint. Once this last layer of paint is dry to the touch, we damp the area with water with a brush and perform some damage and scratch effects with the help of tweezers, a toothpick or the brush itself.<br />
      AK product is the original fluid effect and first in the market.</p>
