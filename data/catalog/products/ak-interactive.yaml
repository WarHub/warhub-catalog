  - id: ak-interactive/AK11773
    name: SIGNATURE SET – RAFA “ARCHIDUQUE” – SUDAN CAMPAIGN 1881-1899 – 28MM WARGAME PAINT SET
    manufacturer: ak-interactive
    productCode: AK11773
    sku: AK11773
    category: paint-set
    status: current
