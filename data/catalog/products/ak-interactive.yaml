      <p>&nbsp;</p>
      <p>Producto acrílico inodoro y eficaz para reemplazar la laca para el pelo y lograr efectos de desgaste y arañazos realistas en nuestros modelos. Primero pintamos nuestro modelo con un color oscuro o el color base que queremos ver debajo de los rasguños y desconchones. Luego, aplicamos a pincel o con aerógrafo una capa generosa sobre la zona a trabajar.<br />
      Finalmente aplicamos una capa de pintura acrílica sobre la zona, que será la capa de pintura más exterior.<br />
