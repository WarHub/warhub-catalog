      <p>Limpiador y diluyente para aerógrafo de alta calidad para nuestra gama Xtreme Metal. Se puede utilizar para toda nuestra gama de colores metálicos, así como para otros fines, como la limpieza de las herramientas, la dilución de la masilla o las pinturas de otras marcas que tienen los mismos componentes de base. Sirve tanto para limpiar como para diluir las pinturas si es necesario. Xtreme Metal es una nueva gama metálica de alta calidad, desarrollada con excelentes pigmentos, y especialmente formulada para ofrecerle los mejores resultados. Resistente al enmascaramiento, a cualquier tipo de intemperie, con un poder de cobertura ultra alto, y de secado rápido. Ahora es fácil limpiar su aerógrafo sin dejar restos de pigmento/pintura. Son, sencillamente, las pinturas metálicas de mayor calidad que se hayan visto.</p>
