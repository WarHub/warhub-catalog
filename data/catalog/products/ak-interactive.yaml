    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>A special set of 3rd Generation acrylic paints intended for finishing vehicles painted in 4BO Russian Green using the modulation technique.</p>
      <p>Each color is different and combining them allows for easy creation of a visual volume to your model and achieving subtle color transitions.</p>
      <p>It is recommended not to avoid using any color during the process. The paints can be mixed with each other to get futher subtle tonal variation useful for larger areas or for larger models.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/extra-dark-green-standard/">AK11153 Extra Dark Green (Shadow).</a></li>
