      <p>This 3rd Generation acrylic paint set contains the three standard colors used for painting the Israeli Defence Forces vehicles from its foundation until today.</p>
      <p>IDF Early Sand Yellow was typical for the late 1950s and 1960s, and was widely used until the Yom Kippur War in 1973 on tanks such as the AMX-13, Shermans, early M48 Pattons and the majority of the Centurions (Sho’t).</p>
      <p>After the Yom Kippur War, it remained in use in the South and the Sinai Peninsula.</p>
      <p>After the 1973 war, more IDF land forces were positioned in the Northern frontiers, and their vehicles received a darker tone, a Sand Grey, which was more suitable for blending with the greyish terrain color of the North of Israel.</p>
      <p>IDF Modern Grey is the current IDF paint introduced in May 1981.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/idf-modern-grey-afv/">AK11352 IDF Modern Grey.</a></li>
      <li><a href="https://ak-interactive.com/product/idf-sand-grey-1970s-1980s-afv/">AK11353 IDF Sand Grey 1970s-1980s.</a></li>
      <li><a href="https://ak-interactive.com/product/idf-early-sand-yellow-afv/">AK11354 IDF Early Sand Yellow.</a></li>
      </ul>
