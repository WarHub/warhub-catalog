      <p>Los colores seleccionados permiten representar los esquemas de pintura más utilizados: RLM 63 general (Heinkel He 51), RLM 63 superficies superiores con RLM 65 superficies inferiores (Messerschmitt Bf 109 D y E); patrones de camuflaje RLM 61/62/63 con superficies inferiores RLM 65 (Dornier Do 17 E/F, Heinkel He 45, He 51, He 70 y He 111, Henschel Hs 123 y Hs 126, Junkers Ju 52, Ju 86 y Ju 87 A, Messerschmitt Bf 109 B) y patrones de astillas RLM 70/71 con superficies inferiores RLM 65 (Dornier Do 17 P, Henschel Hs 126, Junkers Ju 87 B, Messerschmitt Bf 109 B).</p>
