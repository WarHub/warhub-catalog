    imageUrl: https://ak-interactive.com/wp-content/uploads/2021/09/AK11755_web.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p>This set of eight 3rd Generation acrylic paints is essential for painting models of most of the aircraft used by the Royal Air Force from the mid-1960s, onwards.</p>
      <p>The selection of colors allows for representation of several camouflage schemes: Dark Green/Dark Sea Grey/Light Aircraft Grey tactical scheme adopted in 1965 and used on the Hawker Harrier and Hunter, Phantom FGR.2 and Jaguar; Dark Green/Dark Sea Grey wraparound scheme seen on the Harrier, Jaguar and Tornado Gr.1 from the late 1970s until the mid-1990s; Dark Sea Grey/Dark Camouflage Grey tactical scheme applied from the mid-1990s until the mid-2000s to the Jaguar, Harrier and Tornado Gr.1/4; Medium Sea Grey overall finish of Tornado fleet from the mid-2000s, onwards; Light Aircraft Grey/Camouflage (Barley) Grey scheme used by the air defence aircraft such as the Tornado F.3 and Phantom FGR.2 (the latter also featuring Medium Sea Grey on the upper wings); Camouflage (Barley) Grey overall finish of the Eurofighter Typhoon; Medium Sea Grey/Dark Green/Light Aircraft Grey scheme applied to the V-bombers in the 1970s, which in the 1980s was simplified to a wraparound scheme of Medium Sea Grey/Dark Green; the Hemp scheme of Camouflage Beige and Light Aircraft Grey notably used by the Nimrod and the Victor K.2 tanker from the 1980s until their withdrawal from service. The inclusion of PRU Blue color enables to additionally reproduce the painting schemes of reconnaissance aircraft used in the 1950s and 1960s (PRU Blue overall or later paired with Medium Sea Grey upper surfaces) and overseas-based tactical aircraft from the same period, carrying a Dark Sea Grey/Dark Green/PRU Blue scheme.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-dark-green-air/">AK11840 RAF Dark Green</a></li>
      <li><a href="https://ak-interactive.com/product/raf-medium-sea-grey-bs381c-637-air/">AK11843 RAF Medium Sea Grey BS381C/637</a></li>
      <li><a href="https://ak-interactive.com/product/raf-dark-sea-grey-bs381c-638-air/">AK11851 RAF Dark Sea Grey BS381C/638</a></li>
      <li><a href="https://ak-interactive.com/product/raf-pru-blue-bs381c-636-air/">AK11852 RAF PRU Blue BS381C/636</a></li>
      <li><a href="https://ak-interactive.com/product/raf-light-aircraft-grey-bs381c-627-air/">AK11853 RAF Light Aircraft Grey BS381C/627</a></li>
      <li><a href="https://ak-interactive.com/product/raf-camouflage-barley-grey-bs381c-626-air/">AK11854 RAF Camouflage (Barley) Grey BS381C/626</a></li>
      <li><a href="https://ak-interactive.com/product/raf-dark-camouflage-grey-bs381c-629-air/">AK11855 RAF Dark Camouflage Grey BS381C/629</a></li>
      <li><a href="https://ak-interactive.com/product/raf-camouflage-beige-hemp-bs381c-389-air/">AK11856 RAF Camouflage Beige (Hemp) BS381C/389</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>Este set de ocho pinturas acrílicas de 3ª Generación es esencial para pintar maquetas de la mayoría de los aviones utilizados por la Royal Air Force a partir de mediados de los años sesenta.</p>
      <p>La selección de colores permite representar varios esquemas de camuflaje: Esquema táctico verde oscuro/gris marino oscuro/gris aeronáutico claro adoptado en 1965 y utilizado en el Hawker Harrier y Hunter, Phantom FGR.2 y Jaguar; esquema envolvente verde oscuro/gris marino oscuro visto en el Harrier, Jaguar y Tornado Gr.1 desde finales de la década de 1970 hasta mediados de la década de 1990; esquema táctico Dark Sea Grey/Dark Camouflage Grey aplicado desde mediados de la década de 1990 hasta mediados de la década de 2000 al Jaguar, Harrier y Tornado Gr.1/4; acabado general Medium Sea Grey de la flota Tornado desde mediados de la década de 2000 en adelante; esquema Light Aircraft Grey/Camouflage (Barley) Grey utilizado por los aviones de defensa aérea como el Tornado F.3 y el Phantom FGR.2 (este último también con gris marino medio en la parte superior de las alas); el acabado general gris camuflaje (cebada) del Eurofighter Typhoon; el esquema gris marino medio/verde oscuro/gris aeronáutico claro aplicado a los bombarderos V en la década de 1970, que en la década de 1980 se simplificó a un esquema envolvente gris marino medio/verde oscuro; el esquema cáñamo de beige camuflaje y gris aeronáutico claro utilizado especialmente por el Nimrod y el petrolero Victor K.2 desde la década de 1980 hasta su retirada del servicio. La inclusión del color Azul PRU permite reproducir además los esquemas de pintura de los aviones de reconocimiento utilizados en los años 50 y 60 (Azul PRU en su conjunto o más tarde combinado con superficies superiores Gris Mar Medio) y los aviones tácticos con base en ultramar del mismo periodo, que llevaban un esquema Gris Mar Oscuro/Verde Oscuro/Azul PRU.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/raf-dark-green-air/">AK11840 RAF Dark Green</a></li>
