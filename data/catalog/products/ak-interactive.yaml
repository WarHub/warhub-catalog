  - id: ak-interactive/AK11774
    name: WWII JAPANESE ARMY AFV COLORS
    manufacturer: ak-interactive
    productCode: AK11774
    sku: AK11774
    category: paint-set
    status: current
    availability: in_stock
    firstSeen: '2026-07-23'
    priceEur: 13.64
    url: https://ak-interactive.com/product/wwii-japanese-army-afv-color/
    imageUrl: https://ak-interactive.com/wp-content/uploads/2022/09/AK11674_web.jpg
    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p><em><span style="color: #ff6600"><strong>LIMITED EDITION SET</strong></span></em></p>
      <p>A 3rd Generation acrylic paint set featuring the six basic camouflage colors used for painting vehicles of the Imperial Japanese Army during the World War II and the preceding conflicts in the late 1930s.</p>
      <p>Until 1942, multicolour camouflage patterns consisting of IJA Khaki (base color) or IJA Tea Brown (also used as a base color according to some sources), IJA Earth Brown and IJA Green or IJA Dry Grass were in use. In the 1930s, the camouflage patches were additionally bordered with black lines. In the early WWII period the camouflage patterns were sometimes supplemented with wavy cruciform bands centred on the top of the vehicle that had been applied with IJA Dry Grass or a bright yellow color.</p>
      <p>From 1942 until the end of war the camouflage schemes usually consisted of IJA Dry Grass (base color), IJA Earth Brown and IJA Grass Green.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li>AK11435, IJA KHAKI (Field Drab)</li>
      <li>AK11906, IJA TEA BROWN</li>
      <li>AK11902, IJA GREEN</li>
      <li>AK11112, IJA EARTH BROWN</li>
      <li>AK11905, IJA DRY GRASS</li>
      <li>AK11310, IJA GRASS GREEN (Olivgrün Opt.2)</li>
      </ul>
      <p>&nbsp;</p>
      <p>*<strong>Video how to use the set </strong><a href="https://www.youtube.com/watch?v=iV5xi-Mc3hQ" target="_blank" rel="noopener"><strong>here</strong></a>.</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p><em><strong><span style="color: #ff6600">SET DE EDICIÓN LIMITADA</span></strong></em></p>
      <p>Set de pintura acrílica de 3a generación con los seis colores básicos de camuflaje utilizados para pintar los vehículos del Ejército Imperial Japonés durante la Segunda Guerra Mundial y los conflictos precedentes a finales de la década de 1930.</p>
      <p>Hasta 1942, se utilizaban patrones de camuflaje multicolor compuestos por el IJA Khaki (color base), el IJA Tea Brown (también utilizado como color base según algunas fuentes), el IJA Green y el IJA Earth Brown. En la década de 1930, los parches de camuflaje estaban además bordeados con líneas negras. A principios de la Segunda Guerra Mundial, los patrones de camuflaje se complementaban a veces con bandas cruciformes onduladas centradas en la parte superior del vehículo que se habían aplicado con IJA Dry Grass o con un color amarillo brillante.</p>
      <p>Desde 1942 hasta el final de la guerra, los esquemas de camuflaje solían consistir en el IJA Dry Grass (color base), el IJA Earth Brown y el IJA Grass Green.</p>
      <p>&nbsp;</p>
      <p>Este set contiene:</p>
      <ul>
      <li>AK11435, IJA KHAKI (Field Drab)</li>
      <li>AK11906, IJA TEA BROWN</li>
      <li>AK11902, IJA GREEN</li>
      <li>AK11112, IJA EARTH BROWN</li>
      <li>AK11905, IJA DRY GRASS</li>
      <li>AK11310, IJA GRASS GREEN (Olivgrün Opt.2)</li>
      </ul>
      <p>&nbsp;</p>
      <p><strong>*Video cómo usar el set <a href="https://www.youtube.com/watch?v=Xp-Cu65XpjM" target="_blank" rel="noopener">aquí.</a></strong></p>
      <p></div></p>
