      <p>El Dark Olive Drab 41 y el Neutral Grey 43 fueron los colores básicos usados en este periodo, con el Medium Green 42 blotching aplicado sobre el color de la superficie superior del olive drab en el periodo 1942-1943 y el Sand 49 usado como color de la superficie superior de algunos aviones que operaban en el MTO. Este set será su compañero perfecto cuando pinte modelos de aviones como el P-38 Lightning, P-39 Airacobra, P-40 Warhawk, P-43 Lancer, P-47 Thunderbolt, P-51 Mustang, B-17 Flying Fortress, B-24 Liberator, B-25 Mitchell o B-26 Marauder y muchos otros.</p>
