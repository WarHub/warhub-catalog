      <p>A 3rd Generation acrylic paint set featuring the six colors essential for painting models of German Army vehicles used in Europe from 1937 until 1944.</p>
      <p>RAL 7017 Dunkelbraun and RAL 7021 Dunkelgrau were the standard camouflage colors used in 1937-40.</p>
      <p>From 1940, RAL 7021 Dunkelgrau was used as a single camouflage color.</p>
      <p>In the spring of 1943, a three color camouflage system was introduced, featuring RAL 7028 Dunkelgelb as the base color and RAL 6003 Olivgrün and RAL 8017 Rotbraun for disruptive patterns.</p>
      <p>As the two latter colors were supplied to the troops in form of emulsion paints which could be applied either straight from the container or thinned, variation in color appearance existed.</p>
      <p>This is addressed by the inclusion of two different green shades in this set.</p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
      <ul>
      <li><a href="https://ak-interactive.com/product/ral-7017-dunkelbraun-afv/">AK11315 RAL 7017 Dunkelbraun.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-7021-dunkelgrau-afv/">AK11316 RAL 7021 Dunkelgrau.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-7028-dunkelgelb-initial-afv/">AK11318 RAL 7028 Dunkelgelb (Initial).</a></li>
      <li><a href="https://ak-interactive.com/product/ral-6003-olivgrun-opt-1-afv/">AK11309 RAL 6003 Olivgrün Opt.1.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-6003-olivgrun-opt-2-afv/">AK11310 RAL 6003 Olivgrün Opt.2.</a></li>
      <li><a href="https://ak-interactive.com/product/ral-8017-rotbraun-afv/">AK11330 RAL 8017 Rotbraun.</a></li>
      </ul>
      <p>&nbsp;</p>
      <p></div><br />
      <span class="collapseomatic " id="esplang" title="ESPAÑOL">ESPAÑOL</span><div id="target-esplang" class="collapseomatic_content "></p>
      <p>El ejército alemán utilizó varias ordenanzas para camuflar sus vehículos durante la Segunda Guerra Mundial.</p>
      <p>Este set incluye los colores más importantes en uso desde 1937 hasta 1944.</p>
      <p>Incluye 6 colores diseñados para representar el camuflaje inicial Dunkelbraun y Dunkelgrey.</p>
      <p>Finalmente, el set también incluye dos versiones diferentes de Olivegrün, lo que permite al modelista representar las diferentes condiciones de pintura y efectos de degradación para este importante color.</p>
      <p>Para garantizar una precisión histórica, las pinturas AK se han diseñado teniendo en cuenta el efecto de reducción de escala.</p>
