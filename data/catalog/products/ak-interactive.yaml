    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content "></p>
      <p><strong>FULL RANGE PANEL LINERS (7 x 30ml)</strong></p>
      <p><strong>New cap with precision brush and new packaging of 30ml.</strong></p>
      <p><strong><br />
      </strong>Precision panel liners are formulated with a blend of enamel-based products that allow the paint to flow efficiently by capillary action without spreading or staining large areas.<br />
      The enamel base is ideal for panel lining as it prevents the surface tension typical of acrylic products, allowing the paint to flow easily through the details.</p>
      <p>Precision panel liners feature a highly pointed brush with fewer fibers. These fibers are longer than those of a standard brush, enabling a greater paint load, which is essential for the panel lining process and for highlighting structural lines in a single pass. The precision of the brush allows the paint to flow around details and into recesses without spilling, ensuring controlled application.</p>
