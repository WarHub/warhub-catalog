    description: |-
      <span class="collapseomatic " id="englang" title="ENGLISH">ENGLISH</span><div id="target-englang" class="collapseomatic_content ">
      <p><span dir="ltr" role="presentation"><strong>Gabriele Esposito</strong> is one of the world’s most renowned military historians, specializing in </span><span dir="ltr" role="presentation">uniformology; his interests and expertise range from the ancient civilizations to modern post colonial </span><span dir="ltr" role="presentation">conflicts.</span></p>
      <p><span dir="ltr" role="presentation"> During recent years he has conducted several research projects on the armies of various</span><span dir="ltr" role="presentation"> countries and has published them across the world with the most important publishing houses and</span><span dir="ltr" role="presentation"> magazines active in the military history sector. </span></p>
      <p><span dir="ltr" role="presentation">For AK-Interactive he is the author of the new series</span><span dir="ltr" role="presentation"> “Armies of History”, which aims at covering the most important armies of the past with complete but </span><span dir="ltr" role="presentation">accessible analysis. </span></p>
      <p><span dir="ltr" role="presentation">This AK-Interactive set includes <strong>18 acrylic colors</strong> especially useful for painting </span><span dir="ltr" role="presentation">uniforms of the Napoleonic period, since it comprises various shades of blue – the color worn by </span><span dir="ltr" role="presentation">most of Napoleon’s military units – as well as other colors that were extremely popular for uniforms </span><span dir="ltr" role="presentation">like red and green. </span></p>
      <p><span dir="ltr" role="presentation">The set also includes special colors – like gold – that are needed to paint the rank </span><span dir="ltr" role="presentation">distinctions worn by officers and NCOs</span></p>
      <p>&nbsp;</p>
      <p>This set contains:</p>
