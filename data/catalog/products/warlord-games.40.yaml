    description: |-
      Trage den Kampf unter der glühenden Wüstensonne zum Feind und hohle den Zweiten Weltkrieg in Afrika auf deinem Tisch!

      A Gentleman’s War ist eine der besten Möglichkeiten, um mit Bolt Action: Dritte Edition zu beginnen. Egal ob du ein absoluter Anfänger oder ein erfahrener Veteran von Tabletop-Schlachten bist. In dieser Box findest Du detailreiche Infanterie Modelle aus Kunststoff – entschlossene Veteranen der britischen 8. Armee und des deutschen Afrikakorps – sowie zwei Kunststoff Panzerspähwagen, die sie im Kampf unterstützen. Zusätzlich findest du eine doppelseitige Spielmatte und MDF-Gelände um die Kulisse für deine Spiele abzurunden.

      In der Box findest du einen QR-Code. Scanne ihn einfach ein und du gelangst zur Bolt Action-Website. Dort wartet ein kostenloses Bolt Action-Feldhandbuch \(in englischer Sprache\) auf dich zum Download. Dieses unglaublich nützliche Dokument führt dich mit einfachen und leicht verständlichen Anweisungen durch alle Phasen des Hobbys. Lerne wie du deine neuen Modelle zusammenbauen kannst und stürze dich dann direkt ins Geschehen! Durch eine Reihe unterhaltsamer Einführungsmissionen, machst du dich mit den wichtigsten Mechaniken von Bolt Action vertraut. In kürzester Zeit wirst Du deine Streitkräfte in die Schlacht führen können!

      Sobald du die Einführungsmissionen durchgespielt hast, kannst du dich in das vollständige Bolt Action Regelwerk des Sets weiter vertiefen. Von da an sind die Möglichkeiten unbegrenzt!

      A Gentleman’s War enthält:

      - 12 Infanteristen der britischen 8. Armee aus Kunststoff, 28 mm
      - 12 Infanteristen des Afrikakorps aus Kunststoff, 28 mm
      - 1 Panzerspähwagen Humber MkII/IV aus Kunststoff, Maßstab 1:56
      - 1 Panzerspähwagen Sd.Kfz. 222/223 aus Kunststoff, Maßstab 1:56
      - Bolt Action: Dritte Edition Regelbuch
      - Zusammenbauanleitungen
      - Zerstörtes nordafrikanisches Haus Geländestück aus MDF
      - Bolt Action-Befehlswürfel
      - Würfelbeutel
      - Doppelseitige Spielmatte
      - Marker und Schablonen aus Kunststoff
      - 10 sechsseitige Würfel

      *Models supplied unassembled and unpainted*
