      British and Canadian troops in North-West Europe made good use of ‘Kangaroo’ armoured transports to close with the enemy. Converted from a number of armoured fighting vehicles including the Ram and Churchill tanks, one of the most common Kangaroos was based on the M7 Priest self-propelled gun. The conversion process was simple – the gun was removed, and some additional armour plate was fitted, producing a vehicle that could carry a full section of infantrymen into battle in relative safety.

      This bundle gives you everything you need to add a Recce Infantry Platoon to your British Bolt Action collection! A trio of resin and metal Priest Kangaroos allows you to transport the plastic British & Canadian Infantry Platoon in style, and between these kits you’ve got all the components needed to make a battle-ready platoon of mobile infantry, including their officer, extra infantry squads, and supporting anti-tank weaponry.

      Get your British & Canadian troops moving today!

