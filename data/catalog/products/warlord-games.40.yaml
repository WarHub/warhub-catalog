    description: |-
      Defend the Motherland with the Red Star Rising army bundle!

      This bundle gives you everything you need to field a Soviet force for the middle period of World War II. At its core is a whopping 42 plastic infantry, enabling you to build a Rifle Platoon packed with a wide variety of infantry squads and weapons teams, as well as all of the Platoon Commanders your force needs. Backing up the infantry is a Heavy Weapons Platoon composed of two Medium Machine Gun teams and a Medium Mortar. Armoured support comes in the form of a T-34/76 and devastating Katyusha mobile artillery piece, meaning this force can take on anything the enemy can throw at it.

      With an endless number of ways to assemble it, this bundle is the perfect way to start a Soviet *Bolt Action* collection, or significantly expand an existing one!

      This bundle contains:

      - 42 multi-pose plastic Soviet Infantry
      - One Warlord Resin Platoon Commander
      - Two Medium Machine Gun Teams
      - One Medium Mortar Team
      - One plastic T34/76 Medium Tank
      - One plastic Katyusha Multiple Rocket Launcher
      - Includes plastic bases, decals, and vehicle damage markers

