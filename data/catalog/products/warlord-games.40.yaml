    description: |-
      Roar into battle with the M3 Lee Medium Tank!

      Entering American service in 1941, the M3 Medium Tank was designed to serve as an interim tank while the M4 Sherman was developed and put into production. Despite this, it was by no means a poor vehicle, boasting excellent mechanical reliability and powerful firepower, albeit in a somewhat archaic layout.

      This kit allows you to build the M3 \(known to the British in this configuration as the ‘Lee’\), a powerful Medium tank able to be fielded by US, British, and Soviet forces. You can build this vehicle with the earlier short-barrelled or later long-barrelled main gun - in games of *Bolt Action* we treat the M3 as a Medium tank with a 9+ damage value, armed with a medium anti-tank gun in the hull, and a light anti-tank gun in the turret, plus a medium machine gun!

      Whether you’re in the Western Desert with US or British forces, or equipping your Soviet troops with Lend-Lease armour, the M3 Lee is a great option!

      In games of *Bolt Action* these are medium tanks with a hull mounted medium anti-tank gun and a light anti-tank gun in a turret; this set gives you an Armoured Platoon of three tanks.

      Includes three plastic M3 Lee medium tanks, Bolt Action stat card, assembly guide, three full-colour waterslide decal sheets for US and Canadian vehicles and vehicle damage markers

      *Studio models painted by Darek Wyrozebski.*

