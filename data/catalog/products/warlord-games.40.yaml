    description: |-
      *Armies of Imperial Japan: Third Edition is your essential guide to collecting and playing Japanese forces in Bolt Action!*

      Fanatically loyal to their Emperor, the Japanese were forced to combat both the Allies and the environment as they fought in some of the most brutal battles of the war. Armed with the army list in this book, you’ll have all you need to field an Imperial Japanese force in *Bolt Action: Third Edition*. Varied unit profiles and army special rules enable you to field troops of the Imperial Japanese Army, the Special Naval Landing Force, and paratroopers, amongst many others.

      In addition to the unit profiles and national special rules, *Armies of Imperial Japan* is packed with historical background and full-colour illustrations and photography, giving you all the inspiration you need to create your own Japanese collection of miniatures, and unleash them in battle on the *Bolt Action* tabletop.

      **Special Figure:** Alongside *Armies of Imperial Japan* is the Hiroo Onada special miniature \(exclusive to the Warlord Games webstore\). Onada was an IJA officer who is best known for being one of the last Japanese holdouts, continuing to fight nearly 29 years after the conclusion of WWII on Lubang Island in the Philippines. He resolutely refused to believe any evidence supplied to him that the war was over. This special miniature depicts him at the beginning of his campaign of guerrilla warfare, in his early 20s.

      *Hiroo Onoda sculpted by Wojciech Flis. Studio miniature painted by Andrés Amián*

      *Models supplied unassembled and unpainted*
