    firstSeen: '2026-07-07'
    priceGbp: 50.75
    url: https://store.warlordgames.com/products/sd-kfz-10-demag-halftrack-stowage-light-anti-tank-gun
    imageUrl: https://cdn.shopify.com/s/files/1/0255/0949/4864/products/409902005Sd.Kfz10DemagHalftrack_Stowage_LightAnti-TankGun.jpg?v=1600960181
    description: |-
      The smallest \(1-tonne rated\) of a series of six half-track utility vehicles and prime movers that were in effect the same vehicle, simply scaled up each time. Produced by DeMag, the smaller versions were sometimes used as troop transports as well as tows. The SdKfz 11 was rated as 3 tonnes and the SdKfz 6 as 5 tonnes.

      The SDKfz 10 participated in the Invasion of Poland, the Battle of France, the Balkans Campaign, in North Africa and Italy, and on both Western and Eastern fronts, dependably towing small guns such as the 2 cm FlaK 30, the 7.5 cm leIG, or the 3.7 cm PaK 36 anti-tank gun.

      In Bolt Action, the DeMag serves as an inexpensive and dependable tow, whilst also capable of transporting six infantry. Its presence throughout the war lends itself to most German armies.

      This convenient bundle includes stowage accessories for your new vehicle as well as the 37mm Pak 36. The standard issue German anti-tank gun in 1939, it equipped the Panzerjäger battalions \(Pak is short for Panzerabwehrkanone – anti-tank gun, and 36 indicates the year the weapon was designed\). It was arguably the best anti-tank gun in the world at the onset of war, but was quickly outclassed by heavier armour on enemy tanks. Still, 15,000 were produced for Germany and its allies, and it was still in service in 1945.

      Contents:

      - Sd.Kfz 10 Demag halftrack \(20 / 32\)
      - Stowage pack - German
      - Blitzkrieg German Pak 36 anti-tank gun

      *Models supplied unassembled and unpainted*
