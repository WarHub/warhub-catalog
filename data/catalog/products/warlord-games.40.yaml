    description: |-
      Willkommen bei der dritten Ausgabe von Bolt Action. Dem weltgrößten Tabletop Strategiespiel des Zweiten Weltkriegs! Dieses Starterset ist der beste Weg um deine Bolt Action-Reise zu beginnen. Es enthält alles was du brauchst, um sofort in die Action einzusteigen!

      Neben einem Regelbuch mit allen Regeln, die du für rasante und unterhaltsame Partien von Bolt Action brauchst, findest du auch genügend unglaublich detaillierte Kunststoff-Miniaturen, mit denen du im Handumdrehen in dein Hobby einsteigen und Spiele spielen kannst. Übernimm das Kommando über die hartgesottenen deutschen Fallschirmjäger oder die verbissenen und entschlossenen Infanterie der US-Armee. Beide Seiten treffen hier in den gefrorenen Wäldern der Ardennenschlacht aufeinander. Diese Miniaturen sind der perfekte Ausgangspunkt für eine Bolt-Action-Sammlung zum Thema Winterkrieg. Mit winterlicher Ausrüstung und einer Vielzahl von Waffenoptionen, ist diese Box eine großartige Gelegenheit für neue und erfahrene Bastler gleichermaßen!

      Die deutschen und amerikanischen Kunststoffminiaturen können auf viele unterschiedlichste Arten zusammengebaut werden. Von Infanterieeinheiten, bis hin zu Maschinengewehrtrupps, Offizieren, Beobachtern, Sanitätern, Scharfschützen und vieles mehr!

      Aber nicht "nur" Infanterie wartet auf dich! In dieser Box findest du auch einen amerikanischen M8-Panzerwagen aus Kunststoff, der auch als M20-Variante zusammengebaut werden kann - die perfekte Verstärkung für die US-Truppen, bei einen Angriff deutscher Fallschirmjäger-Veteranen. Ein zerstörtes Bauernhaus aus Kunststoff, in dem deine Truppen Schutz suchen können rundet die Box ab.

      Starte jetzt! Baue einfach deine Modelle zusammen und lass Sie die Schlacht beginnen! Sobald du deine ersten Spiele mit dem beiliegenden Einführungsheft gespielt hast, kannst du deine Sammlung erweitern und kopfüber in die fantastische Welt des Zweiten Weltkriegs eintauchen!

      Battle of the Bulge enthält:

      - Bolt Action Regelbuch
      - Battle of the Bulge Alnleitung für Szenarios und den Zusammenbau der Miniaturen \(auf Englisch\)
