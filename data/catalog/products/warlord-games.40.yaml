    description: |-
      The German light infantry support gun mark 18 was a short-barreled 75mm howitzer. It was used throughout the war in most theatres and gave much needed support to the hard-pressed Infantry. It could be towed by light tractor, or even pulled by hand into position where its low profile, small size and rapid fire made it a useful addition to the frontline strength.

      This set includes a SDKfz 10 DeMag - the smallest of a series of six half-track utility vehicles and prime movers that were in effect the same vehicle, simply scaled up each time. Produced by DeMag, the smaller versions were sometimes used as troop transports as well as tows. The SDKfz 10 It participated in the Invasion of Poland, the Battle of France, the Balkans Campaign, in North Africa and Italy, and on both Western and Eastern fronts, dependably towing small guns such as the 2 cm FlaK 30, the 7.5 cm leIG, or the 3.7 cm PaK 36 anti-tank gun.

      In games of Bolt Action this can be included in Artillery Platoons and is a Light Howitzer, with the Demag chosen from the Transports and Tows section - it also has the capacity to carry up to 6 men. This convenient bundle includes stowage accessories to make your model unique.

      Contents:

      - Sd.Kfz 10 Demag halftrack
      - Stowage pack
      - 75mm LeiG 18 light artillery \(1939-42\) with 3 Blitzkrieg German crew

      *Models supplied unassembled and unpainted*
