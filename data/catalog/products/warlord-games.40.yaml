    description: |-
      The M18 Hellcat was the fastest US armoured fighting vehicle of the Second World War, serving in the invasion of the Phillipines and across Europe from the landings at Anzio in Italy through to the end of the war in Northwest Europe.

      A standard tank destroyer platoon in 1944 would have consisted of 4 M18s with support from 2 M20 utility vehicles for reconnaissance, split in to two Anti Tank Sections. This set comes with 2 plastic M18 Hellcats plus 1 plastic M20 Utility vehicle \(which can also be made into the M8 Greyhound if you so wish\).

      In games of Bolt Action the Hellcats are lightly armoured \(7+ Damage Value\) but armed with a heavy anti-tank gun, and the M8 is an armoured car with a heavy machine gun. The three vehicles make an ideal Armoured Platoon, and all can have the Recce special rule to allow them to quickly escape from danger.

      - Two 1/56 scale hard plastic M18 Hellcat Tank Destroyers
      - One 1/56 scale hard plastic M20 Utility \(M8 with Greyhound option\) kit
      - Full-colour waterslide decal sheets
      - Construction leaflets
      - Bolt Action stat card for M18
      - Damage markers

      **Note that this product is a webstore exclusive and is not supplied in a printed box.**

      *Models supplied unassembled and unpainted*
