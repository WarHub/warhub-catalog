      This kit comprises 18 plastic components and is supplied with 1x Citadel 40mm Round Base and 2x Citadel 25mm Round Bases with flying stems. These miniatures are supplied unpainted and require assembly – we recommend using Citadel Plastic Glue and Citadel Colour paints.
