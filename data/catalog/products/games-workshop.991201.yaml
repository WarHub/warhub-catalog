    description: |-
      The Twin Lance, Shas'ri Locai and Shas'ri Lantar, are known as Exemplar Sunsear and Exemplar Scatterflare. They fight with an aggression rarely seen among the Fire Caste. There is a focus to their ferocity, however, as they leap close to their foes in jet-assisted bounds and unleash punishing firepower before discharging kinetic shockwaves built up by their neocapacitor shields and retreating again in the resultant carnage.

      This multipart plastic kit builds The Twin Lance, a pair of legendary warriors, along with their custom gun drones, for your T'au Empire armies in games of Warhammer 40,000. The Exemplars are masters of the Mont'ka, using the thrusters of their custom battlesuits to leap into battle. Protected by their shields, they unleash torrents of fire from their fusion eliminator and ion scattercannon. Advanced shardstorm burst system missiles take care of enemy infantry that get too close, and MV15 gun drones add to the deadly salvos. They are ideal for adding aggressive close-range firepower to your force. The base toppers and guns are interchangeable across the drones, and the visors of the battlesuits can be assembled without glue, allowing them to be raised and lowered.

      This kit is supplied with 1 T'au Empire Infantry Decals – Vior'la Sept Transfer Sheet, which contains 177 high-quality waterslide transfers to decorate your miniatures. These include a selection of Vior'la Sept markings for various battlesuits, and for other infantry in your collection, such as Pathfinder Teams, Strike Teams, and Breacher Teams.

      This kit comprises 113 plastic components, 2 Citadel 60mm Round Bases, 2 Citadel 32mm Round Bases, and 4 Citadel Ball Socket Stems. These miniatures require assembly and are supplied unpainted – we recommend using Citadel Plastic Glue and Citadel Colour paints.
