      With July’s Soldier of Fortune being a 28mm version of legendary commander Hannibal Barca, and continuing our celebration of the release of Hail Caesar Epic Battles, it seemed only fair to give equal representation to his Roman counterpart with August’s exclusive figure. Enter Scipio Africanus, Hammer of Carthage!

      Scipio Africanus was set apart from his contemporaries by his ability to inspire his men to astounding feats of combat against seemingly insurmountable odds, and our new Soldier of Fortune figure is equally inspiring, packed with exquisite detail. Depicting Scipio astride a fine steed, ornately saddled, and looking suitably resplendent in fine armour, he is accompanied by an attendant bearing a dove taking flight, a longstanding symbol of the soul in ancient Roman culture. Both figures are sure to take pride of place in your miniatures collection, or at the centre of a 28mm Republican Roman army!

