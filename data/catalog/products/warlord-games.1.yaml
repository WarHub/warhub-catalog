      Terrify the enemies of the old gods and inspire your warriors with Soldier of Fortune 19 - Bodhmall the Druidess!

      A member of the mysterious and feared druidic religion, and believed capable of powerful magics, this druidess stands alongside her fellow Celts against all who would threaten their lands and way of life. Wielding a staff and uttering dreadful curses, she is equally potent at demoralising the foe and bolstering the spirits of her comrades alike.

      Perfect as a commander or accompaniment to a command base for any Celtic or Briton force in *Hail Caesar*, as well as a wonderfully characterful model in her own right, the druidess evokes images of mist-shrouded ancient woodlands, standing stones, and otherworldly powers. She's also a fantastic opportunity to go to town with your painting, particularly if you want to challenge yourself to some plaid!

      Named after the mythological Irish figure, Bodhmall is a druidess with unknowable aims and unimaginable powers. She's also got a lot of sacred matters to attend to, and so she's only emerged from the woods for the month of February 2025. After that, she'll return to the wild places, and won't be seen again for several years at least. Don't miss out!

      *Sculpted by Marco Sano. Studio miniature painted by Kirsten Williams.*

