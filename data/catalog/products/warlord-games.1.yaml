      **Macedonian Phalangites**: Few sights in the ancient world would have matched the thrill of the advance to contact of the Alexandrian or Macedonian phalanx. Thousands of well-armoured and superbly trained professional soldiers advancing at least eight men deep, often more slowly and methodically keeping apace with their fellow phalangites. As they neared the enemy they would use their shields to protect themselves from arrows or sling shots.

