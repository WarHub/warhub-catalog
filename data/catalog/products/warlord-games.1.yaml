      Hammer the tribes of Germania with November’s Soldier of Fortune - the aptly-named Germanicus!

      One of Imperial Rome’s great commanders, and part of what would become an infamous family of Emperors, Germanicus Julius Caesar’s career in the dark forests of Germany made him a legend. Avenging the shocking defeat suffered by Varus at the Battle of the Teutoburg Forest, and recovering two of the three lost Legion Eagles, Germanicus would battle against the forces under Arminius and restore Roman pride with his victories. Ordered to Asia to govern and organise the Roman provinces in the region, he would die at the age of just 34 - poison was immediately suspected but has never been proven.

      Presented both on foot and mounted, cast in crisply detailed Warlord Resin, the Soldier of Fortune set depicts Germanicus in the thick of the action. Clad in the beautiful armour of a Roman general, complete with glorious cape and plumed helmet, he’s an absolute dream for painters and a great opportunity to really show off your skills! These two models make for brilliant command figures for your Hail Caesar Imperial Roman collection, whether alone on a base, incorporated into dioramas, or fighting in the front ranks of units!

      Germanicus is a busy man \(and Germania’s a big place!\), so he can’t hang around for long! This set will only be available until 30th November 2024, at which point he’ll head back off on campaign again, not to be seen for several years - don’t miss out!

      *Models supplied unassembled and unpainted*
