      - Iberia
      - Gaul
      - Caesar’s Legions
      - Macedonia
      - Persia
      - Thebes
      - Sparta
      - Athens

      Hire mercenaries or lead your force with Heroes of legend – let nothing stand in your way as you conquer all for the glory of your nation and the gods themselves!
