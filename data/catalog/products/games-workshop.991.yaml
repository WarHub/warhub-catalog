      This multipart metal and plastic kit builds one Tuskgor Chariot, a heavy war machine for your Beastmen Brayherds armies in games of Warhammer: The Old World. Fast and hard hitting, they will run roughshod across enemy lines, causing mayhem with goring tusks and vicious hand weapons. The kit comes with a set of paper banners to further decorate your chariot.

      This kit comprises 13 metal components, 12 plastic components, and 1x Citadel 50mm by 100mm Rectangular Base. This miniature requires assembly and is supplied unpainted – we recommend using Citadel Colour paints.
