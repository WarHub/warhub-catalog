      The Frostgrave Cultists II box set contains enough parts to make 20 different figures. There are multiple heads, arms, weapons and accoutrements per frame, no two warbands will ever be the same.

      The Cultists have been designed to complement existing Frostgrave plastic boxed sets. By that we mean the arms, heads and equipment are interchangeable, giving you even MORE choice to build a unique and personal Warband. And, as an extra bonus, the Cultist plastic frame includes heads and arms to convert your Soldiers or Cultists into skeletons and Zombies. True Frostgrave Undead! Perfect to represent your 'risen from the dead' ex-soldiers.

      *Models supplied unassembled and unpainted*
