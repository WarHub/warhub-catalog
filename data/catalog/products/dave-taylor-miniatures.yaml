      These artists work in a wide variety of approaches – miniature painting, illustration, photography, sculpting, writing – that have been explored in the first six online volumes of **28** magazine. You are invited to explore these volumes \(and more\) for free on their website: [28-mag.com](https://www.28-mag.com)

      Not only does this collection include interviews with luminaries like John Blanche, Ian Miller, Trish Carden, Andy Chambers, and Mike Franchina, it also presents reports of community events, features the work of talented 2D and 3D artists, and contains several essays on the philosophies of art and gaming. Additionally, the cover art is by the wonderful John Blanche!
