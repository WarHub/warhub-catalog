    imageUrl: https://cdn.shopify.com/s/files/1/0255/0949/4864/files/305111010_SoF010_ShiverMeTimbersYoungNelson01.jpg?v=1714047827
    description: |-
      **Soldier of Fortune - This figure is only available via the Warlord Games webstore until the 31st of May 2024, 23.59 \(BST\). Thereafter, the figure will not be available in any other way, shape or form for a minimum of two years. A new Soldier of Fortune will take its place in June…**

      **Don’t miss your chance to get a hold of this limited-edition figure!**

      **Please note, that this product is limited to one per transaction. Discount codes cannot be redeemed on this item.**

      May's Soldier of Fortune sees an adolescent Horatio Nelson make a brave but foolhardy encounter with a Polar Bear \(as you do\).

      Joining a 1773 polar expedition at 14 years old Nelson served aboard the bomb vessel HMS Carcass under the wonderfully named Captain Skeffington Lutwidge.

      Horatio spied a Polar Bear and with youthful exuberance and a feeling of invincibility that comes with such tender years he set off to claim the beast's pelt for his father. His musket failed to discharge and with dirk in hand he prepared to tackle the now disturbed ursine. As the tale goes Nelson was then rescued by sailors from his ship who caught wind of his impending doom and fired cannon from the ship to scare off the bear.

      *Models supplied unassembled and unpainted*
