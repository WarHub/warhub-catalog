    description: |-
      Bring firepower to bear at short notice with this mobile light gun for your Spanish Black Powder collection!

      Heirs to a long and proud martial tradition, Spain would initially be France’s ally in the early Napoleonic Wars before being occupied by the French in 1808, with Joseph Bonaparte installed as a puppet king. With the majority of Spaniards rejecting French rule, and fighting bitterly against it, the Spanish army would see significant service alongside their British allies. A key part of this army was the artillery. ‘Horse’ artillery, consisting of highly mobile light guns, was intended to race across the battlefield to wherever it was needed, often proving decisive in defeating enemy assaults or supporting attacks.

      An essential part of any Spanish Black Powder force, this 8-pdr gun is ready to deploy on your tabletop when it’s needed most!

      This pack contains one 8-pdr gun with four crew, cast in metal.

