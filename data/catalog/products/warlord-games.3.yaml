    description: |-
      Dieses Buch stellt das Spiel Black Powder mit all seinen Regeln vor, welche die Autoren und ihre Freunde bei ihren eigenen Spielen benutzen.

      Der Leser erhält dadurch die Möglichkeit \(und wird dazu ermutigt\), die großen Schlachten des 18. und 19. Jahrhunderts mithilfe von Armeen aus Modellsoldaten nachzustellen. Zusätzlich zu den Grundregeln der Kriegsführung wie dem Erteilen von Befehlen, der Bewegung von Truppen, der Wirkung von Muskete und Kanone, sowie dem Einﬂuss der Moral, enthält dieses Buch zahlreiche Beispiele für Sonderregeln, mit denen die Spieler ihre Partien nach eigenen Vorlieben anpassen können. Außerdem bieten zwölf vollständige Szenarien für Black Powder Spiele eine große Auswahl aus den Konﬂikten dieser Zeit.

      - Schlacht von Elixheim – Spanischer Erbfolgekrieg, 1705
      - Schlacht von Clifton Moor – Jakobitenaufstand, 1745
      - Überfall auf Fort Ligonier – Siebenjähriger Krieg, 1758
      - Schlacht bei Chinsura – Siebenjähriger Krieg, 1759
      - Schlacht von Bunker Hill – amerikanischer Unabhängigkeitskrieg, 1775
      - Schlacht von North Point – Britisch- amerikanischer Krieg, 1814
      - Quatre Bras – Napoleonische Kriege, 1815
      - Der Abend vor Waterloo – Napoleonische Kriege, 1815
      - Gefecht bei Kernstown – amerikanischer Bürgerkrieg , 1862
      - Schlacht am Antietam – amerikanischer Bürgerkrieg, 1862
      - Schlacht am Dead man’s creek – Indianerkriege, 1876- 77
      - Gefecht am iNyezane – Zululand, 1879
