    description: |-
      As Operation Market Garden started on the 17th of September 1944, the Allies advance towards their objectives became painfully obvious that they were going to go against very stern defences, ones that they were ill-equipped for. As a result, the Hartenstein hotel served as the headquarters of the British 1st Airborne Division.

