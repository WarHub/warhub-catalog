    firstSeen: '2026-07-07'
    priceGbp: 97.0
    url: https://store.warlordgames.com/products/algoryn-drop-fortress
    imageUrl: https://cdn.shopify.com/s/files/1/0255/0949/4864/products/AG06_Algoryn_Drop_Fortress.jpg?v=1575566462
    description: |-
      Every planetary drop in a capsule is a risk for the troopers inside, a risk of it going off course, getting damaged or being completely destroyed by hostile fire. Aeons of experience in warfare has allowed the Algoryn to advance their technology resulting in the development of the Drop Fortress, comprising of four drop capsules that upon landing expand to becoming one large fortress. The Algoryn can then use the internal transmat in relative safety to deploy from orbit into the prepared defensive structure and dominate the battlefield.

      A large central hub is connected with three smaller bastions, via two small and one long walkways which are protected with a large kinetic shield. Each bastion has an outlook on the top for guards to challenge any threat that dares to try and take the base. The roofs of each bastion and main hub are easily removable to show brutal close combat.

      With the doors in the open position there are clear fields of fire through the building and although it seems like it may block your view of the battlefield you'd be surprised how the angles allow for more lines of sight than you'd expect.

      The set includes:

      - One large Bastion
      - Three small Bastions
      - Three Guard posts
      - Two small Walkways
      - One large Walkway
      - Six small Kinetic Barriers

      During the development process great care was taken by Sarissa to include extra details in the design, including internal transmat pads and cool details to give the exterior a a definitive Algoryn shape - more than you might expect from flat MDF and card. It can also be stacked one on top of another to create a commanding tower objective.

      *Models supplied unassembled and unpainted. Miniatures shown for scale purpose and not included.*
    evidence:
      - legacy-catalog:warlord-games/gates-of-antares/general/algoryn-drop-fortress
      - mfr-warlord-store:algoryn-drop-fortress
