    imageUrl: https://www.warhammer.com/app/resources/catalog/product/920x950/99120903001_ENGBloodBowlSeason3CoreGame2.jpg
    description: |-
      Legend has it that the Brionne Barons were founded by the Grail Knight Bayard the Wanderer in 2498. Since then, the team has bludgeoned its way to glory through trials and tribulations, bravely marching forward for the glory of the Lady. They finally secured a title in the Errantry League in 2503, where it was found that the winning cup was actually the Grail. It was subsequently stolen under suspicious circumstances.

      **Onward to Victory and Glory for the Lady!**

      Despite the fact that they fight with honour, Bretonnian Teams are surprisingly good at the down-and-dirty game of Blood Bowl. This is mostly on account of their heroic acts of martial prowess, and the grit of Squires eager to please their betters. They are cool under pressure and capable of taking a few extra risks for a shot at a glorious play.

      **What’s in the Kit?**
      This multipart plastic kit builds a Bretonnian team for use in games of Blood Bowl. Knight Catchers and Knight Throwers perform impressive feats of athleticism to complete bold plays. Grail Knight Blitzers are the true stars of the team, while Bretonnian Squire Linemen are desperate to prove themselves to their betters.

      **The team of 12 miniatures is comprised of:**
      – 6x Bretonnian Squire Linemen
      – 2x Knight Catchers
      – 2x Knight Throwers
      – 2x Grail Knight Blitzers

      The Bretonnian Squire Linemen each have two head options, and two of the Bretonnian Squire Linemen have two left arm options. Both Knight Throwers have two head options and two left arm options. The Grail Knight Blitzers each have two left arm options, two head options, and two helmet topper options. Each Knight Catcher has three head topper options – all offering a degree of customisation for your team.

      **This kit also includes:**
      – 2x Ornate balls
      – 2x Blessed balls
      – 2x Double-sided coins
      – 2x Turn and Re-roll markers

      This kit is supplied with a Bretonnian Blood Bowl Team Transfer Sheet, featuring 320 high-quality waterslide transfers. These include fleur-de-lys and grail icons, role identifications, and numbers for you to decorate your miniatures.

      **Contents:**
      – 112x Plastic components
      – 12x Citadel 32mm Round Bases
      – 1x Bretonnian Blood Bowl Team Transfer Sheet
      – 1x Construction guide

      **These miniatures require assembly and are supplied unpainted. We recommend:**
      – Citadel Tools: Super Fine Detail Cutters
      – Citadel Plastic Glue
      – Citadel Colour paints
