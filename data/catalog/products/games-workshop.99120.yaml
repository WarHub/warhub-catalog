      This multipart plastic kit builds four Exo-kyn, which can also be used as Exo Masters, and two Techmite Exovator 078b miniatures for use in Ironhead Squat Prospector gangs in games of Necromunda. The doughty Exo-kyn can be armed with a selection of weapons, including two-handed hammers, storm-welders, hydraulic drills, rock saws, or Ironhead power fists. A choice of heads with open-face helmets or mask inserts is also included. The Techmite Exovator 078b are clad in the same layered ferramite armour coating as the exo-suits of their handlers and can also be armed with a variety of weaponry.

