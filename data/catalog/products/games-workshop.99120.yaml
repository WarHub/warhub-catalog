      Rules for using Vampire teams in your games of Blood Bowl can be found in Spike! Journal 16, which is sold separately.

      This kit comprises 96 plastic components, and is supplied with 14x Citadel 32mm Round Bases and 1x Vampire Team Transfer Sheet. These miniatures are supplied unpainted and require assembly – we recommend using Citadel Plastic Glue and Citadel Colour paints.
