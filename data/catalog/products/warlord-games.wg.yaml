  - id: warlord-games/WGP-EC-65
    name: Pike & Shotte Engineer Working Party
    manufacturer: warlord-games
    productCode: WGP-EC-65
    sku: WGP-EC-65
    gameSystems:
      - pike-and-shotte
    faction: general
    gameSystemsBasis: stated
