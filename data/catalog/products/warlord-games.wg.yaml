      Further additions included bow cases and quivers attached to the sides of the chariot . Bronze scale armour became commonplace for the Maryannu Chariot Archers and even for some of the Drivers. Some of the chariot horses also began to acquire scale armour covers for battle.

      Maryannu Archers and crew were dressed similarly, whether they be part of the armies of Mitanni, Middle Kingdom Assyria, Kassite Babylonia, Syrian and Canaanite city-states or the Elamites.

      This chariot has wheels with 6 spokes, bow cases and quivers on the bronze scale sides of the chariot and armoured horses. Pack contains 1 Chariot, 2 armoured Horses, 1 Driver, 1 Archer and 1 alternative Commander.

      *Note: Models supplied unassembled and unpainted*
    evidence:
      - legacy-catalog:warlord-games/hail-caesar/general/2-horse-light-chariot-iii
      - mfr-warlord-store:2-horse-light-chariot-iii
