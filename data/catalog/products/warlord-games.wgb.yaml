    imageUrl: https://cdn.shopify.com/s/files/1/0255/0949/4864/products/wgb-bi-108-m5-half-track-a.jpg?v=1575565771
    description: |-
      At last! The PBI \(poor bloody infantry\) have the right troop transport to take them right into the front line.

      The British and Canadian, not to mention the Russians forces bought huge numbers of M5s during WW2.Up until now you would have had to have made do with Warlord's M3s, but it was the M5 that was the characteristic hallmark of British and Canadian armoured infantry.

      It differs slightly, in that it has a battery box on the right side, differing seats and rolled edge back, whilst the mudguards are rather flatter in profile to the M3. It would also look different as the Brits rarely festooned their halftracks with 3 or more machine guns preferring to dismount and behave like proper infantry if things got hot.

      The Russkies used them as a prime mover for artillery pieces too which is a good modelling opportunity.

      So take this chance to armour up your Reds, Canucks or Tommies and drive hell for leather into the thick of it all.

      *Models supplied unassembled and unpainted*
    evidence:
