    description: |-
      Widely used throughout the war and in most theatres, the Flak 37 8.8cm was developed as an anti air-craft gun but its high muzzle velocity made it an exceptionally deadly anti-tank weapon as many Allied tank crews would learn to their peril.

      In games of Bolt action the 88 can be included in Artillery Platoons and is a superheavy anti-tank gun on a rotating platform, with the option to fire as a medium howitzer, making it the most versatile artillery in the game. It can be towed by the Sd.Kfz 7 half-track.

      This model is ideal for including in early war armies such as for the Battle of France.

      Contents:

      - 1 metal 88mm flak 36 \(can be built in either static or mobile modes\)
      - 2 resin carriages
      - 6 metal Early War crew

      *Models supplied unassembled and unpainted.*
