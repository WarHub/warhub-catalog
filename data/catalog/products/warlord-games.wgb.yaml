      The Poles put up a dogged resistance to the two invading forces despite, in some cases, being utterly outnumbered. There were many desperate actions where the Poles fought the invaders to a standstill, and the stoic infantry held their ground whilst their dashing Polish cavalry caught the enemy by surprise.

