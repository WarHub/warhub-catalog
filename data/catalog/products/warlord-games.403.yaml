      It's all gone a bit pear-shaped for this month's Soldier of Fortune - it's a Crisis in Stalingrad!

      Depicting German Field Marshal Friedrich Paulus and a staff officer, Crisis in Stalingrad represents a crucial turning point on the Eastern Front. Even as they ponder the map in front of them, Paulus and his aide are only moments away from being captured by Soviet troops, spelling the end of Sixth Army outside Stalingrad - an enormous blow to German forces in Russia.

      Crisis in Stalingrad is a fantastic addition to any German *Bolt Action* collection, whether as a thematic diorama or as a Company Commander team. Featuring two beautifully sculpted senior German officers and a map table, this Warlord Resin set is a great opportunity to show off your scene-setting skills, and of course a must-have for Soldier of Fortune collectors.

