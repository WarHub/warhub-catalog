      Paying homage to the legendary American cartoonist Bill Mauldin, September's Soldier of Fortune is Goodbye, Ol’ Pal!

      Drawing inspiration from Mauldin's cartoon Old Sarge and his Jeep, this rather darkly humorous diorama depicts an old and rather portly Sergeant of the fictional 45th Cavalry preparing to ‘put down’ his ‘mount’, the unfortunate jeep having suffered a broken ‘leg’.

      Cast in crisp Warlord Resin^TM^ and packed with detail, Goodbye, Ol’ Pal is a fantastic centrepiece for any American force, perfect as an objective marker or as a \(presumably Veteran!\) leader filling in as an officer. He’s also a brilliant opportunity to really show off your painting and weathering prowess, with a vehicle and infantry model on the same base making for a great all-round display piece – and of course, you don’t want to have a gap in your Soldier of Fortune collection!

      Don’t miss out – as with all of our Soldier of Fortune figures, Goodbye Ol’ Pal will only be available for a month. After that, he’ll disappear off, presumably back to the stables \(garage?\) to find a new mount, and won’t reappear for several years! Get yours today!

